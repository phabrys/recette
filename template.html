<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes recettes</title>
<style>
  :root {
    --bg: #17120f;
    --surface: #241c17;
    --surface-2: #30261f;
    --text: #f5ece3;
    --muted: #bba999;
    --accent: #f4a259;
    --accent-ink: #1d130b;
    --line: #42352b;
    --gutter-x: 4vw;
    --gutter-y: 3vh;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; font-size: clamp(14px, 1.6vw, 48px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  strong { color: #ffd2a6; }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button, a { font: inherit; color: inherit; }

  /* En-tête commun */
  .top {
    display: flex; align-items: center; gap: 1.5rem;
    padding: var(--gutter-y) var(--gutter-x) 1.2rem;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 2.2rem; font-weight: 750; }
  .top .sub { color: var(--muted); font-size: 1.1rem; margin: .2rem 0 0; }
  .hint { color: var(--muted); font-size: .95rem; }

  .btn {
    background: var(--surface-2); border: 0.15rem solid transparent; border-radius: 0.8rem;
    padding: .6rem 1.2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav:focus { outline: none; }
  .btn:focus, .btn:hover { border-color: var(--text); }
  .btn.primary:focus { box-shadow: 0 0 0 .25rem var(--text); }

  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: .5rem; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: .25rem; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll { flex: 1; overflow-y: auto; padding: 1.8rem var(--gutter-x) var(--gutter-y); }

  /* Accueil */
  .grid {
    display: grid; gap: 1.6rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    align-content: start;
  }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: .5rem;
    background: var(--surface); border-radius: 1.2rem; padding: 1.4rem;
    border: .2rem solid transparent; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:focus, .card:hover { border-color: var(--accent); background: var(--surface-2); transform: scale(1.04); }
  .card .emoji { font-size: 3.2rem; line-height: 1; }
  .card .ctitle { font-size: 1.45rem; font-weight: 700; }
  .card .csub { color: var(--muted); font-size: 1rem; }

  .catcard { gap: .7rem; }
  .grid.cats { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
  .catcard { padding: 1.2rem 1.4rem; }
  .catcard .emoji { font-size: 2.2rem; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .catcard .ctitle { font-size: 1.4rem; }

  /* Fiche recette */
  .recipe {
    display: grid; gap: 2rem; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
  }
  .panel { background: var(--surface); border-radius: 1.2rem; padding: 1.4rem 1.6rem; }
  .panel h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: .8rem; }
  .panel h3 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
  .panel p { margin: .4rem 0; font-size: 1.1rem; }
  .panel ul { margin: 0; padding-left: 1.3rem; font-size: 1.15rem; }
  .panel li { margin: .35rem 0; }
  .panel li::marker { color: var(--accent); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; font-size: 1.2rem; }
  ol.steps li { counter-increment: step; position: relative; padding-left: 3rem; margin: 0 0 1rem; min-height: 2.2rem; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: -.1rem;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .extras { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  .extras ul { font-size: 1.05rem; }

  /* Liste de courses */
  .shop { display: grid; gap: 1.6rem 2rem; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); align-items: start; }
  .shop h3 { font-size: 1.15rem; color: var(--accent); margin: 0 0 .5rem; }
  .check {
    display: flex; align-items: flex-start; gap: .8rem; width: 100%; text-align: left;
    background: var(--surface); border: .15rem solid transparent; border-radius: .8rem;
    padding: .6rem .9rem; margin: 0 0 .5rem; font-size: 1.1rem; cursor: pointer; color: var(--muted);
  }
  .check::before {
    content: ""; flex: none; width: 1.3rem; height: 1.3rem; margin-top: .1rem;
    border: .15rem solid var(--line); border-radius: .35rem;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem; font-weight: 800; color: var(--accent-ink);
  }
  .check[aria-checked="true"] { color: var(--text); }
  .check[aria-checked="true"]::before { content: "✓"; background: var(--accent); border-color: var(--accent); }
  .check:focus, .check:hover { outline: none; border-color: var(--accent); background: var(--surface-2); }
  .shopmsg { margin: 0 0 1.4rem; font-size: 1.15rem; color: var(--muted); min-height: 1.6rem; }
  .shopmsg.ok { color: #9fd89a; }
  .shopmsg.err { color: #ff9b8a; }

  /* Mode pas à pas */
  .progress { height: .4rem; background: var(--surface-2); flex: none; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .stepmain {
    flex: 1; min-height: 0; display: grid; gap: 2.5rem;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
    padding: 2rem var(--gutter-x) 1rem;
  }
  .step { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .stepinner { margin: auto 0; }
  .step .count { color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: .03em; }
  .step .label { color: var(--muted); font-size: 1.2rem; margin: .3rem 0 0; }
  .step .stitle { font-size: 3rem; margin: .8rem 0 1.2rem; }
  .step .sbody { font-size: 1.85rem; line-height: 1.4; margin: 0; }
  .step .sbody.long { font-size: 1.5rem; }
  .step .sbody.xlong { font-size: 1.25rem; }
  .side { overflow-y: auto; margin: 0; }
  .side ul { font-size: 1.05rem; }
  .stepfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem var(--gutter-x) var(--gutter-y); flex: none;
  }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  .fade.rev { animation-name: fade-rev; }
  @keyframes fade-rev { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }

  /* Téléphone / petit écran */
  @media (max-width: 700px) {
    html { font-size: 15px; }
    .top { flex-wrap: wrap; }
    .top h1 { font-size: 1.6rem; }
    .recipe, .stepmain { grid-template-columns: 1fr; }
    .extras { grid-template-columns: 1fr; }
    .step .stitle { font-size: 2rem; }
    .step .sbody { font-size: 1.3rem; }
    .stepmain { overflow-y: auto; }
    .stepfoot .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";
  var RECIPES = /*__DATA__*/[];
  var CATEGORIES = /*__CATEGORIES__*/[];
  var BY_SLUG = {};
  RECIPES.forEach(function (r) { BY_SLUG[r.slug] = r; });
  // Automatisation Home Assistant qui ajoute les ingrédients à todo.shopping_list
  // (webhook « local_only » : n'accepte que les appels du réseau local)
  var HA_WEBHOOK = "https://homeassistant.d.perivol.net/api/webhook/recettes-courses-foTh1ZgsdSDpRFjhsT12Q0zk";
  var app = document.getElementById("app");
  var view = { name: "home" };
  var lastSlug = null;
  var lastCat = null;
  var lastStep = 0;
  var shopSel = {};  // Cases cochées de la liste de courses, par recette
  var sending = false;

  // ---------- Routage (hash) ----------
  function findCategory(slug) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].slug === slug) return CATEGORIES[i];
    }
    return null;
  }
  function recipesOf(cat) {
    return RECIPES.filter(function (r) { return r.categorySlug === cat.slug; });
  }

  function parseRoute() {
    var c = /^#\/c\/([^\/]+)$/.exec(location.hash);
    if (c && findCategory(c[1])) return { name: "category", cat: findCategory(c[1]) };
    var m = /^#\/r\/([^\/]+)(?:\/etape\/(\d+)|\/(courses))?$/.exec(location.hash);
    if (!m || !BY_SLUG[m[1]]) return { name: "home" };
    var r = BY_SLUG[m[1]];
    if (m[3] && r.shopping.length) return { name: "shop", recipe: r };
    if (m[2] && r.steps.length) {
      var n = Math.min(Math.max(parseInt(m[2], 10), 1), r.steps.length);
      return { name: "step", recipe: r, n: n };
    }
    return { name: "recipe", recipe: r };
  }
  function parentHash(v) {
    if (v.name === "step" || v.name === "shop") return "#/r/" + v.recipe.slug;
    if (v.name === "recipe") return "#/c/" + v.recipe.categorySlug;
    return "#/";
  }
  function go(hash) {
    history.pushState({ app: 1 }, "", hash);
    render();
  }
  function replace(hash) {
    history.replaceState(history.state, "", hash);
    render();
  }
  function goBack() {
    if (view.name === "home") return;
    if (history.state && history.state.app) history.back();
    else replace(parentHash(view));
  }
  window.addEventListener("popstate", render);
  window.addEventListener("resize", function () { if (view.name === "step") fitStep(); });

  // ---------- Rendu ----------
  function blocksHtml(blocks, olClass) {
    return blocks.map(function (b) {
      if (b.t === "p") return "<p>" + b.html + "</p>";
      var tag = b.t === "ol" ? "ol" : "ul";
      var cls = b.t === "ol" ? ' class="' + olClass + '"' : "";
      return "<" + tag + cls + ">" + b.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</" + tag + ">";
    }).join("");
  }
  function sectionHtml(sec, extraClass) {
    return '<section class="panel ' + (extraClass || "") + '">' +
      (sec.title ? "<h2>" + sec.title + "</h2>" : "") +
      sec.subs.map(function (s) {
        return (s.title ? "<h3>" + s.title + "</h3>" : "") + blocksHtml(s.blocks, "steps");
      }).join("") + "</section>";
  }

  function cardHtml(r) {
    return '<a class="card nav" href="#/r/' + r.slug + '" data-go="#/r/' + r.slug + '" data-slug="' + r.slug + '">' +
      '<span class="emoji">' + r.emoji + "</span>" +
      '<span class="ctitle">' + r.nameHtml + "</span>" +
      (r.subtitle ? '<span class="csub">' + r.subtitle + "</span>" : "") + "</a>";
  }

  function renderHome() {
    document.title = "Mes recettes";
    app.innerHTML =
      '<header class="top"><div class="ttl"><h1>Mes recettes</h1>' +
      '<p class="sub">' + RECIPES.length + " recettes · " + CATEGORIES.length + " catégories</p></div>" +
      '<p class="hint">◀ ▲ ▼ ▶ pour choisir · OK pour ouvrir</p></header>' +
      '<main class="scroll"><div class="grid cats">' +
      CATEGORIES.map(function (c) {
        var list = recipesOf(c);
        return '<a class="card catcard nav" href="#/c/' + c.slug + '" data-go="#/c/' + c.slug + '" data-cat="' + c.slug + '">' +
          '<span class="emoji">' + list.slice(0, 3).map(function (r) { return r.emoji; }).join("") + "</span>" +
          '<span class="ctitle">' + c.nameHtml + "</span>" +
          '<span class="csub">' + list.length + (list.length > 1 ? " recettes" : " recette") + "</span></a>";
      }).join("") + "</div></main>";
    var target = lastCat && app.querySelector('[data-cat="' + lastCat + '"]');
    focusEl(target || app.querySelector(".card"));
  }

  function renderCategory(c) {
    document.title = c.name;
    var list = recipesOf(c);
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn nav" data-back>← Catégories</button>' +
      '<div class="ttl"><h1>' + c.nameHtml + "</h1>" +
      '<p class="sub">' + list.length + (list.length > 1 ? " recettes" : " recette") + "</p></div>" +
      "</header>" +
      '<main class="scroll"><div class="grid">' + list.map(cardHtml).join("") + "</div></main>";
    var target = lastSlug && app.querySelector('[data-slug="' + lastSlug + '"]');
    focusEl(target || app.querySelector(".card"));
  }

  function renderRecipe(r) {
    document.title = r.name;
    var hasSteps = r.steps.length > 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn nav" data-back>← ' + findCategory(r.categorySlug).nameHtml + "</button>" +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1>" +
      (r.subtitle ? '<p class="sub">' + r.subtitle + "</p>" : "") + "</div>" +
      (r.shopping.length ? '<button class="btn nav" data-go="#/r/' + r.slug + '/courses">🛒 Courses</button>' : "") +
      (hasSteps ? '<button class="btn primary nav" id="start" data-go="#/r/' + r.slug + '/etape/1">▶ Pas à pas</button>' : "") +
      "</header>" +
      '<main class="scroll recipe">' +
      (r.ingredients ? sectionHtml(r.ingredients) : "<div></div>") +
      "<div>" + r.prep.map(function (s) { return sectionHtml(s); }).join("") + "</div>" +
      (r.other.length ? '<div class="extras">' + r.other.map(function (s) { return sectionHtml(s); }).join("") + "</div>" : "") +
      "</main>";
    focusEl(document.getElementById("start") || app.querySelector(".nav"));
  }

  function esc(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function shopItems(r) {
    var list = [];
    r.shopping.forEach(function (g) { list = list.concat(g.items); });
    return list;
  }

  function selection(r) {
    if (!shopSel[r.slug]) shopSel[r.slug] = shopItems(r).map(function (it) { return !it.opt; });
    return shopSel[r.slug];
  }

  function sendLabel(r) {
    var n = selection(r).filter(Boolean).length;
    return n ? "Ajouter " + n + (n > 1 ? " articles" : " article") : "Rien à ajouter";
  }

  function renderShop(r) {
    document.title = r.name + " – courses";
    var sel = selection(r);
    var i = 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn nav" data-back>← Recette</button>' +
      '<div class="ttl"><h1>🛒 ' + r.nameHtml + "</h1>" +
      '<p class="sub">Cochez ce qu\'il faut acheter</p></div>' +
      '<button class="btn primary nav" id="send" data-send>' + sendLabel(r) + "</button>" +
      "</header>" +
      '<main class="scroll"><p class="shopmsg" id="shopmsg" role="status"></p><div class="shop">' +
      r.shopping.map(function (g) {
        return "<section>" + (g.title ? "<h3>" + esc(g.title) + "</h3>" : "") +
          g.items.map(function (it) {
            var k = i++;
            return '<button class="check nav" role="checkbox" aria-checked="' + sel[k] + '" data-item="' + k + '">' +
              esc(it.text) + "</button>";
          }).join("") + "</section>";
      }).join("") + "</div></main>";
    focusEl(document.getElementById("send"));
  }

  function toggleItem(el) {
    var sel = selection(view.recipe);
    var k = parseInt(el.getAttribute("data-item"), 10);
    sel[k] = !sel[k];
    el.setAttribute("aria-checked", sel[k]);
    document.getElementById("send").textContent = sendLabel(view.recipe);
  }

  function shopStatus(text, cls) {
    var msg = document.getElementById("shopmsg");
    if (!msg) return;
    msg.textContent = text;
    msg.className = "shopmsg " + (cls || "");
  }

  // Envoi en « no-cors » (formulaire simple, sans requête préalable) : la réponse
  // n'est pas lisible, seule une erreur réseau signale un échec
  function sendShopping() {
    var r = view.recipe;
    var sel = selection(r);
    var items = shopItems(r).filter(function (it, k) { return sel[k]; }).map(function (it) { return it.text; });
    if (!items.length || sending) return;
    sending = true;
    shopStatus("Envoi à Home Assistant…");
    fetch(HA_WEBHOOK, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams({ recette: r.name, ingredients: items.join("\n") })
    }).then(function () {
      shopStatus("✓ " + items.length + (items.length > 1 ? " articles ajoutés" : " article ajouté") + " à la liste de courses", "ok");
    }).catch(function () {
      shopStatus("Home Assistant ne répond pas : êtes-vous sur le réseau de la maison ?", "err");
    }).then(function () { sending = false; });
  }

  function sizeClass(htmlText) {
    var len = htmlText.replace(/<[^>]*>/g, "").length;
    return len > 320 ? " xlong" : len > 200 ? " long" : "";
  }

  // Sur grand écran (TV), rapetisse le texte de l'étape tant qu'il dépasse :
  // la télécommande ne permet pas de faire défiler la zone de l'étape
  function fitStep() {
    var step = app.querySelector(".step");
    var body = app.querySelector(".step .sbody");
    var title = app.querySelector(".step .stitle");
    if (!step || !body || window.innerWidth <= 700) return;
    body.style.fontSize = "";
    if (title) title.style.fontSize = "";
    var base = parseFloat(getComputedStyle(body).fontSize);
    var tbase = title ? parseFloat(getComputedStyle(title).fontSize) : 0;
    for (var k = 0.95; step.scrollHeight > step.clientHeight + 1 && k >= 0.6; k -= 0.05) {
      body.style.fontSize = (base * k) + "px";
      if (title) title.style.fontSize = (tbase * Math.max(k, 0.8)) + "px";
    }
  }

  function renderStep(r, n) {
    var s = r.steps[n - 1];
    var total = r.steps.length;
    var dir = n < lastStep ? " rev" : "";
    lastStep = n;
    document.title = r.name + " – étape " + n;
    var side = app.querySelector(".side");
    var sideScroll = side ? side.scrollTop : 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn" tabindex="-1" data-back>✕ Quitter</button>' +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1></div>" +
      "</header>" +
      '<div class="progress"><div style="width:' + (n / total * 100) + '%"></div></div>' +
      '<main class="stepmain">' +
      '<section class="step"><div class="stepinner fade' + dir + '">' +
      '<div class="count">Étape ' + n + " / " + total + "</div>" +
      (s.label ? '<p class="label">' + s.label + "</p>" : "") +
      (s.title ? '<h2 class="stitle">' + s.title + "</h2>" : "") +
      '<p class="sbody' + sizeClass(s.body) + '">' + s.body + "</p></div></section>" +
      (r.ingredients ? sectionHtml(r.ingredients, "side") : "") +
      "</main>" +
      '<footer class="stepfoot">' +
      '<button class="btn" tabindex="-1" data-step="-1"' + (n === 1 ? " disabled style=\"visibility:hidden\"" : "") + ">◀ Précédente</button>" +
      '<span class="hint">◀ ▶ changer d\'étape · ▲ ▼ ingrédients · Retour pour quitter</span>' +
      '<button class="btn primary" tabindex="-1" data-step="1">' + (n === total ? "Terminé ✓" : "Suivante ▶") + "</button>" +
      "</footer>";
    var newSide = app.querySelector(".side");
    if (newSide) newSide.scrollTop = sideScroll;
    fitStep();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function render() {
    var prev = view;
    view = parseRoute();
    if (view.name !== "step") lastStep = 0;
    if (view.name === "home") renderHome();
    else if (view.name === "category") { lastCat = view.cat.slug; renderCategory(view.cat); }
    else if (view.name === "recipe") {
      lastSlug = view.recipe.slug;
      lastCat = view.recipe.categorySlug;
      renderRecipe(view.recipe);
    }
    else if (view.name === "shop") {
      lastSlug = view.recipe.slug;
      renderShop(view.recipe);
    }
    else {
      if (prev.name !== "step" || prev.recipe !== view.recipe) lastStep = 0;
      lastSlug = view.recipe.slug;
      renderStep(view.recipe, view.n);
    }
    keepAwake(view.name === "step");
  }

  function changeStep(delta) {
    var n = view.n + delta;
    if (n < 1) return;
    if (n > view.recipe.steps.length) { goBack(); return; }
    replace("#/r/" + view.recipe.slug + "/etape/" + n);
  }

  // ---------- Navigation à la télécommande ----------
  function focusEl(el) {
    if (!el) return;
    el.focus({ preventScroll: true });
    var sc = el.classList.contains("card") && app.querySelector(".scroll");
    if (!sc) {
      if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    // Garde la carte visible, avec une marge pour l'effet d'agrandissement au focus
    var view = sc.getBoundingClientRect(), card = el.getBoundingClientRect();
    var pad = 16;
    if (card.top < view.top + pad) sc.scrollBy({ top: card.top - view.top - pad, behavior: "smooth" });
    else if (card.bottom > view.bottom - pad) sc.scrollBy({ top: card.bottom - view.bottom + pad, behavior: "smooth" });
  }

  function moveFocus(dir) {
    var els = Array.prototype.slice.call(app.querySelectorAll(".nav"));
    var cur = document.activeElement;
    if (els.indexOf(cur) < 0) { focusEl(els[0]); return !!els[0]; }
    var a = cur.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = null, bestScore = Infinity;
    els.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      var main, cross;
      if (dir === "left") { main = -dx; cross = dy; }
      else if (dir === "right") { main = dx; cross = dy; }
      else if (dir === "up") { main = -dy; cross = dx; }
      else { main = dy; cross = dx; }
      if (main <= 1) return;
      var score = main + Math.abs(cross) * 2;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) focusEl(best);
    return !!best;
  }

  function scrollArea(selector, dir) {
    var el = app.querySelector(selector);
    if (el) el.scrollBy({ top: dir * el.clientHeight * 0.45, behavior: "smooth" });
  }

  var BACK_KEYS = { Escape: 1, Backspace: 1, GoBack: 1, BrowserBack: 1 };
  var BACK_CODES = { 4: 1, 27: 1, 461: 1, 10009: 1 };
  var DIRS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Left: "left", Right: "right", Up: "up", Down: "down" };

  document.addEventListener("keydown", function (e) {
    if (BACK_KEYS[e.key] || BACK_CODES[e.keyCode]) {
      if (view.name !== "home") { e.preventDefault(); goBack(); }
      return;
    }
    var dir = DIRS[e.key];
    var enter = e.key === "Enter" || e.key === " " || e.keyCode === 13;
    if (view.name === "step") {
      if (dir === "right" || enter) { e.preventDefault(); changeStep(1); }
      else if (dir === "left") { e.preventDefault(); changeStep(-1); }
      else if (dir === "up" || dir === "down") { e.preventDefault(); scrollArea(".side", dir === "up" ? -1 : 1); }
      return;
    }
    if (dir) {
      e.preventDefault();
      if (!moveFocus(dir) && (dir === "up" || dir === "down")) scrollArea(".scroll", dir === "up" ? -1 : 1);
    }
  });

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-back],[data-step],[data-item],[data-send]");
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute("data-back")) goBack();
    else if (t.hasAttribute("data-item")) toggleItem(t);
    else if (t.hasAttribute("data-send")) sendShopping();
    else if (t.hasAttribute("data-step")) changeStep(parseInt(t.getAttribute("data-step"), 10));
    else go(t.getAttribute("data-go"));
  });

  // ---------- Garder l'écran allumé en mode pas à pas (si le navigateur le permet) ----------
  var wakeLock = null;
  function keepAwake(on) {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") keepAwake(view.name === "step");
  });

  render();
})();
</script>
</body>
</html>
