<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes recettes</title>
<style>
  :root {
    --bg: #17120f;
    --surface: #241c17;
    --surface-2: #30261f;
    --text: #f5ece3;
    --muted: #bba999;
    --accent: #f4a259;
    --accent-ink: #1d130b;
    --line: #42352b;
    --gutter-x: 4vw;
    --gutter-y: 3vh;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; font-size: clamp(14px, 1.6vw, 48px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  strong { color: #ffd2a6; }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button, a { font: inherit; color: inherit; }

  /* En-tête commun */
  .top {
    display: flex; align-items: center; gap: 1.5rem;
    padding: var(--gutter-y) var(--gutter-x) 1.2rem;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 2.2rem; font-weight: 750; }
  .top .sub { color: var(--muted); font-size: 1.1rem; margin: .2rem 0 0; }
  .hint { color: var(--muted); font-size: .95rem; }

  .btn {
    background: var(--surface-2); border: 0.15rem solid transparent; border-radius: 0.8rem;
    padding: .6rem 1.2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav:focus { outline: none; }
  .btn:focus, .btn:hover { border-color: var(--text); }
  .btn.primary:focus { box-shadow: 0 0 0 .25rem var(--text); }

  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: .5rem; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: .25rem; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll { flex: 1; overflow-y: auto; padding: 1.8rem var(--gutter-x) var(--gutter-y); }

  /* Accueil */
  .grid {
    display: grid; gap: 1.6rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    align-content: start;
  }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: .5rem;
    background: var(--surface); border-radius: 1.2rem; padding: 1.4rem;
    border: .2rem solid transparent; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:focus, .card:hover { border-color: var(--accent); background: var(--surface-2); transform: scale(1.04); }
  .card .emoji { font-size: 3.2rem; line-height: 1; }
  .card .ctitle { font-size: 1.45rem; font-weight: 700; }
  .card .csub { color: var(--muted); font-size: 1rem; }

  /* Fiche recette */
  .recipe {
    display: grid; gap: 2rem; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
  }
  .panel { background: var(--surface); border-radius: 1.2rem; padding: 1.4rem 1.6rem; }
  .panel h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: .8rem; }
  .panel h3 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
  .panel p { margin: .4rem 0; font-size: 1.1rem; }
  .panel ul { margin: 0; padding-left: 1.3rem; font-size: 1.15rem; }
  .panel li { margin: .35rem 0; }
  .panel li::marker { color: var(--accent); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; font-size: 1.2rem; }
  ol.steps li { counter-increment: step; position: relative; padding-left: 3rem; margin: 0 0 1rem; min-height: 2.2rem; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: -.1rem;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .extras { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  .extras ul { font-size: 1.05rem; }

  /* Mode pas à pas */
  .progress { height: .4rem; background: var(--surface-2); flex: none; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .stepmain {
    flex: 1; min-height: 0; display: grid; gap: 2.5rem;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
    padding: 2rem var(--gutter-x) 1rem;
  }
  .step { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .stepinner { margin: auto 0; }
  .step .count { color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: .03em; }
  .step .label { color: var(--muted); font-size: 1.2rem; margin: .3rem 0 0; }
  .step .stitle { font-size: 3.4rem; margin: 1rem 0 1.4rem; }
  .step .sbody { font-size: 2.1rem; line-height: 1.4; margin: 0; }
  .step .sbody.long { font-size: 1.65rem; }
  .step .sbody.xlong { font-size: 1.4rem; }
  .side { overflow-y: auto; margin: 0; }
  .side ul { font-size: 1.05rem; }
  .stepfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem var(--gutter-x) var(--gutter-y); flex: none;
  }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  .fade.rev { animation-name: fade-rev; }
  @keyframes fade-rev { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }

  /* Téléphone / petit écran */
  @media (max-width: 700px) {
    html { font-size: 15px; }
    .top { flex-wrap: wrap; }
    .top h1 { font-size: 1.6rem; }
    .recipe, .stepmain { grid-template-columns: 1fr; }
    .extras { grid-template-columns: 1fr; }
    .step .stitle { font-size: 2rem; }
    .step .sbody { font-size: 1.3rem; }
    .stepmain { overflow-y: auto; }
    .stepfoot .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

idir<\/strong> : laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain est cuit<\/strong> quand il sonne creux lorsqu'on tapote sous sa base.", "<strong>La vapeur<\/strong> au début de la cuisson permet au pain de bien gonfler et donne une croûte croustillante et brillante.", "<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : mélangez-le d'abord à la farine.", "<strong>Pour un pain plus savoureux, à la mie plus alvéolée<\/strong>, faites la première pousse au réfrigérateur pendant 12 à 24 heures, puis laissez la pâte revenir 1 heure à température ambiante avant de la façonner.", "<strong>Le pain se congèle très bien<\/strong> : emballez-le une fois complètement refroidi et réchauffez-le 10 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pain complet<\/strong> : remplacez la moitié de la farine T65 par de la farine complète (T150) et ajoutez 5 cl d'eau.", "<strong>Pain aux céréales<\/strong> : ajoutez 150 g de graines (tournesol, lin, sésame, courge) au moment du mélange.", "<strong>Pain aux noix<\/strong> : ajoutez 200 g de cerneaux de noix concassés à la fin du pétrissage.", "<strong>Pain aux olives<\/strong> : ajoutez 200 g d'olives dénoyautées et coupées en morceaux à la fin du pétrissage."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte ho  "p", "html": "Sirop d'érable, miel, beurre, fruits rouges, banane, pépites de chocolat, Nutella, ou bacon grillé pour une version sucrée-salée."}]}]}], "steps": [{"label": "", "title": "Le mélange sec", "body": "Dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel."}, {"label": "", "title": "Le mélange liquide", "body": "Dans un autre bol, battez les œufs avec le lait, puis ajoutez le beurre fondu (tiédi)."}, {"label": "", "title": "Assembler", "body": "Versez le mélange liquide sur le mélange sec et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible. Quelques petits grumeaux ne sont pas un problème. La pâte doit être épaisse et napper la cuillère."}, {"label": "", "title": "Le repos", "body": "Laissez reposer 10 à 15 minutes, le temps que la levure commence à agir."}, {"label": "", "title": "La cuisson", "body": "Chauffez une poêle à <strong>feu moyen<\/strong> et graissez-la légèrement. Versez une petite louche de pâte sans l'étaler : le pancake doit faire environ 10 cm de diamètre et 1 cm d'épaisseur."}, {"label": "", "title": "Retourner", "body": "Quand des bulles apparaissent à la surface et que les bords semblent secs (environ 2 minutes), retournez le pancake et laissez cuire 1 à 2 minutes de l'autre côté."}]}, {"slug": "pate-a-choux", "name": "Pâte à choux", "nameHtml": "Pâte à choux", "subtitle": "environ 60 choux ou 30 éclairs", "emoji": "🧁", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["25 cl d'eau", "25 cl de lait", "200 g de beurre doux, coupé en dés", "300 g de farine (type T45 ou T55), tamisée", "8 œufs (environ 400 g sans la coquille)", "2 pincées de sel", "2 cuillères à café de sucre (à supprimer pour des choux salés, comme les gougères)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>200 °C<\/strong> et recouvrez deux plaques de papier cuisson.", "<strong>Faire bouillir<\/strong> : dans une grande casserole, portez à ébullition l'eau, le lait, le beurre, le sel et le sucre, en remuant pour que le beurre fonde complètement.", "<strong>Ajouter la farine<\/strong> : retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène.", "<strong>Dessécher la pâte<\/strong> : remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole.", "<strong>Refroidir<\/strong> : transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant.", "<strong>Les œufs<\/strong> : battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante.", "<strong>Vérifier la consistance<\/strong> : tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf.", "<strong>Dresser<\/strong> : remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères.", "<strong>La cuisson<\/strong> : enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas Dans une grande casserole, portez à ébullition l'eau, le lait, le beurre, le sel et le sucre, en remuant pour que le beurre fonde complètement."}, {"label": "", "title": "Ajouter la farine", "body": "Retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène."}, {"label": "", "title": "Dessécher la pâte", "body": "Remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole."}, {"label": "", "title": "Refroidir", "body": "Transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant."}, {"label": "", "title": "Les œufs", "body": "Battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante."}, {"label": "", "title": "Vérifier la consistance", "body": "Tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf."}, {"label": "", "title": "Dresser", "body": "Remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères."}, {"label": "", "title": "La cuisson", "body": "Enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas le four<\/strong> pendant les 20 premières minutes."}, {"label": "", "title": "Sécher", "body": "Éteignez le four, entrouvrez la porte (coincez une cuillère en bois) et laissez les choux sécher 10 minutes à l'intérieur, puis laissez-les refroidir sur une grille avant de les garnir."}]}, {"slug": "pizza", "name": "Pâte à pizza", "nameHtml": "Pâte à pizza", "subtitle": "4 pizzas de 30 cm environ", "emoji": "🍕", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45 ou T55, ou farine italienne « 00 »)", "60 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "4 cuillères à soupe d'huile d'olive", "20 g de sel", "2 cuillères à café de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau.", "<strong>Le pétrissage<\/strong> : mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts.", "<strong>La pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm.", "<strong>La garniture<\/strong> : déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la.", "<strong>La cuisson<\/strong> : enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : c'est pour ça qu'on le mélange d'abord à la farine.", "<strong>Pour une pâte plus savoureuse et plus digeste<\/strong>, laissez-la lever 24 à 48 heures au réfrigérateur, puis sortez-la 1 heure avant de l'étaler.", "<strong>Pour une base bien croustillante<\/strong>, préchauffez la plaque (ou une pierre à pizza) dans le four et faites glisser la pizza dessus.", "<strong>La pâte se congèle très bien<\/strong> : après la pousse, emballez les pâtons séparément dans du film alimentaire. Décongelez-les au réfrigérateur la veille."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Margherita<\/strong> : sauce tomate, mozzarella, basilic frais, huile d'olive.", "<strong>Reine<\/strong> : sauce tomate, mozzarella, jambon, champignons.", "<strong>Quatre fromages<\/strong> : mozzarella, gorgonzola, chèvre, parmesan.", "<strong>Végétarienne<\/strong> : sauce tomate, mozzarella, poivrons, oignons, courgettes, olives.", "<strong>Blanche<\/strong> : crème fraîche, mozzarella, lardons, oignons."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau."}, {"label": "", "title": "Le pétrissage", "body": "Mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts."}, {"label": "", "title": "La pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm."}, {"label": "", "title": "La garniture", "body": "Déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la."}, {"label": "", "title": "La cuisson", "body": "Enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."}]}, {"slug": "pate-brisee", "name": "Pâte brisée", "nameHtml": "Pâte brisée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🥧", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "10 à 12 cl d'eau très froide", "2 pincées de sel", "Facultatif : 2 jaunes d'œufs (pour une pâte plus riche et plus facile à travailler ; réduisez alors l'eau à 6 à 8 cl)", "Facultatif, pour une tarte sucrée : 2 cuillères à soupe de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles.", "<strong>Ajouter l'eau<\/strong> : creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, puis versez l'eau froide <strong>petit à petit<\/strong> en mélangeant du bout des doigts ou avec une fourchette. Arrêtez dès que la pâte se rassemble en boule : elle ne doit pas être collante.", "<strong>Fraser<\/strong> : sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas.", "<strong>Le repos<\/strong> : divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 30 minutes<\/strong> au réfrigérateur.", "<strong>Étaler<\/strong> : sur un plan de travail fariné, étalez chaque disque au rouleau sur environ 3 mm d'épaisseur. Enroulez la pâte autour du rouleau pour la déposer dans le moule beurré, puis faites-la adhérer aux bords et coupez l'excédent.", "<strong>Piquer<\/strong> : piquez le fond de tarte avec une fourchette pour éviter qu'il gonfle, puis remettez-le 15 minutes au réfrigérateur.", "<strong>La cuisson<\/strong> : selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."]}]}, {"title": "Cuisson à blanc", "blocks": [{"t": "p", "html": "Pour une garniture qui ne cuit pas (tarte aux fraises, au citron) ou très liquide (quiche), faites précuire le fond :"}, {"t": "ol", "items": ["Préchauffez le four à <strong>180 °C<\/strong>.", "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs (haricots, pois chiches).", "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>5 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> (beurre, eau, mains) : si le beurre fond pendant la préparation, la pâte devient dure et perd son côté friable.", "<strong>Travaillez la pâte le moins possible<\/strong> : plus on la pétrit, plus elle devient élastique et se rétracte à la cuisson.", "<strong>Le repos au froid est indispensable<\/strong> : il détend la pâte et l'empêche de rétrécir dans le moule.", "<strong>Pour éviter un fond détrempé<\/strong> avec une quiche, badigeonnez le fond précuit d'un peu de blanc d'œuf et remettez-le 2 minutes au four avant de garnir.", "<strong>La pâte se conserve<\/strong> 2 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille."]}]}]}, {"title": "Idées de tartes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Salées<\/strong> : quiche lorraine, tarte aux poireaux, tarte à la tomate et à la moutarde, tarte au thon.", "<strong>Sucrées<\/strong> : tarte aux pommes, tarte aux prunes, tarte au citron, tarte aux fraises, tarte bourdaloue (poires et amandes)."]}]}]}], "steps": [{"label": "", "title": "Sabler", "body": "Dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles."}, {"label": "", "title": "Ajouter l'eau", "body": "Creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, puis versez l'eau froide <strong>petit à petit<\/strong> en mélangeant du bout des doigts ou avec une fourchette. Arrêtez dès que la pâte se rassemble en boule : elle ne doit pas être collante."}, {"label": "", "title": "Fraser", "body": "Sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas."}, {"label": "", "title": "Le repos", "body": "Divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Étaler", "body": "Sur un plan de travail fariné, étalez chaque disque au rouleau sur environ 3 mm d'épaisseur. Enroulez la pâte autour du rouleau pour la déposer dans le moule beurré, puis faites-la adhérer aux bords et coupez l'excédent."}, {"label": "", "title": "Piquer", "body": "Piquez le fond de tarte avec une fourchette pour éviter qu'il gonfle, puis remettez-le 15 minutes au réfrigérateur."}, {"label": "", "title": "La cuisson", "body": "Selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."}, {"label": "Cuisson à blanc", "title": "", "body": "Préchauffez le four à <strong>180 °C<\/strong>."}, {"label": "Cuisson à blanc", "title": "", "body": "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs (haricots, pois chiches)."}, {"label": "Cuisson à blanc", "title": "", "body": "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>5 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré."}]}, {"slug": "pate-feuilletee", "name": "Pâte feuilletée", "nameHtml": "Pâte feuilletée", "subtitle": "environ 1,2 kg de pâte", "emoji": "🥐", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "25 cl d'eau très froide", "50 g de beurre fondu (tiédi)", "10 g de sel"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["400 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans un grand saladier, mélangez la farine et le sel. Ajoutez l'eau froide et le beurre fondu, puis mélangez rapidement jusqu'à obtenir une boule de pâte homogène. Ne la pétrissez pas.", "<strong>Le repos de la détrempe<\/strong> : incisez une croix sur le dessus de la boule, emballez-la dans du film alimentaire et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur.", "<strong>Préparer le beurre<\/strong> : placez le beurre froid entre deux feuilles de papier cuisson et tapez-le avec le rouleau pour l'assouplir, puis étalez-le en un carré d'environ 15 cm de côté et 1 cm d'épaisseur. Remettez-le au réfrigérateur 15 minutes : il doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : sur un plan de travail fariné, étalez la détrempe en croix en laissant le centre plus épais. Posez le carré de beurre au centre, puis rabattez les quatre côtés de la pâte par-dessus pour l'enfermer complètement. Soudez bien les bords.", "<strong>Les deux premiers tours<\/strong> : étalez la pâte en un long rectangle (environ 3 fois plus long que large), toujours dans le même sens. Pliez-le en trois comme une lettre : c'est un <strong>tour simple<\/strong>. Tournez la pâte d'un quart de tour vers la droite et recommencez une deuxième fois.", "<strong>Repos<\/strong> : marquez 2 empreintes de doigt sur la pâte pour vous souvenir du nombre de tours, emballez-la et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le 3ᵉ et le 4ᵉ tour<\/strong> : recommencez deux tours simples comme à l'étape 5, marquez 4 empreintes, puis laissez reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le 5ᵉ et le 6ᵉ tour<\/strong> : faites les deux derniers tours simples, puis laissez reposer la pâte au moins <strong>30 minutes<\/strong> au réfrigérateur avant de l'utiliser.", "<strong>Utilisation<\/strong> : divisez la pâte selon vos besoins, étalez-la sur environ 3 mm d'épaisseur et découpez-la avec un couteau bien aiguisé, sans écraser les bords.", "<strong>La cuisson<\/strong> : faites cuire dans un four préchauffé à <strong>200 °C<\/strong>, de 15 à 35 minutes selon la recette, jusqu'à ce que la pâte soit bien gonflée et dorée."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> : si le beurre devient mou et commence à traverser la pâte, remettez-la 15 minutes au réfrigérateur avant de continuer.", "<strong>Le beurre et la détrempe doivent avoir la même consistance<\/strong> : un beurre trop dur casse en morceaux, un beurre trop mou se mélange à la pâte, et dans les deux cas le feuilletage rate.", "<strong>Farinez légèrement<\/strong> le plan de travail et brossez l'excédent de farine avant chaque pliage.", "<strong>Pour un feuilletage régulier<\/strong>, découpez la pâte avec une lame bien tranchante, d'un coup sec, et ne dorez jamais les tranches : le jaune d'œuf colle les feuillets et les empêche de gonfler.", "<strong>La pâte se conserve<\/strong> 3 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille.", "<strong>Les chutes<\/strong> ne doivent pas être mises en boule : superposez-les à plat et étalez-les, elles serviront pour des palmiers ou des allumettes au fromage."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Sucrées<\/strong> : galette des rois, chaussons aux pommes, mille-feuille, palmiers, tarte fine aux pommes, pithiviers.", "<strong>Salées<\/strong> : bouchées à la reine (vol-au-vent), feuilletés saucisse, allumettes au fromage, tarte fine à la tomate, friands, pâté en croûte."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans un grand saladier, mélangez la farine et le sel. Ajoutez l'eau froide et le beurre fondu, puis mélangez rapidement jusqu'à obtenir une boule de pâte homogène. Ne la pétrissez pas."}, {"label": "", "title": "Le repos de la détrempe", "body": "Incisez une croix sur le dessus de la boule, emballez-la dans du film alimentaire et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur."}, {"label": "", "title": "Préparer le beurre", "body": "Placez le beurre froid entre deux feuilles de papier cuisson et tapez-le avec le rouleau pour l'assouplir, puis étalez-le en un carré d'environ 15 cm de côté et 1 cm d'épaisseur. Remettez-le au réfrigérateur 15 minutes : il doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Sur un plan de travail fariné, étalez la détrempe en croix en laissant le centre plus épais. Posez le carré de beurre au centre, puis rabattez les quatre côtés de la pâte par-dessus pour l'enfermer complètement. Soudez bien les bords."}, {"label": "", "title": "Les deux premiers tours", "body": "Étalez la pâte en un long rectangle (environ 3 fois plus long que large), toujours dans le même sens. Pliez-le en trois comme une lettre : c'est un <strong>tour simple<\/strong>. Tournez la pâte d'un quart de tour vers la droite et recommencez une deuxième fois."}, {"label": "", "title": "Repos", "body": "Marquez 2 empreintes de doigt sur la pâte pour vous souvenir du nombre de tours, emballez-la et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le 3ᵉ et le 4ᵉ tour", "body": "Recommencez deux tours simples comme à l'étape 5, marquez 4 empreintes, puis laissez reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le 5ᵉ et le 6ᵉ tour", "body": "Faites les deux derniers tours simples, puis laissez reposer la pâte au moins <strong>30 minutes<\/strong> au réfrigérateur avant de l'utiliser."}, {"label": "", "title": "Utilisation", "body": "Divisez la pâte selon vos besoins, étalez-la sur environ 3 mm d'épaisseur et découpez-la avec un couteau bien aiguisé, sans écraser les bords."}, {"label": "", "title": "La cuisson", "body": "Faites cuire dans un four préchauffé à <strong>200 °C<\/strong>, de 15 à 35 minutes selon la recette, jusqu'à ce que la pâte soit bien gonflée et dorée."}]}, {"slug": "pate-sablee", "name": "Pâte sablée", "nameHtml": "Pâte sablée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🍪", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "200 g de sucre glace", "2 œufs", "2 pincées de sel", "2 sachets de sucre vanillé", "Facultatif : 60 g de poudre d'amande (pour une pâte plus parfumée et plus friable ; retirez alors 60 g de farine)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine, le sel et la poudre d'amande si vous en mettez. Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable fin<\/strong>, sans morceaux de beurre visibles.", "<strong>Le sucre<\/strong> : ajoutez le sucre glace et le sucre vanillé, puis mélangez du bout des doigts.", "<strong>Les œufs<\/strong> : battez légèrement les œufs, versez-les au centre et mélangez rapidement avec une fourchette, puis du bout des doigts, juste jusqu'à ce que la pâte se rassemble en boule.", "<strong>Fraser<\/strong> : sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas.", "<strong>Le repos<\/strong> : divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 1 heure<\/strong> au réfrigérateur.", "<strong>Étaler<\/strong> : étalez chaque disque sur environ 3 mm d'épaisseur, de préférence entre deux feuilles de papier cuisson : cette pâte est fragile et colle facilement. Déposez-la dans le moule beurré, faites-la adhérer aux bords et coupez l'excédent. Si elle se casse, recollez simplement les morceaux en appuyant avec les doigts.", "<strong>Piquer<\/strong> : piquez le fond de tarte avec une fourchette, puis remettez-le <strong>30 minutes<\/strong> au réfrigérateur pour qu'il ne se rétracte pas à la cuisson.", "<strong>La cuisson<\/strong> : selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."]}]}, {"title": "Cuisson à blanc", "blocks": [{"t": "p", "html": "Pour une garniture qui ne cuit pas (tarte aux fraises, au citron, au chocolat) :"}, {"t": "ol", "items": ["Préchauffez le four à <strong>170 °C<\/strong>.", "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs.", "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>8 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré. Surveillez bien : avec le sucre, la pâte sablée brunit vite."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pâte brisée ou pâte sablée ?<\/strong> La pâte sablée contient du sucre et des œufs : elle est plus friable, plus sucrée et réservée aux tartes sucrées et aux biscuits.", "<strong>Le sucre glace<\/strong> donne une pâte plus fine et plus régulière que le sucre en poudre.", "<strong>Tout doit rester froid<\/strong> : si la pâte devient molle et collante pendant que vous l'étalez, remettez-la 15 minutes au réfrigérateur.", "<strong>Pour éviter un fond détrempé<\/strong> avec des fruits juteux, badigeonnez le fond précuit d'un peu de blanc d'œuf, ou saupoudrez-le de poudre d'amande avant de garnir.", "<strong>La pâte se conserve<\/strong> 3 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille.", "<strong>Les chutes<\/strong> font de délicieux sablés : étalez-les, découpez-les à l'emporte-pièce et faites-les cuire 10 à 12 minutes à 180 °C."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tartes<\/strong> : tarte au citron meringuée, tarte aux fraises, tarte au chocolat, tarte aux framboises, tarte normande, tarte aux fruits de la passion.", "<strong>Biscuits<\/strong> : sablés nature, sablés à la confiture (lunettes), sablés au chocolat, biscuits de Noël décorés."]}]}]}], "steps": [{"label": "", "title": "Sabler", "body": "Dans un grand saladier, mélangez la farine, le sel et la poudre d'amande si vous en mettez. Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable fin<\/strong>, sans morceaux de beurre visibles."}, {"label": "", "title": "Le sucre", "body": "Ajoutez le sucre glace et le sucre vanillé, puis mélangez du bout des doigts."}, {"label": "", "title": "Les œufs", "body": "Battez légèrement les œufs, versez-les au centre et mélangez rapidement avec une fourchette, puis du bout des doigts, juste jusqu'à ce que la pâte se rassemble en boule."}, {"label": "", "title": "Fraser", "body": "Sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas."}, {"label": "", "title": "Le repos", "body": "Divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 1 heure<\/strong> au réfrigérateur."}, {"label": "", "title": "Étaler", "body": "Étalez chaque disque sur environ 3 mm d'épaisseur, de préférence entre deux feuilles de papier cuisson : cette pâte est fragile et colle facilement. Déposez-la dans le moule beurré, faites-la adhérer aux bords et coupez l'excédent. Si elle se casse, recollez simplement les morceaux en appuyant avec les doigts."}, {"label": "", "title": "Piquer", "body": "Piquez le fond de tarte avec une fourchette, puis remettez-le <strong>30 minutes<\/strong> au réfrigérateur pour qu'il ne se rétracte pas à la cuisson."}, {"label": "", "title": "La cuisson", "body": "Selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."}, {"label": "Cuisson à blanc", "title": "", "body": "Préchauffez le four à <strong>170 °C<\/strong>."}, {"label": "Cuisson à blanc", "title": "", "body": "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs."}, {"label": "Cuisson à blanc", "title": "", "body": "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>8 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré. Surveillez bien : avec le sucre, la pâte sablée brunit vite."}]}];
  var BY_SLUG = {};
  RECIPES.forEach(function (r) { BY_SLUG[r.slug] = r; });
  var app = document.getElementById("app");
  var view = { name: "home" };
  var lastSlug = null;
  var lastStep = 0;

  // ---------- Routage (hash) ----------
  function parseRoute() {
    var m = /^#\/r\/([^\/]+)(?:\/etape\/(\d+))?$/.exec(location.hash);
    if (!m || !BY_SLUG[m[1]]) return { name: "home" };
    var r = BY_SLUG[m[1]];
    if (m[2] && r.steps.length) {
      var n = Math.min(Math.max(parseInt(m[2], 10), 1), r.steps.length);
      return { name: "step", recipe: r, n: n };
    }
    return { name: "recipe", recipe: r };
  }
  function parentHash(v) {
    if (v.name === "step") return "#/r/" + v.recipe.slug;
    return "#/";
  }
  function go(hash) {
    history.pushState({ app: 1 }, "", hash);
    render();
  }
  function replace(hash) {
    history.replaceState(history.state, "", hash);
    render();
  }
  function goBack() {
    if (view.name === "home") return;
    if (history.state && history.state.app) history.back();
    else replace(parentHash(view));
  }
  window.addEventListener("popstate", render);

  // ---------- Rendu ----------
  function blocksHtml(blocks, olClass) {
    return blocks.map(function (b) {
      if (b.t === "p") return "<p>" + b.html + "</p>";
      var tag = b.t === "ol" ? "ol" : "ul";
      var cls = b.t === "ol" ? ' class="' + olClass + '"' : "";
      return "<" + tag + cls + ">" + b.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</" + tag + ">";
    }).join("");
  }
  function sectionHtml(sec, extraClass) {
    return '<section class="panel ' + (extraClass || "") + '">' +
      (sec.title ? "<h2>" + sec.title + "</h2>" : "") +
      sec.subs.map(function (s) {
        return (s.title ? "<h3>" + s.title + "</h3>" : "") + blocksHtml(s.blocks, "steps");
      }).join("") + "</section>";
  }

  function renderHome() {
    document.title = "Mes recettes";
    app.innerHTML =
      '<header class="top"><div class="ttl"><h1>Mes recettes</h1>' +
      '<p class="sub">' + RECIPES.length + " recettes</p></div>" +
      '<p class="hint">◀ ▲ ▼ ▶ pour choisir · OK pour ouvrir</p></header>' +
      '<main class="scroll"><div class="grid">' +
      RECIPES.map(function (r) {
        return '<a class="card nav" href="#/r/' + r.slug + '" data-go="#/r/' + r.slug + '" data-slug="' + r.slug + '">' +
          '<span class="emoji">' + r.emoji + "</span>" +
          '<span class="ctitle">' + r.nameHtml + "</span>" +
          (r.subtitle ? '<span class="csub">' + r.subtitle + "</span>" : "") + "</a>";
      }).join("") + "</div></main>";
    var target = lastSlug && app.querySelector('[data-slug="' + lastSlug + '"]');
    focusEl(target || app.querySelector(".card"));
  }

  function renderRecipe(r) {
    document.title = r.name;
    var hasSteps = r.steps.length > 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn nav" data-back>← Recettes</button>' +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1>" +
      (r.subtitle ? '<p class="sub">' + r.subtitle + "</p>" : "") + "</div>" +
      (hasSteps ? '<button class="btn primary nav" id="start" data-go="#/r/' + r.slug + '/etape/1">▶ Pas à pas</button>' : "") +
      "</header>" +
      '<main class="scroll recipe">' +
      (r.ingredients ? sectionHtml(r.ingredients) : "<div></div>") +
      "<div>" + r.prep.map(function (s) { return sectionHtml(s); }).join("") + "</div>" +
      (r.other.length ? '<div class="extras">' + r.other.map(function (s) { return sectionHtml(s); }).join("") + "</div>" : "") +
      "</main>";
    focusEl(document.getElementById("start") || app.querySelector(".nav"));
  }

  function sizeClass(htmlText) {
    var len = htmlText.replace(/<[^>]*>/g, "").length;
    return len > 320 ? " xlong" : len > 200 ? " long" : "";
  }

  function renderStep(r, n) {
    var s = r.steps[n - 1];
    var total = r.steps.length;
    var dir = n < lastStep ? " rev" : "";
    lastStep = n;
    document.title = r.name + " – étape " + n;
    var side = app.querySelector(".side");
    var sideScroll = side ? side.scrollTop : 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn" tabindex="-1" data-back>✕ Quitter</button>' +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1></div>" +
      "</header>" +
      '<div class="progress"><div style="width:' + (n / total * 100) + '%"></div></div>' +
      '<main class="stepmain">' +
      '<section class="step"><div class="stepinner fade' + dir + '">' +
      '<div class="count">Étape ' + n + " / " + total + "</div>" +
      (s.label ? '<p class="label">' + s.label + "</p>" : "") +
      (s.title ? '<h2 class="stitle">' + s.title + "</h2>" : "") +
      '<p class="sbody' + sizeClass(s.body) + '">' + s.body + "</p></div></section>" +
      (r.ingredients ? sectionHtml(r.ingredients, "side") : "") +
      "</main>" +
      '<footer class="stepfoot">' +
      '<button class="btn" tabindex="-1" data-step="-1"' + (n === 1 ? " disabled style=\"visibility:hidden\"" : "") + ">◀ Précédente</button>" +
      '<span class="hint">◀ ▶ changer d\'étape · ▲ ▼ ingrédients · Retour pour quitter</span>' +
      '<button class="btn primary" tabindex="-1" data-step="1">' + (n === total ? "Terminé ✓" : "Suivante ▶") + "</button>" +
      "</footer>";
    var newSide = app.querySelector(".side");
    if (newSide) newSide.scrollTop = sideScroll;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function render() {
    var prev = view;
    view = parseRoute();
    if (view.name !== "step") lastStep = 0;
    if (view.name === "home") renderHome();
    else if (view.name === "recipe") { lastSlug = view.recipe.slug; renderRecipe(view.recipe); }
    else {
      if (prev.name !== "step" || prev.recipe !== view.recipe) lastStep = 0;
      lastSlug = view.recipe.slug;
      renderStep(view.recipe, view.n);
    }
    keepAwake(view.name === "step");
  }

  function changeStep(delta) {
    var n = view.n + delta;
    if (n < 1) return;
    if (n > view.recipe.steps.length) { goBack(); return; }
    replace("#/r/" + view.recipe.slug + "/etape/" + n);
  }

  // ---------- Navigation à la télécommande ----------
  function focusEl(el) {
    if (!el) return;
    el.focus({ preventScroll: true });
    if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function moveFocus(dir) {
    var els = Array.prototype.slice.call(app.querySelectorAll(".nav"));
    var cur = document.activeElement;
    if (els.indexOf(cur) < 0) { focusEl(els[0]); return !!els[0]; }
    var a = cur.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = null, bestScore = Infinity;
    els.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      var main, cross;
      if (dir === "left") { main = -dx; cross = dy; }
      else if (dir === "right") { main = dx; cross = dy; }
      else if (dir === "up") { main = -dy; cross = dx; }
      else { main = dy; cross = dx; }
      if (main <= 1) return;
      var score = main + Math.abs(cross) * 2;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) focusEl(best);
    return !!best;
  }

  function scrollArea(selector, dir) {
    var el = app.querySelector(selector);
    if (el) el.scrollBy({ top: dir * el.clientHeight * 0.45, behavior: "smooth" });
  }

  var BACK_KEYS = { Escape: 1, Backspace: 1, GoBack: 1, BrowserBack: 1 };
  var BACK_CODES = { 4: 1, 27: 1, 461: 1, 10009: 1 };
  var DIRS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Left: "left", Right: "right", Up: "up", Down: "down" };

  document.addEventListener("keydown", function (e) {
    if (BACK_KEYS[e.key] || BACK_CODES[e.keyCode]) {
      if (view.name !== "home") { e.preventDefault(); goBack(); }
      return;
    }
    var dir = DIRS[e.key];
    var enter = e.key === "Enter" || e.key === " " || e.keyCode === 13;
    if (view.name === "step") {
      if (dir === "right" || enter) { e.preventDefault(); changeStep(1); }
      else if (dir === "left") { e.preventDefault(); changeStep(-1); }
      else if (dir === "up" || dir === "down") { e.preventDefault(); scrollArea(".side", dir === "up" ? -1 : 1); }
      return;
    }
    if (dir) {
      e.preventDefault();
      if (!moveFocus(dir) && (dir === "up" || dir === "down")) scrollArea(".scroll", dir === "up" ? -1 : 1);
    }
  });

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-back],[data-step]");
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute("data-back")) goBack();
    else if (t.hasAttribute("data-step")) changeStep(parseInt(t.getAttribute("data-step"), 10));
    else go(t.getAttribute("data-go"));
  });

  // ---------- Garder l'écran allumé en mode pas à pas (si le navigateur le permet) ----------
  var wakeLock = null;
  function keepAwake(on) {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") keepAwake(view.name === "step");
  });

  render();
})();
</script>
</body>
