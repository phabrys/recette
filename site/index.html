emière omelette). Ajoutez la moitié du lait, du sel et du poivre, et battez-les à la fourchette <strong>juste assez<\/strong> pour mélanger les blancs et les jaunes, sans les faire mousser.", "<strong>Chauffer la poêle<\/strong> : faites fondre la moitié du beurre dans une poêle antiadhésive de 24 à 26 cm, à feu <strong>moyen-vif<\/strong>, jusqu'à ce qu'il mousse sans brunir.", "<strong>Cuire<\/strong> : versez les œufs. Laissez-les prendre <strong>10 secondes<\/strong>, puis ramenez les bords vers le centre avec une spatule en inclinant la poêle pour que l'œuf liquide coule sur les bords. Recommencez pendant <strong>1 à 2 minutes<\/strong>.", "<strong>Garder baveux<\/strong> : arrêtez quand le dessous est pris mais que le dessus est encore légèrement crémeux. Parsemez de ciboulette ou de cives.", "<strong>Plier et servir<\/strong> : repliez l'omelette en deux ou en trois avec la spatule et faites-la glisser sur un plat. Servez aussitôt.", "<strong>La deuxième omelette<\/strong> : recommencez avec les 6 autres œufs et le reste du beurre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne faites pas une omelette géante<\/strong> : au-delà de 6 œufs dans une poêle de 26 cm, elle cuit mal. Faites-en plusieurs, elles cuisent en 2 minutes.", "<strong>Ne battez pas trop<\/strong> les œufs : une omelette trop battue est sèche et caoutchouteuse.", "<strong>La cuisson continue<\/strong> dans l'assiette : retirez-la du feu un peu avant qu'elle semble parfaite.", "<strong>Une poêle antiadhésive<\/strong> est indispensable pour une omelette qui glisse sans se déchirer."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au fromage<\/strong> : parsemez 60 g de fromage râpé sur chaque omelette avant de la plier.", "<strong>Aux pommes de terre<\/strong> : faites dorer des pommes de terre en dés à la poêle avant de verser les œufs, et laissez cuire à couvert à feu doux.", "<strong>Aux champignons, au jambon ou aux lardons<\/strong> : faites revenir la garniture à la poêle avant d'ajouter les œufs.", "<strong>À la créole<\/strong> : faites revenir des cives, de l'ail, de la tomate et un peu de piment, ajoutez éventuellement de la morue émiettée, puis versez les œufs.", "<strong>Omelette aux fines herbes<\/strong> : persil, ciboulette, cerfeuil et estragon hachés dans les œufs battus."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Salade verte, frites maison, pommes de terre sautées, riz blanc avec de la sauce créole."}]}]}], "steps": [{"label": "", "title": "Battre les œufs", "body": "Cassez 6 œufs dans un bol (pour la première omelette). Ajoutez la moitié du lait, du sel et du poivre, et battez-les à la fourchette <strong>juste assez<\/strong> pour mélanger les blancs et les jaunes, sans les faire mousser."}, {"label": "", "title": "Chauffer la poêle", "body": "Faites fondre la moitié du beurre dans une poêle antiadhésive de 24 à 26 cm, à feu <strong>moyen-vif<\/strong>, jusqu'à ce qu'il mousse sans brunir."}, {"label": "", "title": "Cuire", "body": "Versez les œufs. Laissez-les prendre <strong>10 secondes<\/strong>, puis ramenez les bords vers le centre avec une spatule en inclinant la poêle pour que l'œuf liquide coule sur les bords. Recommencez pendant <strong>1 à 2 minutes<\/strong>."}, {"label": "", "title": "Garder baveux", "body": "Arrêtez quand le dessous est pris mais que le dessus est encore légèrement crémeux. Parsemez de ciboulette ou de cives."}, {"label": "", "title": "Plier et servir", "body": "Repliez l'omelette en deux ou en trois avec la spatule et faites-la glisser sur un plat. Servez aussitôt."}, {"label": "", "title": "La deuxième omelette", "body": "Recommencez avec les 6 autres œufs et le reste du beurre."}], "categorySlug": "plats"}, {"slug": "pain-au-beurre", "name": "Pain au beurre antillais", "nameHtml": "Pain au beurre antillais", "subtitle": "4 pains moyens", "emoji": "🌴", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45)", "4 œufs, à température ambiante", "35 cl de lait tiède (ou moitié lait, moitié lait concentré non sucré)", "250 g de beurre doux mou, coupé en dés", "200 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "15 g de sel", "2 cuillères à café d'extrait de vanille (ou les graines d'une gousse)", "1 cuillère à café de cannelle en poudre", "½ noix de muscade râpée", "Le zeste de 2 citrons verts", "Facultatif : 2 cuillères à soupe de rhum blanc"]}]}, {"title": "Façonnage et dorure", "blocks": [{"t": "ul", "items": ["100 g de beurre doux bien mou", "1 jaune d'œuf + 2 cuillères à soupe de lait (ou de lait concentré sucré, pour une croûte plus brillante)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait.", "<strong>Le pétrissage<\/strong> : pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique.", "<strong>Le beurre<\/strong> : ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois.", "<strong>Première pousse<\/strong> : formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Diviser<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon.", "<strong>Le façonnage<\/strong> : étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus.", "<strong>Deuxième pousse<\/strong> : déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir sur une grille avant de servir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pliage avec le beurre<\/strong> est ce qui fait le pain au beurre : il s'ouvre légèrement à la cuisson et donne une mie feuilletée et fondante au centre.", "<strong>Le citron vert, la muscade et la vanille<\/strong> donnent le parfum typique des Antilles et de la Guyane : n'hésitez pas à ajuster les épices à votre goût.", "<strong>La pâte est un peu collante<\/strong> : résistez à l'envie d'ajouter de la farine, elle deviendra lisse avec le pétrissage et l'ajout du beurre.", "<strong>Pour gagner du temps le matin<\/strong>, laissez la première pousse se faire au réfrigérateur pendant la nuit. Sortez la pâte 1 heure avant de la façonner.", "<strong>Le pain au beurre se conserve<\/strong> 2 à 3 jours dans un sac en tissu ou emballé, et se congèle très bien. Réchauffez-le quelques minutes au four."]}]}]}, {"title": "Comment le déguster", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Avec un chocolat chaud antillais<\/strong> (chocolat de communion), épais et parfumé à la cannelle, à la muscade et au zeste de citron vert : c'est le duo traditionnel des communions, baptêmes, mariages, de Pâques et de Noël.", "<strong>Au petit-déjeuner<\/strong>, nature, tartiné de beurre salé ou de confiture de goyave.", "<strong>En pain perdu<\/strong>, quand il a un ou deux jours."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique."}, {"label": "", "title": "Le beurre", "body": "Ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Diviser", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon."}, {"label": "", "title": "Le façonnage", "body": "Étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus."}, {"label": "", "title": "Deuxième pousse", "body": "Déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir sur une grille avant de servir."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pain", "name": "Pain maison", "nameHtml": "Pain maison", "subtitle": "2 gros pains ou 4 baguettes", "emoji": "🥖", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T65, dite « farine à pain »)", "65 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "20 g de sel"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène.", "<strong>Le pétrissage<\/strong> : pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts.", "<strong>Première pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four.", "<strong>Grigner<\/strong> : juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé.", "<strong>La cuisson<\/strong> : enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée.", "<strong>Refroidir<\/strong> : laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain est cuit<\/strong> quand il sonne creux lorsqu'on tapote sous sa base.", "<strong>La vapeur<\/strong> au début de la cuisson permet au pain de bien gonfler et donne une croûte croustillante et brillante.", "<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : mélangez-le d'abord à la farine.", "<strong>Pour un pain plus savoureux, à la mie plus alvéolée<\/strong>, faites la première pousse au réfrigérateur pendant 12 à 24 heures, puis laissez la pâte revenir 1 heure à température ambiante avant de la façonner.", "<strong>Le pain se congèle très bien<\/strong> : emballez-le une fois complètement refroidi et réchauffez-le 10 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pain complet<\/strong> : remplacez la moitié de la farine T65 par de la farine complète (T150) et ajoutez 5 cl d'eau.", "<strong>Pain aux céréales<\/strong> : ajoutez 150 g de graines (tournesol, lin, sésame, courge) au moment du mélange.", "<strong>Pain aux noix<\/strong> : ajoutez 200 g de cerneaux de noix concassés à la fin du pétrissage.", "<strong>Pain aux olives<\/strong> : ajoutez 200 g d'olives dénoyautées et coupées en morceaux à la fin du pétrissage."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four."}, {"label": "", "title": "Grigner", "body": "Juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé."}, {"label": "", "title": "La cuisson", "body": "Enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée."}, {"label": "", "title": "Refroidir", "body": "Laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pain-perdu", "name": "Pain perdu", "nameHtml": "Pain perdu", "subtitle": "6 à 8 personnes", "emoji": "🍞", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["12 tranches épaisses (2 cm) de pain rassis, de brioche ou de pain de mie", "4 œufs", "50 cl de lait entier", "80 g de sucre (et un peu plus pour caraméliser)", "1 sachet de sucre vanillé (ou 1 cuillère à café d'extrait de vanille)", "1 pincée de cannelle (facultatif)", "1 pincée de sel", "60 g de beurre (pour la cuisson)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préparer le mélange<\/strong> : dans un grand plat creux, fouettez les œufs avec le sucre, le sucre vanillé, la cannelle et le sel, puis ajoutez le lait et mélangez bien.", "<strong>Tremper le pain<\/strong> : plongez les tranches dans le mélange <strong>quelques secondes de chaque côté<\/strong> pour le pain de mie ou la brioche, et <strong>30 secondes à 1 minute<\/strong> pour le pain rassis, jusqu'à ce qu'elles soient bien imbibées sans tomber en morceaux. Laissez-les égoutter sur une grille.", "<strong>Chauffer la poêle<\/strong> : faites fondre une noix de beurre dans une grande poêle à feu <strong>moyen<\/strong>.", "<strong>Cuire<\/strong> : déposez quelques tranches dans la poêle et faites-les dorer <strong>2 à 3 minutes de chaque côté<\/strong>. Ajoutez un peu de beurre à chaque nouvelle fournée.", "<strong>Caraméliser<\/strong> : en fin de cuisson, saupoudrez chaque face d'un peu de sucre et laissez-le caraméliser <strong>30 secondes<\/strong> de chaque côté.", "<strong>Servir<\/strong> : servez aussitôt, bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain rassis est idéal<\/strong> : sec, il absorbe le mélange sans se défaire. Du pain frais devient spongieux.", "<strong>Ne faites pas tremper trop longtemps<\/strong> la brioche et le pain de mie : ils sont fragiles et se cassent.", "<strong>Feu moyen, pas fort<\/strong> : le beurre ne doit pas brûler, et l'intérieur doit avoir le temps de cuire, comme un flan.", "<strong>Pour garder au chaud<\/strong> les premières tranches, posez-les sur une plaque dans le four à <strong>100 °C<\/strong>.", "<strong>La brioche rassise<\/strong> (voir la recette de brioche) donne le pain perdu le plus moelleux."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la créole<\/strong> : remplacez une partie du lait par du lait de coco, ajoutez du zeste de citron vert et un trait de rhum vieux dans le mélange.", "<strong>Au four<\/strong> : rangez les tranches imbibées dans un plat beurré, versez le reste du mélange par-dessus, parsemez de sucre et faites cuire <strong>25 à 30 minutes à 180 °C<\/strong>.", "<strong>Salé<\/strong> : supprimez le sucre et la vanille, ajoutez sel, poivre et muscade, puis servez avec du jambon et du fromage fondu."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sirop d'érable, miel, confiture, chantilly, boule de glace à la vanille, fruits frais (fraises, bananes poêlées, mangue), ou crème pâtissière."}]}]}], "steps": [{"label": "", "title": "Préparer le mélange", "body": "Dans un grand plat creux, fouettez les œufs avec le sucre, le sucre vanillé, la cannelle et le sel, puis ajoutez le lait et mélangez bien."}, {"label": "", "title": "Tremper le pain", "body": "Plongez les tranches dans le mélange <strong>quelques secondes de chaque côté<\/strong> pour le pain de mie ou la brioche, et <strong>30 secondes à 1 minute<\/strong> pour le pain rassis, jusqu'à ce qu'elles soient bien imbibées sans tomber en morceaux. Laissez-les égoutter sur une grille."}, {"label": "", "title": "Chauffer la poêle", "body": "Faites fondre une noix de beurre dans une grande poêle à feu <strong>moyen<\/strong>."}, {"label": "", "title": "Cuire", "body": "Déposez quelques tranches dans la poêle et faites-les dorer <strong>2 à 3 minutes de chaque côté<\/strong>. Ajoutez un peu de beurre à chaque nouvelle fournée."}, {"label": "", "title": "Caraméliser", "body": "En fin de cuisson, saupoudrez chaque face d'un peu de sucre et laissez-le caraméliser <strong>30 secondes<\/strong> de chaque côté."}, {"label": "", "title": "Servir", "body": "Servez aussitôt, bien chaud."}], "categorySlug": "desserts"}, {"slug": "pain-au-chocolat", "name": "Pains au chocolat", "nameHtml": "Pains au chocolat", "subtitle": "environ 24 pains au chocolat", "emoji": "🍫", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["1 kg de farine T45 (ou farine de gruau)", "30 cl de lait entier froid", "30 cl d'eau froide", "120 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "20 g de sel", "100 g de beurre mou"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["560 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}, {"title": "Garniture et dorure", "blocks": [{"t": "ul", "items": ["48 bâtons de chocolat spécial boulanger (2 par pain au chocolat)", "2 œufs + 2 cuillères à soupe de lait"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique.", "<strong>Le repos au froid<\/strong> : divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>.", "<strong>Préparer le beurre<\/strong> : coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords.", "<strong>Le tour double<\/strong> : étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le tour simple<\/strong> : tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton.", "<strong>Étaler<\/strong> : étalez chaque pâton en un rectangle d'environ <strong>30 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid.", "<strong>Découper<\/strong> : coupez la pâte en deux bandes de 15 cm de large, puis chaque bande en rectangles de <strong>8 cm<\/strong> de large.", "<strong>Façonner<\/strong> : posez un bâton de chocolat à 1 cm du bord d'un rectangle, rabattez la pâte par-dessus, posez le second bâton contre le pli et roulez jusqu'au bout. La fin de la pâte doit se retrouver <strong>en dessous<\/strong>. Déposez les pains au chocolat sur des plaques recouvertes de papier cuisson, bien espacés.", "<strong>La pousse<\/strong> : mélangez les œufs et le lait, et badigeonnez une première fois les pains au chocolat au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume.", "<strong>La cuisson<\/strong> : préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois et faites cuire <strong>16 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés.", "<strong>Refroidir<\/strong> : laissez-les tiédir sur une grille avant de les déguster : le chocolat brûlant est très chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> : si le beurre fond pendant le tourage, les feuilletages se soudent et les pains au chocolat ne seront pas feuilletés. Au moindre doute, remettez la pâte 15 minutes au réfrigérateur.", "<strong>En climat chaud<\/strong>, travaillez tôt le matin, dans une pièce climatisée, et faites reposer la pâte au réfrigérateur plus longtemps entre chaque étape.", "<strong>Les bâtons de chocolat boulanger<\/strong> supportent la cuisson sans couler. À défaut, coupez une tablette de chocolat noir en bâtonnets.", "<strong>Ne laissez pas pousser au chaud<\/strong> : au-dessus de 25 °C, le beurre fond et coule à la cuisson.", "<strong>Préparez-les la veille<\/strong> : façonnez-les le soir, couvrez-les et placez-les au réfrigérateur. Le lendemain matin, laissez-les pousser 2 à 3 heures à température ambiante, puis faites-les cuire.", "<strong>Congélation<\/strong> : les pains au chocolat crus et façonnés se congèlent sur une plaque, puis en sachet. La veille, posez-les sur une plaque au réfrigérateur, puis laissez-les pousser le matin."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Moitié croissants, moitié pains au chocolat<\/strong> : avec un pâton, façonnez des croissants (voir la recette de croissants), avec l'autre des pains au chocolat.", "<strong>Pains aux raisins<\/strong> : étalez de la crème pâtissière sur la pâte, parsemez de raisins secs trempés dans du rhum, roulez-la et coupez des tranches de 2 cm.", "<strong>Chocolat au lait ou pralinoise<\/strong> : remplacez les bâtons de chocolat noir par du chocolat au lait ou des bâtons de pralinoise."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique."}, {"label": "", "title": "Le repos au froid", "body": "Divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>."}, {"label": "", "title": "Préparer le beurre", "body": "Coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords."}, {"label": "", "title": "Le tour double", "body": "Étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le tour simple", "body": "Tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton."}, {"label": "", "title": "Étaler", "body": "Étalez chaque pâton en un rectangle d'environ <strong>30 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid."}, {"label": "", "title": "Découper", "body": "Coupez la pâte en deux bandes de 15 cm de large, puis chaque bande en rectangles de <strong>8 cm<\/strong> de large."}, {"label": "", "title": "Façonner", "body": "Posez un bâton de chocolat à 1 cm du bord d'un rectangle, rabattez la pâte par-dessus, posez le second bâton contre le pli et roulez jusqu'au bout. La fin de la pâte doit se retrouver <strong>en dessous<\/strong>. Déposez les pains au chocolat sur des plaques recouvertes de papier cuisson, bien espacés."}, {"label": "", "title": "La pousse", "body": "Mélangez les œufs et le lait, et badigeonnez une première fois les pains au chocolat au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume."}, {"label": "", "title": "La cuisson", "body": "Préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois et faites cuire <strong>16 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés."}, {"label": "", "title": "Refroidir", "body": "Laissez-les tiédir sur une grille avant de les déguster : le chocolat brûlant est très chaud."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pancakes", "name": "Pancakes moelleux", "nameHtml": "Pancakes moelleux", "subtitle": "environ 24 pancakes", "emoji": "🥞", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "2 sachets de levure chimique (22 g)", "4 œufs", "60 cl de lait", "100 g de beurre fondu", "80 g de sucre", "2 sachets de sucre vanillé", "2 pincées de sel"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Le mélange sec<\/strong> : dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel.", "<strong>Le mélange liquide<\/strong> : dans un autre bol, battez les œufs avec le lait, puis ajoutez le beurre fondu (tiédi).", "<strong>Assembler<\/strong> : versez le mélange liquide sur le mélange sec et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible. Quelques petits grumeaux ne sont pas un problème. La pâte doit être épaisse et napper la cuillère.", "<strong>Le repos<\/strong> : laissez reposer 10 à 15 minutes, le temps que la levure commence à agir.", "<strong>La cuisson<\/strong> : chauffez une poêle à <strong>feu moyen<\/strong> et graissez-la légèrement. Versez une petite louche de pâte sans l'étaler : le pancake doit faire environ 10 cm de diamètre et 1 cm d'épaisseur.", "<strong>Retourner<\/strong> : quand des bulles apparaissent à la surface et que les bords semblent secs (environ 2 minutes), retournez le pancake et laissez cuire 1 à 2 minutes de l'autre côté."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne mélangez pas trop la pâte<\/strong> : en la travaillant trop, les pancakes deviennent plats et caoutchouteux.", "<strong>Le feu ne doit pas être trop fort<\/strong>, sinon l'extérieur brûle avant que l'intérieur soit cuit.", "<strong>Pour des pancakes encore plus moelleux<\/strong>, séparez les œufs et incorporez les blancs montés en neige à la fin, ou remplacez le lait par du lait ribot (babeurre).", "Pour les garder chauds, placez-les dans le four à 80 °C, recouverts d'un torchon."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sirop d'érable, miel, beurre, fruits rouges, banane, pépites de chocolat, Nutella, ou bacon grillé pour une version sucrée-salée."}]}]}], "steps": [{"label": "", "title": "Le mélange sec", "body": "Dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel."}, {"label": "", "title": "Le mélange liquide", "body": "Dans un autre bol, battez les œufs avec le lait, puis ajoutez le beurre fondu (tiédi)."}, {"label": "", "title": "Assembler", "body": "Versez le mélange liquide sur le mélange sec et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible. Quelques petits grumeaux ne sont pas un problème. La pâte doit être épaisse et napper la cuillère."}, {"label": "", "title": "Le repos", "body": "Laissez reposer 10 à 15 minutes, le temps que la levure commence à agir."}, {"label": "", "title": "La cuisson", "body": "Chauffez une poêle à <strong>feu moyen<\/strong> et graissez-la légèrement. Versez une petite louche de pâte sans l'étaler : le pancake doit faire environ 10 cm de diamètre et 1 cm d'épaisseur."}, {"label": "", "title": "Retourner", "body": "Quand des bulles apparaissent à la surface et que les bords semblent secs (environ 2 minutes), retournez le pancake et laissez cuire 1 à 2 minutes de l'autre côté."}], "categorySlug": "desserts"}, {"slug": "pate-a-choux", "name": "Pâte à choux", "nameHtml": "Pâte à choux", "subtitle": "environ 60 choux ou 30 éclairs", "emoji": "🧁", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["25 cl d'eau", "25 cl de lait", "200 g de beurre doux, coupé en dés", "300 g de farine (type T45 ou T55), tamisée", "8 œufs (environ 400 g sans la coquille)", "2 pincées de sel", "2 cuillères à café de sucre (à supprimer pour des choux salés, comme les gougères)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>200 °C<\/strong> et recouvrez deux plaques de papier cuisson.", "<strong>Faire bouillir<\/strong> : dans une grande casserole, portez à ébullition l'eau, le lait, le beurre, le sel et le sucre, en remuant pour que le beurre fonde complètement.", "<strong>Ajouter la farine<\/strong> : retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène.", "<strong>Dessécher la pâte<\/strong> : remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole.", "<strong>Refroidir<\/strong> : transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant.", "<strong>Les œufs<\/strong> : battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante.", "<strong>Vérifier la consistance<\/strong> : tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf.", "<strong>Dresser<\/strong> : remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères.", "<strong>La cuisson<\/strong> : enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas le four<\/strong> pendant les 20 premières minutes.", "<strong>Sécher<\/strong> : éteignez le four, entrouvrez la porte (coincez une cuillère en bois) et laissez les choux sécher 10 minutes à l'intérieur, puis laissez-les refroidir sur une grille avant de les garnir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les choux retombent à la sortie du four ?<\/strong> Ils n'étaient pas assez cuits : la pâte doit être bien dorée et sèche au toucher. Prolongez la cuisson de quelques minutes la prochaine fois.", "<strong>Ne mettez pas tous les œufs d'office<\/strong> : selon la taille des œufs et le dessèchement de la pâte, il peut en falloir un peu moins. C'est la consistance qui compte.", "<strong>Pour des choux bien ronds et réguliers<\/strong>, aplatissez la pointe de chaque chou avec le dos d'une fourchette trempée dans l'œuf battu, ou posez dessus un disque de craquelin.", "<strong>Le lait<\/strong> donne des choux plus dorés et plus moelleux ; avec seulement de l'eau, ils sont plus croustillants.", "<strong>Les choux cuits se congèlent très bien<\/strong> vides : réchauffez-les 5 minutes à 180 °C pour qu'ils redeviennent croustillants avant de les garnir.", "<strong>Garnissez au dernier moment<\/strong>, sinon la crème ramollit la pâte."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Sucrées<\/strong> : profiteroles au chocolat, éclairs au café ou au chocolat, chouquettes (parsemées de sucre perlé avant cuisson), choux à la crème pâtissière, paris-brest, religieuses, croquembouche.", "<strong>Salées<\/strong> : gougères au fromage (ajoutez 150 g de comté râpé dans la pâte), choux garnis de mousse de saumon ou de fromage frais aux herbes."]}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>200 °C<\/strong> et recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Faire bouillir", "body": "Dans une grande casserole, portez à ébullition l'eau, le lait, le beurre, le sel et le sucre, en remuant pour que le beurre fonde complètement."}, {"label": "", "title": "Ajouter la farine", "body": "Retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène."}, {"label": "", "title": "Dessécher la pâte", "body": "Remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole."}, {"label": "", "title": "Refroidir", "body": "Transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant."}, {"label": "", "title": "Les œufs", "body": "Battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante."}, {"label": "", "title": "Vérifier la consistance", "body": "Tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf."}, {"label": "", "title": "Dresser", "body": "Remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères."}, {"label": "", "title": "La cuisson", "body": "Enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas le four<\/strong> pendant les 20 premières minutes."}, {"label": "", "title": "Sécher", "body": "Éteignez le four, entrouvrez la porte (coincez une cuillère en bois) et laissez les choux sécher 10 minutes à l'intérieur, puis laissez-les refroidir sur une grille avant de les garnir."}], "categorySlug": "bases"}, {"slug": "pizza", "name": "Pâte à pizza", "nameHtml": "Pâte à pizza", "subtitle": "4 pizzas de 30 cm environ", "emoji": "🍕", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45 ou T55, ou farine italienne « 00 »)", "60 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "4 cuillères à soupe d'huile d'olive", "20 g de sel", "2 cuillères à café de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau.", "<strong>Le pétrissage<\/strong> : mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts.", "<strong>La pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm.", "<strong>La garniture<\/strong> : déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la.", "<strong>La cuisson<\/strong> : enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : c'est pour ça qu'on le mélange d'abord à la farine.", "<strong>Pour une pâte plus savoureuse et plus digeste<\/strong>, laissez-la lever 24 à 48 heures au réfrigérateur, puis sortez-la 1 heure avant de l'étaler.", "<strong>Pour une base bien croustillante<\/strong>, préchauffez la plaque (ou une pierre à pizza) dans le four et faites glisser la pizza dessus.", "<strong>La pâte se congèle très bien<\/strong> : après la pousse, emballez les pâtons séparément dans du film alimentaire. Décongelez-les au réfrigérateur la veille."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Margherita<\/strong> : sauce tomate, mozzarella, basilic frais, huile d'olive.", "<strong>Reine<\/strong> : sauce tomate, mozzarella, jambon, champignons.", "<strong>Quatre fromages<\/strong> : mozzarella, gorgonzola, chèvre, parmesan.", "<strong>Végétarienne<\/strong> : sauce tomate, mozzarella, poivrons, oignons, courgettes, olives.", "<strong>Blanche<\/strong> : crème fraîche, mozzarella, lardons, oignons."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau."}, {"label": "", "title": "Le pétrissage", "body": "Mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts."}, {"label": "", "title": "La pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm."}, {"label": "", "title": "La garniture", "body": "Déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la."}, {"label": "", "title": "La cuisson", "body": "Enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."}], "categorySlug": "bases"}, {"slug": "pate-brisee", "name": "Pâte brisée", "nameHtml": "Pâte brisée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🥧", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "10 à 12 cl d'eau très froide", "2 pincées de sel", "Facultatif : 2 jaunes d'œufs (pour une pâte plus riche et plus facile à travailler ; réduisez alors l'eau à 6 à 8 cl)", "Facultatif, pour une tarte sucrée : 2 cuillères à soupe de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles.", "<strong>Ajouter l'eau<\/strong> : creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, puis versez l'eau froide <strong>petit à petit<\/strong> en mélangeant du bout des doigts ou avec une fourchette. Arrêtez dès que la pâte se rassemble en boule : elle ne doit pas être collante.", "<strong>Fraser<\/strong> : sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas.", "<strong>Le repos<\/strong> : divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 30 minutes<\/strong> au réfrigérateur.", "<strong>Étaler<\/strong> : sur un plan de travail fariné, étalez chaque disque au rouleau sur environ 3 mm d'épaisseur. Enroulez la pâte autour du rouleau pour la déposer dans le moule beurré, puis faites-la adhérer aux bords et coupez l'excédent.", "<strong>Piquer<\/strong> : piquez le fond de tarte avec une fourchette pour éviter qu'il gonfle, puis remettez-le 15 minutes au réfrigérateur.", "<strong>La cuisson<\/strong> : selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."]}]}, {"title": "Cuisson à blanc", "blocks": [{"t": "p", "html": "Pour une garniture qui ne cuit pas (tarte aux fraises, au citron) ou très liquide (quiche), faites précuire le fond :"}, {"t": "ol", "items": ["Préchauffez le four à <strong>180 °C<\/strong>.", "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs (haricots, pois chiches).", "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>5 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> (beurre, eau, mains) : si le beurre fond pendant la préparation, la pâte devient dure et perd son côté friable.", "<strong>Travaillez la pâte le moins possible<\/strong> : plus on la pétrit, plus elle devient élastique et se rétracte à la cuisson.", "<strong>Le repos au froid est indispensable<\/strong> : il détend la pâte et l'empêche de rétrécir dans le moule.", "<strong>Pour éviter un fond détrempé<\/strong> avec une quiche, badigeonnez le fond précuit d'un peu de blanc d'œuf et remettez-le 2 minutes au four avant de garnir.", "<strong>La pâte se conserve<\/strong> 2 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille."]}]}]}, {"title": "Idées de tartes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Salées<\/strong> : quiche lorraine, tarte aux poireaux, tarte à la tomate et à la moutarde, tarte au thon.", "<strong>Sucrées<\/strong> : tarte aux pommes, tarte aux prunes, tarte au citron, tarte aux fraises, tarte bourdaloue (poires et amandes)."]}]}]}], "steps": [{"label": "", "title": "Sabler", "body": "Dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles."}, {"label": "", "title": "Ajouter l'eau", "body": "Creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, puis versez l'eau froide <strong>petit à petit<\/strong> en mélangeant du bout des doigts ou avec une fourchette. Arrêtez dès que la pâte se rassemble en boule : elle ne doit pas être collante."}, {"label": "", "title": "Fraser", "body": "Sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas."}, {"label": "", "title": "Le repos", "body": "Divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Étaler", "body": "Sur un plan de travail fariné, étalez chaque disque au rouleau sur environ 3 mm d'épaisseur. Enroulez la pâte autour du rouleau pour la déposer dans le moule beurré, puis faites-la adhérer aux bords et coupez l'excédent."}, {"label": "", "title": "Piquer", "body": "Piquez le fond de tarte avec une fourchette pour éviter qu'il gonfle, puis remettez-le 15 minutes au réfrigérateur."}, {"label": "", "title": "La cuisson", "body": "Selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."}, {"label": "Cuisson à blanc", "title": "", "body": "Préchauffez le four à <strong>180 °C<\/strong>."}, {"label": "Cuisson à blanc", "title": "", "body": "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs (haricots, pois chiches)."}, {"label": "Cuisson à blanc", "title": "", "body": "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>5 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré."}], "categorySlug": "bases"}, {"slug": "pate-en-pot", "name": "Pâté en pot", "nameHtml": "Pâté en pot", "subtitle": "environ 20 bols", "emoji": "🍜", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viandes", "blocks": [{"t": "ul", "items": ["3 kg d'abats de mouton (ou de cabri) : panse (gras-double), pieds, cœur, foie, rognons, poumon, selon ce que propose le boucher", "1 kg de collier ou de poitrine de mouton", "300 g de lard fumé (ou de queue de cochon salée, dessalée la veille)", "6 citrons verts", "Gros sel"]}]}, {"title": "Légumes", "blocks": [{"t": "ul", "items": ["4 carottes", "2 navets", "2 poireaux", "2 branches de céleri", "1 petit chou vert", "2 christophines", "500 g de giraumon", "4 pommes de terre", "4 oignons", "1 botte de cives", "8 gousses d'ail"]}]}, {"title": "Bouillon et assaisonnement", "blocks": [{"t": "ul", "items": ["4 litres d'eau", "4 cuillères à soupe d'huile", "4 branches de thym", "6 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 piment antillais entier (non percé)", "6 clous de girofle", "50 cl de vin blanc sec", "4 cuillères à soupe de câpres", "Sel et poivre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer les abats<\/strong> : la veille ou le matin, grattez et brossez soigneusement la panse et les pieds. Frottez tous les abats et la viande avec du gros sel et le jus de 4 citrons verts, puis rincez-les à grande eau plusieurs fois.", "<strong>Blanchir<\/strong> : mettez la panse, les pieds et le lard dans une grande marmite, couvrez d'eau froide, portez à ébullition et laissez bouillir <strong>10 minutes<\/strong>. Égouttez et rincez.", "<strong>Couper<\/strong> : coupez la panse, les pieds, le cœur, le poumon et la viande de mouton en petits morceaux (2 à 3 cm), et le lard en dés. Gardez le foie et les rognons à part.", "<strong>Faire revenir<\/strong> : émincez les oignons et les cives, hachez 6 gousses d'ail. Dans la marmite, faites chauffer l'huile et faites revenir les oignons, les cives et le lard <strong>5 minutes<\/strong>. Ajoutez les morceaux de viande et d'abats (sauf le foie et les rognons) et faites-les revenir <strong>10 minutes<\/strong> en remuant, puis ajoutez l'ail.", "<strong>Première cuisson<\/strong> : versez l'eau et le vin blanc, ajoutez le thym, le bois d'Inde, les clous de girofle et le piment entier. Portez à ébullition, écumez, puis laissez mijoter à couvert <strong>2 heures<\/strong> à feu doux.", "<strong>Les légumes<\/strong> : pendant ce temps, épluchez tous les légumes et coupez-les en <strong>petits dés<\/strong> (1 cm). Émincez finement les poireaux, le céleri et le chou.", "<strong>Deuxième cuisson<\/strong> : ajoutez tous les légumes dans la marmite et poursuivez la cuisson <strong>1 heure<\/strong> à feu doux, à couvert, en remuant de temps en temps. Les légumes doivent se défaire en partie et épaissir la soupe.", "<strong>Le foie et les rognons<\/strong> : coupez-les en petits dés et ajoutez-les avec les câpres pour les <strong>15 dernières minutes<\/strong>.", "<strong>La touche finale<\/strong> : hors du feu, retirez le piment, ajoutez le jus des 2 derniers citrons verts, les 2 gousses d'ail restantes hachées et le persil ciselé. Salez, poivrez, goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez très chaud, dans des bols, avec une goutte de rhum ou de vin blanc pour ceux qui aiment."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pâté en pot<\/strong> est la soupe de fête de la Martinique, servie en entrée aux baptêmes, communions et mariages, et le samedi de Pâques ou de Pentecôte. Ce n'est pas un pâté mais une soupe épaisse.", "<strong>Le nettoyage des abats<\/strong> est l'étape la plus longue : demandez au boucher une panse et des pieds déjà échaudés et nettoyés.", "<strong>À l'autocuiseur<\/strong> : comptez <strong>50 minutes<\/strong> sous pression à l'étape 5, puis 15 minutes de cuisson normale avec les légumes.", "<strong>Encore meilleur le lendemain<\/strong> : préparez-le la veille. Il se garde 3 jours au réfrigérateur et se congèle très bien, en portions.", "<strong>La soupe doit être épaisse<\/strong> : si elle est trop liquide, écrasez une partie des légumes ou laissez réduire sans couvercle."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au cabri<\/strong> : remplacez le mouton par des abats et de la viande de cabri.", "<strong>Plus simple<\/strong> : avec seulement de la viande de mouton et des pieds, sans les abats, pour une version plus douce.", "<strong>Avec des boulettes<\/strong> : ajoutez des petits dombrés (voir la recette) dans la soupe 20 minutes avant la fin."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "En entrée, avant un colombo de cabri ou une fricassée, avec du pain et un ti-punch pour ceux qui le souhaitent."}]}]}], "steps": [{"label": "", "title": "Nettoyer les abats", "body": "La veille ou le matin, grattez et brossez soigneusement la panse et les pieds. Frottez tous les abats et la viande avec du gros sel et le jus de 4 citrons verts, puis rincez-les à grande eau plusieurs fois."}, {"label": "", "title": "Blanchir", "body": "Mettez la panse, les pieds et le lard dans une grande marmite, couvrez d'eau froide, portez à ébullition et laissez bouillir <strong>10 minutes<\/strong>. Égouttez et rincez."}, {"label": "", "title": "Couper", "body": "Coupez la panse, les pieds, le cœur, le poumon et la viande de mouton en petits morceaux (2 à 3 cm), et le lard en dés. Gardez le foie et les rognons à part."}, {"label": "", "title": "Faire revenir", "body": "Émincez les oignons et les cives, hachez 6 gousses d'ail. Dans la marmite, faites chauffer l'huile et faites revenir les oignons, les cives et le lard <strong>5 minutes<\/strong>. Ajoutez les morceaux de viande et d'abats (sauf le foie et les rognons) et faites-les revenir <strong>10 minutes<\/strong> en remuant, puis ajoutez l'ail."}, {"label": "", "title": "Première cuisson", "body": "Versez l'eau et le vin blanc, ajoutez le thym, le bois d'Inde, les clous de girofle et le piment entier. Portez à ébullition, écumez, puis laissez mijoter à couvert <strong>2 heures<\/strong> à feu doux."}, {"label": "", "title": "Les légumes", "body": "Pendant ce temps, épluchez tous les légumes et coupez-les en <strong>petits dés<\/strong> (1 cm). Émincez finement les poireaux, le céleri et le chou."}, {"label": "", "title": "Deuxième cuisson", "body": "Ajoutez tous les légumes dans la marmite et poursuivez la cuisson <strong>1 heure<\/strong> à feu doux, à couvert, en remuant de temps en temps. Les légumes doivent se défaire en partie et épaissir la soupe."}, {"label": "", "title": "Le foie et les rognons", "body": "Coupez-les en petits dés et ajoutez-les avec les câpres pour les <strong>15 dernières minutes<\/strong>."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, retirez le piment, ajoutez le jus des 2 derniers citrons verts, les 2 gousses d'ail restantes hachées et le persil ciselé. Salez, poivrez, goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez très chaud, dans des bols, avec une goutte de rhum ou de vin blanc pour ceux qui aiment."}], "categorySlug": "plats"}, {"slug": "pate-feuilletee", "name": "Pâte feuilletée", "nameHtml": "Pâte feuilletée", "subtitle": "environ 1,2 kg de pâte", "emoji": "🥐", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "25 cl d'eau très froide", "50 g de beurre fondu (tiédi)", "10 g de sel"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["400 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans un grand saladier, mélangez la farine et le sel. Ajoutez l'eau froide et le beurre fondu, puis mélangez rapidement jusqu'à obtenir une boule de pâte homogène. Ne la pétrissez pas.", "<strong>Le repos de la détrempe<\/strong> : incisez une croix sur le dessus de la boule, emballez-la dans du film alimentaire et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur.", "<strong>Préparer le beurre<\/strong> : placez le beurre froid entre deux feuilles de papier cuisson et tapez-le avec le rouleau pour l'assouplir, puis étalez-le en un carré d'environ 15 cm de côté et 1 cm d'épaisseur. Remettez-le au réfrigérateur 15 minutes : il doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : sur un plan de travail fariné, étalez la détrempe en croix en laissant le centre plus épais. Posez le carré de beurre au centre, puis rabattez les quatre côtés de la pâte par-dessus pour l'enfermer complètement. Soudez bien les bords.", "<strong>Les deux premiers tours<\/strong> : étalez la pâte en un long rectangle (environ 3 fois plus long que large), toujours dans le même sens. Pliez-le en trois comme une lettre : c'est un <strong>tour simple<\/strong>. Tournez la pâte d'un quart de tour vers la droite et recommencez une deuxième fois.", "<strong>Repos<\/strong> : marquez 2 empreintes de doigt sur la pâte pour vous souvenir du nombre de tours, emballez-la et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le 3ᵉ et le 4ᵉ tour<\/strong> : recommencez deux tours simples comme à l'étape 5, marquez 4 empreintes, puis laissez reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le 5ᵉ et le 6ᵉ tour<\/strong> : faites les deux derniers tours simples, puis laissez reposer la pâte au moins <strong>30 minutes<\/strong> au réfrigérateur avant de l'utiliser.", "<strong>Utilisation<\/strong> : divisez la pâte selon vos besoins, étalez-la sur environ 3 mm d'épaisseur et découpez-la avec un couteau bien aiguisé, sans écraser les bords.", "<strong>La cuisson<\/strong> : faites cuire dans un four préchauffé à <strong>200 °C<\/strong>, de 15 à 35 minutes selon la recette, jusqu'à ce que la pâte soit bien gonflée et dorée."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> : si le beurre devient mou et commence à traverser la pâte, remettez-la 15 minutes au réfrigérateur avant de continuer.", "<strong>Le beurre et la détrempe doivent avoir la même consistance<\/strong> : un beurre trop dur casse en morceaux, un beurre trop mou se mélange à la pâte, et dans les deux cas le feuilletage rate.", "<strong>Farinez légèrement<\/strong> le plan de travail et brossez l'excédent de farine avant chaque pliage.", "<strong>Pour un feuilletage régulier<\/strong>, découpez la pâte avec une lame bien tranchante, d'un coup sec, et ne dorez jamais les tranches : le jaune d'œuf colle les feuillets et les empêche de gonfler.", "<strong>La pâte se conserve<\/strong> 3 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille.", "<strong>Les chutes<\/strong> ne doivent pas être mises en boule : superposez-les à plat et étalez-les, elles serviront pour des palmiers ou des allumettes au fromage."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Sucrées<\/strong> : galette des rois, chaussons aux pommes, mille-feuille, palmiers, tarte fine aux pommes, pithiviers.", "<strong>Salées<\/strong> : bouchées à la reine (vol-au-vent), feuilletés saucisse, allumettes au fromage, tarte fine à la tomate, friands, pâté en croûte."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans un grand saladier, mélangez la farine et le sel. Ajoutez l'eau froide et le beurre fondu, puis mélangez rapidement jusqu'à obtenir une boule de pâte homogène. Ne la pétrissez pas."}, {"label": "", "title": "Le repos de la détrempe", "body": "Incisez une croix sur le dessus de la boule, emballez-la dans du film alimentaire et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur."}, {"label": "", "title": "Préparer le beurre", "body": "Placez le beurre froid entre deux feuilles de papier cuisson et tapez-le avec le rouleau pour l'assouplir, puis étalez-le en un carré d'environ 15 cm de côté et 1 cm d'épaisseur. Remettez-le au réfrigérateur 15 minutes : il doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Sur un plan de travail fariné, étalez la détrempe en croix en laissant le centre plus épais. Posez le carré de beurre au centre, puis rabattez les quatre côtés de la pâte par-dessus pour l'enfermer complètement. Soudez bien les bords."}, {"label": "", "title": "Les deux premiers tours", "body": "Étalez la pâte en un long rectangle (environ 3 fois plus long que large), toujours dans le même sens. Pliez-le en trois comme une lettre : c'est un <strong>tour simple<\/strong>. Tournez la pâte d'un quart de tour vers la droite et recommencez une deuxième fois."}, {"label": "", "title": "Repos", "body": "Marquez 2 empreintes de doigt sur la pâte pour vous souvenir du nombre de tours, emballez-la et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le 3ᵉ et le 4ᵉ tour", "body": "Recommencez deux tours simples comme à l'étape 5, marquez 4 empreintes, puis laissez reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le 5ᵉ et le 6ᵉ tour", "body": "Faites les deux derniers tours simples, puis laissez reposer la pâte au moins <strong>30 minutes<\/strong> au réfrigérateur avant de l'utiliser."}, {"label": "", "title": "Utilisation", "body": "Divisez la pâte selon vos besoins, étalez-la sur environ 3 mm d'épaisseur et découpez-la avec un couteau bien aiguisé, sans écraser les bords."}, {"label": "", "title": "La cuisson", "body": "Faites cuire dans un four préchauffé à <strong>200 °C<\/strong>, de 15 à 35 minutes selon la recette, jusqu'à ce que la pâte soit bien gonflée et dorée."}], "categorySlug": "bases"}, {"slug": "pate-sablee", "name": "Pâte sablée", "nameHtml": "Pâte sablée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🍓", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "200 g de sucre glace", "2 œufs", "2 pincées de sel", "2 sachets de sucre vanillé", "Facultatif : 60 g de poudre d'amande (pour une pâte plus parfumée et plus friable ; retirez alors 60 g de farine)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine, le sel et la poudre d'amande si vous en mettez. Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable fin<\/strong>, sans morceaux de beurre visibles.", "<strong>Le sucre<\/strong> : ajoutez le sucre glace et le sucre vanillé, puis mélangez du bout des doigts.", "<strong>Les œufs<\/strong> : battez légèrement les œufs, versez-les au centre et mélangez rapidement avec une fourchette, puis du bout des doigts, juste jusqu'à ce que la pâte se rassemble en boule.", "<strong>Fraser<\/strong> : sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas.", "<strong>Le repos<\/strong> : divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 1 heure<\/strong> au réfrigérateur.", "<strong>Étaler<\/strong> : étalez chaque disque sur environ 3 mm d'épaisseur, de préférence entre deux feuilles de papier cuisson : cette pâte est fragile et colle facilement. Déposez-la dans le moule beurré, faites-la adhérer aux bords et coupez l'excédent. Si elle se casse, recollez simplement les morceaux en appuyant avec les doigts.", "<strong>Piquer<\/strong> : piquez le fond de tarte avec une fourchette, puis remettez-le <strong>30 minutes<\/strong> au réfrigérateur pour qu'il ne se rétracte pas à la cuisson.", "<strong>La cuisson<\/strong> : selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."]}]}, {"title": "Cuisson à blanc", "blocks": [{"t": "p", "html": "Pour une garniture qui ne cuit pas (tarte aux fraises, au citron, au chocolat) :"}, {"t": "ol", "items": ["Préchauffez le four à <strong>170 °C<\/strong>.", "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs.", "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>8 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré. Surveillez bien : avec le sucre, la pâte sablée brunit vite."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pâte brisée ou pâte sablée ?<\/strong> La pâte sablée contient du sucre et des œufs : elle est plus friable, plus sucrée et réservée aux tartes sucrées et aux biscuits.", "<strong>Le sucre glace<\/strong> donne une pâte plus fine et plus régulière que le sucre en poudre.", "<strong>Tout doit rester froid<\/strong> : si la pâte devient molle et collante pendant que vous l'étalez, remettez-la 15 minutes au réfrigérateur.", "<strong>Pour éviter un fond détrempé<\/strong> avec des fruits juteux, badigeonnez le fond précuit d'un peu de blanc d'œuf, ou saupoudrez-le de poudre d'amande avant de garnir.", "<strong>La pâte se conserve<\/strong> 3 jours au réfrigérateur ou 3 mois au congélateur, bien emballée. Décongelez-la au réfrigérateur la veille.", "<strong>Les chutes<\/strong> font de délicieux sablés : étalez-les, découpez-les à l'emporte-pièce et faites-les cuire 10 à 12 minutes à 180 °C."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tartes<\/strong> : tarte au citron meringuée, tarte aux fraises, tarte au chocolat, tarte aux framboises, tarte normande, tarte aux fruits de la passion.", "<strong>Biscuits<\/strong> : sablés nature, sablés à la confiture (lunettes), sablés au chocolat, biscuits de Noël décorés."]}]}]}], "steps": [{"label": "", "title": "Sabler", "body": "Dans un grand saladier, mélangez la farine, le sel et la poudre d'amande si vous en mettez. Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable fin<\/strong>, sans morceaux de beurre visibles."}, {"label": "", "title": "Le sucre", "body": "Ajoutez le sucre glace et le sucre vanillé, puis mélangez du bout des doigts."}, {"label": "", "title": "Les œufs", "body": "Battez légèrement les œufs, versez-les au centre et mélangez rapidement avec une fourchette, puis du bout des doigts, juste jusqu'à ce que la pâte se rassemble en boule."}, {"label": "", "title": "Fraser", "body": "Sur le plan de travail, écrasez rapidement la pâte avec la paume de la main en la poussant devant vous, une ou deux fois seulement, pour l'homogénéiser. Ne la pétrissez pas."}, {"label": "", "title": "Le repos", "body": "Divisez la pâte en 2 boules, aplatissez-les en disques, emballez-les dans du film alimentaire et laissez-les reposer <strong>au moins 1 heure<\/strong> au réfrigérateur."}, {"label": "", "title": "Étaler", "body": "Étalez chaque disque sur environ 3 mm d'épaisseur, de préférence entre deux feuilles de papier cuisson : cette pâte est fragile et colle facilement. Déposez-la dans le moule beurré, faites-la adhérer aux bords et coupez l'excédent. Si elle se casse, recollez simplement les morceaux en appuyant avec les doigts."}, {"label": "", "title": "Piquer", "body": "Piquez le fond de tarte avec une fourchette, puis remettez-le <strong>30 minutes<\/strong> au réfrigérateur pour qu'il ne se rétracte pas à la cuisson."}, {"label": "", "title": "La cuisson", "body": "Selon la recette, garnissez la tarte directement, ou faites cuire le fond <strong>à blanc<\/strong> (voir ci-dessous)."}, {"label": "Cuisson à blanc", "title": "", "body": "Préchauffez le four à <strong>170 °C<\/strong>."}, {"label": "Cuisson à blanc", "title": "", "body": "Recouvrez la pâte de papier cuisson et remplissez-la de billes de cuisson ou de légumes secs."}, {"label": "Cuisson à blanc", "title": "", "body": "Faites cuire <strong>15 minutes<\/strong>, retirez le papier et les billes, puis prolongez la cuisson de <strong>8 à 10 minutes<\/strong> jusqu'à ce que le fond soit doré. Surveillez bien : avec le sucre, la pâte sablée brunit vite."}], "categorySlug": "bases"}, {"slug": "pates-creoles", "name": "Pâtés créoles à la viande", "nameHtml": "Pâtés créoles à la viande", "subtitle": "environ 30 pâtés", "emoji": "🥟", "category": "Entrées et apéritifs", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 recette de pâte feuilletée (environ 1,2 kg, voir la recette de pâte feuilletée), ou 4 rouleaux de pâte feuilletée du commerce"]}]}, {"title": "Farce", "blocks": [{"t": "ul", "items": ["1 kg de viande hachée (bœuf, porc, ou un mélange des deux)", "2 oignons", "1 botte de cives", "4 gousses d'ail", "1 piment antillais", "2 branches de thym (les feuilles seulement)", "1 bouquet de persil", "2 cuillères à soupe de concentré de tomates", "2 tranches de pain de mie trempées dans un peu de lait (facultatif, pour une farce plus moelleuse)", "2 cuillères à soupe d'huile", "1 pincée de muscade râpée", "Sel et poivre"]}]}, {"title": "Dorure", "blocks": [{"t": "ul", "items": ["2 jaunes d'œufs + 2 cuillères à soupe de lait"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Les aromates<\/strong> : hachez finement les oignons, les cives, l'ail, le persil et le piment (sans les graines si vous le voulez moins fort).", "<strong>Cuire la farce<\/strong> : dans une grande poêle, faites chauffer l'huile et faites revenir les oignons et les cives <strong>5 minutes<\/strong>. Ajoutez la viande hachée et faites-la cuire <strong>8 à 10 minutes<\/strong> en l'émiettant à la spatule, jusqu'à ce qu'elle ne soit plus rose.", "<strong>Assaisonner<\/strong> : ajoutez l'ail, le piment, le thym, le concentré de tomates, la muscade, du sel et du poivre. Laissez cuire encore <strong>5 minutes<\/strong>, jusqu'à ce que le jus se soit évaporé. Hors du feu, ajoutez le persil et le pain essoré et écrasé.", "<strong>Refroidir<\/strong> : laissez <strong>complètement refroidir<\/strong> la farce, idéalement 1 heure au réfrigérateur.", "<strong>Découper la pâte<\/strong> : préchauffez le four à <strong>200 °C<\/strong>. Étalez la pâte sur <strong>3 mm<\/strong> d'épaisseur et découpez des disques de <strong>10 cm<\/strong> de diamètre avec un bol ou un emporte-pièce.", "<strong>Garnir<\/strong> : déposez une cuillère à soupe de farce sur une moitié de chaque disque, sans aller jusqu'au bord. Mouillez le bord au pinceau avec un peu d'eau, repliez la pâte en demi-lune et soudez les bords en appuyant avec les dents d'une fourchette.", "<strong>Dorer<\/strong> : déposez les pâtés sur deux plaques recouvertes de papier cuisson. Badigeonnez-les de jaune d'œuf mélangé au lait et percez un petit trou sur le dessus de chacun pour laisser s'échapper la vapeur.", "<strong>Cuire<\/strong> : faites cuire <strong>20 à 25 minutes<\/strong>, jusqu'à ce qu'ils soient bien gonflés et dorés. Servez chauds ou tièdes."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La farce doit être froide<\/strong> : chaude, elle ferait fondre le beurre de la pâte, qui ne feuilletterait plus.", "<strong>Une farce bien sèche<\/strong> évite que les pâtés ne s'ouvrent ou ne détrempent à la cuisson.", "<strong>Préparez à l'avance<\/strong> : les pâtés crus se congèlent sur une plaque, puis en sachet. Faites-les cuire directement sans décongeler, <strong>30 minutes à 200 °C<\/strong>.", "<strong>Pour l'apéritif<\/strong>, faites des mini-pâtés avec des disques de 6 cm, cuits 15 minutes."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pâtés à la morue<\/strong> : remplacez la viande par 800 g de morue dessalée, pochée et émiettée, revenue avec les aromates.", "<strong>Pâtés au poulet<\/strong> : avec 1 kg de poulet cuit et effiloché, mélangé à la sauce d'un colombo ou d'une fricassée.", "<strong>Pâtés aux légumes<\/strong> : avec un mélange de giraumon, carottes et petits pois revenus aux aromates.", "<strong>Pâte brisée<\/strong> : on peut aussi les faire avec de la pâte brisée (voir la recette), pour une pâte plus croustillante et moins grasse."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "À l'apéritif avec des accras de morue et un punch, ou en entrée avec uce tartare."}], "categorySlug": "plats"}, {"slug": "poulet-au-coco", "name": "Poulet au coco", "nameHtml": "Poulet au coco", "subtitle": "8 à 10 personnes", "emoji": "🥥", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["2 poulets fermiers (environ 3 kg), coupés en morceaux (ou 3 kg de cuisses et hauts de cuisse)", "4 citrons verts", "6 gousses d'ail", "1 morceau de gingembre frais d'environ 5 cm", "Sel et poivre"]}]}, {"title": "Sauce", "blocks": [{"t": "ul", "items": ["80 cl de lait de coco (2 boîtes de 400 ml)", "4 oignons", "1 botte de cives", "2 poivrons rouges", "4 tomates bien mûres", "2 cuillères à café de curcuma (ou 1 cuillère à soupe de poudre à colombo)", "1 piment antillais entier", "4 branches de thym", "1 bouquet de persil (ou de coriandre)", "4 cuillères à soupe d'huile", "Facultatif : 50 g de noix de coco râpée, dorée à sec à la poêle, pour le service"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc, et éventuellement des bananes plantains frites"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poulet<\/strong> : frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : râpez le gingembre et écrasez l'ail. Mélangez-les avec le jus d'un citron vert, du sel et du poivre, enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 1 heure<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Préparer les légumes<\/strong> : émincez les oignons et les cives, coupez les poivrons en lanières et les tomates en dés.", "<strong>Faire dorer le poulet<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser.
