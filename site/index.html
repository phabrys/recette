z les haricots et faites-les sauter <strong>2 à 3 minutes<\/strong> en remuant de temps en temps."}, {"label": "", "title": "Ajouter le vinaigre", "body": "Versez le vinaigre blanc dans la poêle, mélangez et poursuivez la cuisson <strong>1 minute<\/strong>, le temps qu'il s'évapore en partie."}, {"label": "", "title": "Ajouter l'ail", "body": "Baissez le feu, saupoudrez l'ail en poudre, salez légèrement et poivrez. Mélangez et laissez cuire <strong>1 minute<\/strong>, sans plus. Au total, la cuisson dure <strong>4 à 5 minutes<\/strong>."}, {"label": "", "title": "Goûter et servir", "body": "Rectifiez l'assaisonnement et servez aussitôt."}], "categorySlug": "accompagnements"}, {"slug": "jus-de-maracudja", "name": "Jus de maracudja", "nameHtml": "Jus de maracudja", "subtitle": "environ 2 litres, 10 verres", "emoji": "🧃", "category": "Cocktails sans alcool", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["12 maracudjas (fruits de la passion), bien mûrs : peau ridée et fruit lourd", "1,5 litre d'eau bien fraîche", "150 g de sucre de canne (ou 20 cl de sirop de canne), selon votre goût", "1 gousse de vanille (ou 1 sachet de sucre vanillé)", "Le jus d'un citron vert (facultatif)", "Glaçons"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Vider les fruits<\/strong> : coupez les maracudjas en deux et videz la pulpe et les graines à la cuillère dans le bol d'un blender.", "<strong>Mixer<\/strong> : ajoutez <strong>50 cl<\/strong> d'eau et mixez <strong>quelques secondes seulement<\/strong>, par petites impulsions, juste pour détacher la pulpe des graines sans les broyer.", "<strong>Filtrer<\/strong> : versez le mélange dans une passoire fine posée sur un pichet, et pressez la pulpe avec le dos d'une cuillère pour en extraire tout le jus. Jetez les graines.", "<strong>Sucrer et parfumer<\/strong> : ajoutez le reste de l'eau, le sucre, les graines de la gousse de vanille grattée et le jus de citron vert. Mélangez jusqu'à ce que le sucre soit dissous.", "<strong>Rafraîchir<\/strong> : placez au réfrigérateur <strong>au moins 1 heure<\/strong>.", "<strong>Servir<\/strong> : mélangez, goûtez, ajustez le sucre et servez bien frais avec des glaçons."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez des fruits à la peau ridée<\/strong> : ce sont les plus mûrs, les plus parfumés et les moins acides.", "<strong>Ne broyez pas les graines<\/strong> : mixées trop longtemps, elles rendent le jus amer et trouble avec des points noirs.", "<strong>Le maracudja est très acide<\/strong> : sucrez progressivement et goûtez.", "<strong>Conservation<\/strong> : le jus se garde 2 jours au réfrigérateur. La pulpe filtrée, non diluée, se congèle très bien en bacs à glaçons."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Jus de goyave<\/strong> : mixez 1 kg de goyaves coupées en morceaux avec 50 cl d'eau, filtrez pour retirer les pépins, puis allongez et sucrez de la même façon.", "<strong>Au lait<\/strong> : remplacez la moitié de l'eau par du lait bien froid (ou du lait concentré sucré, en supprimant le sucre), et mixez avec des glaçons pour un jus onctueux.", "<strong>Maracudja-orange<\/strong> : remplacez 50 cl d'eau par du jus d'orange.", "<strong>Pétillant<\/strong> : allongez avec de l'eau gazeuse au moment de servir."]}]}]}], "steps": [{"label": "", "title": "Vider les fruits", "body": "Coupez les maracudjas en deux et videz la pulpe et les graines à la cuillère dans le bol d'un blender."}, {"label": "", "title": "Mixer", "body": "Ajoutez <strong>50 cl<\/strong> d'eau et mixez <strong>quelques secondes seulement<\/strong>, par petites impulsions, juste pour détacher la pulpe des graines sans les broyer."}, {"label": "", "title": "Filtrer", "body": "Versez le mélange dans une passoire fine posée sur un pichet, et pressez la pulpe avec le dos d'une cuillère pour en extraire tout le jus. Jetez les graines."}, {"label": "", "title": "Sucrer et parfumer", "body": "Ajoutez le reste de l'eau, le sucre, les graines de la gousse de vanille grattée et le jus de citron vert. Mélangez jusqu'à ce que le sucre soit dissous."}, {"label": "", "title": "Rafraîchir", "body": "Placez au réfrigérateur <strong>au moins 1 heure<\/strong>."}, {"label": "", "title": "Servir", "body": "Mélangez, goûtez, ajustez le sucre et servez bien frais avec des glaçons."}], "categorySlug": "cocktails-sans-alcool"}, {"slug": "lasagnes", "name": "Lasagnes à la bolognaise", "nameHtml": "Lasagnes à la bolognaise", "subtitle": "2 plats, 10 à 12 personnes", "emoji": "🧀", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Sauce bolognaise", "blocks": [{"t": "ul", "items": ["1,2 kg de bœuf haché (ou moitié bœuf, moitié porc)", "2 oignons", "2 carottes", "4 gousses d'ail", "4 cuillères à soupe d'huile d'olive", "2 grandes boîtes de tomates concassées (2 × 800 g)", "4 cuillères à soupe de concentré de tomates", "20 cl d'eau", "2 cuillères à café d'origan (ou d'herbes de Provence)", "Sel et poivre"]}]}, {"title": "Béchamel", "blocks": [{"t": "ul", "items": ["120 g de beurre", "120 g de farine", "1,5 litre de lait", "1 pincée de noix de muscade râpée", "Sel et poivre"]}]}, {"title": "Montage", "blocks": [{"t": "ul", "items": ["500 g de feuilles de lasagnes (sans précuisson)", "300 g de fromage râpé (emmental, mozzarella, ou un mélange)", "50 g de parmesan râpé"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La bolognaise<\/strong> : épluchez et hachez finement les oignons, les carottes et l'ail. Dans une grande cocotte, faites-les revenir <strong>8 minutes<\/strong> dans l'huile d'olive. Ajoutez la viande et faites-la dorer <strong>8 à 10 minutes<\/strong> en l'émiettant. Ajoutez le concentré de tomates, les tomates concassées, l'eau et l'origan, salez, poivrez et laissez mijoter <strong>45 minutes<\/strong> à feu doux, à demi couvert.", "<strong>La béchamel<\/strong> : dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 à 8 minutes<\/strong> à feu doux, en fouettant. Salez, poivrez, ajoutez la muscade (voir aussi la recette de béchamel).", "<strong>Préchauffer<\/strong> : préchauffez le four à <strong>180 °C<\/strong>.", "<strong>Monter les lasagnes<\/strong> : dans deux plats à gratin beurrés, étalez une fine couche de béchamel au fond. Disposez une couche de feuilles de lasagnes, puis une couche de bolognaise, une couche de béchamel et une poignée de fromage râpé. Recommencez <strong>3 ou 4 fois<\/strong>, en terminant par une couche de lasagnes recouverte de béchamel.", "<strong>Le dessus<\/strong> : parsemez du reste de fromage râpé et du parmesan.", "<strong>Cuire<\/strong> : couvrez de papier aluminium et faites cuire <strong>30 minutes<\/strong>, puis retirez l'aluminium et poursuivez <strong>15 à 20 minutes<\/strong>, jusqu'à ce que le dessus soit bien gratiné et que la pointe d'un couteau traverse les pâtes sans résistance.", "<strong>Reposer<\/strong> : laissez reposer <strong>10 minutes<\/strong> hors du four avant de couper : les lasagnes se tiendront mieux."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les feuilles sans précuisson<\/strong> cuisent dans la sauce : elles doivent être bien recouvertes de sauce, sinon les bords restent durs.", "<strong>Une sauce bolognaise un peu liquide<\/strong> est préférable : les pâtes absorbent le liquide pendant la cuisson.", "<strong>Préparez-les la veille<\/strong> : montées, elles se gardent un jour au réfrigérateur. Elles sont même meilleures, les saveurs se mélangent.", "<strong>Congélation<\/strong> : elles se congèlent très bien, cuites ou crues, en portions ou en entier."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Lasagnes au poulet<\/strong> : remplacez le bœuf par 1,2 kg de poulet cuit effiloché, mélangé à une sauce tomate.", "<strong>Lasagnes au saumon et épinards<\/strong> : remplacez la bolognaise par 800 g de saumon en dés et 1 kg d'épinards revenus à l'ail.", "<strong>Végétariennes<\/strong> : avec des légumes grillés (courgettes, aubergines, poivrons) et de la ricotta."]}]}]}], "steps": [{"label": "", "title": "La bolognaise", "body": "Épluchez et hachez finement les oignons, les carottes et l'ail. Dans une grande cocotte, faites-les revenir <strong>8 minutes<\/strong> dans l'huile d'olive. Ajoutez la viande et faites-la dorer <strong>8 à 10 minutes<\/strong> en l'émiettant. Ajoutez le concentré de tomates, les tomates concassées, l'eau et l'origan, salez, poivrez et laissez mijoter <strong>45 minutes<\/strong> à feu doux, à demi couvert."}, {"label": "", "title": "La béchamel", "body": "Dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 à 8 minutes<\/strong> à feu doux, en fouettant. Salez, poivrez, ajoutez la muscade (voir aussi la recette de béchamel)."}, {"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>180 °C<\/strong>."}, {"label": "", "title": "Monter les lasagnes", "body": "Dans deux plats à gratin beurrés, étalez une fine couche de béchamel au fond. Disposez une couche de feuilles de lasagnes, puis une couche de bolognaise, une couche de béchamel et une poignée de fromage râpé. Recommencez <strong>3 ou 4 fois<\/strong>, en terminant par une couche de lasagnes recouverte de béchamel."}, {"label": "", "title": "Le dessus", "body": "Parsemez du reste de fromage râpé et du parmesan."}, {"label": "", "title": "Cuire", "body": "Couvrez de papier aluminium et faites cuire <strong>30 minutes<\/strong>, puis retirez l'aluminium et poursuivez <strong>15 à 20 minutes<\/strong>, jusqu'à ce que le dessus soit bien gratiné et que la pointe d'un couteau traverse les pâtes sans résistance."}, {"label": "", "title": "Reposer", "body": "Laissez reposer <strong>10 minutes<\/strong> hors du four avant de couper : les lasagnes se tiendront mieux."}], "categorySlug": "plats"}, {"slug": "lentilles", "name": "Lentilles mijotées", "nameHtml": "Lentilles mijotées", "subtitle": "6 à 8 personnes", "emoji": "🫘", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de lentilles vertes (du Puy ou blondes)", "2 oignons", "2 carottes", "4 gousses d'ail", "1 bouquet garni (thym, laurier, persil)", "3 cuillères à soupe d'huile (ou 30 g de beurre)", "1,5 litre d'eau (ou de bouillon de légumes)", "Sel fin", "Poivre du moulin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Trier et rincer<\/strong> : étalez les lentilles sur une assiette pour retirer les éventuels petits cailloux, puis rincez-les à l'eau froide dans une passoire.", "<strong>Préparer les légumes<\/strong> : épluchez et émincez finement les oignons. Épluchez les carottes et coupez-les en petits dés ou en rondelles fines. Épluchez et écrasez les gousses d'ail.", "<strong>Faire revenir<\/strong> : faites chauffer l'huile dans une grande casserole à feu moyen. Ajoutez les oignons et faites-les revenir <strong>5 minutes<\/strong> jusqu'à ce qu'ils soient translucides. Ajoutez les carottes et l'ail, et laissez cuire encore <strong>2 minutes<\/strong> en remuant.", "<strong>Ajouter les lentilles<\/strong> : versez les lentilles, mélangez pour bien les enrober, puis couvrez avec l'eau froide. Ajoutez le bouquet garni.", "<strong>Cuire<\/strong> : portez à ébullition, puis baissez le feu et laissez mijoter à couvert <strong>25 à 30 minutes<\/strong> à petits frémissements, en remuant de temps en temps. Ajoutez un peu d'eau si elles deviennent trop sèches.", "<strong>Saler en fin de cuisson<\/strong> : quand les lentilles sont tendres mais encore entières, salez, poivrez et laissez cuire encore <strong>5 minutes<\/strong> à découvert pour réduire le liquide restant.", "<strong>Servir<\/strong> : retirez le bouquet garni, goûtez, rectifiez l'assaisonnement et servez chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pas besoin de trempage<\/strong> pour les lentilles vertes ou blondes, contrairement aux haricots secs.", "<strong>Salez toujours en fin de cuisson<\/strong> : le sel au début durcit la peau des lentilles et allonge la cuisson.", "<strong>Départ à l'eau froide<\/strong> : les lentilles cuisent plus régulièrement et se tiennent mieux.", "<strong>Petits frémissements<\/strong> : un bouillonnement trop fort fait éclater les lentilles, qui deviennent de la purée.", "<strong>Un filet de vinaigre<\/strong> au moment de servir réveille le goût des lentilles.", "<strong>Conservation<\/strong> : elles se gardent 3 jours au réfrigérateur et sont encore meilleures réchauffées. Elles se congèlent très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la créole<\/strong> : remplacez le bouquet garni par du thym, 2 cives émincées et un piment végétarien (ou un piment entier non percé pour parfumer sans piquer), et ajoutez 2 tomates coupées en dés avec les carottes.", "<strong>Au lard<\/strong> : faites dorer 200 g de lardons ou de lard fumé avant les oignons, ou ajoutez une saucisse fumée coupée en rondelles pour les 15 dernières minutes de cuisson.", "<strong>Au lait de coco<\/strong> : remplacez 400 ml d'eau par une boîte de lait de coco et ajoutez 2 cuillères à café de curry ou de poudre à colombo avec les oignons.", "<strong>En salade<\/strong> : faites cuire les lentilles à l'eau avec le bouquet garni se gnements"}, {"slug": "mayonnaise", "name": "Mayonnaise", "nameHtml": "Mayonnaise", "subtitle": "environ 500 g", "emoji": "🥚", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 jaunes d'œufs, à température ambiante", "2 cuillères à café de moutarde forte", "50 cl d'huile neutre (tournesol, colza ou arachide), à température ambiante", "2 cuillères à café de vinaigre de vin blanc (ou de jus de citron)", "Sel fin et poivre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La base<\/strong> : dans un bol à fond rond (posé sur un torchon humide pour qu'il ne glisse pas), mettez les jaunes d'œufs, la moutarde, une pincée de sel et du poivre. Mélangez au fouet.", "<strong>Monter<\/strong> : versez l'huile <strong>goutte à goutte<\/strong> au début, en fouettant sans arrêt, jusqu'à ce que le mélange épaississe et devienne ferme.", "<strong>Accélérer<\/strong> : quand la mayonnaise a pris, versez le reste de l'huile en <strong>mince filet<\/strong>, toujours en fouettant.", "<strong>Assaisonner<\/strong> : ajoutez le vinaigre en fin de montage, goûtez et rectifiez le sel et le poivre.", "<strong>Conserver<\/strong> : couvrez et gardez-la au réfrigérateur."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tous les ingrédients à la même température<\/strong> (ambiante) : c'est la clé pour que la mayonnaise prenne. Sortez les œufs et l'huile du réfrigérateur 1 heure avant.", "<strong>La mayonnaise ne prend pas ou retombe ?<\/strong> Dans un autre bol, mettez une cuillère à café de moutarde (ou un jaune d'œuf), puis versez la mayonnaise ratée goutte à goutte en fouettant : elle va remonter.", "<strong>Au batteur électrique ou au mixeur plongeant<\/strong>, c'est plus rapide : avec le mixeur plongeant, mettez tous les ingrédients dans un bocal étroit, posez le mixeur au fond, mixez et remontez doucement.", "<strong>Les œufs sont crus<\/strong> : utilisez-les très frais, et gardez la mayonnaise <strong>2 jours maximum<\/strong> au réfrigérateur. Évitez de la servir aux femmes enceintes, aux jeunes enfants et aux personnes fragiles."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Aïoli<\/strong> : ajoutez 4 gousses d'ail écrasées en purée aux jaunes d'œufs, et utilisez de l'huile d'olive.", "<strong>Sauce tartare<\/strong> : ajoutez des cornichons, des câpres, de l'échalote et des fines herbes hachés.", "<strong>Sauce cocktail<\/strong> : ajoutez 2 cuillères à soupe de ketchup, un trait de cognac et une pincée de piment.", "<strong>Mayonnaise pimentée<\/strong> : ajoutez un peu de piment antillais finement haché et du jus de citron vert à la place du vinaigre."]}]}]}, {"title": "Idées d'utilisation", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Frites maison, chips, nuggets de poulet, poisson pané, œufs durs, salades de pommes de terre, sandwichs, bokits."}]}]}], "steps": [{"label": "", "title": "La base", "body": "Dans un bol à fond rond (posé sur un torchon humide pour qu'il ne glisse pas), mettez les jaunes d'œufs, la moutarde, une pincée de sel et du poivre. Mélangez au fouet."}, {"label": "", "title": "Monter", "body": "Versez l'huile <strong>goutte à goutte<\/strong> au début, en fouettant sans arrêt, jusqu'à ce que le mélange épaississe et devienne ferme."}, {"label": "", "title": "Accélérer", "body": "Quand la mayonnaise a pris, versez le reste de l'huile en <strong>mince filet<\/strong>, toujours en fouettant."}, {"label": "", "title": "Assaisonner", "body": "Ajoutez le vinaigre en fin de montage, goûtez et rectifiez le sel et le poivre."}, {"label": "", "title": "Conserver", "body": "Couvrez et gardez-la au réfrigérateur."}], "categorySlug": "bases"}, {"slug": "mojito", "name": "Mojito", "nameHtml": "Mojito", "subtitle": "pichet de 8 verres", "emoji": "🌿", "category": "Cocktails", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["40 cl de rhum blanc (cubain ou agricole)", "6 citrons verts", "1 grosse botte de menthe fraîche (environ 80 feuilles)", "12 cl de sirop de canne (ou 8 cuillères à soupe de sucre de canne roux)", "1 litre d'eau gazeuse bien fraîche", "Glace pilée (ou beaucoup de glaçons)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Les citrons<\/strong> : lavez les citrons verts et coupez-les en quartiers.", "<strong>Écraser<\/strong> : dans le fond d'un grand pichet, mettez les quartiers de citron et le sirop de canne. Écrasez-les avec un pilon (ou le manche d'une cuillère en bois) pour extraire le jus.", "<strong>La menthe<\/strong> : ajoutez les feuilles de menthe et écrasez-les <strong>doucement<\/strong>, juste pour libérer leur parfum, sans les déchiqueter.", "<strong>Le rhum<\/strong> : versez le rhum et mélangez bien.", "<strong>Servir<\/strong> : remplissez les verres de glace pilée, versez le mélange au rhum jusqu'à mi-hauteur, puis complétez avec l'eau gazeuse. Mélangez délicatement et décorez d'un brin de menthe et d'un quartier de citron."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>N'écrasez pas trop la menthe<\/strong> : déchiquetée, elle libère de l'amertume et des morceaux restent entre les dents.", "<strong>L'eau gazeuse au dernier moment<\/strong> dans chaque verre, pour garder les bulles.", "<strong>La glace pilée<\/strong> refroidit vite et dilue juste ce qu'il faut. Pour la faire, enveloppez des glaçons dans un torchon et tapez-les avec un rouleau à pâtisserie.", "<strong>L'abus d'alcool est dangereux pour la santé<\/strong>, à consommer avec modération."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Mojito sans alcool<\/strong> : voir la recette de virgin mojito.", "<strong>Mojito aux fruits<\/strong> : écrasez avec g> : ajoutez les jaunes <strong>un par un<\/strong> au chocolat tiède, en fouettant bien entre chaque. Le mélange devient épais et brillant.", "<strong>Monter les blancs<\/strong> : dans un grand saladier bien propre, battez les blancs avec la pincée de sel au batteur électrique. Quand ils deviennent mousseux, ajoutez le sucre en pluie et continuez de battre jusqu'à ce qu'ils soient <strong>fermes et brillants<\/strong> : ils doivent former un bec au bout du fouet.", "<strong>Détendre<\/strong> : ajoutez <strong>un quart des blancs<\/strong> au chocolat et mélangez vivement au fouet pour détendre le mélange.", "<strong>Incorporer<\/strong> : ajoutez le reste des blancs et incorporez-les <strong>très délicatement<\/strong> à la spatule, en soulevant la masse du fond vers le haut et en tournant le saladier, jusqu'à ce qu'il ne reste plus de traces blanches.", "<strong>Prendre au froid<\/strong> : répartissez la mousse dans un grand saladier ou dans des verrines, couvrez et placez au réfrigérateur <strong>au moins 4 heures<\/strong>, idéalement une nuit."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le chocolat doit être tiède<\/strong>, pas chaud ni froid : chaud, il cuit les jaunes et fait retomber les blancs ; froid, il fige en grains au contact des blancs.", "<strong>Un saladier parfaitement propre et sec<\/strong> pour les blancs : la moindre trace de gras ou de jaune les empêche de monter.", "<strong>Incorporez les blancs délicatement<\/strong> : c'est ce qui rend la mousse légère et aérienne.", "<strong>Les œufs sont crus<\/strong> : utilisez-les très frais, et évitez de servir cette mousse aux femmes enceintes, aux jeunes enfants et aux personnes fragiles.", "<strong>Conservation<\/strong> : 2 jours au réfrigérateur maximum."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Chocolat au lait<\/strong> : remplacez la moitié du chocolat noir par du chocolat au n tournant le saladier, jusqu'à ce qu'il ne reste plus de traces blanches."}, {"label": "", "title": "Prendre au froid", "body": "Répartissez la mousse dans un grand saladier ou dans des verrines, couvrez et placez au réfrigérateur <strong>au moins 4 heures<\/strong>, idéalement une nuit."}], "categorySlug": "desserts"}, {"slug": "nuggets", "name": "Nuggets de poulet", "nameHtml": "Nuggets de poulet", "subtitle": "environ 60 nuggets, 8 personnes", "emoji": "🐤", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Farce", "blocks": [{"t": "ul", "items": ["1,6 kg de blancs de poulet (ou un mélange blancs et hauts de cuisse désossés, plus moelleux)", "2 œufs", "4 cuillères à soupe de crème fraîche épaisse (ou de lait)", "2 cuillères à soupe de fécule de maïs (Maïzena)", "2 cuillères à café d'ail en poudre", "2 cuillères à café d'oignon en poudre (facultatif)", "2 cuillères à café de paprika doux", "3 cuillères à café de sel", "1 cuillère à café de poivre"]}]}, {"title": "Panure", "blocks": [{"t": "ul", "items": ["150 g de farine", "4 œufs", "300 g de chapelure (ou de chapelure japonaise « panko », plus croustillante)", "100 g de corn flakes nature écrasés (facultatif, pour plus de croustillant)"]}]}, {"title": "Cuisson", "blocks": [{"t": "ul", "items": ["Huile de friture (tournesol ou arachide)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Hacher le poulet<\/strong> : coupez le poulet en morceaux et mixez-le <strong>par impulsions<\/strong> au robot, en plusieurs fois, jusqu'à obtenir un hachis fin mais pas en purée.", "<strong>La farce<\/strong> : dans un grand saladier, mélangez le poulet haché avec les œufs, la crème, la fécule, l'ail, l'oignon, le paprika, le sel et le poivre, jusqu'à obtenir une pâte homogène.", "<strong>Façonner<\/strong> : avec les mains mouillées, prélevez des portions d'une cuillère à soupe bien pleine (environ 30 g) et formez es frire directement sans décongeler, <strong>5 à 6 minutes à 170 °C<\/strong>, ou cuisez-les au four.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : déposez les nuggets panés sur deux plaques recouvertes de papier cuisson, arrosez-les d'un filet d'huile et faites-les cuire <strong>15 à 20 minutes à 200 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>À la friteuse sans huile<\/strong> : badigeonnez-les ou vaporisez-les d'huile et faites-les cuire <strong>10 à 12 minutes à 200 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>En morceaux<\/strong> : sans hacher le poulet, coupez les blancs en cubes de 3 cm, faites-les mariner 30 minutes dans du lait avec l'ail et le paprika, puis panez-les comme ci-dessus.", "<strong>Au fromage<\/strong> : ajoutez 100 g de cheddar ou d'emmental râpé à la farce.", "<strong>Épicés<\/strong> : ajoutez du piment de Cayenne ou de la poudre à colombo dans la farce et dans la chapelure."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Frites maison, chips maison, purée de pommes de terre, riz blanc, crudités, avec du ketchup, de la mayonnaise, de la sauce barbecue, de la sauce aigre-douce ou de la sauce chien."}]}]}], "steps": [{"label": "", "title": "Hacher le poulet", "body": "Coupez le poulet en morceaux et mixez-le <strong>par impulsions<\/strong> au robot, en plusieurs fois, jusqu'à obtenir un hachis fin mais pas en purée."}, {"label": "", "title": "La farce", "body": "Dans un grand saladier, mélangez le poulet haché avec les œufs, la crème, la fécule, l'ail, l'oignon, le paprika, le sel et le poivre, jusqu'à obtenir une pâte homogène."}, {"label": "", "title": "Façonner", "body": "Avec les mains mouillées, prélevez des
