 24 gaufres", "emoji": "🧇", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "2 sachets de levure chimique (22 g)", "6 œufs", "1 litre de lait", "200 g de beurre fondu", "100 g de sucre", "2 sachets de sucre vanillé", "2 pincées de sel", "Facultatif : 2 cuillères à soupe de rhum ou de fleur d'oranger"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Séparer les œufs<\/strong> : mettez les blancs de côté dans un bol propre et sec.", "<strong>Le mélange sec<\/strong> : dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel.", "<strong>Les jaunes et le lait<\/strong> : creusez un puits, ajoutez les jaunes d'œufs, puis versez le lait <strong>petit à petit<\/strong> en fouettant pour éviter les grumeaux.", "<strong>Le beurre<\/strong> : incorporez le beurre fondu (tiédi), puis l'arôme si vous en mettez un.", "<strong>Les blancs en neige<\/strong> : montez les blancs en neige ferme avec une pincée de sel, puis incorporez-les <strong>délicatement<\/strong> à la pâte avec une spatule, en soulevant la pâte.", "<strong>Le repos<\/strong> : laissez reposer 30 minutes si vous avez le temps (facultatif).", "<strong>La cuisson<\/strong> : préchauffez le gaufrier et graissez-le légèrement. Versez une louche de pâte, refermez et laissez cuire 3 à 5 minutes, jusqu'à ce que la gaufre soit bien dorée."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les blancs en neige<\/strong> rendent les gaufres légères et aérées : c'est l'étape qui fait la différence.", "<strong>Pour des gaufres plus croustillantes<\/strong>, remplacez 20 cl de lait par 20 cl d'eau gazeuse, ou ajoutez 100 g de fécule de maïs à la place de 100 g de farine.", "<strong>N'ouvrez pas le gaufrier trop tôt<\/strong>, sinon la gaufre se déchire. Attendez qu'il ne s'en échappe presque plus de vapeur.", "Posez les gaufres cuites sur une grille plutôt qu'empilées, pour qu'elles restent croustillantes."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre glace, chantilly, Nutella, confiture, sirop d'érable, caramel au beurre salé, fruits frais ou une boule de glace."}]}]}], "steps": [{"label": "", "title": "Séparer les œufs", "body": "Mettez les blancs de côté dans un bol propre et sec."}, {"label": "", "title": "Le mélange sec", "body": "Dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel."}, {"label": "", "title": "Les jaunes et le lait", "body": "Creusez un puits, ajoutez les jaunes d'œufs, puis versez le lait <strong>petit à petit<\/strong> en fouettant pour éviter les grumeaux."}, {"label": "", "title": "Le beurre", "body": "Incorporez le beurre fondu (tiédi), puis l'arôme si vous en mettez un."}, {"label": "", "title": "Les blancs en neige", "body": "Montez les blancs en neige ferme avec une pincée de sel, puis incorporez-les <strong>délicatement<\/strong> à la pâte avec une spatule, en soulevant la pâte."}, {"label": "", "title": "Le repos", "body": "Laissez reposer 30 minutes si vous avez le temps (facultatif)."}, {"label": "", "title": "La cuisson", "body": "Préchauffez le gaufrier et graissez-le légèrement. Versez une louche de pâte, refermez et laissez cuire 3 à 5 minutes, jusqu'à ce que la gaufre soit bien dorée."}], "categorySlug": "desserts"}, {"slug": "genoise", "name": "Génoise", "nameHtml": "Génoise", "subtitle": "2 génoises de 24 cm", "emoji": "🎂", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["8 œufs, à température ambiante", "250 g de sucre", "250 g de farine (type T45), tamisée", "2 sachets de sucre vanillé", "1 pincée de sel", "Facultatif : 50 g de beurre fondu (pour une génoise plus moelleuse qui se garde mieux)", "Un peu de beurre et de farine pour les moules"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules ronds de 24 cm, ou recouvrez leur fond d'un disque de papier cuisson.", "<strong>Le bain-marie<\/strong> : dans un grand saladier résistant à la chaleur, mettez les œufs entiers, le sucre, le sucre vanillé et le sel. Posez-le sur une casserole d'eau <strong>frémissante<\/strong>, sans que le fond touche l'eau.", "<strong>Fouetter à chaud<\/strong> : fouettez sans arrêt, de préférence au batteur électrique, jusqu'à ce que le mélange soit tiède au doigt (<strong>45 à 50 °C<\/strong>) et ait doublé de volume, environ 5 minutes.", "<strong>Fouetter à froid<\/strong> : retirez le saladier du bain-marie et continuez de fouetter à grande vitesse <strong>8 à 10 minutes<\/strong>, jusqu'à ce que le mélange ait refroidi et triplé de volume. Il est prêt quand il forme un <strong>ruban<\/strong> épais qui reste quelques secondes à la surface quand on soulève le fouet.", "<strong>La farine<\/strong> : tamisez la farine en trois fois au-dessus du saladier, en l'incorporant à chaque fois <strong>très délicatement<\/strong> avec une spatule, en soulevant la pâte du fond vers le dessus. Arrêtez dès qu'il n'y a plus de farine visible : la pâte ne doit pas retomber.", "<strong>Le beurre<\/strong> (facultatif) : prélevez 2 cuillères de pâte, mélangez-les avec le beurre fondu tiède, puis reversez ce mélange dans le saladier et incorporez-le délicatement.", "<strong>Remplir les moules<\/strong> : répartissez la pâte dans les deux moules et lissez la surface sans appuyer.", "<strong>La cuisson<\/strong> : enfournez aussitôt et faites cuire <strong>20 à 25 minutes<\/strong>, sans ouvrir le four pendant les 15 premières minutes. La génoise est cuite quand elle est dorée, se décolle des bords et reprend sa forme quand on appuie doucement dessus.", "<strong>Démouler<\/strong> : démoulez dès la sortie du four sur une grille et laissez refroidir complètement avant de couper ou de garnir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le ruban est l'étape clé<\/strong> : c'est l'air emprisonné dans les œufs qui fait lever la génoise, il n'y a pas de levure. Ne raccourcissez pas le temps de fouettage.", "<strong>Ne laissez pas l'eau bouillir<\/strong> sous le saladier, et ne dépassez pas 50 °C : les œufs cuiraient.", "<strong>Pour couper la génoise en deux ou trois disques<\/strong>, attendez qu'elle soit complètement froide, ou mieux, préparez-la la veille et gardez-la emballée dans du film alimentaire.", "<strong>Imbibez toujours la génoise<\/strong> avant de la garnir avec un sirop (10 cl d'eau et 50 g de sucre portés à ébullition, avec éventuellement un trait de rhum, de kirsch ou de jus de fruit) : sinon, elle reste sèche.", "<strong>La génoise se congèle très bien<\/strong> sans garniture, emballée dans du film alimentaire."]}]}]}, {"title": "Biscuit roulé", "subs": [{"title": "", "blocks": [{"t": "p", "html": "La même pâte sert à faire deux bûches ou gâteaux roulés :"}, {"t": "ol", "items": ["Étalez la pâte sur deux plaques recouvertes de papier cuisson, sur environ 1 cm d'épaisseur.", "Faites cuire <strong>8 à 10 minutes à 200 °C<\/strong>, jusqu'à ce que le biscuit soit juste doré.", "Dès la sortie du four, retournez le biscuit sur un torchon humide, retirez le papier et roulez-le dans le torchon. Laissez-le refroidir ainsi, puis déroulez-le, garnissez-le et roulez-le à nouveau."]}]}]}, {"title": "Idées de gâteaux", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Fraisier, forêt-noire, gâteau d'anniversaire à la crème et aux fruits, gâteau au chocolat fourré de ganache, bûche de Noël, gâteau roulé à la confiture, charlotte."}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules ronds de 24 cm, ou recouvrez leur fond d'un disque de papier cuisson."}, {"label": "", "title": "Le bain-marie", "body": "Dans un grand saladier résistant à la chaleur, mettez les œufs entiers, le sucre, le sucre vanillé et le sel. Posez-le sur une casserole d'eau <strong>frémissante<\/strong>, sans que le fond touche l'eau."}, {"label": "", "title": "Fouetter à chaud", "body": "Fouettez sans arrêt, de préférence au batteur électrique, jusqu'à ce que le mélange soit tiède au doigt (<strong>45 à 50 °C<\/strong>) et ait doublé de volume, environ 5 minutes."}, {"label": "", "title": "Fouetter à froid", "body": "Retirez le saladier du bain-marie et continuez de fouetter à grande vitesse <strong>8 à 10 minutes<\/strong>, jusqu'à ce que le mélange ait refroidi et triplé de volume. Il est prêt quand il forme un <strong>ruban<\/strong> épais qui reste quelques secondes à la surface quand on soulève le fouet."}, {"label": "", "title": "La farine", "body": "Tamisez la farine en trois fois au-dessus du saladier, en l'incorporant à chaque fois <strong>très délicatement<\/strong> avec une spatule, en soulevant la pâte du fond vers le dessus. Arrêtez dès qu'il n'y a plus de farine visible : la pâte ne doit pas retomber."}, {"label": "", "title": "", "body": "<strong>Le beurre<\/strong> (facultatif) : prélevez 2 cuillères de pâte, mélangez-les avec le beurre fondu tiède, puis reversez ce mélange dans le saladier et incorporez-le délicatement."}, {"label": "", "title": "Remplir les moules", "body": "Répartissez la pâte dans les deux moules et lissez la surface sans appuyer."}, {"label": "", "title": "La cuisson", "body": "Enfournez aussitôt et faites cuire <strong>20 à 25 minutes<\/strong>, sans ouvrir le four pendant les 15 premières minutes. La génoise est cuite quand elle est dorée, se décolle des bords et reprend sa forme quand on appuie doucement dessus."}, {"label": "", "title": "Démouler", "body": "Démoulez dès la sortie du four sur une grille et laissez refroidir complètement avant de couper ou de garnir."}], "categorySlug": "patisseries"}, {"slug": "gratin-dauphinois", "name": "Gratin dauphinois", "nameHtml": "Gratin dauphinois", "subtitle": "8 à 10 personnes", "emoji": "🫕", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair ferme ou mixte (Charlotte, Monalisa ou Agria)", "1 litre de lait entier", "50 cl de crème fraîche liquide entière", "4 gousses d'ail", "40 g de beurre (pour le plat et le dessus)", "2 cuillères à café de sel fin", "Poivre du moulin", "2 pincées de noix de muscade râpée"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer<\/strong> : préchauffez le four à <strong>160 °C<\/strong> (chaleur traditionnelle).", "<strong>Préparer le plat<\/strong> : coupez une gousse d'ail en deux et frottez-en généreusement le fond et les bords d'un grand plat à gratin (ou de deux plats moyens). Beurrez ensuite le plat avec une partie du beurre.", "<strong>Éplucher et trancher<\/strong> : épluchez les pommes de terre et coupez-les en rondelles <strong>fines et régulières<\/strong> de <strong>3 mm<\/strong>, à la mandoline ou au couteau. <strong>Ne les rincez pas<\/strong> : leur amidon va lier la crème.", "<strong>Précuire dans le lait<\/strong> : mettez les rondelles dans une grande casserole avec le lait, la crème, les gousses d'ail restantes écrasées, le sel, le poivre et la muscade. Portez doucement à frémissement en remuant délicatement avec une spatule, puis laissez cuire <strong>10 minutes<\/strong> à feu doux, jusqu'à ce que le mélange épaississe légèrement.", "<strong>Garnir le plat<\/strong> : retirez les gousses d'ail, puis versez les pommes de terre et le liquide dans le plat. Égalisez la surface : le liquide doit arriver juste au niveau des pommes de terre.", "<strong>Parsemer de beurre<\/strong> : déposez le reste du beurre en petits morceaux sur le dessus.", "<strong>Cuire<\/strong> : enfournez pour <strong>1 heure à 1 heure 15<\/strong>, jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse les pommes de terre sans résistance.", "<strong>Reposer<\/strong> : laissez reposer <strong>10 minutes<\/strong> hors du four avant de servir, le temps que le gratin se tienne."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le vrai gratin dauphinois ne contient pas de fromage<\/strong> : c'est la crème et l'amidon des pommes de terre qui le rendent fondant et gratiné.", "<strong>Ne rincez pas les pommes de terre après les avoir coupées<\/strong> : l'amidon épaissit la sauce et lie le gratin.", "<strong>La précuisson dans le lait<\/strong> raccourcit le passage au four et garantit des pommes de terre bien fondantes à cœur.", "<strong>Cuisson douce et longue<\/strong> : à 160 °C, la crème ne tranche pas et le gratin reste onctueux. Si le dessus dore trop vite, couvrez-le de papier aluminium.", "<strong>Des rondelles régulières<\/strong> cuisent toutes en même temps : la mandoline est idéale (attention aux doigts, utilisez le protège-main).", "<strong>Préparez-le à l'avance<\/strong> : il se réchauffe très bien 20 minutes à 160 °C, et il est même souvent meilleur le lendemain."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Gratin savoyard<\/strong> : remplacez le lait et la crème par du bouillon et parsemez 200 g de beaufort ou de comté râpé entre les couches et sur le dessus.", "<strong>Avec du fromage<\/strong> : pour ceux qui aiment, parsemez 150 g de gruyère ou d'emmental râpé sur le dessus 15 minutes avant la fin de la cuisson.", "<strong>Plus léger<\/strong> : remplacez la crème par du lait (1,5 litre de lait au total).", "<strong>Gratin de patate douce<\/strong> : remplacez la moitié des pommes de terre par de la patate douce, et ajoutez une pincée de piment ou de colombo dans la crème."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Rôti de porc, gigot d'agneau, poulet rôti, côtes de bœuf, jambon à l'os, magret de canard, avec une salade verte."}]}]}], "steps": [{"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>160 °C<\/strong> (chaleur traditionnelle)."}, {"label": "", "title": "Préparer le plat", "body": "Coupez une gousse d'ail en deux et frottez-en généreusement le fond et les bords d'un grand plat à gratin (ou de deux plats moyens). Beurrez ensuite le plat avec une partie du beurre."}, {"label": "", "title": "Éplucher et trancher", "body": "Épluchez les pommes de terre et coupez-les en rondelles <strong>fines et régulières<\/strong> de <strong>3 mm<\/strong>, à la mandoline ou au couteau. <strong>Ne les rincez pas<\/strong> : leur amidon va lier la crème."}, {"label": "", "title": "Précuire dans le lait", "body": "Mettez les rondelles dans une grande casserole avec le lait, la crème, les gousses d'ail restantes écrasées, le sel, le poivre et la muscade. Portez doucement à frémissement en remuant délicatement avec une spatule, puis laissez cuire <strong>10 minutes<\/strong> à feu doux, jusqu'à ce que le mélange épaississe légèrement."}, {"label": "", "title": "Garnir le plat", "body": "Retirez les gousses d'ail, puis versez les pommes de terre et le liquide dans le plat. Égalisez la surface : le liquide doit arriver juste au niveau des pommes de terre."}, {"label": "", "title": "Parsemer de beurre", "body": "Déposez le reste du beurre en petits morceaux sur le dessus."}, {"label": "", "title": "Cuire", "body": "Enfournez pour <strong>1 heure à 1 heure 15<\/strong>, jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse les pommes de terre sans résistance."}, {"label": "", "title": "Reposer", "body": "Laissez reposer <strong>10 minutes<\/strong> hors du four avant de servir, le temps que le gratin se tienne."}], "categorySlug": "accompagnements"}, {"slug": "haricots-verts-a-l-ail", "name": "Haricots verts à l'ail", "nameHtml": "Haricots verts à l'ail", "subtitle": "4 à 6 personnes", "emoji": "🫛", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 boîtes de haricots verts (boîtes 4/4, environ 440 g égouttés chacune)", "2 cuillères à soupe d'huile (ou 30 g de beurre)", "2 cuillères à café d'ail en poudre", "2 cuillères à soupe de vinaigre blanc", "Sel fin", "Poivre du moulin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Égoutter<\/strong> : versez les haricots verts dans une passoire, rincez-les rapidement à l'eau froide pour retirer le goût de conserve, puis égouttez-les bien.", "<strong>Sécher<\/strong> : étalez-les sur un torchon propre ou du papier absorbant et tapotez-les pour retirer un maximum d'eau. Plus ils sont secs, mieux ils dorent.", "<strong>Faire revenir<\/strong> : faites chauffer l'huile dans une grande poêle à feu <strong>moyen-vif<\/strong>. Ajoutez les haricots et faites-les sauter <strong>2 à 3 minutes<\/strong> en remuant de temps en temps.", "<strong>Ajouter le vinaigre<\/strong> : versez le vinaigre blanc dans la poêle, mélangez et poursuivez la cuisson <strong>1 minute<\/strong>, le temps qu'il s'évapore en partie.", "<strong>Ajouter l'ail<\/strong> : baissez le feu, saupoudrez l'ail en poudre, salez légèrement et poivrez. Mélangez et laissez cuire <strong>1 minute<\/strong>, sans plus. Au total, la cuisson dure <strong>4 à 5 minutes<\/strong>.", "<strong>Goûter et servir<\/strong> : rectifiez l'assaisonnement et servez aussitôt."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>L'ail en poudre brûle très vite<\/strong> et devient amer : ajoutez-le toujours en fin de cuisson, à feu doux.", "<strong>Salez avec modération<\/strong> : les haricots en conserve sont souvent déjà salés. Goûtez avant d'ajouter du sel.", "<strong>Le vinaigre pendant la cuisson<\/strong> : en s'évaporant en partie, il perd son acidité agressive et parfume les haricots. Commencez par 1 cuillère à soupe et ajoutez-en selon votre goût.", "<strong>Ne remuez pas sans arrêt<\/strong> : laissez les haricots en contact avec la poêle pour qu'ils colorent un peu, c'est ce qui leur donne du goût."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À l'ail frais<\/strong> : remplacez l'ail en poudre par 4 gousses d'ail hachées, ajoutées 2 minutes avant la fin de la cuisson.", "<strong>En persillade<\/strong> : ajoutez une poignée de persil haché en même temps que l'ail.", "<strong>Avec des oignons<\/strong> : faites revenir un oignon émincé dans l'huile avant d'ajouter les haricots.", "<strong>Avec des lardons<\/strong> : faites dorer 200 g de lardons dans la poêle, puis ajoutez les haricots dans la graisse rendue (et réduisez l'huile).", "<strong>Haricots verts frais<\/strong> : faites-les cuire 8 à 10 minutes dans l'eau bouillante salée, égouttez-les, puis suivez la recette à partir de l'étape 3."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Poulet pané, poisson pané, colombo de poulet, poulet au coco, steak, côtes de porc, avec du riz blanc ou des pommes de terre sautées."}]}]}], "steps": [{"label": "", "title": "Égoutter", "body": "Versez les haricots verts dans une passoire, rincez-les rapidement à l'eau froide pour retirer le goût de conserve, puis égouttez-les bien."}, {"label": "", "title": "Sécher", "body": "Étalez-les sur un torchon propre ou du papier absorbant et tapotez-les pour retirer un maximum d'eau. Plus ils sont secs, mieux ils dorent."}, {"label": "", "title": "Faire revenir", "body": "Faites chauffer l'huile dans une grande poêle à feu <strong>moyen-vif<\/strong>. Ajoutez les haricots et faites-les sauter <strong>2 à 3 minutes<\/strong> en remuant de temps en temps."}, {"label": "", "title": "Ajouter le vinaigre", "body": "Versez le vinaigre blanc dans la poêle, mélangez et poursuivez la cuisson <strong>1 minute<\/strong>, le temps qu'il s'évapore en partie."}, {"label": "", "title": "Ajouter l'ail", "body": "Baissez le feu, saupoudrez l'ail en poudre, salez légèrement et poivrez. Mélangez et laissez cuire <strong>1 minute<\/strong>, sans plus. Au total, la cuisson dure <strong>4 à 5 minutes<\/strong>."}, {"label": "", "title": "Goûter et servir", "body": "Rectifiez l'assaisonnement et servez aussitôt."}], "categorySlug": "accompagnements"}, {"slug": "lentilles", "name": "Lentilles mijotées", "nameHtml": "Lentilles mijotées", "subtitle": "6 à 8 personnes", "emoji": "🫘", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de lentilles vertes (du Puy ou blondes)", "2 oignons", "2 carottes", "4 gousses d'ail", "1 bouquet garni (thym, laurier, persil)", "3 cuillères à soupe d'huile (ou 30 g de beurre)", "1,5 litre d'eau (ou de bouillon de légumes)", "Sel fin", "Poivre du moulin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Trier et rincer<\/strong> : étalez les lentilles sur une assiette pour retirer les éventuels petits cailloux, puis rincez-les à l'eau froide dans une passoire.", "<strong>Préparer les légumes<\/strong> : épluchez et émincez finement les oignons. Épluchez les carottes et coupez-les en petits dés ou en rondelles fines. Épluchez et écrasez les gousses d'ail.", "<strong>Faire revenir<\/strong> : faites chauffer l'huile dans une grande casserole à feu moyen. Ajoutez les oignons et faites-les revenir <strong>5 minutes<\/strong> jusqu'à ce qu'ils soient translucides. Ajoutez les carottes et l'ail, et laissez cuire encore <strong>2 minutes<\/strong> en remuant.", "<strong>Ajouter les lentilles<\/strong> : versez les lentilles, mélangez pour bien les enrober, puis couvrez avec l'eau froide. Ajoutez le bouquet garni.", "<strong>Cuire<\/strong> : portez à ébullition, puis baissez le feu et laissez mijoter à couvert <strong>25 à 30 minutes<\/strong> à petits frémissements, en remuant de temps en temps. Ajoutez un peu d'eau si elles deviennent trop sèches.", "<strong>Saler en fin de cuisson<\/strong> : quand les lentilles sont tendres mais encore entières, salez, poivrez et laissez cuire encore <strong>5 minutes<\/strong> à découvert pour réduire le liquide restant.", "<strong>Servir<\/strong> : retirez le bouquet garni, goûtez, rectifiez l'assaisonnement et servez chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pas besoin de trempage<\/strong> pour les lentilles vertes ou blondes, contrairement aux haricots secs.", "<strong>Salez toujours en fin de cuisson<\/strong> : le sel au début durcit la peau des lentilles et allonge la cuisson.", "<strong>Départ à l'eau froide<\/strong> : les lentilles cuisent plus régulièrement et se tiennent mieux.", "<strong>Petits frémissements<\/strong> : un bouillonnement trop fort fait éclater les lentilles, qui deviennent de la purée.", "<strong>Un filet de vinaigre<\/strong> au moment de servir réveille le goût des lentilles.", "<strong>Conservation<\/strong> : elles se gardent 3 jours au réfrigérateur et sont encore meilleures réchauffées. Elles se congèlent très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la créole<\/strong> : remplacez le bouquet garni par du thym, 2 cives émincées et un piment végétarien (ou un piment entier non percé pour parfumer sans piquer), et ajoutez 2 tomates coupées en dés avec les carottes.", "<strong>Au lard<\/strong> : faites dorer 200 g de lardons ou de lard fumé avant les oignons, ou ajoutez une saucisse fumée coupée en rondelles pour les 15 dernières minutes de cuisson.", "<strong>Au lait de coco<\/strong> : remplacez 400 ml d'eau par une boîte de lait de coco et ajoutez 2 cuillères à café de curry ou de poudre à colombo avec les oignons.", "<strong>En salade<\/strong> : faites cuire les lentilles à l'eau avec le bouquet garni seulement, égouttez-les, puis assaisonnez-les tièdes d'une vinaigrette moutardée, d'échalote et de persil hachés.", "<strong>Lentilles corail<\/strong> : elles cuisent en <strong>15 minutes<\/strong> et se transforment en purée, idéale pour un dahl."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, saucisses, petit salé, poulet au coco, colombo de poulet, poisson grillé, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Trier et rincer", "body": "Étalez les lentilles sur une assiette pour retirer les éventuels petits cailloux, puis rincez-les à l'eau froide dans une passoire."}, {"label": "", "title": "Préparer les légumes", "body": "Épluchez et émincez finement les oignons. Épluchez les carottes et coupez-les en petits dés ou en rondelles fines. Épluchez et écrasez les gousses d'ail."}, {"label": "", "title": "Faire revenir", "body": "Faites chauffer l'huile dans une grande casserole à feu moyen. Ajoutez les oignons et faites-les revenir <strong>5 minutes<\/strong> jusqu'à ce qu'ils soient translucides. Ajoutez les carottes et l'ail, et laissez cuire encore <strong>2 minutes<\/strong> en remuant."}, {"label": "", "title": "Ajouter les lentilles", "body": "Versez les lentilles, mélangez pour bien les enrober, puis couvrez avec l'eau froide. Ajoutez le bouquet garni."}, {"label": "", "title": "Cuire", "body": "Portez à ébullition, puis baissez le feu et laissez mijoter à couvert <strong>25 à 30 minutes<\/strong> à petits frémissements, en remuant de temps en temps. Ajoutez un peu d'eau si elles deviennent trop sèches."}, {"label": "", "title": "Saler en fin de cuisson", "body": "Quand les lentilles sont tendres mais encore entières, salez, poivrez et laissez cuire encore <strong>5 minutes<\/strong> à découvert pour réduire le liquide restant."}, {"label": "", "title": "Servir", "body": "Retirez le bouquet garni, goûtez, rectifiez l'assaisonnement et servez chaud."}], "categorySlug": "accompagnements"}, {"slug": "pain-au-beurre", "name": "Pain au beurre antillais", "nameHtml": "Pain au beurre antillais", "subtitle": "4 pains moyens", "emoji": "🌴", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45)", "4 œufs, à température ambiante", "35 cl de lait tiède (ou moitié lait, moitié lait concentré non sucré)", "250 g de beurre doux mou, coupé en dés", "200 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "15 g de sel", "2 cuillères à café d'extrait de vanille (ou les graines d'une gousse)", "1 cuillère à café de cannelle en poudre", "½ noix de muscade râpée", "Le zeste de 2 citrons verts", "Facultatif : 2 cuillères à soupe de rhum blanc"]}]}, {"title": "Façonnage et dorure", "blocks": [{"t": "ul", "items": ["100 g de beurre doux bien mou", "1 jaune d'œuf + 2 cuillères à soupe de lait (ou de lait concentré sucré, pour une croûte plus brillante)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait.", "<strong>Le pétrissage<\/strong> : pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique.", "<strong>Le beurre<\/strong> : ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois.", "<strong>Première pousse<\/strong> : formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Diviser<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon.", "<strong>Le façonnage<\/strong> : étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus.", "<strong>Deuxième pousse<\/strong> : déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir sur une grille avant de servir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pliage avec le beurre<\/strong> est ce qui fait le pain au beurre : il s'ouvre légèrement à la cuisson et donne une mie feuilletée et fondante au centre.", "<strong>Le citron vert, la muscade et la vanille<\/strong> donnent le parfum typique des Antilles et de la Guyane : n'hésitez pas à ajuster les épices à votre goût.", "<strong>La pâte est un peu collante<\/strong> : résistez à l'envie d'ajouter de la farine, elle deviendra lisse avec le pétrissage et l'ajout du beurre.", "<strong>Pour gagner du temps le matin<\/strong>, laissez la première pousse se faire au réfrigérateur pendant la nuit. Sortez la pâte 1 heure avant de la façonner.", "<strong>Le pain au beurre se conserve<\/strong> 2 à 3 jours dans un sac en tissu ou emballé, et se congèle très bien. Réchauffez-le quelques minutes au four."]}]}]}, {"title": "Comment le déguster", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Avec un chocolat chaud antillais<\/strong> (chocolat de communion), épais et parfumé à la cannelle, à la muscade et au zeste de citron vert : c'est le duo traditionnel des communions, baptêmes, mariages, de Pâques et de Noël.", "<strong>Au petit-déjeuner<\/strong>, nature, tartiné de beurre salé ou de confiture de goyave.", "<strong>En pain perdu<\/strong>, quand il a un ou deux jours."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique."}, {"label": "", "title": "Le beurre", "body": "Ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Diviser", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon."}, {"label": "", "title": "Le façonnage", "body": "Étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus."}, {"label": "", "title": "Deuxième pousse", "body": "Déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir sur une grille avant de servir."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pain", "name": "Pain maison", "nameHtml": "Pain maison", "subtitle": "2 gros pains ou 4 baguettes", "emoji": "🥖", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T65, dite « farine à pain »)", "65 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "20 g de sel"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène.", "<strong>Le pétrissage<\/strong> : pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts.", "<strong>Première pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four.", "<strong>Grigner<\/strong> : juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé.", "<strong>La cuisson<\/strong> : enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée.", "<strong>Refroidir<\/strong> : laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain est cuit<\/strong> quand il sonne creux lorsqu'on tapote sous sa base.", "<strong>La vapeur<\/strong> au début de la cuisson permet au pain de bien gonfler et donne une croûte croustillante et brillante.", "<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : mélangez-le d'abord à la farine.", "<strong>Pour un pain plus savoureux, à la mie plus alvéolée<\/strong>, faites la première pousse au réfrigérateur pendant 12 à 24 heures, puis laissez la pâte revenir 1 heure à température ambiante avant de la façonner.", "<strong>Le pain se congèle très bien<\/strong> : emballez-le une fois complètement refroidi et réchauffez-le 10 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pain complet<\/strong> : remplacez la moitié de la farine T65 par de la farine complète (T150) et ajoutez 5 cl d'eau.", "<strong>Pain aux céréales<\/strong> : ajoutez 150 g de graines (tournesol, lin, sésame, courge) au moment du mélange.", "<strong>Pain aux noix<\/strong> : ajoutez 200 g de cerneaux de noix concassés à la fin du pétrissage.", "<strong>Pain aux olives<\/strong> : ajoutez 200 g d'olives dénoyautées et coupées en morceaux à la fin du pétrissage."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four."}, {"label": "", "title": "Grigner", "body": "Juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé."}, {"label": "", "title": "La cuisson", "body": "Enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée."}, {"label": "", "title": "Refroidir", "body": "Laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pain-perdu", "name": "Pain perdu", "nameHtml": "Pain perdu", "subtitle": "6 à 8 personnes", "emoji": "🍞", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["12 tranches épaisses (2 cm) de pain rassis, de brioche ou de pain de mie", "4 œufs", "50 cl de lait entier", "80 g de sucre (et un peu plus pour caraméliser)", "1 sachet de sucre vanillé (ou 1 cuillère à café d'extrait de vanille)", "1 pincée de cannelle (facultatif)", "1 pincée de sel", "60 g de beurre (pour la cuisson)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préparer le mélange<\/strong> : dans un grand plat creux, fouettez les œufs avec le sucre, le sucre vanillé, la cannelle et le sel, puis ajoutez le lait et mélangez bien.", "<strong>Tremper le pain<\/strong> : plongez les tranches dans le mélange <strong>quelques secondes de chaque côté<\/strong> pour le pain de mie ou la brioche, et <strong>30 secondes à 1 minute<\/strong> pour le pain rassis, jusqu'à ce qu'elles soient bien imbibées sans tomber en morceaux. Laissez-les égoutter sur une grille.", "<strong>Chauffer la poêle<\/strong> : faites fondre une noix de beurre dans une grande poêle à feu <strong>moyen<\/strong>.", "<strong>Cuire<\/strong> : déposez quelques tranches dans la poêle et faites-les dorer <strong>2 à 3 minutes de chaque côté<\/strong>. Ajoutez un peu de beurre à chaque nouvelle fournée.", "<strong>Caraméliser<\/strong> : en fin de cuisson, saupoudrez chaque face d'un peu de sucre et laissez-le caraméliser <strong>30 secondes<\/strong> de chaque côté.", "<strong>Servir<\/strong> : servez aussitôt, bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain rassis est idéal<\/strong> : sec, il absorbe le mélange sans se défaire. Du pain frais devient spongieux.", "<strong>Ne faites pas tremper trop longtemps<\/strong> la brioche et le pain de mie : ils sont fragiles et se cassent.", "<strong>Feu moyen, pas fort<\/strong> : le beurre ne doit pas brûler, et l'intérieur doit avoir le temps de cuire, comme un flan.", "<strong>Pour garder au chaud<\/strong> les premières tranches, posez-les sur une plaque dans le four à <strong>100 °C<\/strong>.", "<strong>La brioche rassise<\/strong> (voir la recette de brioche) donne le pain perdu le plus moelleux."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la créole<\/strong> : remplacez une partie du lait par du lait de coco, ajoutez du zeste de citron vert et un trait de rhum vieux dans le mélange.", "<strong>Au four<\/strong> : rangez les tranches imbibées dans un plat beurré, versez le reste du mélange par-dessus, parsemez de sucre et faites cuire <strong>25 à 30 minutes à 180 °C<\/strong>.", "<strong>Salé<\/strong> : supprimez le sucre et la vanille, ajoutez sel, poivre et muscade, puis servez avec du jambon et du fromage fondu."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sirop d'érable, miel, confiture, chantilly, boule de glace à la vanille, fruits frais (fraises, bananes poêlées, mangue), ou crème pâtissière."}]}]}], "steps": [{"label": "", "title": "Préparer le mélange", "body": "Dans un grand plat creux, fouettez les œufs avec le sucre, le sucre vanillé, la cannelle et le sel, puis ajoutez le lait et mélangez bien."}, {"label": "", "title": "Tremper le pain", "body": "Plongez les tranches dans le mélange <strong>quelques secondes de chaque côté<\/strong> pour le pain de mie ou la brioche, et <strong>30 secondes à 1 minute<\/strong> pour le pain rassis, jusqu'à ce qu'elles soient bien imbibées sans tomber en morceaux. Laissez-les égoutter sur une grille."}, {"label": "", "title": "Chauffer la poêle", "body": "Faites fondre une noix de beurre dans une grande poêle à feu <strong>moyen<\/strong>."}, {"label": "", "title": "Cuire", "body": "Déposez quelques tranches dans la poêle et faites-les dorer <strong>2 à 3 minutes de chaque côté<\/strong>. Ajoutez un peu de beurre à chaque nouvelle fournée."}, {"label": "", "title": "Caraméliser", "body": "En fin de cuisson, saupoudrez chaque face d'un peu de sucre et laissez-le caraméliser <strong>30 secondes<\/strong> de chaque côté."}, {"label": "", "title": "Servir", "body": "Servez aussitôt, bien chaud."}], "categorySlug": "desserts"}, {"slug": "pain-au-chocolat", "name": "Pains au chocolat", "nameHtml": "Pains au chocolat", "subtitle": "environ 24 pains au chocolat", "emoji": "🍫", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["1 kg de farine T45 (ou farine de gruau)", "30 cl de lait entier froid", "30 cl d'eau froide", "120 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "20 g de sel", "100 g de beurre mou"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["560 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}, {"title": "Garniture et dorure", "blocks": [{"t": "ul", "items": ["48 bâtons de chocolat spécial boulanger (2 par pain au chocolat)", "2 œufs + 2 cuillères à soupe de lait"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique.", "<strong>Le repos au froid<\/strong> : divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>.", "<strong>Préparer le beurre<\/strong> : coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords.", "<strong>Le tour double<\/strong> : étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le tour simple<\/strong> : tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton.", "<strong>Étaler<\/strong> : étalez chaque pâton en un rectangle d'environ <strong>30 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid.", "<strong>Découper<\/strong> : coupez la pâte en deux bandes de 15 cm de large, puis chaque bande en rectangles de <strong>8 cm<\/strong> de large.", "<strong>Façonner<\/strong> : posez un bâton de chocolat à 1 cm du bord d'un rectangle, rabattez la pâte par-dessus, posez le second bâton contre le pli et roulez jusqu'au bout. La fin de la pâte doit se retrouver <strong>en dessous<\/strong>. Déposez les pains au chocolat sur des plaques recouvertes de papier cuisson, bien espacés.", "<strong>La pousse<\/strong> : mélangez les œufs et le lait, et badigeonnez une première fois les pains au chocolat au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maxi es tranches de 2 cm.", "<strong>Chocolat au lait ou pralinoise<\/strong> : remplacez les bâtons de chocolat noir par du chocolat au lait ou des bâtons de pralinoise."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique."}, {"label": "", "title": "Le repos au froid", "body": "Divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>."}, {"label": "", "title": "Préparer le beurre", "body": "Coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords."}, {"label": "", "title": "Le tour double", "body": "Étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le tour simple", "body": "Tournez la pâte d'un quart de tour, étalez-la à nouveau en un long r un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts."}, {"label": "", "title": "La pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm."}, {"label": "", "title": "La garniture", "body": "Déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la."}, {"label": "", "title": "La cuisson", "body": "Enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."}], "categorySlug": "bases"}, {"slug": "pate-brisee", "name": "Pâte brisée", "nameHtml": "Pâte brisée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🥧", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "10 à 12 cl d'eau très froide", "2 pincées de sel", "Facultatif : 2 jaunes d'œufs (pour une pâte plus riche et plus facile à travailler ; réduisez alors l'eau à 6 à 8 cl)", "Facultatif, pour une tarte sucrée : 2 cuillères à soupe de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles.", "<strong>Ajouter l'eau<\/strong> : creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, pu  bouquet de persil (ou de coriandre)", "4 cuillères à soupe d'huile", "Facultatif : 50 g de noix de coco râpée, dorée à sec à la poêle, pour le service"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc, et éventuellement des bananes plantains frites"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poulet<\/strong> : frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : râpez le gingembre et écrasez l'ail. Mélangez-les avec le jus d'un citron vert, du sel et du poivre, enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 1 heure<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Préparer les légumes<\/strong> : émincez les oignons et les cives, coupez les poivrons en lanières et les tomates en dés.", "<strong>Faire dorer le poulet<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les.", "<strong>Les aromates<\/strong> : dans la même cocotte, faites revenir les oignons, les cives et les poivrons 5 minutes. Ajoutez les tomates et le curcuma et laissez compoter <strong>5 minutes<\/strong> en remuant.", "<strong>Le lait de coco<\/strong> : remettez le poulet et sa marinade dans la cocotte. Versez le lait de coco, ajoutez le thym et le piment <strong>entier<\/strong>, sans le percer. Mélangez et portez juste à frémissement.", "<strong>Mijoter<\/strong> : couvrez et laissez mijoter <strong>40 à 45 minutes<\/strong> à feu doux, en remuant de temps en temps. Le lait de coco ne doit pas bouillir fort, sinon il tranche.", "<strong>Réduire la sauce<\/strong> : retirez le couvercle et laissez réduire <strong>10 minutes<\/strong>, jusqu'à ce que la sauce soit onctueuse et nappe la cuillère. Retirez le piment et le thym.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc, parsemé de noix de coco râpée dorée si vous le souhaitez."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez un lait de coco riche<\/strong> (au moins 15 % de matière grasse, sans épaississant) : la sauce sera plus onctueuse et ne tranchera pas.", "<strong>Le piment entier<\/strong> parfume la sauce sans la rendre trop forte ; s'il éclate, le plat devient très piquant. Pour plus de piquant, percez-le légèrement, ou hachez-en un morceau.", "<strong>La sauce a tranché ?<\/strong> Hors du feu, ajoutez 2 ou 3 cuillères à soupe de lait de coco froid et fouettez vivement.", "<strong>Le citron vert à la fin<\/strong> équilibre la richesse du coco : ne le supprimez pas.", "<strong>Le poulet au coco se réchauffe très bien<\/strong> le lendemain, à feu doux, avec un peu d'eau si la sauce a trop épaissi."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Crevettes au coco<\/strong> : faites la sauce de la même façon, laissez-la mijoter 15 minutes seule, puis ajoutez 2 kg de crevettes décortiquées pour les 5 dernières minutes.", "<strong>Poisson au coco<\/strong> : ajoutez 2 kg de filets de poisson ferme (acoupa, mérou, vivaneau) en gros morceaux pour les 10 dernières minutes.", "<strong>Avec des légumes<\/strong> : ajoutez 1 kg de patates douces ou de giraumon en cubes en même temps que le lait de coco.", "<strong>Plus épicé<\/strong> : ajoutez 1 cuillère à café de cumin et 1 de coriandre moulue avec le curcuma."]}]}]}], "steps": [{"label": "", "title": "Nettoyer le poulet", "body": "Frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Râpez le gingembre et écrasez l'ail. Mélangez-les avec le jus d'un citron vert, du sel et du poivre, enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 1 heure<\/strong> au réfrigérateur, idéalement une nuit."}, {"label": "", "title": "Préparer les légumes", "body": "Émincez les oignons et les cives, coupez les poivrons en lanières et les tomates en dés."}, {"label": "", "title": "Faire dorer le poulet", "body": "Dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les."}, {"label": "", "title": "Les aromates", "body": "Dans la même cocotte, faites revenir les oignons, les cives et les poivrons 5 minutes. Ajoutez les tomates et le curcuma et laissez compoter <strong>5 minutes<\/strong> en remuant."}, {"label": "", "title": "Le lait de coco", "body": "Remettez le poulet et sa marinade dans la cocotte. Versez le lait de coco, ajoutez le thym et le piment <strong>entier<\/strong>, sans le percer. Mélangez et portez juste à frémissement."}, {"label": "", "title": "Mijoter", "body": "Couvrez et laissez mijoter <strong>40 à 45 minutes<\/strong> à feu doux, en remuant de temps en temps. Le lait de coco ne doit pas bouillir fort, sinon il tranche."}, {"label": "", "title": "Réduire la sauce", "body": "Retirez le couvercle et laissez réduire <strong>10 minutes<\/strong>, jusqu'à ce que la sauce soit onctueuse et nappe la cuillère. Retirez le piment et le thym."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez bien chaud avec du riz blanc, parsemé de noix de coco râpée dorée si vous le souhaitez."}], "categorySlug": "plats"}, {"slug": "poulet-pane", "name": "Poulet pané", "nameHtml": "Poulet pané", "subtitle": "8 personnes", "emoji": "🍗", "category": "Plat rong> au réfrigérateur.", "<strong>La cuisson<\/strong> : dans une grande poêle, faites chauffer 1 cm d'huile avec un morceau de beurre à <strong>feu moyen<\/strong>. Faites dorer les escalopes <strong>4 à 5 minutes de chaque côté<\/strong>, en plusieurs fois, jusqu'à ce que la panure soit bien dorée et que le poulet soit cuit à cœur.", "<strong>Égoutter<\/strong> : déposez-les sur du papier absorbant et salez légèrement. Gardez-les au chaud dans le four à 100 °C pendant que vous faites cuire le reste.", "<strong>Servir<\/strong> : servez aussitôt avec des quartiers de citron, des frites, une salade ou du riz."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La marinade au lait<\/strong> attendrit le poulet et le garde bien juteux à la cuisson.", "<strong>Des escalopes d'épaisseur régulière<\/strong> cuisent uniformément : la panure ne brûle pas avant que le centre soit cuit.", "<strong>Le poulet est cuit<\/strong> quand son jus est clair lorsqu'on le pique au centre, ou quand il atteint 74 °C à cœur avec un thermomètre.", "<strong>Pour une panure extra-croustillante<\/strong>, faites une double panure : œuf puis chapelure, une deuxième fois.", "<strong>Le poulet pané se garde<\/strong> 2 jours au réfrigérateur : réchauffez-le 10 minutes au four à 180 °C pour qu'il redevienne croustillant (pas au micro-ondes)."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : déposez les escalopes panées sur une plaque recouverte de papier cuisson, arrosez-les d'un filet d'huile et faites cuire <strong>20 à 25 minutes à 200 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>Nuggets<\/strong> : coupez le poulet en morceaux de 3 cm avant de le paner, et faites-les cuire 2 à 3 minutes de chaque côté.", "<strong>Aux corn-flakes<\/strong> : remplacez la chapelure par 300 g de corn-flakes nature écrasés grossièrement, pour une panure très croustillante.", "<stron Égoutter", "body": "Déposez-les sur du papier absorbant et salez légèrement. Gardez-les au chaud dans le four à 100 °C pendant que vous faites cuire le reste."}, {"label": "", "title": "Servir", "body": "Servez aussitôt avec des quartiers de citron, des frites, une salade ou du riz."}], "categorySlug": "plats"}, {"slug": "poulet-roti", "name": "Poulet rôti", "nameHtml": "Poulet rôti", "subtitle": "8 à 10 personnes", "emoji": "🐔", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 poulets fermiers d'environ 1,5 kg chacun", "100 g de beurre mou", "2 citrons", "2 têtes d'ail", "1 bouquet de thym (ou 4 cuillères à café de thym séché)", "4 feuilles de laurier", "4 oignons", "2 cuillères à soupe d'huile", "20 cl d'eau (ou de bouillon de volaille)", "Sel fin", "Poivre du moulin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sortir les poulets<\/strong> : sortez les poulets du réfrigérateur <strong>1 heure avant<\/strong> la cuisson pour qu'ils soient à température ambiante.", "<strong>Préchauffer<\/strong> : préchauffez le four à <strong>210 °C<\/strong> (chaleur traditionnelle).", "<strong>Préparer la garniture<\/strong> : coupez les citrons en quatre. Coupez les têtes d'ail en deux dans l'épaisseur, sans les éplucher. Épluchez les oignons et coupez-les en quartiers.", "<strong>Garnir l'intérieur<\/strong> : salez et poivrez l'intérieur des poulets, puis glissez dans chacun la moitié des citrons, une demi-tête d'ail, quelques branches de thym et 2 feuilles de laurier.", "<strong>Beurrer<\/strong> : séchez la peau avec du papier absorbant, puis badigeonnez généreusement les poulets de beurre mou sur toute leur surface. Salez et poivrez bien l'extérieur.", "<strong>Dresser le plat<\/strong> : répartissez les oignons, le reste de l'ail et du thym dans un grand plat allant au four (ou deux plats). Posez les poulets dessus, <strong>sur le côté<\/strong> (une cuisse vers le haut), et arrosez avec l'huile.", "<strong>Cuire<\/strong> : enfournez pour <strong>1 heure 15 à 1 heure 30<\/strong> au total. Au bout de <strong>25 minutes<\/strong>, retournez les poulets sur l'autre côté ; au bout de <strong>50 minutes<\/strong>, mettez-les sur le dos. Arrosez-les avec le jus du plat <strong>toutes les 15 minutes<\/strong>. Si le plat sèche, ajoutez un peu d'eau.", "<strong>Vérifier la cuisson<\/strong> : piquez la cuisse au niveau de l'articulation : le jus qui s'écoule doit être <strong>clair, sans trace rosée<\/strong>. Avec un thermomètre, comptez <strong>75 °C<\/strong> à cœur, au plus épais de la cuisse.", "<strong>Reposer<\/strong> : sortez les poulets, posez-les sur une planche, couvrez-les de papier aluminium et laissez-les reposer <strong>15 minutes<\/strong>.", "<strong>Faire le jus<\/strong> : pendant le repos, posez le plat sur feu moyen, versez l'eau et grattez les sucs du fond avec une spatule. Écrasez quelques gousses d'ail confites dans le jus, laissez réduire <strong>3 à 4 minutes<\/strong> et filtrez.", "<strong>Découper et servir<\/strong> : découpez les poulets et servez-les avec le jus chaud et les oignons fondants."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Une peau bien sèche<\/strong> avant de beurrer donne une peau plus croustillante.", "<strong>Commencer sur le côté<\/strong> puis retourner protège les blancs, qui cuisent plus vite que les cuisses et restent ainsi moelleux.", "<strong>Arroser souvent<\/strong> est la clé d'une chair juteuse et d'une peau dorée.", "<strong>Le repos est indispensable<\/strong> : les jus se répartissent dans la chair au lieu de couler sur la planche.", "<strong>Temps de cuisson<\/strong> : comptez environ <strong>45 à 50 minutes par kilo<\/strong> pour un poulet pesé seul (les deux poulets cuisent en même temps, il ne faut pas additionner leurs poids).", "<strong>Les restes<\/strong> se gardent 3 jours au réfrigérateur : en salade, en sandwich, dans un wrap ou effilochés dans un riz."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Aux pommes de terre<\/strong> : ajoutez dans le plat 1,5 kg de grenailles ou de pommes de terre coupées en morceaux, mélangées avec un peu d'huile, du sel et du thym, en même temps que les poulets.", "<strong>À la créole<\/strong> : la veille, faites mariner les poulets avec du jus de citron vert, de l'ail écrasé, des cives, du thym, du piment et du bois d'Inde, puis faites-les rôtir comme ci-dessus.", "<strong>Aux herbes<\/strong> : mélangez le beurre mou avec de l'ail haché, du persil et de l'estragon, et glissez-en une partie <strong>sous la peau<\/strong> des blancs.", "<strong>Au paprika<\/strong> : mélangez le beurre avec 2 cuillères à café de paprika fumé et 1 cuillère à café de cumin."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Gratin dauphinois, frites maison, purée de pommes de terre, riz blanc, haricots verts à l'ail, lentilles mijotées, avec une salade verte."}]}]}], "steps": [{"label": "", "title": "Sortir les poulets", "body": "Sortez les poulets du réfrigérateur <strong>1 heure avant<\/strong> la cuisson pour qu'ils soient à température ambiante."}, {"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>210 °C<\/strong> (chaleur traditionnelle)."}, {"label": "", "title": "Préparer la garniture", "body": "Coupez les citrons en quatre. Coupez les têtes d'ail en deux dans l'épaisseur, sans les éplucher. Épluchez les oignons et coupez-les en quartiers."}, {"label": "", "title": "Garnir l'intérieur", "body": "Salez et poivrez l'intérieur des poulets, puis glissez dans chacun la moitié des citrons, une demi-tête d'ail, quelques branches de thym et 2 feuilles de laurier."}, {"label": "", "title": "Beurrer", "body": "Séchez la peau avec du papier absorbant, puis badigeonnez généreusement les poulets de beurre mou sur toute leur surface. Salez et poivrez bien l'extérieur."}, {"label": "", "title": "Dresser le plat", "body": "Répartissez les oignons, le reste de l'ail et du thym dans un grand plat allant au four (ou deux plats). Posez les poulets dessus, <strong>sur le côté<\/strong> (une cuisse vers le haut), et arrosez avec l'huile."}, {"label": "", "title": "Cuire", "body": "Enfournez pour <strong>1 heure 15 à 1 heure 30<\/strong> au total. Au bout de <strong>25 minutes<\/strong>, retournez les poulets sur l'autre côté ; au bout de <strong>50 minutes<\/strong>, mettez-les sur le dos. Arrosez-les avec le jus du plat <strong>toutes les 15 minutes<\/strong>. Si le plat sèche, ajoutez un peu d'eau."}, {"label": "", "title": "Vérifier la cuisson", "body": "Piquez la cuisse au niveau de l'articulation : le jus qui s'écoule doit être <strong>clair, sans trace rosée<\/strong>. Avec un thermomètre, comptez <strong>75 °C<\/strong> à cœur, au plus épais de la cuisse."}, {"label": "", "title": "Reposer", "body": "Sortez les poulets, posez-les sur une planche, couvrez-les de papier aluminium et laissez-les reposer <strong>15 minutes<\/strong>."}, {"label": "", "title": "Faire le jus", "body": "Pendant le repos, posez le plat sur feu moyen, versez l'eau et grattez les sucs du fond avec une spatule. Écrasez quelques gousses d'ail confites dans le jus, laissez réduire <strong>3 à 4 minutes<\/strong> et filtrez."}, {"label": "", "title": "Découper et servir", "body": "Découpez les poulets et servez-les avec le jus chaud et les oignons fondants."}], "categorySlug": "plats"}, {"slug": "puree", "name": "Purée de pommes de terre", "nameHtml": "Purée de pommes de terre", "subtitle": "6 à 8 personnes", "emoji": "🥔", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair farineuse (Bintje, Agria ou Mona Lisa)", "200 g de beurre, coupé en morceaux", "50 cl de lait entier", "2 cuillères à soupe de gros sel (pour l'eau de cuisson)", "Sel fin", "Poivre du moulin (blanc de préférence)", "1 pincée de noix de muscade râpée"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher et couper<\/strong> : épluchez les pommes de terre, rincez-les et coupez-les en morceaux de <strong>taille égale<\/strong> (environ 4 cm) pour qu'ils cuisent en même temps.", "<strong>Départ à l'eau froide<\/strong> : mettez les morceaux dans une grande casserole, couvrez-les largement d'eau froide et ajoutez le gros sel.", "<strong>Cuire<\/strong> : portez à ébullition, puis laissez cuire à petits bouillons <strong>20 à 25 minutes<\/strong>. Les pommes de terre sont cuites quand la pointe d'un couteau s'y enfonce sans résistance.", "<strong>Chauffer le lait<\/strong> : pendant ce temps, faites chauffer le lait dans une petite casserole, <strong>sans le faire bouillir<\/strong>.", "<strong>Égoutter et sécher<\/strong> : égouttez les pommes de terre, remettez-les dans la casserole chaude et laissez-les sécher <strong>1 à 2 minutes<\/strong> à feu doux en secouant la casserole, pour évaporer l'eau restante.", "<strong>Écraser<\/strong> : passez les pommes de terre au <strong>presse-purée<\/strong> ou au moulin à légumes, ou écrasez-les au pilon.", "<strong>Ajouter le beurre<\/strong> : incorporez le beurre morceau par morceau, en mélangeant à la spatule jusqu'à ce qu'il soit fondu.", "<strong>Ajouter le lait<\/strong> : versez le lait chaud petit à petit, en mélangeant vivement, jusqu'à obtenir la texture souhaitée.", "<strong>Assaisonner<\/strong> : salez, poivrez, ajoutez la muscade, goûtez et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Jamais de mixeur ni de robot<\/strong> : les lames cassent l'amidon et la purée devient collante et élastique. Utilisez un presse-purée, un moulin à légumes ou un pilon.", "<strong>Le lait doit être chaud<\/strong> : du lait froid refroidit la purée et l'alourdit.", "<strong>Le beurre avant le lait<\/strong> : il enrobe l'amidon et donne une purée plus onctueuse.", "<strong>Dosez le lait selon vos goûts<\/strong> : moins pour une purée ferme, un peu plus pour une purée souple. Vous n'aurez pas forcément besoin de tout.", "<strong>Pour la garder au chaud<\/strong>, couvrez-la et posez la casserole au bain-marie. Pour la réchauffer, ajoutez un peu de lait chaud en mélangeant."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À l'ail<\/strong> : faites cuire 6 gousses d'ail épluchées avec les pommes de terre et écrasez-les ensemble.", "<strong>À la crème<\/strong> : remplacez 20 cl de lait par de la crème fraîche épaisse.", "<strong>Au fromage<\/strong> : incorporez 200 g de fromage râpé (comté, emmental ou cheddar) à la fin, hors du feu.", "<strong>Aux herbes<\/strong> : ajoutez de la ciboulette, des cives ou du persil hachés juste avant de servir.", "<strong>Purée de patate douce<\/strong> : même méthode, avec une cuisson plus courte (<strong>15 minutes<\/strong>) et moins de lait. Délicieuse avec une pointe de muscade et de cannelle.", "<strong>Purée mixte<\/strong> : remplacez la moitié des pommes de terre par des carottes, du potiron ou du céleri-rave."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Poulet pané, poisson pané, saucisses, steak haché, rôti de porc, jambon, poisson en sauce."}]}]}], "steps": [{"label": "", "title": "Éplucher et couper", "body": "Épluchez les pommes de terre, rincez-les et coupez-les en morceaux de <strong>taille égale<\/strong> (environ 4 cm) pour qu'ils cuisent en même temps."}, {"label": "", "title": "Départ à l'eau froide", "body": "Mettez les morceaux dans une grande casserole, couvrez-les largement d'eau froide et ajoutez le gros sel."}, {"label": "", "title": "Cuire", "body": "Portez à ébullition, puis laissez cuire à petits bouillons <strong>20 à 25 minutes<\/strong>. Les pommes de terre sont cuites quand la pointe d'un couteau s'y enfonce sans résistance."}, {"label": "", "title": "Chauffer le lait", "body": "Pendant ce temps, faites chauffer le lait dans une petite casserole, <strong>sans le faire bouillir<\/strong>."}, {"label": "", "title": "Égoutter et sécher", "body": "Égouttez les pommes de terre, remettez-les dans la casserole chaude et laissez-les sécher <strong>1 à 2 minutes<\/strong> à feu doux en secouant la casserole, pour évaporer l'eau restante."}, {"label": "", "title": "Écraser", "body": "Passez les pommes de terre au <strong>presse-purée<\/strong> ou au moulin à légumes, ou écrasez-les au pilon."}, {"label": "", "title": "Ajouter le beurre", "body": "Incorporez le beurre morceau par morceau, en mélangeant à la spatule jusqu'à ce qu'il soit fondu."}, {"label": "", "title": "Ajouter le lait", "body": "Versez le lait chaud petit à petit, en mélangeant vivement, jusqu'à obtenir la texture souhaitée."}, {"label": "", "title": "Assaisonner", "body": "Salez, poivrez, ajoutez la muscade, goûtez et servez bien chaud."}], "categorySlug": "accompagnements"}, {"slug": "quatre-quarts", "name": "Quatre-quarts", "nameHtml": "Quatre-quarts", "subtitle": "2 cakes de 25 cm", "emoji": "🧈", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Le principe : <strong>le même poids<\/strong> d'œufs, de beurre, de sucre et de farine. Pesez d'abord les œufs avec leur coquille, puis ajustez les autres ingrédients sur ce poids (environ 500 g pour 8 œufs)."}, {"t": "ul", "items": ["8 œufs (environ 500 g)", "500 g de beurre demi-sel (ou doux + 2 pincées de sel)", "500 g de sucre", "500 g de farine", "1 sachet de levure chimique", "2 sachets de sucre vanillé", "Facultatif : le zeste de 2 citrons ou d'une orange, ou 2 cuillères à soupe de rhum", "Un peu de beurre et de farine pour les moules"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>170 °C<\/strong>. Beurrez et farinez deux moules à cake de 25 cm (ou recouvrez-les de papier cuisson).", "<strong>Le beurre<\/strong> : faites fondre le beurre à feu doux ou au micro-ondes, puis laissez-le tiédir.", "<strong>Séparer les œufs<\/strong> : mettez les blancs de côté dans un grand bol propre et sec.", "<strong>Blanchir<\/strong> : dans un grand saladier, fouettez les jaunes avec le sucre et le sucre vanillé pendant 3 à 4 minutes, jusqu'à ce que le mélange <strong>blanchisse et devienne mousseux<\/strong>.", "<strong>Le beurre et la farine<\/strong> : incorporez le beurre fondu tiède, puis la farine mélangée à la levure, et le zeste ou le rhum si vous en mettez. Mélangez jusqu'à obtenir une pâte lisse et épaisse.", "<strong>Les blancs en neige<\/strong> : montez les blancs en neige ferme avec une pincée de sel. Incorporez-en d'abord un tiers en mélangeant vivement pour détendre la pâte, puis le reste <strong>délicatement<\/strong> à la spatule, en soulevant la pâte.", "<strong>Remplir les moules<\/strong> : répartissez la pâte dans les deux moules, sans dépasser les deux tiers de leur hauteur.", "<strong>La cuisson<\/strong> : faites cuire <strong>45 à 50 minutes<\/strong>. Le quatre-quarts est cuit quand il est bien doré et que la lame d'un couteau plantée au centre ressort sèche.", "<strong>Démouler<\/strong> : laissez tiédir 10 minutes dans les moules, puis démoulez sur une grille et laissez refroidir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pour une belle fente bien régulière<\/strong> sur le dessus, tracez un trait dans la longueur de la pâte avec un couteau trempé dans du beurre fondu, après 10 minutes de cuisson.", "<strong>Le dessus dore trop vite ?<\/strong> Couvrez le gâteau d'une feuille de papier aluminium pour la fin de la cuisson.", "<strong>Le beurre demi-sel<\/strong> donne le goût du quatre-quarts breton traditionnel.", "<strong>Sans les blancs en neige<\/strong>, la recette marche aussi (on ajoute alors les œufs entiers à l'étape 4), mais le gâteau est plus dense.", "<strong>Le quatre-quarts est encore meilleur le lendemain.<\/strong> Il se conserve une semaine emballé dans du film alimentaire, et se congèle très bien en tranches."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Marbré<\/strong> : séparez la pâte en deux, ajoutez 3 cuillères à soupe de cacao en poudre dans une moitié, puis versez les deux pâtes en alternance dans le moule.", "<strong>Aux pommes caramélisées<\/strong> : faites dorer 3 pommes en dés dans du beurre et du sucre, puis répartissez-les dans la pâte avant la cuisson.", "<strong>Citron<\/strong> : ajoutez le zeste de 3 citrons dans la pâte, puis nappez le gâteau refroidi d'un glaçage (150 g de sucre glace et le jus d'un citron).", "<strong>Pépites de chocolat<\/strong> : ajoutez 200 g de pépites de chocolat, roulées d'abord dans un peu de farine pour qu'elles ne tombent pas au fond."]}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>170 °C<\/strong>. Beurrez et farinez deux moules à cake de 25 cm (ou recouvrez-les de papier cuisson)."}, {"label": "", "title": "Le beurre", "body": "Faites fondre le beurre à feu doux ou au micro-ondes, puis laissez-le tiédir."}, {"label": "", "title": "Séparer les œufs", "body": "Mettez les blancs de côté dans un grand bol propre et sec."}, {"label": "", "title": "Blanchir", "body": "Dans un grand saladier, fouettez les jaunes avec le sucre et le sucre vanillé pendant 3 à 4 minutes, jusqu'à ce que le mélange <strong>blanchisse et devienne mousseux<\/strong>."}, {"label": "", "title": "Le beurre et la farine", "body": "Incorporez le beurre fondu tiède, puis la farine mélangée à la levure, et le zeste ou le rhum si vous en mettez. Mélangez jusqu'à obtenir une pâte lisse et é
