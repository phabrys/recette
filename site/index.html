<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes recettes</title>
<style>
  :root {
    --bg: #17120f;
    --surface: #241c17;
    --surface-2: #30261f;
    --text: #f5ece3;
    --muted: #bba999;
    --accent: #f4a259;
    --accent-ink: #1d130b;
    --line: #42352b;
    --gutter-x: 4vw;
    --gutter-y: 3vh;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; font-size: clamp(14px, 1.6vw, 48px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  strong { color: #ffd2a6; }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button, a { font: inherit; color: inherit; }

  /* En-tête commun */
  .top {
    display: flex; align-items: center; gap: 1.5rem;
    padding: var(--gutter-y) var(--gutter-x) 1.2rem;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 2.2rem; font-weight: 750; }
  .top .sub { color: var(--muted); font-size: 1.1rem; margin: .2rem 0 0; }
  .hint { color: var(--muted); font-size: .95rem; }

  .btn {
    background: var(--surface-2); border: 0.15rem solid transparent; border-radius: 0.8rem;
    padding: .6rem 1.2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav:focus { outline: none; }
  .btn:focus, .btn:hover { border-color: var(--text); }
  .btn.primary:focus { box-shadow: 0 0 0 .25rem var(--text); }

  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: .5rem; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: .25rem; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll { flex: 1; overflow-y: auto; padding: 1.8rem var(--gutter-x) var(--gutter-y); }

  /* Accueil */
  .grid {
    display: grid; gap: 1.6rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    align-content: start;
  }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: .5rem;
    background: var(--surface); border-radius: 1.2rem; padding: 1.4rem;
    border: .2rem solid transparent; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:focus, .card:hover { border-color: var(--accent); background: var(--surface-2); transform: scale(1.04); }
  .card .emoji { font-size: 3.2rem; line-height: 1; }
  .card .ctitle { font-size: 1.45rem; font-weight: 700; }
  .card .csub { color: var(--muted); font-size: 1rem; }

  .catcard { gap: .7rem; }
  .grid.cats { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
  .catcard { padding: 1.2rem 1.4rem; }
  .catcard .emoji { font-size: 2.2rem; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .catcard .ctitle { font-size: 1.4rem; }

  /* Fiche recette */
  .recipe {
    display: grid; gap: 2rem; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
  }
  .panel { background: var(--surface); border-radius: 1.2rem; padding: 1.4rem 1.6rem; }
  .panel h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: .8rem; }
  .panel h3 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
  .panel p { margin: .4rem 0; font-size: 1.1rem; }
  .panel ul { margin: 0; padding-left: 1.3rem; font-size: 1.15rem; }
  .panel li { margin: .35rem 0; }
  .panel li::marker { color: var(--accent); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; font-size: 1.2rem; }
  ol.steps li { counter-increment: step; position: relative; padding-left: 3rem; margin: 0 0 1rem; min-height: 2.2rem; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: -.1rem;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .extras { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  .extras ul { font-size: 1.05rem; }

  /* Mode pas à pas */
  .progress { height: .4rem; background: var(--surface-2); flex: none; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .stepmain {
    flex: 1; min-height: 0; display: grid; gap: 2.5rem;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
    padding: 2rem var(--gutter-x) 1rem;
  }
  .step { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .stepinner { margin: auto 0; }
  .step .count { color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: .03em; }
  .step .label { color: var(--muted); font-size: 1.2rem; margin: .3rem 0 0; }
  .step .stitle { font-size: 3rem; margin: .8rem 0 1.2rem; }
  .step .sbody { font-size: 1.85rem; line-height: 1.4; margin: 0; }
  .step .sbody.long { font-size: 1.5rem; }
  .step .sbody.xlong { font-size: 1.25rem; }
  .side { overflow-y: auto; margin: 0; }
  .side ul { font-size: 1.05rem; }
  .stepfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem var(--gutter-x) var(--gutter-y); flex: none;
  }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  .fade.rev { animation-name: fade-rev; }
  @keyframes fade-rev { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }

  /* Téléphone / petit écran */
  @media (max-width: 700px) {
    html { font-size: 15px; }
    .top { flex-wrap: wrap; }
    .top h1 { font-size: 1.6rem; }
    .recipe, .stepmain { grid-template-columns: 1fr; }
    .extras { grid-template-columns: 1fr; }
    .step .stitle { font-size: 2rem; }
    .step .sbody { font-size: 1.3rem; }
    .stepmain { overflow-y: auto; }
    .stepfoot .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

ignets sur du papier absorbant, puis saupoudrez-les de sucre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La bière<\/strong> (ou de l'eau gazeuse) rend la pâte plus légère et croustillante ; l'alcool s'évapore à la cuisson.", "<strong>Sans thermomètre<\/strong>, plongez une goutte de pâte dans l'huile : si elle remonte aussitôt en grésillant, l'huile est prête.", "<strong>Ne mettez pas trop de beignets à la fois<\/strong>, sinon l'huile refroidit et les beignets deviennent gras.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu.", "Sans fruits, cette pâte sert aussi pour des beignets salés (légumes, crevettes, fleurs de courgette) : supprimez alors le sucre et l'arôme."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre glace, sucre à la cannelle, miel, caramel au beurre salé, coulis de fruits rouges ou une boule de glace vanille."}]}]}], "steps": [{"label": "", "title": "Séparer les œufs", "body": "Mettez les blancs de côté dans un bol propre et sec."}, {"label": "", "title": "La pâte", "body": "Dans un grand saladier, mélangez la farine, la levure, le sucre et le sel. Creusez un puits, ajoutez les jaunes d'œufs et l'huile, puis versez le lait (et la bière) <strong>petit à petit<\/strong> en fouettant pour éviter les grumeaux. Ajoutez l'arôme si vous en mettez un."}, {"label": "", "title": "Le repos", "body": "Couvrez et laissez reposer <strong>1 heure<\/strong> à température ambiante."}, {"label": "", "title": "Les fruits", "body": "Épluchez les pommes, retirez le trognon et coupez-les en rondelles d'environ 1 cm. Arrosez-les de jus de citron."}, {"label": "", "title": "Les blancs en neige", "body": "Juste avant la cuisson, montez les blancs en neige ferme avec une pincée de sel et incorporez-les <strong>délicatement<\/strong> à la pâte."}, {"label": "", "title": "La friture", "body": "Chauffez l'huile à <strong>170-180 °C<\/strong>. Trempez chaque rondelle de fruit dans la pâte, laissez égoutter l'excédent, puis plongez-la dans l'huile. Faites cuire 2 à 3 minutes en retournant à mi-cuisson, jusqu'à ce que le beignet soit bien doré."}, {"label": "", "title": "Égoutter", "body": "Déposez les beignets sur du papier absorbant, puis saupoudrez-les de sucre."}], "categorySlug": "desserts"}, {"slug": "blaff-de-poisson", "name": "Blaff de poisson", "nameHtml": "Blaff de poisson", "subtitle": "8 personnes", "emoji": "🍋", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Poisson et marinade", "blocks": [{"t": "ul", "items": ["2,5 kg de poisson entier en darnes ou en tronçons (vivaneau, acoupa, machoiran, mérou, daurade), écaillé et vidé", "6 citrons verts", "6 gousses d'ail", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Bouillon", "blocks": [{"t": "ul", "items": ["2 litres d'eau", "2 oignons", "1 botte de cives", "4 branches de thym", "6 feuilles de bois d'Inde (ou 4 feuilles de laurier et 6 clous de girofle)", "1 bouquet de persil", "1 piment antillais entier (non percé)", "Sel et poivre"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc, bananes pesées, ou légumes pays (igname, dachine, patate douce)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poisson<\/strong> : rincez les morceaux de poisson à l'eau froide et frottez-les avec le jus de 2 citrons verts. Rincez-les rapidement.", "<strong>La marinade<\/strong> : dans un grand plat, mélangez le jus de 2 citrons verts, 4 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en le poisson et laissez mariner <strong>30 minutes à 1 heure<\/strong> au réfrigérateur, pas plus.", "<strong>Le bouillon<\/strong> : dans une
