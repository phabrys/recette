", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, bananes pesées, haricots rouges, avec de la sauce chien."}]}]}], "steps": [{"label": "", "title": "Nettoyer le poisson", "body": "Rincez les morceaux de poisson à l'eau froide et frottez-les avec le jus de 2 citrons verts. Rincez-les rapidement."}, {"label": "", "title": "La marinade", "body": "Dans un grand plat, mélangez le jus de 2 citrons verts, 4 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en le poisson et laissez mariner <strong>30 minutes à 1 heure<\/strong> au réfrigérateur, pas plus."}, {"label": "", "title": "Le bouillon", "body": "Dans une grande cocotte, versez l'eau. Ajoutez les oignons émincés, les cives coupées en tronçons, le thym, le bois d'Inde, la moitié du persil, le piment entier et les 2 gousses d'ail restantes écrasées. Salez, poivrez et portez à ébullition, puis laissez frémir <strong>10 minutes<\/strong>."}, {"label": "", "title": "Pocher le poisson", "body": "Plongez délicatement le poisson et sa marinade dans le bouillon frémissant. Laissez cuire <strong>10 à 15 minutes<\/strong> à petits frémissements, sans faire bouillir fort, jusqu'à ce que la chair soit opaque et se détache de l'arête."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus des 2 derniers citrons verts et le reste du persil ciselé. Retirez le piment entier. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez le poisson dans des assiettes creuses, arrosé de bouillon, avec du riz blanc ou des légumes pays."}], "categorySlug": "plats"}, {"slug": "blanc-manger-coco", "name": "Blanc-manger coco", "nameHtml": "Blanc-manger coco", "subtitle": "2 moules, 12 à 16 personnes", "emoji": "🥛", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["80 cl de lait de coco (2 boîtes de 400 ml)", "2 boîtes de lait concentré sucré (2 × 397 g)", "50 cl de lait entier", "14 feuilles de gélatine (28 g), ou 8 g d'agar-agar", "1 gousse de vanille (ou 2 sachets de sucre vanillé)", "Le zeste d'un citron vert", "1 pincée de cannelle", "1 pincée de noix de muscade râpée", "Facultatif : 100 g de noix de coco râpée, pour décorer"]}]}, {"title": "Coulis (facultatif)", "blocks": [{"t": "ul", "items": ["400 g de fruits rouges, de mangue ou de fruits de la passion", "60 g de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La gélatine<\/strong> : faites tremper les feuilles de gélatine <strong>10 minutes<\/strong> dans un bol d'eau froide.", "<strong>Chauffer<\/strong> : dans une casserole, versez le lait entier, la gousse de vanille fendue et grattée, le zeste de citron vert, la cannelle et la muscade. Faites chauffer <strong>sans faire bouillir<\/strong>, puis retirez du feu et laissez infuser <strong>10 minutes<\/strong>.", "<strong>Incorporer la gélatine<\/strong> : retirez la gousse de vanille et le zeste. Essorez bien la gélatine entre vos mains et ajoutez-la dans le lait chaud, en remuant jusqu'à ce qu'elle soit complètement dissoute.", "<strong>Mélanger<\/strong> : dans un grand saladier, fouettez le lait de coco et le lait concentré sucré. Ajoutez le lait parfumé et mélangez bien.", "<strong>Mouler<\/strong> : versez la préparation dans deux moules à savarin ou à cake légèrement huilés (ou dans des ramequins individuels).", "<strong>Prendre au froid<\/strong> : laissez refroidir à température ambiante, puis placez au réfrigérateur <strong>au moins 6 heures<\/strong>, idéalement une nuit.", "<strong>Le coulis<\/strong> : mixez les fruits avec le sucre, puis filtrez pour retirer les pépins.", "<strong>Démouler et servir<\/strong> : trempez les moules <strong>quelques secondes<\/strong> dans l'eau chaude, puis retournez-les sur un plat. Parsemez de noix de coco râpée et servez bien frais, avec le coulis."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne faites jamais bouillir<\/strong> le lait après avoir ajouté la gélatine : elle perd son pouvoir gélifiant.", "<strong>Avec de l'agar-agar<\/strong> : ajoutez-le dans le lait froid, portez à ébullition et laissez bouillir <strong>2 minutes<\/strong> en fouettant. Il prend plus vite et supporte mieux la chaleur.", "<strong>Pour un démoulage facile<\/strong>, huilez très légèrement les moules avec une huile neutre.", "<strong>Conservation<\/strong> : il se garde 3 jours au réfrigérateur, filmé."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la noix de coco fraîche<\/strong> : râpez la chair de 2 noix de coco, mixez-la avec 80 cl d'eau chaude et filtrez à travers un torchon pour obtenir un lait de coco maison.", "<strong>Marbré<\/strong> : ajoutez à la moitié de la préparation 2 cuillères à soupe de cacao, et versez les deux en alternance.", "<strong>Aux fruits<\/strong> : déposez des dés de mangue ou d'ananas au fond des moules avant de verser la préparation."]}]}]}], "steps": [{"label": "", "title": "La gélatine", "body": "Faites tremper les feuilles de gélatine <strong>10 minutes<\/strong> dans un bol d'eau froide."}, {"label": "", "title": "Chauffer", "body": "Dans une casserole, versez le lait entier, la gousse de vanille fendue et grattée, le zeste de citron vert, la cannelle et la muscade. Faites chauffer <strong>sans faire bouillir<\/strong>, puis retirez du feu et laissez infuser <strong>10 minutes<\/strong>."}, {"label": "", "title": "Incorporer la gélatine", "body": "Retirez la gousse de vanille et le zeste. Essorez bien la gélatine entre vos mains et ajoutez-la dans le lait chaud, en remuant jusqu'à ce qu'elle soit complètement dissoute."}, {"label": "", "title": "Mélanger", "body": "Dans un grand saladier, fouettez le lait de coco et le lait concentré sucré. Ajoutez le lait parfumé et mélangez bien."}, {"label": "", "title": "Mouler", "body": "Versez la préparation dans deux moules à savarin ou à cake légèrement huilés (ou dans des ramequins individuels)."}, {"label": "", "title": "Prendre au froid", "body": "Laissez refroidir à température ambiante, puis placez au réfrigérateur <strong>au moins 6 heures<\/strong>, idéalement une nuit."}, {"label": "", "title": "Le coulis", "body": "Mixez les fruits avec le sucre, puis filtrez pour retirer les pépins."}, {"label": "", "title": "Démouler et servir", "body": "Trempez les moules <strong>quelques secondes<\/strong> dans l'eau chaude, puis retournez-les sur un plat. Parsemez de noix de coco râpée et servez bien frais, avec le coulis."}], "categorySlug": "desserts"}, {"slug": "bokit", "name": "Bokits", "nameHtml": "Bokits", "subtitle": "environ 16 bokits", "emoji": "🥙", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 kg de farine T45 ou T55", "55 cl d'eau tiède", "15 g de levure de boulanger sèche (2 sachets) ou 30 g de levure fraîche", "20 g de sel", "2 cuillères à café de sucre", "4 cuillères à soupe d'huile (ou 50 g de saindoux, comme à l'ancienne)"]}]}, {"title": "Cuisson", "blocks": [{"t": "ul", "items": ["Huile de friture (tournesol ou arachide)"]}]}, {"title": "Garniture (au choix)", "blocks": [{"t": "ul", "items": ["Chiquetaille de morue, poulet boucané ou effiloché, jambon et fromage, thon, saucisses", "Crudités : salade, tomates, concombre, oignons rouges, carottes râpées", "Sauce chien, ketchup, mayonnaise, piment"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et le sucre dans <strong>10 cl<\/strong> d'eau tiède et laissez reposer <strong>10 minutes<\/strong>, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Ajoutez la levure, l'huile, puis le reste de l'eau petit à petit, en mélangeant.", "<strong>Le pétrissage<\/strong> : pétrissez <strong>10 minutes<\/strong> à la main (ou 6 minutes au robot), jusqu'à obtenir une pâte <strong>souple, lisse et qui ne colle plus<\/strong> aux doigts. Ajoutez un peu de farine si elle colle, ou un peu d'eau si elle est trop ferme.", "<strong>La pousse<\/strong> : couvrez le saladier d'un torchon et laissez lever <strong>1 heure<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Façonner<\/strong> : dégazez la pâte et divisez-la en <strong>16 boules<\/strong> d'environ 100 g. Sur un plan de travail fariné, aplatissez chaque boule à la main ou au rouleau en un disque d'environ <strong>12 cm de diamètre<\/strong> et <strong>1 cm d'épaisseur<\/strong>.", "<strong>Le repos<\/strong> : couvrez les disques d'un torchon et laissez-les reposer <strong>15 minutes<\/strong>.", "<strong>Frire<\/strong> : faites chauffer l'huile à <strong>170 °C<\/strong> dans une grande casserole ou une sauteuse. Plongez <strong>1 ou 2 bokits à la fois<\/strong> et faites-les frire <strong>2 à 3 minutes de chaque côté<\/strong>, en les arrosant d'huile, jusqu'à ce qu'ils soient gonflés et bien dorés.", "<strong>Égoutter<\/strong> : sortez-les avec une écumoire et égouttez-les debout sur du papier absorbant.", "<strong>Garnir<\/strong> : ouvrez les bokits encore chauds sur le côté, comme une poche, sans les couper complètement. Garnissez-les de la garniture de votre choix, de crudités et de sauce, et servez aussitôt."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La température de l'huile est essentielle<\/strong> : trop chaude, le bokit dore dehors et reste cru dedans ; pas assez, il boit l'huile. Faites un essai avec un premier bokit.", "<strong>Arrosez le dessus d'huile<\/strong> pendant la cuisson avec une cuillère : le bokit gonfle mieux et devient bien creux, facile à garnir.", "<strong>Le saindoux<\/strong> donne le goût traditionnel guadeloupéen et une pâte plus tendre.", "<strong>Garnissez au dernier moment<\/strong>, sinon la sauce ramollit le bokit.", "<strong>Préparez à l'avance<\/strong> : les bokits frits se gardent une journée dans un torchon. Réchauffez-les <strong>5 minutes au four à 180 °C<\/strong> avant de les garnir.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la levure chimique<\/strong> : remplacez la levure de boulanger par <strong>2 sachets de levure chimique<\/strong> (22 g) mélangés à la farine. Pas besoin de pousse : laissez simplement reposer la pâte 30 minutes avant de façonner.", "<strong>Au lait de coco<\/strong> : remplacez 20 cl d'eau par du lait de coco, pour une pâte plus douce et parfumée.", "<strong>Bokit sucré<\/strong> : garnissez-le de Nutella, de banane et de lait concentré sucré.", "<strong>Johnny cakes<\/strong> : façonnez des petits disques de 6 cm et servez-les nature, au petit déjeuner ou en accompagnement."]}]}]}, {"title": "Idées de garniture", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Bokit morue<\/strong> : chiquetaille de morue, crudités et sauce chien.", "<strong>Bokit poulet<\/strong> : poulet boucané ou poulet pané, salade, tomates, oignons et sauce chien.", "<strong>Bokit complet<\/strong> : jambon, fromage, œuf au plat et crudités.", "<strong>Bokit accras<\/strong> : accras de morue, salade et sauce chien."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et le sucre dans <strong>10 cl<\/strong> d'eau tiède et laissez reposer <strong>10 minutes<\/strong>, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Ajoutez la levure, l'huile, puis le reste de l'eau petit à petit, en mélangeant."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez <strong>10 minutes<\/strong> à la main (ou 6 minutes au robot), jusqu'à obtenir une pâte <strong>souple, lisse et qui ne colle plus<\/strong> aux doigts. Ajoutez un peu de farine si elle colle, ou un peu d'eau si elle est trop ferme."}, {"label": "", "title": "La pousse", "body": "Couvrez le saladier d'un torchon et laissez lever <strong>1 heure<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Façonner", "body": "Dégazez la pâte et divisez-la en <strong>16 boules<\/strong> d'environ 100 g. Sur un plan de travail fariné, aplatissez chaque boule à la main ou au rouleau en un disque d'environ <strong>12 cm de diamètre<\/strong> et <strong>1 cm d'épaisseur<\/strong>."}, {"label": "", "title": "Le repos", "body": "Couvrez les disques d'un torchon et laissez-les reposer <strong>15 minutes<\/strong>."}, {"label": "", "title": "Frire", "body": "Faites chauffer l'huile à <strong>170 °C<\/strong> dans une grande casserole ou une sauteuse. Plongez <strong>1 ou 2 bokits à la fois<\/strong> et faites-les frire <strong>2 à 3 minutes de chaque côté<\/strong>, en les arrosant d'huile, jusqu'à ce qu'ils soient gonflés et bien dorés."}, {"label": "", "title": "Égoutter", "body": "Sortez-les avec une écumoire et égouttez-les debout sur du papier absorbant."}, {"label": "", "title": "Garnir", "body": "Ouvrez les bokits encore chauds sur le côté, comme une poche, sans les couper complètement. Garnissez-les de la garniture de votre choix, de crudités et de sauce, et servez aussitôt."}], "categorySlug": "plats"}, {"slug": "bouillon-d-awara", "name": "Bouillon d'awara", "nameHtml": "Bouillon d'awara", "subtitle": "environ 20 personnes", "emoji": "🥘", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Chaque famille guyanaise a sa propre recette : les viandes, les poissons et les légumes varient selon les goûts et ce qu'on trouve au marché."}]}, {"title": "Base", "blocks": [{"t": "ul", "items": ["1 kg de pâte d'awara (en pot ou surgelée)", "3 à 4 litres d'eau"]}]}, {"title": "Viandes et poissons", "blocks": [{"t": "ul", "items": ["1 poulet boucané", "1 kg de queue de cochon salée", "500 g de petit salé (ou lard salé)", "500 g de jambon fumé (ou jarret fumé)", "500 g de poisson boucané (acoupa ou machoiran)", "500 g de crevettes (fraîches ou boucanées)", "6 crabes (crabes de mangrove ou crabes de terre), nettoyés et coupés en deux"]}]}, {"title": "Légumes", "blocks": [{"t": "ul", "items": ["1 chou vert", "1 kg de haricots verts (ou haricots kilomètre)", "4 aubergines", "4 concombres", "500 g d'épinards (ou de feuilles de « zépinard » local)"]}]}, {"title": "Aromates", "blocks": [{"t": "ul", "items": ["4 oignons", "1 botte de cives", "8 gousses d'ail", "1 bouquet de persil", "4 branches de thym et 4 feuilles de laurier", "6 clous de girofle", "1 piment antillais entier (ou plus, selon les goûts)", "Poivre", "4 cuillères à soupe d'huile"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Dessaler les viandes<\/strong> : la veille, mettez la queue de cochon et le petit salé à tremper dans un grand saladier d'eau froide, en changeant l'eau 2 ou 3 fois.", "<strong>Blanchir les viandes salées<\/strong> : le jour même, plongez-les dans une casserole d'eau froide, portez à ébullition et laissez cuire <strong>15 minutes<\/strong>, puis égouttez. Coupez-les en morceaux, ainsi que le poulet boucané et le jambon.", "<strong>Préparer le poisson<\/strong> : ébouillantez le poisson boucané 5 minutes pour le dessaler, égouttez-le, retirez la peau et les arêtes et émiettez-le en gros morceaux.", "<strong>Les aromates<\/strong> : hachez les oignons, les cives, l'ail et le persil.", "<strong>Faire revenir<\/strong> : dans une très grande marmite, faites chauffer l'huile et faites revenir les aromates 5 minutes. Ajoutez les viandes et faites-les revenir 10 minutes en remuant.", "<strong>La pâte d'awara<\/strong> : ajoutez la pâte d'awara et mélangez bien pour enrober les viandes, puis versez l'eau petit à petit en remuant pour obtenir un bouillon homogène.", "<strong>Le premier mijotage<\/strong> : ajoutez le thym, le laurier, les clous de girofle, le poivre et le piment <strong>entier<\/strong>, sans le percer. Laissez mijoter à feu doux <strong>1 h 30<\/strong>, en remuant souvent avec une grande cuillère en bois et en raclant bien le fond : le bouillon accroche facilement.", "<strong>Les légumes<\/strong> : pendant ce temps, coupez le chou en lanières, les haricots verts en tronçons, les aubergines et les concombres en dés. Ajoutez le chou, les haricots et les aubergines, et laissez mijoter <strong>1 heure<\/strong>.", "<strong>Les fruits de mer<\/strong> : ajoutez les concombres, les épinards, les crabes, les crevettes et le poisson émietté. Laissez mijoter encore <strong>1 heure<\/strong>, toujours à feu doux et en remuant régulièrement. Ajoutez un peu d'eau si le bouillon épaissit trop.", "<strong>Le repos<\/strong> : goûtez et rectifiez l'assaisonnement, retirez le piment. Laissez reposer le bouillon : il est bien meilleur réchauffé le lendemain, et même le surlendemain.", "<strong>Servir<\/strong> : réchauffez le bouillon à feu doux en remuant, et servez-le bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le bouillon d'awara se prépare à l'avance<\/strong> : traditionnellement, on le fait cuire plusieurs jours avant Pâques en le réchauffant et en le remuant chaque jour. Ses saveurs se développent avec le temps.", "<strong>Remuez souvent et raclez le fond<\/strong> : la pâte d'awara est épaisse et brûle facilement. Une marmite à fond épais aide beaucoup.", "<strong>Le piment entier<\/strong> parfume sans trop piquer ; s'il éclate, le bouillon devient très fort. Retirez-le avant de servir.", "<strong>Les viandes salées et boucanées<\/strong> donnent tout son goût au bouillon : pensez à bien les dessaler, sinon il sera trop salé. Goûtez avant d'ajouter du sel.", "<strong>La pâte d'awara<\/strong> se trouve en pot ou surgelée sur les marchés et dans les épiceries de Guyane. Faite maison, elle demande de cuire longuement la pulpe des fruits du palmier awara jusqu'à obtenir une pâte orangée et onctueuse.", "<strong>Le bouillon se congèle très bien<\/strong> en portions."]}]}]}, {"title": "Tradition", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Le bouillon d'awara est le plat emblématique de la Guyane, servi en famille à <strong>Pâques<\/strong> et à la <strong>Pentecôte<\/strong>. Une légende dit : « Si tu manges le bouillon d'awara, en Guyane tu reviendras. »"}]}]}], "steps": [{"label": "", "title": "Dessaler les viandes", "body": "La veille, mettez la queue de cochon et le petit salé à tremper dans un grand saladier d'eau froide, en changeant l'eau 2 ou 3 fois."}, {"label": "", "title": "Blanchir les viandes salées", "body": "Le jour même, plongez-les dans une casserole d'eau froide, portez à ébullition et laissez cuire <strong>15 minutes<\/strong>, puis égouttez. Coupez-les en morceaux, ainsi que le poulet boucané et le jambon."}, {"label": "", "title": "Préparer le poisson", "body": "Ébouillantez le poisson boucané 5 minutes pour le dessaler, égouttez-le, retirez la peau et les arêtes et émiettez-le en gros morceaux."}, {"label": "", "title": "Les aromates", "body": "Hachez les oignons, les cives, l'ail et le persil."}, {"label": "", "title": "Faire revenir", "body": "Dans une très grande marmite, faites chauffer l'huile et faites revenir les aromates 5 minutes. Ajoutez les viandes et faites-les revenir 10 minutes en remuant."}, {"label": "", "title": "La pâte d'awara", "body": "Ajoutez la pâte d'awara et mélangez bien pour enrober les viandes, puis versez l'eau petit à petit en remuant pour obtenir un bouillon homogène."}, {"label": "", "title": "Le premier mijotage", "body": "Ajoutez le thym, le laurier, les clous de girofle, le poivre et le piment <strong>entier<\/strong>, sans le percer. Laissez mijoter à feu doux <strong>1 h 30<\/strong>, en remuant souvent avec une grande cuillère en bois et en raclant bien le fond : le bouillon accroche facilement."}, {"label": "", "title": "Les légumes", "body": "Pendant ce temps, coupez le chou en lanières, les haricots verts en tronçons, les aubergines et les concombres en dés. Ajoutez le chou, les haricots et les aubergines, et laissez mijoter <strong>1 heure<\/strong>."}, {"label": "", "title": "Les fruits de mer", "body": "Ajoutez les concombres, les épinards, les crabes, les crevettes et le poisson émietté. Laissez mijoter encore <strong>1 heure<\/strong>, toujours à feu doux et en remuant régulièrement. Ajoutez un peu d'eau si le bouillon épaissit trop."}, {"label": "", "title": "Le repos", "body": "Goûtez et rectifiez l'assaisonnement, retirez le piment. Laissez reposer le bouillon : il est bien meilleur réchauffé le lendemain, et même le surlendemain."}, {"label": "", "title": "Servir", "body": "Réchauffez le bouillon à feu doux en remuant, et servez-le bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "brioche", "name": "Brioche", "nameHtml": "Brioche", "subtitle": "2 brioches", "emoji": "🍞", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou farine de gruau)", "5 œufs, à température ambiante", "10 cl de lait tiède", "200 g de beurre doux mou, coupé en dés", "70 g de sucre", "20 g de levure de boulanger fraîche (ou 1 sachet de levure sèche, 7 g)", "10 g de sel", "Facultatif : 1 cuillère à soupe de fleur d'oranger ou le zeste d'une orange"]}]}, {"title": "Dorure et décor", "blocks": [{"t": "ul", "items": ["1 jaune d'œuf + 1 cuillère à soupe de lait", "Facultatif : sucre perlé"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez.", "<strong>Le pétrissage<\/strong> : pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol.", "<strong>Le beurre<\/strong> : ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante.", "<strong>Première pousse<\/strong> : couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Le repos au froid<\/strong> : dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner.", "<strong>Le façonnage<\/strong> : divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Un robot pétrisseur est vivement conseillé<\/strong> : la pâte à brioche est très collante et demande un long pétrissage. À la main, comptez 20 à 25 minutes et ne rajoutez pas de farine.", "<strong>Le beurre doit être mou, pas fondu<\/strong> : il doit s'écraser facilement au doigt.", "<strong>Le repos d'une nuit au réfrigérateur<\/strong> rend la brioche plus parfumée et la pâte bien plus facile à façonner. Vous pouvez donc préparer la pâte la veille au soir et cuire le matin.", "<strong>La brioche est cuite<\/strong> quand elle sonne creux lorsqu'on tapote dessous, ou que l'intérieur atteint 90 °C avec un thermomètre.", "<strong>Elle se conserve<\/strong> 2 à 3 jours emballée dans du film alimentaire, et se congèle très bien en tranches : il suffit de les passer au grille-pain."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pépites de chocolat<\/strong> : ajoutez 150 g de pépites de chocolat à la fin du pétrissage.", "<strong>Brioche Nanterre<\/strong> : façonnez 8 boules par brioche et placez-les en deux rangées dans un moule à cake.", "<strong>Brioches individuelles<\/strong> : divisez la pâte en boules de 60 g et faites-les cuire 12 à 15 minutes.", "<strong>Brioche aux pralines roses<\/strong> : ajoutez 150 g de pralines roses concassées au moment du façonnage.", "<strong>Pain perdu<\/strong> : la brioche rassise de quelques jours fait un excellent pain perdu."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol."}, {"label": "", "title": "Le beurre", "body": "Ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante."}, {"label": "", "title": "Première pousse", "body": "Couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Le repos au froid", "body": "Dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner."}, {"label": "", "title": "Le façonnage", "body": "Divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "chips-banane", "name": "Chips de banane plantain", "nameHtml": "Chips de banane plantain", "subtitle": "6 à 8 personnes à l'apéritif", "emoji": "🍌", "category": "Entrées et apéritifs", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["4 bananes plantain <strong>bien vertes<\/strong> (fermes, peau verte sans taches)", "Huile de friture (tournesol ou arachide)", "Sel fin", "Optionnel : piment en poudre, poudre à colombo ou jus de citron vert"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher<\/strong> : coupez les deux extrémités des bananes, puis incisez la peau sur toute la longueur, en suivant les arêtes, sans entailler la chair. Soulevez la peau avec le pouce et retirez-la en bandes.", "<strong>Faire tremper<\/strong> : plongez les bananes épluchées dans un saladier d'eau froide salée pendant <strong>10 minutes<\/strong>, pour qu'elles ne noircissent pas et pour retirer un peu d'amidon.", "<strong>Trancher<\/strong> : égouttez-les et coupez-les en rondelles <strong>très fines<\/strong> (1 à 2 mm), à la mandoline ou au couteau bien aiguisé. Pour des chips longues, coupez-les dans la longueur.", "<strong>Sécher<\/strong> : étalez les rondelles sur un torchon propre et séchez-les <strong>soigneusement<\/strong> : l'eau fait éclabousser l'huile et empêche les chips de croustiller.", "<strong>Chauffer l'huile<\/strong> : faites chauffer l'huile à <strong>170-175 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts.", "<strong>Frire<\/strong> : plongez les rondelles <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites-les frire <strong>2 à 4 minutes<\/strong> en remuant, jusqu'à ce qu'elles soient <strong>jaune doré<\/strong> et que les bulles autour diminuent nettement.", "<strong>Égoutter et saler<\/strong> : sortez-les avec une écumoire, égouttez-les sur du papier absorbant et salez-les aussitôt, pendant qu'elles sont chaudes.", "<strong>Laisser refroidir<\/strong> : elles finissent de croustiller en refroidissant. Servez-les à température ambiante."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez des bananes très vertes<\/strong> : plus elles sont vertes, plus les chips sont croustillantes et peu sucrées. Une banane jaune donne des chips molles qui brunissent trop vite.", "<strong>Huilez-vous les mains<\/strong> (ou mettez des gants) avant d'éplucher : la sève de la banane verte tache et colle aux doigts.", "<strong>Des tranches régulières<\/strong> cuisent toutes en même temps : la mandoline est idéale (utilisez le protège-main).", "<strong>Ne surchargez pas l'huile<\/strong> : trop de rondelles d'un coup font chuter la température et les chips deviennent grasses.", "<strong>Conservation<\/strong> : une fois bien refroidies, elles se gardent <strong>1 semaine<\/strong> dans une boîte hermétique.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pimentées<\/strong> : saupoudrez les chips chaudes de piment en poudre, de paprika fumé ou de poudre à colombo, en plus du sel.", "<strong>Au citron vert<\/strong> : arrosez-les d'un filet de jus de citron vert et parsemez de zeste juste avant de servir.", "<strong>À l'ail<\/strong> : mélangez le sel avec un peu d'ail en poudre avant de saler les chips.", "<strong>Au four<\/strong> : mélangez les rondelles avec 3 cuillères à soupe d'huile, étalez-les en une seule couche sur deux plaques recouvertes de papier cuisson et faites cuire <strong>15 à 20 minutes à 180 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>Bananes pesées<\/strong> : en tronçons frits deux fois et aplatis entre les deux cuissons (voir la recette de bananes pesées).", "<strong>Bananes jaunes mûres<\/strong> : coupées en rondelles épaisses (1 cm) et frites, elles donnent des <strong>alocos<\/strong>, moelleux et sucrés, à servir en accompagnement."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "À l'apéritif avec les accras de morue et la sauce chien, ou en accompagnement d'un poisson grillé ou d'un colombo de poulet."}]}]}], "steps": [{"label": "", "title": "Éplucher", "body": "Coupez les deux extrémités des bananes, puis incisez la peau sur toute la longueur, en suivant les arêtes, sans entailler la chair. Soulevez la peau avec le pouce et retirez-la en bandes."}, {"label": "", "title": "Faire tremper", "body": "Plongez les bananes épluchées dans un saladier d'eau froide salée pendant <strong>10 minutes<\/strong>, pour qu'elles ne noircissent pas et pour retirer un peu d'amidon."}, {"label": "", "title": "Trancher", "body": "Égouttez-les et coupez-les en rondelles <strong>très fines<\/strong> (1 à 2 mm), à la mandoline ou au couteau bien aiguisé. Pour des chips longues, coupez-les dans la longueur."}, {"label": "", "title": "Sécher", "body": "Étalez les rondelles sur un torchon propre et séchez-les <strong>soigneusement<\/strong> : l'eau fait éclabousser l'huile et empêche les chips de croustiller."}, {"label": "", "title": "Chauffer l'huile", "body": "Faites chauffer l'huile à <strong>170-175 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts."}, {"label": "", "title": "Frire", "body": "Plongez les rondelles <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites-les frire <strong>2 à 4 minutes<\/strong> en remuant, jusqu'à ce qu'elles soient <strong>jaune doré<\/strong> et que les bulles autour diminuent nettement."}, {"label": "", "title": "Égoutter et saler", "body": "Sortez-les avec une écumoire, égouttez-les sur du papier absorbant et salez-les aussitôt, pendant qu'elles sont chaudes."}, {"label": "", "title": "Laisser refroidir", "body": "Elles finissent de croustiller en refroidissant. Servez-les à température ambiante."}], "categorySlug": "entrees-et-aperitifs"}, {"slug": "chips", "name": "Chips maison", "nameHtml": "Chips maison", "subtitle": "4 grands bols, environ 8 personnes à l'apéritif", "emoji": "🥔", "category": "Entrées et apéritifs", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair farineuse (Bintje, Agria ou Russet)", "Huile de friture (tournesol ou arachide)", "Sel fin (ou fleur de sel)", "Facultatif, pour assaisonner : paprika fumé, ail en poudre, herbes de Provence, poivre, ou poudre à colombo"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher<\/strong> : lavez et épluchez les pommes de terre. Vous pouvez aussi les garder avec la peau, bien brossées, pour des chips plus rustiques.", "<strong>Trancher<\/strong> : coupez les pommes de terre en tranches <strong>très fines, de 1 à 2 mm<\/strong>, de préférence à la mandoline, en utilisant le protège-doigts.", "<strong>Rincer<\/strong> : plongez les tranches dans un grand saladier d'eau froide et remuez-les pour retirer l'amidon. Changez l'eau jusqu'à ce qu'elle reste claire, puis laissez tremper <strong>30 minutes<\/strong>.", "<strong>Sécher<\/strong> : égouttez les tranches et séchez-les <strong>très soigneusement<\/strong>, étalées entre deux torchons propres, en tamponnant bien. Elles doivent être parfaitement sèches.", "<strong>Chauffer l'huile<\/strong> : faites chauffer l'huile à <strong>160-170 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts.", "<strong>La friture<\/strong> : plongez les tranches <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites frire <strong>3 à 5 minutes<\/strong> en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et que l'huile ne bouillonne presque plus autour d'elles.", "<strong>Égoutter et saler<\/strong> : sortez les chips avec une écumoire, déposez-les sur du papier absorbant et <strong>salez-les aussitôt<\/strong>, pendant qu'elles sont encore chaudes, avec le sel ou votre assaisonnement. Continuez avec le reste des tranches.", "<strong>Refroidir<\/strong> : laissez refroidir les chips en une seule couche : elles finissent de croustiller en refroidissant."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Des tranches très fines et régulières<\/strong> sont la clé : une mandoline est presque indispensable. Utilisez toujours le protège-doigts, la lame est très coupante.", "<strong>Rincer et sécher<\/strong> retire l'amidon et l'eau : c'est ce qui rend les chips croustillantes au lieu de molles et collées entre elles.", "<strong>Les chips sont prêtes<\/strong> quand les grosses bulles autour d'elles disparaissent : cela veut dire que toute l'eau s'est évaporée.", "<strong>Une huile pas assez chaude<\/strong> donne des chips grasses ; trop chaude, elles brunissent avant d'être croustillantes. Retirez-les dès qu'elles sont blondes, elles continuent de colorer un peu.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu.", "<strong>Les chips se conservent<\/strong> 2 à 3 jours dans une boîte hermétique. Si elles ramollissent, repassez-les 3 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : badigeonnez les tranches bien sèches d'un peu d'huile, étalez-les en une seule couche sur des plaques recouvertes de papier cuisson et faites cuire <strong>15 à 20 minutes à 180 °C<\/strong>, en les surveillant de près à la fin.", "<strong>À la friteuse sans huile<\/strong> : mélangez les tranches avec 1 cuillère à soupe d'huile et faites-les cuire 15 à 20 minutes à 180 °C, en secouant le panier toutes les 5 minutes.", "<strong>Chips de banane plantain<\/strong> : utilisez des bananes plantains <strong>vertes<\/strong>, coupées en fines rondelles ou en longues lamelles. Pas besoin de les rincer : faites-les frire directement 2 à 3 minutes, puis salez.", "<strong>Chips de patate douce<\/strong> : même méthode, avec une huile un peu moins chaude (150-160 °C), car le sucre de la patate douce la fait brunir plus vite.", "<strong>Sel et vinaigre<\/strong> : vaporisez un peu de vinaigre blanc sur les chips chaudes avant de les saler."]}]}]}], "steps": [{"label": "", "title": "Éplucher", "body": "Lavez et épluchez les pommes de terre. Vous pouvez aussi les garder avec la peau, bien brossées, pour des chips plus rustiques."}, {"label": "", "title": "Trancher", "body": "Coupez les pommes de terre en tranches <strong>très fines, de 1 à 2 mm<\/strong>, de préférence à la mandoline, en utilisant le protège-doigts."}, {"label": "", "title": "Rincer", "body": "Plongez les tranches dans un grand saladier d'eau froide et remuez-les pour retirer l'amidon. Changez l'eau jusqu'à ce qu'elle reste claire, puis laissez tremper <strong>30 minutes<\/strong>."}, {"label": "", "title": "Sécher", "body": "Égouttez les tranches et séchez-les <strong>très soigneusement<\/strong>, étalées entre deux torchons propres, en tamponnant bien. Elles doivent être parfaitement sèches."}, {"label": "", "title": "Chauffer l'huile", "body": "Faites chauffer l'huile à <strong>160-170 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts."}, {"label": "", "title": "La friture", "body": "Plongez les tranches <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites frire <strong>3 à 5 minutes<\/strong> en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et que l'huile ne bouillonne presque plus autour d'elles."}, {"label": "", "title": "Égoutter et saler", "body": "Sortez les chips avec une écumoire, déposez-les sur du papier absorbant et <strong>salez-les aussitôt<\/strong>, pendant qu'elles sont encore chaudes, avec le sel ou votre assaisonnement. Continuez avec le reste des tranches."}, {"label": "", "title": "Refroidir", "body": "Laissez refroidir les chips en une seule couche : elles finissent de croustiller en refroidissant."}], "categorySlug": "entrees-et-aperitifs"}, {"slug": "chocolat-de-communion", "name": "Chocolat de première communion", "nameHtml": "Chocolat de première communion", "subtitle": "environ 20 tasses", "emoji": "🍫", "category": "Boissons", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Chocolat et épices", "blocks": [{"t": "ul", "items": ["500 g de chocolat « pays » (bâtons de cacao pur), ou 400 g de chocolat noir à 70 % + 4 cuillères à soupe de cacao en poudre non sucré", "1 litre d'eau", "2 bâtons de cannelle", "2 étoiles de badiane (anis étoilé)", "2 gousses de vanille", "½ noix de muscade râpée", "Le zeste de 2 citrons verts, prélevé en larges rubans", "1 pincée de sel"]}]}, {"title": "Lait et liaison", "blocks": [{"t": "ul", "items": ["2 litres de lait entier", "2 boîtes de lait concentré non sucré (2 × 410 g)", "1 boîte de lait concentré sucré (397 g)", "3 cuillères à soupe de fécule de maïs (Maïzena)", "Sucre selon votre goût (environ 100 g)", "Facultatif : 50 g de beurre, pour un chocolat plus velouté"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Râper le chocolat<\/strong> : râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux.", "<strong>Faire fondre<\/strong> : dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse.", "<strong>Les épices<\/strong> : fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent.", "<strong>Les laits<\/strong> : versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>.", "<strong>Épaissir<\/strong> : délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère.", "<strong>Goûter<\/strong> : goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu.", "<strong>Filtrer<\/strong> : retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois.", "<strong>Faire mousser<\/strong> : juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser.", "<strong>Servir<\/strong> : servez bien chaud, dans des tasses, avec du pain au beurre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le chocolat pays<\/strong> (bâtons ou boules de cacao pur, sans sucre) donne le goût authentique, plus intense et légèrement amer. On le trouve sur les marchés des Antilles et de Guyane.", "<strong>Remuez souvent et raclez le fond<\/strong> : avec la fécule et le lait concentré, le chocolat attache facilement. Une casserole à fond épais aide beaucoup.", "<strong>Ne faites jamais bouillir fort<\/strong> le chocolat une fois les laits ajoutés : il pourrait déborder et prendre un goût de brûlé.", "<strong>Le lélé<\/strong> est un petit bâton à pointes qu'on fait tourner entre les mains pour faire mousser le chocolat : c'est le geste traditionnel.", "<strong>Préparé à l'avance<\/strong>, le chocolat épaissit en refroidissant : réchauffez-le doucement en ajoutant un peu de lait, en fouettant.", "<strong>Il se conserve<\/strong> 2 à 3 jours au réfrigérateur dans des bouteilles fermées."]}]}]}, {"title": "Tradition", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Aux Antilles et en Guyane, le chocolat de communion est servi lors des grandes fêtes familiales : <strong>premières communions, baptêmes, mariages, Pâques et Noël<\/strong>. On le déguste traditionnellement le matin, bien épais et parfumé, accompagné de <strong>pain au beurre<\/strong> (voir la recette du recueil), de gâteaux et de tourments d'amour."}]}]}], "steps": [{"label": "", "title": "Râper le chocolat", "body": "Râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux."}, {"label": "", "title": "Faire fondre", "body": "Dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse."}, {"label": "", "title": "Les épices", "body": "Fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent."}, {"label": "", "title": "Les laits", "body": "Versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>."}, {"label": "", "title": "Épaissir", "body": "Délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère."}, {"label": "", "title": "Goûter", "body": "Goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu."}, {"label": "", "title": "Filtrer", "body": "Retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois."}, {"label": "", "title": "Faire mousser", "body": "Juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser."}, {"label": "", "title": "Servir", "body": "Servez bien chaud, dans des tasses, avec du pain au beurre."}], "categorySlug": "boissons"}, {"slug": "citronnade", "name": "Citronnade au citron vert", "nameHtml": "Citronnade au citron vert", "subtitle": "2 litres, environ 10 verres", "emoji": "🍋", "category": "Cocktails sans alcool", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["8 citrons verts", "200 g de sucre de canne (ou 25 cl de sirop de canne)", "2 litres d'eau bien fraîche (plate ou gazeuse)", "Quelques feuilles de menthe (facultatif)", "Glaçons"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Le sirop<\/strong> : dans une petite casserole, faites chauffer <strong>25 cl<\/strong> d'eau (prise sur les 2 litres) avec le sucre, juste le temps qu'il soit dissous. Laissez refroidir. Si vous utilisez du sirop de canne, passez cette étape.", "<strong>Les zestes<\/strong> : lavez les citrons verts. Prélevez le zeste de 2 citrons avec un zesteur ou une râpe fine, sans la partie blanche, qui est amère.", "<strong>Le jus<\/strong> : roulez les citrons sous la paume de la main sur le plan de travail pour qu'ils rendent plus de jus, puis pressez-les.", "<strong>Le mélange<\/strong> : dans un grand pichet, mélangez le jus des citrons, les zestes, le sirop et le reste de l'eau. Ajoutez les feuilles de menthe.", "<strong>Rafraîchir<\/strong> : placez au réfrigérateur <strong>au moins 1 heure<\/strong>, puis filtrez si vous voulez retirer les zestes.", "<strong>Servir<\/strong> : goûtez, ajustez le sucre, et servez bien frais avec des glaçons et une rondelle de citron vert."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le sirop<\/strong> se mélange beaucoup mieux que le sucre en poudre, qui reste au fond du pichet.", "<strong>Ne laissez pas les zestes trop longtemps<\/strong> (plus de 3 heures) : ils donnent de l'amertume.", "<strong>Avec de l'eau gazeuse<\/strong>, ajoutez-la au dernier moment pour garder les bulles.", "<strong>Conservation<\/strong> : elle se garde 2 jours au réfrigérateur, sans les zestes ni la menthe."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au gingembre<\/strong> : ajoutez un morceau de gingembre frais de 5 cm, épluché et râpé, dans le sirop chaud. Filtrez avant de servir.", "<strong>Citronnade-maracudja<\/strong> : ajoutez la pulpe de 4 fruits de la passion.", "<strong>Au citron jaune<\/strong> : remplacez les citrons verts par 6 citrons jaunes, plus doux.", "<strong>À la citronnelle<\/strong> : faites infuser 2 tiges de citronnelle écrasées dans le sirop chaud pendant 15 minutes."]}]}]}], "steps": [{"label": "", "title": "Le sirop", "body": "Dans une petite casserole, faites chauffer <strong>25 cl<\/strong> d'eau (prise sur les 2 litres) avec le sucre, juste le temps qu'il soit dissous. Laissez refroidir. Si vous utilisez du sirop de canne, passez cette étape."}, {"label": "", "title": "Les zestes", "body": "Lavez les citrons verts. Prélevez le zeste de 2 citrons avec un zesteur ou une râpe fine, sans la partie blanche, qui est amère."}, {"label": "", "title": "Le jus", "body": "Roulez les citrons sous la paume de la main sur le plan de travail pour qu'ils rendent plus de jus, puis pressez-les."}, {"label": "", "title": "Le mélange", "body": "Dans un grand pichet, mélangez le jus des citrons, les zestes, le sirop et le reste de l'eau. Ajoutez les feuilles de menthe."}, {"label": "", "title": "Rafraîchir", "body": "Placez au réfrigérateur <strong>au moins 1 heure<\/strong>, puis filtrez si vous voulez retirer les zestes."}, {"label": "", "title": "Servir", "body": "Goûtez, ajustez le sucre, et servez bien frais avec des glaçons et une rondelle de citron vert."}], "categorySlug": "cocktails-sans-alcool"}, {"slug": "colombo-de-cabri", "name": "Colombo de cabri", "nameHtml": "Colombo de cabri", "subtitle": "8 à 10 personnes", "emoji": "🐐", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["3 kg de viande de cabri (chevreau) avec les os, coupée en morceaux de 5 cm (épaule, gigot, collier)", "4 citrons verts", "10 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "4 branches de thym", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "2 litres d'eau (ou de bouillon)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer la viande<\/strong> : frottez les morceaux de cabri avec le jus de 2 citrons verts et rincez-les à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : dans un grand saladier, mélangez le jus d'un citron vert, 8 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), les branches de thym, du sel et du poivre. Enrobez-en bien la viande, couvrez et laissez mariner <strong>une nuit<\/strong> au réfrigérateur.", "<strong>Faire dorer le cabri<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de cabri sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les.", "<strong>Les aromates<\/strong> : émincez les oignons et les cives. Dans la même cocotte, faites-les revenir 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter la viande<\/strong> : remettez le cabri et sa marinade dans la cocotte, ajoutez les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>1 h 30<\/strong> à feu doux, en remuant de temps en temps. Ajoutez un peu d'eau si la sauce réduit trop.", "<strong>Les légumes<\/strong> : pendant ce temps, épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Ajoutez les pommes de terre et les christophines dans la cocotte et poursuivez la cuisson <strong>30 minutes<\/strong>, à couvert.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert. La viande doit se détacher facilement de l'os, les légumes être fondants et la sauce un peu épaisse.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le cabri<\/strong> se trouve chez les bouchers antillais et guyanais, souvent sur commande pour les fêtes. À défaut, prenez de l'<strong>agneau<\/strong> (épaule ou collier) ou du <strong>mouton<\/strong>, en réduisant la cuisson à 1 heure pour l'agneau.", "<strong>Gardez les os<\/strong> : ils donnent du goût et du corps à la sauce.", "<strong>La marinade d'une nuit<\/strong> est importante pour le cabri : elle attendrit la viande et adoucit son goût prononcé.", "<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>Faites revenir la poudre à colombo<\/strong> avant d'ajouter l'eau : c'est ce qui lui donne toute sa saveur. Mais attention, brûlée elle devient amère.", "<strong>Encore meilleur le lendemain<\/strong> : préparez-le la veille et réchauffez-le doucement. Il se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la mangue verte<\/strong> : comme en Guadeloupe, ajoutez 2 mangues vertes épluchées et coupées en morceaux avec les aubergines, pour une pointe d'acidité.", "<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse.", "<strong>À l'autocuiseur<\/strong> : après l'étape 5, faites cuire la viande <strong>40 minutes<\/strong> sous pression, puis ajoutez tous les légumes et faites cuire encore <strong>8 minutes<\/strong> sous pression."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, lentilles mijotées, bananes pesées, avec un peu de sauce chien. C'est le plat traditionnel des fêtes, notamment de <strong>Pâques<\/strong> aux Antilles."}]}]}], "steps": [{"label": "", "title": "Nettoyer la viande", "body": "Frottez les morceaux de cabri avec le jus de 2 citrons verts et rincez-les à l'eau froide. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un grand saladier, mélangez le jus d'un citron vert, 8 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), les branches de thym, du sel et du poivre. Enrobez-en bien la viande, couvrez et laissez mariner <strong>une nuit<\/strong> au réfrigérateur."}, {"label": "", "title": "Faire dorer le cabri", "body": "Dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de cabri sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les."}, {"label": "", "title": "Les aromates", "body": "Émincez les oignons et les cives. Dans la même cocotte, faites-les revenir 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter la viande", "body": "Remettez le cabri et sa marinade dans la cocotte, ajoutez les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>1 h 30<\/strong> à feu doux, en remuant de temps en temps. Ajoutez un peu d'eau si la sauce réduit trop."}, {"label": "", "title": "Les légumes", "body": "Pendant ce temps, épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Ajoutez les pommes de terre et les christophines dans la cocotte et poursuivez la cuisson <strong>30 minutes<\/strong>, à couvert."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert. La viande doit se détacher facilement de l'os, les légumes être fondants et la sauce un peu épaisse."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "colombo-de-crevettes", "name": "Colombo de crevettes", "nameHtml": "Colombo de crevettes", "subtitle": "8 à 10 personnes", "emoji": "🦐", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Crevettes et marinade", "blocks": [{"t": "ul", "items": ["2 kg de crevettes crues décortiquées (environ 3,5 kg de crevettes entières), fraîches ou surgelées", "4 citrons verts", "8 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 tomates", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 litre d'eau (ou de fumet de poisson)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préparer les crevettes<\/strong> : si elles sont surgelées, faites-les décongeler une nuit au réfrigérateur. Décortiquez-les en gardant éventuellement la queue, puis incisez le dos et retirez le petit boyau noir. Rincez-les à l'eau froide et séchez-les.", "<strong>La marinade<\/strong> : dans un saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en les crevettes, couvrez et laissez mariner <strong>30 minutes<\/strong> au réfrigérateur, <strong>pas plus<\/strong>.", "<strong>Préparer les légumes<\/strong> : épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés, les tomates en morceaux. Émincez les oignons et les cives.", "<strong>Les aromates<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter les légumes<\/strong> : ajoutez les pommes de terre, les christophines, les tomates, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>20 minutes<\/strong> à feu doux.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 minutes<\/strong>, à couvert. Les légumes doivent être tendres et la sauce un peu épaisse.", "<strong>Les crevettes<\/strong> : ajoutez les crevettes et leur marinade, mélangez et laissez cuire <strong>4 à 5 minutes<\/strong> à feu doux, à couvert, jusqu'à ce qu'elles soient <strong>roses et opaques<\/strong>. Ne prolongez pas la cuisson.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez aussitôt avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les crevettes cuisent en quelques minutes<\/strong> : trop cuites, elles deviennent caoutchouteuses. Ajoutez-les seulement quand les légumes sont cuits.", "<strong>Pas plus de 30 minutes de marinade<\/strong> : le citron vert « cuit » les crevettes et les rend farineuses s'il agit trop longtemps.", "<strong>Retirez le boyau noir<\/strong> le long du dos : il peut donner un goût amer et une texture sableuse.", "<strong>Pour une sauce plus parfumée<\/strong>, faites revenir les têtes et les carapaces dans un peu d'huile, couvrez d'eau, laissez frémir 15 minutes et filtrez : utilisez ce bouillon à la place de l'eau.", "<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>À consommer rapidement<\/strong> : il se garde 2 jours au réfrigérateur. Réchauffez-le doucement, juste le temps que la sauce soit chaude, pour ne pas recuire les crevettes."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Aux ouassous<\/strong> : remplacez les crevettes par des ouassous (grosses écrevisses des rivières antillaises), entiers ou décortiqués, cuits <strong>6 à 8 minutes<\/strong>.", "<strong>Avec du poisson<\/strong> : mélangez 1 kg de crevettes et 1,5 kg de poisson à chair ferme (voir la recette de colombo de poisson).", "<strong>Sans légumes, plus rapide<\/strong> : faites revenir les aromates et le colombo, ajoutez les tomates et le lait de coco, laissez réduire 10 minutes, puis ajoutez les crevettes.", "<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, bananes pesées, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Préparer les crevettes", "body": "Si elles sont surgelées, faites-les décongeler une nuit au réfrigérateur. Décortiquez-les en gardant éventuellement la queue, puis incisez le dos et retirez le petit boyau noir. Rincez-les à l'eau froide et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en les crevettes, couvrez et laissez mariner <strong>30 minutes<\/strong> au réfrigérateur, <strong>pas plus<\/strong>."}, {"label": "", "title": "Préparer les légumes", "body": "Épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés, les tomates en morceaux. Émincez les oignons et les cives."}, {"label": "", "title": "Les aromates", "body": "Dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter les légumes", "body": "Ajoutez les pommes de terre, les christophines, les tomates, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>20 minutes<\/strong> à feu doux."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 minutes<\/strong>, à couvert. Les légumes doivent être tendres et la sauce un peu épaisse."}, {"label": "", "title": "Les crevettes", "body": "Ajoutez les crevettes et leur marinade, mélangez et laissez cuire <strong>4 à 5 minutes<\/strong> à feu doux, à couvert, jusqu'à ce qu'elles soient <strong>roses et opaques<\/strong>. Ne prolongez pas la cuisson."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez aussitôt avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "colombo-de-poisson", "name": "Colombo de poisson", "nameHtml": "Colombo de poisson", "subtitle": "8 à 10 personnes", "emoji": "🐠", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Poisson et marinade", "blocks": [{"t": "ul", "items": ["2,5 kg de poisson à chair ferme, en darnes ou en gros morceaux de 5 cm (acoupa, vivaneau, mérou, thon, mahi-mahi, requin)", "4 citrons verts", "8 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 tomates", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 litre d'eau (ou de fumet de poisson)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poisson<\/strong> : rincez les morceaux de poisson à l'eau froide, frottez-les avec le jus de 2 citrons verts, puis rincez-les rapidement à nouveau. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : dans un grand plat, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en délicatement le poisson, couvrez et laissez mariner <strong>1 heure<\/strong> au réfrigérateur, <strong>pas plus<\/strong>.", "<strong>Préparer les légumes<\/strong> : épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés, les tomates en morceaux. Émincez les oignons et les cives.", "<strong>Les aromates<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter les légumes<\/strong> : ajoutez les pommes de terre, les christophines, les tomates, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>20 minutes<\/strong> à feu doux.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>15 minutes<\/strong>, à couvert. Les légumes doivent être presque tendres et la sauce commencer à épaissir.", "<strong>Le poisson<\/strong> : déposez délicatement les morceaux de poisson et leur marinade sur les légumes, en les enfonçant à moitié dans la sauce. Couvrez et laissez cuire <strong>10 à 15 minutes<\/strong> à feu doux, <strong>sans remuer<\/strong> : secouez simplement la cocotte de temps en temps. Le poisson est cuit quand sa chair devient opaque et se détache en lamelles.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez aussitôt avec du riz blanc, en prenant soin de ne pas briser le poisson."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez un poisson à chair ferme<\/strong> qui se tient à la cuisson. L'acoupa, le vivaneau, le mérou ou le thon sont parfaits ; les poissons fragiles (cabillaud, merlan) se défont en miettes.", "<strong>Pas plus d'une heure de marinade<\/strong> : le citron vert « cuit » la chair du poisson et la rend farineuse s'il agit trop longtemps.", "<strong>Le poisson en dernier<\/strong> : il cuit très vite. Les légumes doivent être presque cuits avant de l'ajouter.", "<strong>Ne remuez pas<\/strong> une fois le poisson dans la cocotte, sinon il s'effrite. Secouez la cocotte ou arrosez-le de sauce avec une cuillère.", "<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>À consommer rapidement<\/strong> : le colombo de poisson se garde 2 jours au réfrigérateur et se réchauffe doucement, à couvert, sans remuer."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Colombo de crevettes<\/strong> : remplacez le poisson par 2 kg de crevettes décortiquées, ajoutées pour les <strong>5 dernières minutes<\/strong> de cuisson seulement (voir la recette de colombo de crevettes).", "<strong>Colombo de morue<\/strong> : avec 1,5 kg de morue dessalée la veille dans plusieurs eaux, en gros morceaux, ajoutée pour les 10 dernières minutes. Ne salez pas la sauce.", "<strong>Colombo de requin<\/strong> : le requin (ou le cazon) a une chair très ferme qui supporte bien la cuisson ; ajoutez-le 20 minutes avant la fin.", "<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, bananes pesées, lentilles mijotées, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Nettoyer le poisson", "body": "Rincez les morceaux de poisson à l'eau froide, frottez-les avec le jus de 2 citrons verts, puis rincez-les rapidement à nouveau. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un grand plat, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en délicatement le poisson, couvrez et laissez mariner <strong>1 heure<\/strong> au réfrigérateur, <strong>pas plus<\/strong>."}, {"label": "", "title": "Préparer les légumes", "body": "Épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés, les tomates en morceaux. Émincez les oignons et les cives."}, {"label": "", "title": "Les aromates", "body": "Dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter les légumes", "body": "Ajoutez les pommes de terre, les christophines, les tomates, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>20 minutes<\/strong> à feu doux."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>15 minutes<\/strong>, à couvert. Les légumes doivent être presque tendres et la sauce commencer à épaissir."}, {"label": "", "title": "Le poisson", "body": "Déposez délicatement les morceaux de poisson et leur marinade sur les légumes, en les enfonçant à moitié dans la sauce. Couvrez et laissez cuire <strong>10 à 15 minutes<\/strong> à feu doux, <strong>sans remuer<\/strong> : secouez simplement la cocotte de temps en temps. Le poisson est cuit quand sa chair devient opaque et se détache en lamelles."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez aussitôt avec du riz blanc, en prenant soin de ne pas briser le poisson."}], "categorySlug": "plats"}, {"slug": "colombo-de-porc", "name": "Colombo de porc", "nameHtml": "Colombo de porc", "subtitle": "8 à 10 personnes", "emoji": "🐖", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["3 kg d'échine ou de palette de porc, coupée en gros cubes de 5 cm (ou un mélange échine et travers)", "4 citrons verts", "8 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1,5 litre d'eau (ou de bouillon)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer la viande<\/strong> : frottez les cubes de porc avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en bien la viande, couvrez et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Faire dorer le porc<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les cubes de porc sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les.", "<strong>Les aromates<\/strong> : émincez les oignons et les cives. Dans la même cocotte, faites-les revenir 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter la viande<\/strong> : remettez le porc et sa marinade dans la cocotte, ajoutez le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>45 minutes<\/strong> à feu doux.", "<strong>Les légumes<\/strong> : pendant ce temps, épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Ajoutez les pommes de terre et les christophines dans la cocotte et poursuivez la cuisson <strong>30 minutes<\/strong>, à couvert.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. La viande doit être très tendre, les légumes fondants et la sauce un peu épaisse.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez un morceau un peu gras<\/strong> comme l'échine ou la palette : il reste fondant après la longue cuisson. Le filet, trop maigre, devient sec.", "<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>Faites revenir la poudre à colombo<\/strong> avant d'ajouter l'eau : c'est ce qui lui donne toute sa saveur. Mais attention, brûlée elle devient amère.", "<strong>L'ail cru et le citron vert ajoutés à la fin<\/strong> donnent au colombo sa fraîcheur caractéristique : ne les supprimez pas.", "<strong>La sauce est trop liquide ?<\/strong> Écrasez quelques morceaux de pomme de terre ou d'aubergine dans la sauce et laissez réduire quelques minutes sans couvercle.", "<strong>Encore meilleur le lendemain<\/strong> : le colombo de porc gagne à être préparé la veille et réchauffé doucement. Il se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse.", "<strong>À l'autocuiseur<\/strong> : après l'étape 5, faites cuire la viande <strong>25 minutes<\/strong> sous pression, puis ajoutez tous les légumes et faites cuire encore <strong>8 minutes<\/strong> sous pression.", "<strong>Avec de la queue de cochon<\/strong> : ajoutez 1 kg de queue de cochon salée, dessalée la veille dans plusieurs eaux, en même temps que la viande."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, lentilles mijotées, bananes pesées, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Nettoyer la viande", "body": "Frottez les cubes de porc avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à co
