<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes recettes</title>
<style>
  :root {
    --bg: #17120f;
    --surface: #241c17;
    --surface-2: #30261f;
    --text: #f5ece3;
    --muted: #bba999;
    --accent: #f4a259;
    --accent-ink: #1d130b;
    --line: #42352b;
    --gutter-x: 4vw;
    --gutter-y: 3vh;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; font-size: clamp(14px, 1.6vw, 48px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  strong { color: #ffd2a6; }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button, a { font: inherit; color: inherit; }

  /* En-tête commun */
  .top {
    display: flex; align-items: center; gap: 1.5rem;
    padding: var(--gutter-y) var(--gutter-x) 1.2rem;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 2.2rem; font-weight: 750; }
  .top .sub { color: var(--muted); font-size: 1.1rem; margin: .2rem 0 0; }
  .hint { color: var(--muted); font-size: .95rem; }

  .btn {
    background: var(--surface-2); border: 0.15rem solid transparent; border-radius: 0.8rem;
    padding: .6rem 1.2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav:focus { outline: none; }
  .btn:focus, .btn:hover { border-color: var(--text); }
  .btn.primary:focus { box-shadow: 0 0 0 .25rem var(--text); }

  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: .5rem; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: .25rem; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll { flex: 1; overflow-y: auto; padding: 1.8rem var(--gutter-x) var(--gutter-y); }

  /* Accueil */
  .grid {
    display: grid; gap: 1.6rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    align-content: start;
  }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: .5rem;
    background: var(--surface); border-radius: 1.2rem; padding: 1.4rem;
    border: .2rem solid transparent; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:focus, .card:hover { border-color: var(--accent); background: var(--surface-2); transform: scale(1.04); }
  .card .emoji { font-size: 3.2rem; line-height: 1; }
  .card .ctitle { font-size: 1.45rem; font-weight: 700; }
  .card .csub { color: var(--muted); font-size: 1rem; }

  .top.home { flex-wrap: wrap; row-gap: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .8rem; width: 100%; }
  .chip {
    background: var(--surface-2); border: .15rem solid transparent; border-radius: 2rem;
    padding: .35rem 1.1rem; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .chip:focus, .chip:hover { border-color: var(--accent); }
  .chip span { color: var(--muted); font-weight: 400; margin-left: .3rem; }
  .cat + .cat { margin-top: 2.4rem; }
  .cathead { font-size: 1.5rem; color: var(--accent); margin: 0 0 1rem; }

  /* Fiche recette */
  .recipe {
    display: grid; gap: 2rem; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
  }
  .panel { background: var(--surface); border-radius: 1.2rem; padding: 1.4rem 1.6rem; }
  .panel h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: .8rem; }
  .panel h3 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
  .panel p { margin: .4rem 0; font-size: 1.1rem; }
  .panel ul { margin: 0; padding-left: 1.3rem; font-size: 1.15rem; }
  .panel li { margin: .35rem 0; }
  .panel li::marker { color: var(--accent); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; font-size: 1.2rem; }
  ol.steps li { counter-increment: step; position: relative; padding-left: 3rem; margin: 0 0 1rem; min-height: 2.2rem; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: -.1rem;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .extras { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  .extras ul { font-size: 1.05rem; }

  /* Mode pas à pas */
  .progress { height: .4rem; background: var(--surface-2); flex: none; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .stepmain {
    flex: 1; min-height: 0; display: grid; gap: 2.5rem;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
    padding: 2rem var(--gutter-x) 1rem;
  }
  .step { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .stepinner { margin: auto 0; }
  .step .count { color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: .03em; }
  .step .label { color: var(--muted); font-size: 1.2rem; margin: .3rem 0 0; }
  .step .stitle { font-size: 3.4rem; margin: 1rem 0 1.4rem; }
  .step .sbody { font-size: 2.1rem; line-height: 1.4; margin: 0; }
  .step .sbody.long { font-size: 1.65rem; }
  .step .sbody.xlong { font-size: 1.4rem; }
  .side { overflow-y: auto; margin: 0; }
  .side ul { font-size: 1.05rem; }
  .stepfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem var(--gutter-x) var(--gutter-y); flex: none;
  }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  .fade.rev { animation-name: fade-rev; }
  @keyframes fade-rev { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }

  /* Téléphone / petit écran */
  @media (max-width: 700px) {
    html { font-size: 15px; }
    .top { flex-wrap: wrap; }
    .top h1 { font-size: 1.6rem; }
    .recipe, .stepmain { grid-template-columns: 1fr; }
    .extras { grid-template-columns: 1fr; }
    .step .stitle { font-size: 2rem; }
    .step .sbody { font-size: 1.3rem; }
    .stepmain { overflow-y: auto; }
    .stepfoot .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

 3 fois."}, {"label": "", "title": "Blanchir les viandes salées", "body": "Le jour même, plongez-les dans une casserole d'eau froide, portez à ébullition et laissez cuire <strong>15 minutes<\/strong>, puis égouttez. Coupez-les en morceaux, ainsi que le poulet boucané et le jambon."}, {"label": "", "title": "Préparer le poisson", "body": "Ébouillantez le poisson boucané 5 minutes pour le dessaler, égouttez-le, retirez la peau et les arêtes et émiettez-le en gros morceaux."}, {"label": "", "title": "Les aromates", "body": "Hachez les oignons, les cives, l'ail et le persil."}, {"label": "", "title": "Faire revenir", "body": "Dans une très grande marmite, faites chauffer l'huile et faites revenir les aromates 5 minutes. Ajoutez les viandes et faites-les revenir 10 minutes en remuant."}, {"label": "", "title": "La pâte d'awara", "body": "Ajoutez la pâte d'awara et mélangez bien pour enrober les viandes, puis versez l'eau petit à petit en remuant pour obtenir un bouillon homogène."}, {"label": "", "title": "Le premier mijotage", "body": "Ajoutez le thym, le laurier, les clous de girofle, le poivre et le piment <strong>entier<\/strong>, sans le percer. Laissez mijoter à feu doux <strong>1 h 30<\/strong>, en remuant souvent avec une grande cuillère en bois et en raclant bien le fond : le bouillon accroche facilement."}, {"label": "", "title": "Les légumes", "body": "Pendant ce temps, coupez le chou en lanières, les haricots verts en tronçons, les aubergines et les concombres en dés. Ajoutez le chou, les haricots et les aubergines, et laissez mijoter <strong>1 heure<\/strong>."}, {"label": "", "title": "Les fruits de mer", "body": "Ajoutez les concombres, les épinards, les crabes, les crevettes et le poisson émietté. Laissez mijoter encore <strong>1 heure<\/strong>, toujours à feu doux et en remuant régulièrement. Ajoutez un peu d'eau si le bouillon épaissit trop."}, {"label": "", "title": "Le repos", "body": "Goûtez et rectifiez l'assaisonnement, retirez le piment. Laissez reposer le bouillon : il est bien meilleur réchauffé le lendemain, et même le surlendemain."}, {"label": "", "title": "Servir", "body": "Réchauffez le bouillon à feu doux en remuant, et servez-le bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "brioche", "name": "Brioche", "nameHtml": "Brioche", "subtitle": "2 brioches", "emoji": "🍞", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou farine de gruau)", "5 œufs, à température ambiante", "10 cl de lait tiède", "200 g de beurre doux mou, coupé en dés", "70 g de sucre", "20 g de levure de boulanger fraîche (ou 1 sachet de levure sèche, 7 g)", "10 g de sel", "Facultatif : 1 cuillère à soupe de fleur d'oranger ou le zeste d'une orange"]}]}, {"title": "Dorure et décor", "blocks": [{"t": "ul", "items": ["1 jaune d'œuf + 1 cuillère à soupe de lait", "Facultatif : sucre perlé"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez.", "<strong>Le pétrissage<\/strong> : pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol.", "<strong>Le beurre<\/strong> : ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante.", "<strong>Première pousse<\/strong> : couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Le repos au froid<\/strong> : dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner.", "<strong>Le façonnage<\/strong> : divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Un robot pétrisseur est vivement conseillé<\/strong> : la pâte à brioche est très collante et demande un long pétrissage. À la main, comptez 20 à 25 minutes et ne rajoutez pas de farine.", "<strong>Le beurre doit être mou, pas fondu<\/strong> : il doit s'écraser facilement au doigt.", "<strong>Le repos d'une nuit au réfrigérateur<\/strong> rend la brioche plus parfumée et la pâte bien plus facile à façonner. Vous pouvez donc préparer la pâte la veille au soir et cuire le matin.", "<strong>La brioche est cuite<\/strong> quand elle sonne creux lorsqu'on tapote dessous, ou que l'intérieur atteint 90 °C avec un thermomètre.", "<strong>Elle se conserve<\/strong> 2 à 3 jours emballée dans du film alimentaire, et se congèle très bien en tranches : il suffit de les passer au grille-pain."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pépites de chocolat<\/strong> : ajoutez 150 g de pépites de chocolat à la fin du pétrissage.", "<strong>Brioche Nanterre<\/strong> : façonnez 8 boules par brioche et placez-les en deux rangées dans un moule à cake.", "<strong>Brioches individuelles<\/strong> : divisez la pâte en boules de 60 g et faites-les cuire 12 à 15 minutes.", "<strong>Brioche aux pralines roses<\/strong> : ajoutez 150 g de pralines roses concassées au moment du façonnage.", "<strong>Pain perdu<\/strong> : la brioche rassise de quelques jours fait un excellent pain perdu."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol."}, {"label": "", "title": "Le beurre", "body": "Ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante."}, {"label": "", "title": "Première pousse", "body": "Couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Le repos au froid", "body": "Dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner."}, {"label": "", "title": "Le façonnage", "body": "Divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "chocolat-de-communion", "name": "Chocolat de première communion", "nameHtml": "Chocolat de première communion", "subtitle": "environ 20 tasses", "emoji": "🍫", "category": "Boissons", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Chocolat et épices", "blocks": [{"t": "ul", "items": ["500 g de chocolat « pays » (bâtons de cacao pur), ou 400 g de chocolat noir à 70 % + 4 cuillères à soupe de cacao en poudre non sucré", "1 litre d'eau", "2 bâtons de cannelle", "2 étoiles de badiane (anis étoilé)", "2 gousses de vanille", "½ noix de muscade râpée", "Le zeste de 2 citrons verts, prélevé en larges rubans", "1 pincée de sel"]}]}, {"title": "Lait et liaison", "blocks": [{"t": "ul", "items": ["2 litres de lait entier", "2 boîtes de lait concentré non sucré (2 × 410 g)", "1 boîte de lait concentré sucré (397 g)", "3 cuillères à soupe de fécule de maïs (Maïzena)", "Sucre selon votre goût (environ 100 g)", "Facultatif : 50 g de beurre, pour un chocolat plus velouté"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Râper le chocolat<\/strong> : râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux.", "<strong>Faire fondre<\/strong> : dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse.", "<strong>Les épices<\/strong> : fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent.", "<strong>Les laits<\/strong> : versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>.", "<strong>Épaissir<\/strong> : délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère.", "<strong>Goûter<\/strong> : goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu.", "<strong>Filtrer<\/strong> : retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois.", "<strong>Faire mousser<\/strong> : juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser.", "<strong>Servir<\/strong> : servez bien chaud, dans des tasses, avec du pain au beurre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le chocolat pays<\/strong> (bâtons ou boules de cacao pur, sans sucre) donne le goût authentique, plus intense et légèrement amer. On le trouve sur les marchés des Antilles et de Guyane.", "<strong>Remuez souvent et raclez le fond<\/strong> : avec la fécule et le lait concentré, le chocolat attache facilement. Une casserole à fond épais aide beaucoup.", "<strong>Ne faites jamais bouillir fort<\/strong> le chocolat une fois les laits ajoutés : il pourrait déborder et prendre un goût de brûlé.", "<strong>Le lélé<\/strong> est un petit bâton à pointes qu'on fait tourner entre les mains pour faire mousser le chocolat : c'est le geste traditionnel.", "<strong>Préparé à l'avance<\/strong>, le chocolat épaissit en refroidissant : réchauffez-le doucement en ajoutant un peu de lait, en fouettant.", "<strong>Il se conserve<\/strong> 2 à 3 jours au réfrigérateur dans des bouteilles fermées."]}]}]}, {"title": "Tradition", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Aux Antilles et en Guyane, le chocolat de communion est servi lors des grandes fêtes familiales : <strong>premières communions, baptêmes, mariages, Pâques et Noël<\/strong>. On le déguste traditionnellement le matin, bien épais et parfumé, accompagné de <strong>pain au beurre<\/strong> (voir la recette du recueil), de gâteaux et de tourments d'amour."}]}]}], "steps": [{"label": "", "title": "Râper le chocolat", "body": "Râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux."}, {"label": "", "title": "Faire fondre", "body": "Dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse."}, {"label": "", "title": "Les épices", "body": "Fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent."}, {"label": "", "title": "Les laits", "body": "Versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>."}, {"label": "", "title": "Épaissir", "body": "Délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère."}, {"label": "", "title": "Goûter", "body": "Goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu."}, {"label": "", "title": "Filtrer", "body": "Retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois."}, {"label": "", "title": "Faire mousser", "body": "Juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser."}, {"label": "", "title": "Servir", "body": "Servez bien chaud, dans des tasses, avec du pain au beurre."}], "categorySlug": "boissons"}, {"slug": "colombo-de-poulet", "name": "Colombo de poulet", "nameHtml": "Colombo de poulet", "subtitle": "8 à 10 personnes", "emoji": "🍛", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["2 poulets fermiers (environ 3 kg), coupés en morceaux (ou 3 kg de cuisses et hauts de cuisse)", "4 citrons verts", "8 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 litre d'eau (ou de bouillon de volaille)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poulet<\/strong> : frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Préparer les légumes<\/strong> : épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Émincez les oignons et les cives.", "<strong>Faire dorer le poulet<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les.", "<strong>Les aromates<\/strong> : dans la même cocotte, faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter<\/strong> : remettez le poulet et sa marinade dans la cocotte, ajoutez les pommes de terre, les christophines, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>30 minutes<\/strong> à feu doux.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. Les légumes doivent être fondants et la sauce un peu épaisse : les aubergines et les pommes de terre la lient naturellement.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>Faites revenir la poudre à colombo<\/strong> avant d'ajouter l'eau : c'est ce qui lui donne toute sa saveur. Mais attention, brûlée elle devient amère.", "<strong>L'ail cru et le citron vert ajoutés à la fin<\/strong> donnent au colombo sa fraîcheur caractéristique : ne les supprimez pas.", "<strong>La sauce est trop liquide ?<\/strong> Écrasez quelques morceaux de pomme de terre ou d'aubergine dans la sauce et laissez réduire quelques minutes sans couvercle.", "<strong>Comme beaucoup de plats mijotés, le colombo est encore meilleur réchauffé le lendemain.<\/strong> Il se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Colombo de cabri<\/strong> : la version traditionnelle des fêtes, avec 3 kg de viande de cabri (chevreau) en morceaux. Prolongez la cuisson à 1 h 30 avant d'ajouter les aubergines.", "<strong>Colombo de porc<\/strong> : avec 3 kg d'échine ou de palette de porc en cubes, en prolongeant la cuisson de 30 minutes.", "<strong>Colombo de poisson ou de crevettes<\/strong> : faites mijoter les légumes 30 minutes, puis ajoutez le poisson en gros morceaux ou les crevettes pour les 10 dernières minutes seulement.", "<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse."]}]}]}], "steps": [{"label": "", "title": "Nettoyer le poulet", "body": "Frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit."}, {"label": "", "title": "Préparer les légumes", "body": "Épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Émincez les oignons et les cives."}, {"label": "", "title": "Faire dorer le poulet", "body": "Dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les."}, {"label": "", "title": "Les aromates", "body": "Dans la même cocotte, faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter", "body": "Remettez le poulet et sa marinade dans la cocotte, ajoutez les pommes de terre, les christophines, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>30 minutes<\/strong> à feu doux."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. Les légumes doivent être fondants et la sauce un peu épaisse : les aubergines et les pommes de terre la lient naturellement."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "cookies", "name": "Cookies au chocolat", "nameHtml": "Cookies au chocolat", "subtitle": "environ 30 cookies", "emoji": "🍪", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "250 g de beurre doux mou (sorti du réfrigérateur 1 heure avant)", "200 g de sucre roux (cassonade ou vergeoise)", "100 g de sucre en poudre", "2 œufs", "400 g de chocolat noir ou au lait (en pépites, ou une tablette concassée au couteau)", "2 cuillères à café de bicarbonate de soude (ou 1 sachet de levure chimique)", "2 sachets de sucre vanillé", "1 cuillère à café de fleur de sel (ou 2 pincées de sel fin)", "Facultatif : 150 g de noix de pécan ou de noisettes concassées"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Crémer le beurre<\/strong> : dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>.", "<strong>Les œufs<\/strong> : ajoutez les œufs un par un, en mélangeant bien entre chaque.", "<strong>La farine<\/strong> : dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible.", "<strong>Le chocolat<\/strong> : incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule.", "<strong>Le repos<\/strong> : couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson.", "<strong>Façonner<\/strong> : formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler.", "<strong>La cuisson<\/strong> : faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant.", "<strong>Refroidir<\/strong> : laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne prolongez pas la cuisson<\/strong> même si les cookies semblent trop mous à la sortie du four : ils durcissent en refroidissant, et trop cuits ils deviennent secs et cassants.", "<strong>Le sucre roux<\/strong> donne des cookies moelleux et un goût de caramel ; plus il y a de sucre blanc, plus ils sont croustillants.", "<strong>Pour des cookies bien ronds<\/strong>, posez un grand verre retourné autour de chaque cookie dès la sortie du four et faites-le tourner pour arrondir les bords.", "<strong>Pour un aspect gourmand<\/strong>, enfoncez quelques pépites de chocolat sur le dessus des boules avant la cuisson et saupoudrez d'une pincée de fleur de sel en sortant du four.", "<strong>La pâte se congèle très bien<\/strong> en boules : faites-les cuire directement sans décongeler, en ajoutant 2 minutes de cuisson.", "<strong>Les cookies se conservent<\/strong> une semaine dans une boîte en métal hermétique. Ajoutez une tranche de pain de mie dans la boîte : ils resteront moelleux."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Double chocolat<\/strong> : remplacez 60 g de farine par 60 g de cacao en poudre non sucré.", "<strong>Chocolat blanc et cranberries<\/strong> : remplacez le chocolat noir par 250 g de chocolat blanc et 150 g de cranberries séchées.", "<strong>Beurre de cacahuète<\/strong> : remplacez 100 g de beurre par 150 g de beurre de cacahuète et ajoutez des cacahuètes concassées.", "<strong>M&amp;M's<\/strong> : remplacez la moitié du chocolat par des bonbons chocolatés colorés, enfoncés sur le dessus avant la cuisson."]}]}]}], "steps": [{"label": "", "title": "Crémer le beurre", "body": "Dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>."}, {"label": "", "title": "Les œufs", "body": "Ajoutez les œufs un par un, en mélangeant bien entre chaque."}, {"label": "", "title": "La farine", "body": "Dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible."}, {"label": "", "title": "Le chocolat", "body": "Incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule."}, {"label": "", "title": "Le repos", "body": "Couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Façonner", "body": "Formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant."}, {"label": "", "title": "Refroidir", "body": "Laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."}], "categorySlug": "patisseries"}, {"slug": "creme-patissiere", "name": "Crème pâtissière", "nameHtml": "Crème pâtissière", "subtitle": "environ 1,3 kg de crème", "emoji": "🍨", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 litre de lait entier", "8 jaunes d'œufs", "200 g de sucre", "80 g de fécule de maïs (Maïzena), ou 100 g de farine", "2 gousses de vanille (ou 4 cuillères à café d'extrait de vanille)", "Facultatif : 50 g de beurre doux, pour une crème plus onctueuse et plus brillante"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Infuser la vanille<\/strong> : fendez les gousses de vanille en deux et grattez les graines. Dans une casserole, faites chauffer le lait avec les gousses et les graines jusqu'à frémissement. Retirez du feu, couvrez et laissez infuser 10 minutes, puis retirez les gousses.", "<strong>Blanchir les jaunes<\/strong> : dans un saladier, fouettez les jaunes d'œufs avec le sucre jusqu'à ce que le mélange <strong>blanchisse<\/strong> légèrement.", "<strong>La fécule<\/strong> : ajoutez la fécule de maïs et fouettez jusqu'à obtenir un mélange lisse, sans grumeaux.", "<strong>Verser le lait chaud<\/strong> : versez le lait chaud petit à petit sur le mélange, en fouettant sans arrêt.", "<strong>Cuire la crème<\/strong> : reversez le tout dans la casserole et faites cuire à feu moyen <strong>en fouettant sans arrêt<\/strong>, surtout au fond et sur les bords. Quand la crème épaissit et que les premières bulles apparaissent, comptez encore <strong>1 à 2 minutes<\/strong> de cuisson, toujours en fouettant, pour que la fécule perde son goût.", "<strong>Le beurre<\/strong> (facultatif) : hors du feu, ajoutez le beurre en morceaux et fouettez jusqu'à ce qu'il soit complètement fondu.", "<strong>Refroidir rapidement<\/strong> : versez aussitôt la crème dans un plat large et peu profond. Couvrez-la de film alimentaire <strong>au contact<\/strong>, directement posé sur la crème, pour qu'elle ne forme pas de croûte.", "<strong>Le repos<\/strong> : laissez refroidir à température ambiante, puis placez la crème <strong>au moins 2 heures au réfrigérateur<\/strong>.", "<strong>Avant utilisation<\/strong> : fouettez la crème froide quelques secondes pour la rendre à nouveau lisse et souple, puis garnissez."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Fécule ou farine ?<\/strong> La fécule de maïs donne une crème plus légère et plus lisse ; la farine, une crème plus ferme et un peu plus « pâtissière » en goût.", "<strong>Si la crème fait des grumeaux<\/strong>, passez-la au mixeur plongeant ou au tamis dès qu'elle est cuite, pendant qu'elle est encore chaude.", "<strong>Le film au contact est indispensable<\/strong> : sans lui, une croûte se forme à la surface et laisse des morceaux dans la crème.", "<strong>Refroidissez-la vite et gardez-la au froid<\/strong> : c'est une crème fragile à base d'œufs. Elle se conserve <strong>2 jours maximum<\/strong> au réfrigérateur et ne se congèle pas bien.", "<strong>Pour une crème plus légère<\/strong> (crème diplomate), incorporez délicatement 25 cl de crème liquide montée en chantilly dans la crème pâtissière froide.", "<strong>Les 8 blancs restants<\/strong> se conservent 3 jours au réfrigérateur ou se congèlent : ils serviront pour des meringues, des macarons, des financiers ou des tuiles."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Chocolat<\/strong> : ajoutez 150 g de chocolat noir haché dans la crème chaude, juste après la cuisson, et fouettez jusqu'à ce qu'il fonde.", "<strong>Café<\/strong> : ajoutez 2 cuillères à soupe de café soluble dans le lait chaud.", "<strong>Praliné<\/strong> : incorporez 150 g de pâte de praliné dans la crème refroidie.", "<strong>Citron<\/strong> : remplacez la vanille par le zeste de 3 citrons infusé dans le lait.", "<strong>Rhum ou fleur d'oranger<\/strong> : ajoutez 2 cuillères à soupe de rhum ou de fleur d'oranger dans la crème refroidie."]}]}]}, {"title": "Idées d'utilisation", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Choux à la crème, éclairs, religieuses (avec la pâte à choux du recueil), tarte aux fraises ou aux fruits (avec la pâte sablée), mille-feuille (avec la pâte feuilletée), fraisier (avec la génoise), chaussons, brioches fourrées, galette des rois."}]}]}], "steps": [{"label": "", "title": "Infuser la vanille", "body": "Fendez les gousses de vanille en deux et grattez les graines. Dans une casserole, faites chauffer le lait avec les gousses et les graines jusqu'à frémissement. Retirez du feu, couvrez et laissez infuser 10 minutes, puis retirez les gousses."}, {"label": "", "title": "Blanchir les jaunes", "body": "Dans un saladier, fouettez les jaunes d'œufs avec le sucre jusqu'à ce que le mélange <strong>blanchisse<\/strong> légèrement."}, {"label": "", "title": "La fécule", "body": "Ajoutez la fécule de maïs et fouettez jusqu'à obtenir un mélange lisse, sans grumeaux."}, {"label": "", "title": "Verser le lait chaud", "body": "Versez le lait chaud petit à petit sur le mélange, en fouettant sans arrêt."}, {"label": "", "title": "Cuire la crème", "body": "Reversez le tout dans la casserole et faites cuire à feu moyen <strong>en fouettant sans arrêt<\/strong>, surtout au fond et sur les bords. Quand la crème épaissit et que les premières bulles apparaissent, comptez encore <strong>1 à 2 minutes<\/strong> de cuisson, toujours en fouettant, pour que la fécule perde son goût."}, {"label": "", "title": "", "body": "<strong>Le beurre<\/strong> (facultatif) : hors du feu, ajoutez le beurre en morceaux et fouettez jusqu'à ce qu'il soit complètement fondu."}, {"label": "", "title": "Refroidir rapidement", "body": "Versez aussitôt la crème dans un plat large et peu profond. Couvrez-la de film alimentaire <strong>au contact<\/strong>, directement posé sur la crème, pour qu'elle ne forme pas de croûte."}, {"label": "", "title": "Le repos", "body": "Laissez refroidir à température ambiante, puis placez la crème <strong>au moins 2 heures au réfrigérateur<\/strong>."}, {"label": "", "title": "Avant utilisation", "body": "Fouettez la crème froide quelques secondes pour la rendre à nouveau lisse et souple, puis garnissez."}], "categorySlug": "bases"}, {"slug": "crepes", "name": "Crêpes classiques", "nameHtml": "Crêpes classiques", "subtitle": "environ 30 crêpes", "emoji": "🫓", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "4 œufs", "1 litre de lait (entier de préférence)", "2 pincées de sel", "2 cuillères à soupe de sucre (facultatif, pour des crêpes sucrées)", "100 g de beurre fondu (ou 4 cuillères à soupe d'huile)", "Facultatif : 2 sachets de sucre vanillé, 2 cuillères à soupe de rhum ou de fleur d'oranger"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Le mélange<\/strong> : versez la farine dans un grand saladier et creusez un puits au centre. Ajoutez-y les œufs, le sel et le sucre.", "<strong>Le lait<\/strong> : mélangez au fouet en versant le lait <strong>petit à petit<\/strong> pour éviter les grumeaux.", "<strong>Le beurre<\/strong> : incorporez le beurre fondu, puis l'arôme si vous en mettez un. La pâte doit être fluide, comme une crème liquide.", "<strong>Le repos<\/strong> : laissez reposer la pâte <strong>1 heure<\/strong> à température ambiante. Ce n'est pas obligatoire, mais les crêpes seront plus souples.", "<strong>La cuisson<\/strong> : chauffez une poêle bien chaude et graissez-la légèrement avec un papier absorbant imbibé d'huile ou de beurre. Versez une petite louche de pâte et inclinez la poêle pour l'étaler en couche fine.", "<strong>Retourner<\/strong> : quand les bords se décollent et dorent (environ 1 à 2 minutes), retournez la crêpe et laissez cuire 30 secondes à 1 minute de l'autre côté."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>S'il y a des grumeaux<\/strong>, passez la pâte au mixeur plongeant quelques secondes.", "<strong>Si la pâte est trop épaisse<\/strong>, ajoutez un peu de lait ou d'eau.", "<strong>La première crêpe est souvent ratée<\/strong>, c'est normal : elle sert à bien graisser et chauffer la poêle.", "Pour les garder chaudes, empilez-les sur une assiette posée sur une casserole d'eau frémissante et couvrez-les.", "Avec cette quantité, utiliser <strong>deux poêles en même temps<\/strong> fait gagner beaucoup de temps."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre et citron, Nutella, confiture, caramel au beurre salé, banane et chocolat, ou crème de marrons."}]}]}], "steps": [{"label": "", "title": "Le mélange", "body": "Versez la farine dans un grand saladier et creusez un puits au centre. Ajoutez-y les œufs, le sel et le sucre."}, {"label": "", "title": "Le lait", "body": "Mél : "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules ronds de 24 cm, ou recouvrez leur fond d'un disque de papier cuisson.", "<strong>Le bain-marie<\/strong> : dans un grand saladier résistant à la chaleur, mettez les œufs entiers, le sucre, le sucre vanillé et le sel. Posez-le sur une casserole d'eau <strong>frémissante<\/strong>, sans que le fond touche l'eau.", "<strong>Fouetter à chaud<\/strong> : fouettez sans arrêt, de préférence au batteur électrique, jusqu'à ce que le mélange soit tiède au doigt (<strong>45 à 50 °C<\/strong>) et ait doublé de volume, environ 5 minutes.", "<strong>Fouetter à froid<\/strong> : retirez le saladier du bain-marie et continuez de fouetter à grande vitesse <strong>8 à 10 minutes<\/strong>, jusqu'à ce que le mélange ait refroidi et triplé de volume. Il est prêt quand il forme un <strong>ruban<\/strong> épais qui reste quelques secondes à la surface quand on soulève le fouet.", "<strong>La farine<\/strong> : tamisez la farine en trois fois au-dessus du saladier, en l'incorporant à chaque fois <strong>très délicatement<\/strong> avec une spatule, en soulevant la pâte du fond vers le dessus. Arrêtez dès qu'il n'y a plus de farine visible : la pâte ne doit pas retomber.", "<strong>Le beurre<\/strong> (facultatif) : prélevez 2 cuillères de pâte, mélangez-les avec le beurre fondu tiède, puis reversez ce mélange dans le saladier et incorporez-le délicatement.", "<strong>Remplir les moules<\/strong> : répartissez la pâte dans les deux moules et lissez la surface sans appuyer.", "<strong>La cuisson<\/strong> : enfournez aussitôt et faites cuire <strong>20 à 25 minutes<\/strong>, sans ouvrir le four pendant les 15 premières minutes. La génoise est cuite quand elle est dorée, se décolle des bords et reprend sa forme quand on appuie doucement dessus.", "<strong>Démouler<\/strong> : démoulez dès la sortie du four sur une grille et laissez refroidir complètement avant de couper ou de garnir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le ruban est l'étape clé<\/strong> : c'est l'air emprisonné dans les œufs qui fait lever la génoise, il n'y a pas de levure. Ne raccourcissez pas le temps de fouettage.", "<strong>Ne laissez pas l'eau bouillir<\/strong> sous le saladier, et ne dépassez pas 50 °C : les œufs cuiraient.", "<strong>Pour couper la génoise en deux ou trois disques<\/strong>, attendez qu'elle soit complètement froide, ou mieux, préparez-la la veille et gardez-la emballée dans du film alimentaire.", "<strong>Imbibez toujours la génoise<\/strong> avant de la garnir avec un sirop (10 cl d'eau et 50 g de sucre portés à ébullition, avec éventuellement un trait de rhum, de kirsch ou de jus de fruit) : sinon, elle reste sèche.", "<strong>La génoise se congèle très bien<\/strong> sans garniture, emballée dans du film alimentaire."]}]}]}, {"title": "Biscuit roulé", "subs": [{"title": "", "blocks": [{"t": "p", "html": "La même pâte sert à faire deux bûches ou gâteaux roulés :"}, {"t": "ol", "items": ["Étalez la pâte sur deux plaques recouvertes de papier cuisson, sur environ 1 cm d'épaisseur.", "Faites cuire <strong>8 à 10 minutes à 200 °C<\/strong>, jusqu'à ce que le biscuit soit juste doré.", "Dès la sortie du four, retournez le biscuit sur un torchon humide, retirez le papier et roulez-le dans le torchon. Laissez-le refroidir ainsi, puis déroulez-le, garnissez-le et roulez-le à nouveau."]}]}]}, {"title": "Idées de gâteaux", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Fraisier, forêt-noire, gâteau d'anniversaire à la crème et aux fruits, gâteau au chocolat fourré de ganache, bûche de Noël, gâteau roulé à la confiture, charlotte."}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules ronds de 24 cm, ou recouvrez leur fond d'un disque de papier cuisson."}, {"label": "", "title": "Le bain-marie", "body": "Dans un grand saladier résistant à la chaleur, mettez les œufs entiers, le sucre, le sucre vanillé et le sel. Posez-le sur une casserole d'eau <strong>frémissante<\/strong>, sans que le fond touche l'eau."}, {"label": "", "title": "Fouetter à chaud", "body": "Fouettez sans arrêt, de préférence au batteur électrique, jusqu'à ce que le mélange soit tiède au doigt (<strong>45 à 50 °C<\/strong>) et ait doublé de volume, environ 5 minutes."}, {"label": "", "title": "Fouetter à froid", "body": "Retirez le saladier du bain-marie et continuez de fouetter à grande vitesse <strong>8 à 10 minutes<\/strong>, jusqu'à ce que le mélange ait refroidi et triplé de volume. Il est prêt quand il forme un <strong>ruban<\/strong> épais qui reste quelques secondes à la surface quand on soulève le fouet."}, {"label": "", "title": "La farine", "body": "Tamisez la farine en trois fois au-dessus du saladier, en l'incorporant à chaque fois <strong>très délicatement<\/strong> avec une spatule, en soulevant la pâte du fond vers le dessus. Arrêtez dès qu'il n'y a plus de farine visible : la pâte ne doit pas retomber."}, {"label": "", "title": "", "body": "<strong>Le beurre<\/strong> (facultatif) : prélevez 2 cuillères de pâte, mélangez-les avec le beurre fondu tiède, puis reversez ce mélange dans le saladier et incorporez-le délicatement."}, {"label": "", "title": "Remplir les moules", "body": "Répartissez la pâte dans les deux moules et lissez la surface sans appuyer."}, {"label": "", "title": "La cuisson", "body": "Enfournez aussitôt et faites cuire <strong>20 à 25 minutes<\/strong>, sans ouvrir le four pendant les 15 premières minutes. La génoise est cuite quand elle est dorée, se décolle des bords et reprend sa forme quand on appuie doucement dessus."}, {"label": "", "title": "Démouler", "body": "Démoulez dès la sortie du four sur une grille et laissez refroidir complètement avant de couper ou de garnir."}], "categorySlug": "patisseries"}, {"slug": "pain-au-beurre", "name": "Pain au beurre antillais", "nameHtml": "Pain au beurre antillais", "subtitle": "4 pains moyens", "emoji": "🌴", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45)", "4 œufs, à température ambiante", "35 cl de lait tiède (ou moitié lait, moitié lait concentré non sucré)", "250 g de beurre doux mou, coupé en dés", "200 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "15 g de sel", "2 cuillères à café d'extrait de vanille (ou les graines d'une gousse)", "1 cuillère à café de cannelle en poudre", "½ noix de muscade râpée", "Le zeste de 2 citrons verts", "Facultatif : 2 cuillères à soupe de rhum blanc"]}]}, {"title": "Façonnage et dorure", "blocks": [{"t": "ul", "items": ["100 g de beurre doux bien mou", "1 jaune d'œuf + 2 cuillères à soupe de lait (ou de lait concentré sucré, pour une croûte plus brillante)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait.", "<strong>Le pétrissage<\/strong> : pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique.", "<strong>Le beurre<\/strong> : ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois.", "<strong>Première pousse<\/strong> : formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Diviser<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon.", "<strong>Le façonnage<\/strong> : étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus.", "<strong>Deuxième pousse<\/strong> : déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir sur une grille avant de servir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pliage avec le beurre<\/strong> est ce qui fait le pain au beurre : il s'ouvre légèrement à la cuisson et donne une mie feuilletée et fondante au centre.", "<strong>Le citron vert, la muscade et la vanille<\/strong> donnent le parfum typique des Antilles et de la Guyane : n'hésitez pas à ajuster les épices à votre goût.", "<strong>La pâte est un peu collante<\/strong> : résistez à l'envie d'ajouter de la farine, elle deviendra lisse avec le pétrissage et l'ajout du beurre.", "<strong>Pour gagner du temps le matin<\/strong>, laissez la première pousse se faire au réfrigérateur pendant la nuit. Sortez la pâte 1 heure avant de la façonner.", "<strong>Le pain au beurre se conserve<\/strong> 2 à 3 jours dans un sac en tissu ou emballé, et se congèle très bien. Réchauffez-le quelques minutes au four."]}]}]}, {"title": "Comment le déguster", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Avec un chocolat chaud antillais<\/strong> (chocolat de communion), épais et parfumé à la cannelle, à la muscade et au zeste de citron vert : c'est le duo traditionnel des communions, baptêmes, mariages, de Pâques et de Noël.", "<strong>Au petit-déjeuner<\/strong>, nature, tartiné de beurre salé ou de confiture de goyave.", "<strong>En pain perdu<\/strong>, quand il a un ou deux jours."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et une pincée de sucre dans un peu de lait tiède (prélevé sur les 35 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier ou le bol d'un robot, mélangez la farine, le sucre, le sel, la cannelle, la muscade et le zeste de citron vert. Creusez un puits, ajoutez la levure, les œufs, la vanille, le rhum si vous en mettez et le reste du lait."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez <strong>10 minutes<\/strong> (au robot à vitesse moyenne, ou à la main sur un plan de travail fariné), jusqu'à ce que la pâte soit lisse et élastique."}, {"label": "", "title": "Le beurre", "body": "Ajoutez les dés de beurre en plusieurs fois, en pétrissant bien entre chaque ajout. Continuez <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte soit souple, brillante et se décolle des parois."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Diviser", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Formez des boules et laissez-les reposer 10 minutes sous un torchon."}, {"label": "", "title": "Le façonnage", "body": "Étalez chaque boule au rouleau en un disque d'environ 1 cm d'épaisseur. <strong>Tartinez-le généreusement de beurre mou<\/strong>, puis repliez-le en deux, comme un chausson, sans souder les bords. Avec un couteau, faites quelques entailles en éventail sur le dessus."}, {"label": "", "title": "Deuxième pousse", "body": "Déposez les pains sur des plaques recouvertes de papier cuisson, couvrez d'un torchon et laissez lever encore <strong>1 heure<\/strong>, jusqu'à ce qu'ils soient bien gonflés."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, puis badigeonnez délicatement les pains au pinceau."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les pains soient bien dorés et sonnent creux quand on tapote dessous. S'ils colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir sur une grille avant de servir."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pain", "name": "Pain maison", "nameHtml": "Pain maison", "subtitle": "2 gros pains ou 4 baguettes", "emoji": "🥖", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T65, dite « farine à pain »)", "65 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "20 g de sel"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène.", "<strong>Le pétrissage<\/strong> : pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts.", "<strong>Première pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four.", "<strong>Grigner<\/strong> : juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé.", "<strong>La cuisson<\/strong> : enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée.", "<strong>Refroidir<\/strong> : laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le pain est cuit<\/strong> quand il sonne creux lorsqu'on tapote sous sa base.", "<strong>La vapeur<\/strong> au début de la cuisson permet au pain de bien gonfler et donne une croûte croustillante et brillante.", "<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : mélangez-le d'abord à la farine.", "<strong>Pour un pain plus savoureux, à la mie plus alvéolée<\/strong>, faites la première pousse au réfrigérateur pendant 12 à 24 heures, puis laissez la pâte revenir 1 heure à température ambiante avant de la façonner.", "<strong>Le pain se congèle très bien<\/strong> : emballez-le une fois complètement refroidi et réchauffez-le 10 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pain complet<\/strong> : remplacez la moitié de la farine T65 par de la farine complète (T150) et ajoutez 5 cl d'eau.", "<strong>Pain aux céréales<\/strong> : ajoutez 150 g de graines (tournesol, lin, sésame, courge) au moment du mélange.", "<strong>Pain aux noix<\/strong> : ajoutez 200 g de cerneaux de noix concassés à la fin du pétrissage.", "<strong>Pain aux olives<\/strong> : ajoutez 200 g d'olives dénoyautées et coupées en morceaux à la fin du pétrissage."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans un peu d'eau tiède (prélevée sur les 65 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure et le reste de l'eau, puis mélangez jusqu'à obtenir une pâte homogène."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez la pâte sur un plan de travail légèrement fariné pendant <strong>10 à 15 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, élastique et qu'elle se détache des doigts."}, {"label": "", "title": "Première pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, divisez-la en 2 (ou en 4 pour des baguettes), puis façonnez des boules, des pains allongés ou des baguettes. Déposez-les sur une plaque recouverte de papier cuisson et farinée."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever encore <strong>45 minutes à 1 heure<\/strong>."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>240 °C<\/strong> en plaçant un récipient vide (lèchefrite ou plat en métal) sur la sole ou en bas du four."}, {"label": "", "title": "Grigner", "body": "Juste avant d'enfourner, saupoudrez les pains d'un peu de farine et faites quelques entailles nettes et peu profondes sur le dessus avec une lame ou un couteau bien aiguisé."}, {"label": "", "title": "La cuisson", "body": "Enfournez, puis versez aussitôt un verre d'eau dans le récipient chaud pour créer de la vapeur et refermez vite la porte. Faites cuire <strong>30 à 35 minutes<\/strong> pour les gros pains, <strong>20 à 25 minutes<\/strong> pour les baguettes, jusqu'à ce que la croûte soit bien dorée."}, {"label": "", "title": "Refroidir", "body": "Laissez refroidir les pains sur une grille au moins 30 minutes avant de les couper."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "pancakes", "name": "Pancakes moelleux", "nameHtml": "Pancakes moelleux", "subtitle": "environ 24 pancakes", "emoji": "🥞", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "2 sachets de levure chimique (22 g)", "4 œufs", "60 cl de lait", "100 g de beurre fondu", "80 g de sucre", "2 sachets de sucre vanillé", "2 pincées de sel"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Le mélange sec<\/strong> : dans un grand saladier, mélangez la farine, la levure, le sucre, le sucre vanillé et le sel.", "<strong>Le mélange liquide<\/strong> : dans un autre bol, battez les œufs avec le lait, puis ajoutez le beurre fondu (tiédi).", "<strong>Assembler<\/strong> : versez le mélange liquide sur le mélange sec et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible. Quelques petits grumeaux ne sont pas un problème. La pâte doit être épaisse et napper la cuillère.", "<strong>Le repos<\/strong> : laissez reposer 10 à 15 minutes, le temps que la levure commence à agir.", "<strong>La cuisson<\/strong> : chauffez une poêle à <strong>feu moyen<\/strong> et graissez-la légèrement. Versez une petite louche de pâte sans l'étaler : le pancake doit faire environ 10 cm de diamètre et 1 cm d'épaisseur.", "<strong>Retourner<\/strong> : quand des bulles apparaissent à la surface et que les bords semblent secs (environ 2 minutes), retournez le pancake et laissez cuire 1 à 2 minutes de l'autre côté."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne mélangez pas trop la pâte<\/strong> : en la travaillant trop, les pancakes deviennent plats et caoutchouteux.", "<strong>Le feu ne doit pas être trop fort<\/strong>, sinon l'extérieur brûle avant que l'intérieur soit cuit.", "<strong>Pour des pancakes encore plus moelleux<\/strong>, séparez les œufs et incorporez les blancs montés en neige à la fin, ou remplacez le lait par du lait ribot (babeurre).", "Pour les garder chauds, placez-les dans le four à 80 °C, recouverts d'un torchon."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sirop d'érable, miel, beurre, fruits rouges, banane, pépites de chocolat, Nutella, ou bacon grillé pour une version sucrée-salée."}]}]}], "steps": [{"label": "", "title": "Le mélange sec", "body": " , en remuant pour que le beurre fonde complètement.", "<strong>Ajouter la farine<\/strong> : retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène.", "<strong>Dessécher la pâte<\/strong> : remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole.", "<strong>Refroidir<\/strong> : transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant.", "<strong>Les œufs<\/strong> : battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante.", "<strong>Vérifier la consistance<\/strong> : tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf.", "<strong>Dresser<\/strong> : remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères.", "<strong>La cuisson<\/strong> : enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas le four<\/strong> pendant les 20 premières minutes.", "<strong>Sécher<\/strong> : éteignez le four, entrouvrez la porte (coincez une cuillère en bois) et laissez les choux sécher 10 minutes à l'intérieur, puis laissez-les refroidir sur une grille avant de les garnir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les choux retombent à la sortie du four ?<\/strong> Ils n'étaient pas assez cuits : la pâte doit être bien dorée et sèche au toucher. Prolongez la cuisson de quelques minutes la prochaine fois.", "<strong>Ne mettez pas tous les œufs d'office<\/strong> : selon la taille des œufs et le dessèchement de la pâte, il peut en falloir un peu moins. C'est la consistance qui compte.", "<strong>Pour des choux bien ronds et réguliers<\/strong>, aplatissez la pointe de chaque chou avec le dos d'une fourchette trempée dans l'œuf battu, ou posez dessus un disque de craquelin.", "<strong>Le lait<\/strong> donne des choux plus dorés et plus moelleux ; avec seulement de l'eau, ils sont plus croustillants.", "<strong>Les choux cuits se congèlent très bien<\/strong> vides : réchauffez-les 5 minutes à 180 °C pour qu'ils redeviennent croustillants avant de les garnir.", "<strong>Garnissez au dernier moment<\/strong>, sinon la crème ramollit la pâte."]}]}]}, {"title": "Idées de recettes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Sucrées<\/strong> : profiteroles au chocolat, éclairs au café ou au chocolat, chouquettes (parsemées de sucre perlé avant cuisson), choux à la crème pâtissière, paris-brest, religieuses, croquembouche.", "<strong>Salées<\/strong> : gougères au fromage (ajoutez 150 g de comté râpé dans la pâte), choux garnis de mousse de saumon ou de fromage frais aux herbes."]}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>200 °C<\/strong> et recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Faire bouillir", "body": "Dans une grande casserole, portez à ébullition l'eau, le lait, le beurre, le sel et le sucre, en remuant pour que le beurre fonde complètement."}, {"label": "", "title": "Ajouter la farine", "body": "Retirez la casserole du feu et versez <strong>toute la farine d'un coup<\/strong>. Mélangez vivement avec une spatule en bois jusqu'à obtenir une pâte lisse et homogène."}, {"label": "", "title": "Dessécher la pâte", "body": "Remettez la casserole sur feu moyen et remuez sans arrêt pendant <strong>2 à 3 minutes<\/strong>. La pâte est prête quand elle forme une boule qui se détache des parois et qu'un fin film se dépose au fond de la casserole."}, {"label": "", "title": "Refroidir", "body": "Transvasez la pâte dans un grand saladier et laissez-la tiédir 5 minutes en la remuant de temps en temps, pour que les œufs ne cuisent pas en l'ajoutant."}, {"label": "", "title": "Les œufs", "body": "Battez les œufs dans un bol. Incorporez-les <strong>petit à petit<\/strong>, en mélangeant bien à la spatule entre chaque ajout, jusqu'à ce que la pâte soit lisse et brillante."}, {"label": "", "title": "Vérifier la consistance", "body": "Tracez un sillon dans la pâte avec le doigt : il doit se refermer lentement. Quand on soulève la spatule, la pâte doit retomber en formant un <strong>ruban en pointe<\/strong>. Si elle est trop ferme, ajoutez encore un peu d'œuf battu ; arrêtez-vous dès que la bonne texture est atteinte, même s'il reste de l'œuf."}, {"label": "", "title": "Dresser", "body": "Remplissez une poche à douille (douille unie ou cannelée de 10 à 12 mm) et dressez des petits tas de 3 cm pour les choux, ou des boudins de 12 cm pour les éclairs, en les espaçant bien. À défaut de poche, utilisez deux cuillères."}, {"label": "", "title": "La cuisson", "body": "Enfournez, baissez aussitôt le four à <strong>180 °C<\/strong> et faites cuire <strong>25 à 30 minutes<\/strong> pour les choux, <strong>30 à 35 minutes<\/strong> pour les éclairs, jusqu'à ce qu'ils soient bien gonflés et dorés. <strong>N'ouvrez surtout pas le four<\/strong> pendant les 20 premières minutes."}, {"label": "", "title": "Sécher", "body": "Éteignez le four, entrouvrez la porte (coincez une cuillère en bois) et laissez les choux sécher 10 minutes à l'intérieur, puis laissez-les refroidir sur une grille avant de les garnir."}], "categorySlug": "bases"}, {"slug": "pizza", "name": "Pâte à pizza", "nameHtml": "Pâte à pizza", "subtitle": "4 pizzas de 30 cm environ", "emoji": "🍕", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de farine (type T45 ou T55, ou farine italienne « 00 »)", "60 cl d'eau tiède", "2 sachets de levure de boulanger sèche (14 g) ou 40 g de levure fraîche", "4 cuillères à soupe d'huile d'olive", "20 g de sel", "2 cuillères à café de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau.", "<strong>Le pétrissage<\/strong> : mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts.", "<strong>La pousse<\/strong> : formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume.", "<strong>Le façonnage<\/strong> : dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm.", "<strong>La garniture<\/strong> : déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la.", "<strong>La cuisson<\/strong> : enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>L'eau doit être tiède, pas chaude<\/strong> : au-dessus de 40 °C, la levure meurt et la pâte ne lève pas.", "<strong>Ne mettez pas le sel en contact direct avec la levure<\/strong>, il ralentit son action : c'est pour ça qu'on le mélange d'abord à la farine.", "<strong>Pour une pâte plus savoureuse et plus digeste<\/strong>, laissez-la lever 24 à 48 heures au réfrigérateur, puis sortez-la 1 heure avant de l'étaler.", "<strong>Pour une base bien croustillante<\/strong>, préchauffez la plaque (ou une pierre à pizza) dans le four et faites glisser la pizza dessus.", "<strong>La pâte se congèle très bien<\/strong> : après la pousse, emballez les pâtons séparément dans du film alimentaire. Décongelez-les au réfrigérateur la veille."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Margherita<\/strong> : sauce tomate, mozzarella, basilic frais, huile d'olive.", "<strong>Reine<\/strong> : sauce tomate, mozzarella, jambon, champignons.", "<strong>Quatre fromages<\/strong> : mozzarella, gorgonzola, chèvre, parmesan.", "<strong>Végétarienne<\/strong> : sauce tomate, mozzarella, poivrons, oignons, courgettes, olives.", "<strong>Blanche<\/strong> : crème fraîche, mozzarella, lardons, oignons."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure et le sucre dans un peu d'eau tiède (prélevée sur les 60 cl). Laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans un grand saladier, mélangez la farine et le sel. Creusez un puits, versez-y la levure, l'huile d'olive et le reste de l'eau."}, {"label": "", "title": "Le pétrissage", "body": "Mélangez, puis pétrissez la pâte sur un plan de travail fariné pendant <strong>10 minutes<\/strong>, jusqu'à ce qu'elle soit lisse, souple et ne colle plus aux doigts."}, {"label": "", "title": "La pousse", "body": "Formez une boule, placez-la dans un saladier légèrement huilé, couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède. La pâte doit doubler de volume."}, {"label": "", "title": "Le façonnage", "body": "Dégazez la pâte en appuyant dessus, puis divisez-la en 4 pâtons. Étalez chaque pâton à la main (ou au rouleau) en disque d'environ 30 cm."}, {"label": "", "title": "La garniture", "body": "Déposez la pâte sur une plaque farinée ou du papier cuisson, puis garnissez-la."}, {"label": "", "title": "La cuisson", "body": "Enfournez dans un four préchauffé à <strong>250 °C<\/strong> (ou le plus chaud possible) pendant 10 à 15 minutes, jusqu'à ce que les bords soient dorés et le fromage fondu."}], "categorySlug": "bases"}, {"slug": "pate-brisee", "name": "Pâte brisée", "nameHtml": "Pâte brisée", "subtitle": "2 fonds de tarte de 28 cm", "emoji": "🥧", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou T55)", "250 g de beurre doux bien froid, coupé en dés", "10 à 12 cl d'eau très froide", "2 pincées de sel", "Facultatif : 2 jaunes d'œufs (pour une pâte plus riche et plus facile à travailler ; réduisez alors l'eau à 6 à 8 cl)", "Facultatif, pour une tarte sucrée : 2 cuillères à soupe de sucre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Sabler<\/strong> : dans un grand saladier, mélangez la farine et le sel (et le sucre si vous en mettez). Ajoutez les dés de beurre froid et frottez le mélange entre vos doigts jusqu'à obtenir une texture de <strong>sable grossier<\/strong>, sans morceaux de beurre visibles.", "<strong>Ajouter l'eau<\/strong> : creusez un puits, ajoutez les jaunes d'œufs si vous en mettez, puis versez l'eau froide <strong>petit à petit<\/strong> en mélangeant du bout des doigts ou avec une fourchette. Arrêtez       else if (dir === "up") { main = -dy; cross = dx; }
      else { main = dy; cross = dx; }
      if (main <= 1) return;
      var score = main + Math.abs(cross) * 2;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) focusEl(best);
    return !!best;
  }

  function scrollArea(selector, dir) {
    var el = app.querySelector(selector);
    if (el) el.scrollBy({ top: dir * el.clientHeight * 0.45, behavior: "smooth" });
  }

  var BACK_KEYS = { Escape: 1, Backspace: 1, GoBack: 1, BrowserBack: 1 };
  var BACK_CODES = { 4: 1, 27: 1, 461: 1, 10009: 1 };
  var DIRS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Left: "left", Right: "right", Up: "up", Down: "down" };

  document.addEventListener("keydown", function (e) {
    if (BACK_KEYS[e.key] || BACK_CODES[e.keyCode]) {
      if (view.name !== "home") { e.preventDefault(); goBack(); }
      return;
    }
    var dir = DIRS[e.key];
    var enter = e.key === "Enter" || e.key === " " || e.keyCode === 13;
    if (view.name === "step") {
      if (dir === "right" || enter) { e.preventDefault(); changeStep(1); }
      else if (dir === "left") { e.preventDefault(); changeStep(-1); }
      else if (dir === "up" || dir === "down") { e.preventDefault(); scrollArea(".side", dir === "up" ? -1 : 1); }
      return;
    }
    if (dir) {
      e.preventDefault();
      if (!moveFocus(dir) && (dir === "up" || dir === "down")) scrollArea(".scroll", dir === "up" ? -1 : 1);
    }
  });

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-back],[data-step],[data-jump]");
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute("data-jump")) jumpTo(t.getAttribute("data-jump"));
    else if (t.hasAttribute("data-back")) goBack();
    else if (t.hasAttribute("data-step")) changeStep(parseInt(t.getAttribute("data-step"), 10));
    else go(t.getAttribute("data-go"));
  });

  // ---------- Garder l'écran allumé en mode pas à pas (si le navigateur le permet) ----------
  var wakeLock = null;
  function keepAwake(on) {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") keepAwake(view.name === "step");
  });

  render();
})();
</script>
</body>
</html>
