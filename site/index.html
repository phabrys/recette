<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes recettes</title>
<style>
  :root {
    --bg: #17120f;
    --surface: #241c17;
    --surface-2: #30261f;
    --text: #f5ece3;
    --muted: #bba999;
    --accent: #f4a259;
    --accent-ink: #1d130b;
    --line: #42352b;
    --gutter-x: 4vw;
    --gutter-y: 3vh;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; font-size: clamp(14px, 1.6vw, 48px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  strong { color: #ffd2a6; }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button, a { font: inherit; color: inherit; }

  /* En-tête commun */
  .top {
    display: flex; align-items: center; gap: 1.5rem;
    padding: var(--gutter-y) var(--gutter-x) 1.2rem;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 2.2rem; font-weight: 750; }
  .top .sub { color: var(--muted); font-size: 1.1rem; margin: .2rem 0 0; }
  .hint { color: var(--muted); font-size: .95rem; }

  .btn {
    background: var(--surface-2); border: 0.15rem solid transparent; border-radius: 0.8rem;
    padding: .6rem 1.2rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav:focus { outline: none; }
  .btn:focus, .btn:hover { border-color: var(--text); }
  .btn.primary:focus { box-shadow: 0 0 0 .25rem var(--text); }

  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: .5rem; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: .25rem; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll { flex: 1; overflow-y: auto; padding: 1.8rem var(--gutter-x) var(--gutter-y); }

  /* Accueil */
  .grid {
    display: grid; gap: 1.6rem;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    align-content: start;
  }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: .5rem;
    background: var(--surface); border-radius: 1.2rem; padding: 1.4rem;
    border: .2rem solid transparent; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:focus, .card:hover { border-color: var(--accent); background: var(--surface-2); transform: scale(1.04); }
  .card .emoji { font-size: 3.2rem; line-height: 1; }
  .card .ctitle { font-size: 1.45rem; font-weight: 700; }
  .card .csub { color: var(--muted); font-size: 1rem; }

  .catcard { gap: .7rem; }
  .grid.cats { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
  .catcard { padding: 1.2rem 1.4rem; }
  .catcard .emoji { font-size: 2.2rem; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .catcard .ctitle { font-size: 1.4rem; }

  /* Fiche recette */
  .recipe {
    display: grid; gap: 2rem; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
  }
  .panel { background: var(--surface); border-radius: 1.2rem; padding: 1.4rem 1.6rem; }
  .panel h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: .8rem; }
  .panel h3 { font-size: 1.15rem; margin: 1.1rem 0 .4rem; }
  .panel p { margin: .4rem 0; font-size: 1.1rem; }
  .panel ul { margin: 0; padding-left: 1.3rem; font-size: 1.15rem; }
  .panel li { margin: .35rem 0; }
  .panel li::marker { color: var(--accent); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; font-size: 1.2rem; }
  ol.steps li { counter-increment: step; position: relative; padding-left: 3rem; margin: 0 0 1rem; min-height: 2.2rem; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: -.1rem;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .extras { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); }
  .extras ul { font-size: 1.05rem; }

  /* Mode pas à pas */
  .progress { height: .4rem; background: var(--surface-2); flex: none; }
  .progress div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .stepmain {
    flex: 1; min-height: 0; display: grid; gap: 2.5rem;
    grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
    padding: 2rem var(--gutter-x) 1rem;
  }
  .step { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .stepinner { margin: auto 0; }
  .step .count { color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: .03em; }
  .step .label { color: var(--muted); font-size: 1.2rem; margin: .3rem 0 0; }
  .step .stitle { font-size: 3.4rem; margin: 1rem 0 1.4rem; }
  .step .sbody { font-size: 2.1rem; line-height: 1.4; margin: 0; }
  .step .sbody.long { font-size: 1.65rem; }
  .step .sbody.xlong { font-size: 1.4rem; }
  .side { overflow-y: auto; margin: 0; }
  .side ul { font-size: 1.05rem; }
  .stepfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem var(--gutter-x) var(--gutter-y); flex: none;
  }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  .fade.rev { animation-name: fade-rev; }
  @keyframes fade-rev { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }

  /* Téléphone / petit écran */
  @media (max-width: 700px) {
    html { font-size: 15px; }
    .top { flex-wrap: wrap; }
    .top h1 { font-size: 1.6rem; }
    .recipe, .stepmain { grid-template-columns: 1fr; }
    .extras { grid-template-columns: 1fr; }
    .step .stitle { font-size: 2rem; }
    .step .sbody { font-size: 1.3rem; }
    .stepmain { overflow-y: auto; }
    .stepfoot .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

rez-les <strong>délicatement<\/strong> à la pâte.", "<strong>La friture<\/strong> : chauffez l'huile à <strong>170-180 °C<\/strong>. Trempez chaque rondelle de fruit dans la pâte, laissez égoutter l'excédent, puis plongez-la dans l'huile. Faites cuire 2 à 3 minutes en retournant à mi-cuisson, jusqu'à ce que le beignet soit bien doré.", "<strong>Égoutter<\/strong> : déposez les beignets sur du papier absorbant, puis saupoudrez-les de sucre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La bière<\/strong> (ou de l'eau gazeuse) rend la pâte plus légère et croustillante ; l'alcool s'évapore à la cuisson.", "<strong>Sans thermomètre<\/strong>, plongez une goutte de pâte dans l'huile : si elle remonte aussitôt en grésillant, l'huile est prête.", "<strong>Ne mettez pas trop de beignets à la fois<\/strong>, sinon l'huile refroidit et les beignets deviennent gras.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu.", "Sans fruits, cette pâte sert aussi pour des beignets salés (légumes, crevettes, fleurs de courgette) : supprimez alors le sucre et l'arôme."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre glace, sucre à la cannelle, miel, caramel au beurre salé, coulis de fruits rouges ou une boule de glace vanille."}]}]}], "steps": [{"label": "", "title": "Séparer les œufs", "body": "Mettez les blancs de côté dans un bol propre et sec."}, {"label": "", "title": "La pâte", "body": "Dans un grand saladier, mélangez la farine, la levure, le sucre et le sel. Creusez un puits, ajoutez les jaunes d'œufs et l'huile, puis versez le lait (et la bière) <strong>petit à petit<\/strong> en fouettant pour éviter les grumeaux. Ajoutez l'arôme si vous en mettez un."}, {"label": "", "title": "Le repos", "body": "Couvrez et laissez reposer <strong>1 heure<\/strong> à température ambiante."}, {"label": "", "title": "Les fruits", "body": "Épluchez les pommes, retirez le trognon et coupez-les en rondelles d'environ 1 cm. Arrosez-les de jus de citron."}, {"label": "", "title": "Les blancs en neige", "body": "Juste avant la cuisson, montez les blancs en neige ferme avec une pincée de sel et incorporez-les <strong>délicatement<\/strong> à la pâte."}, {"label": "", "title": "La friture", "body": "Chauffez l'huile à <strong>170-180 °C<\/strong>. Trempez chaque rondelle de fruit dans la pâte, laissez égoutter l'excédent, puis plongez-la dans l'huile. Faites cuire 2 à 3 minutes en retournant à mi-cuisson, jusqu'à ce que le beignet soit bien doré."}, {"label": "", "title": "Égoutter", "body": "Déposez les beignets sur du papier absorbant, puis saupoudrez-les de sucre."}], "categorySlug": "desserts"}, {"slug": "bouillon-d-awara", "name": "Bouillon d'awara", "nameHtml": "Bouillon d'awara", "subtitle": "environ 20 personnes", "emoji": "🥘", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Chaque famille guyanaise a sa propre recette : les viandes, les poissons et les légumes varient selon les goûts et ce qu'on trouve au marché."}]}, {"title": "Base", "blocks": [{"t": "ul", "items": ["1 kg de pâte d'awara (en pot ou surgelée)", "3 à 4 litres d'eau"]}]}, {"title": "Viandes et poissons", "blocks": [{"t": "ul", "items": ["1 poulet boucané", "1 kg de queue de cochon salée", "500 g de petit salé (ou lard salé)", "500 g de jambon fumé (ou jarret fumé)", "500 g de poisson boucané (acoupa ou machoiran)", "500 g de crevettes (fraîches ou boucanées)", "6 crabes (crabes de mangrove ou crabes de terre), nettoyés et coupés en deux"]}]}, {"title": "Légumes", "blocks": [{"t": "ul", "items": ["1 chou vert", "1 kg de haricots verts (ou haricots kilomètre)", "4 aubergines", "4 concombres", "500 g d'épinards (ou de feuilles de « zépinard » local)"]}]}, {"title": "Aromates", "blocks": [{"t": "ul", "items": ["4 oignons", "1 botte de cives", "8 gousses d'ail", "1 bouquet de persil", "4 branches de thym et 4 feuilles de laurier", "6 clous de girofle", "1 piment antillais entier (ou plus, selon les goûts)", "Poivre", "4 cuillères à soupe d'huile"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Dessaler les viandes<\/strong> : la veille, mettez la queue de cochon et le petit salé à tremper dans un grand saladier d'eau froide, en changeant l'eau 2 ou 3 fois.", "<strong>Blanchir les viandes salées<\/strong> : le jour même, plongez-les dans une casserole d'eau froide, portez à ébullition et laissez cuire <strong>15 minutes<\/strong>, puis égouttez. Coupez-les en morceaux, ainsi que le poulet boucané et le jambon.", "<strong>Préparer le poisson<\/strong> : ébouillantez le poisson boucané 5 minutes pour le dessaler, égouttez-le, retirez la peau et les arêtes et émiettez-le en gros morceaux.", "<strong>Les aromates<\/strong> : hachez les oignons, les cives, l'ail et le persil.", "<strong>Faire revenir<\/strong> : dans une très grande marmite, faites chauffer l'huile et faites revenir les aromates 5 minutes. Ajoutez les viandes et faites-les revenir 10 minutes en remuant.", "<strong>La pâte d'awara<\/strong> : ajoutez la pâte d'awara et mélangez bien pour enrober les viandes, puis versez l'eau petit à petit en remuant pour obtenir un bouillon homogène.", "<strong>Le premier mijotage<\/strong> : ajoutez le thym, le laurier, les clous de girofle, le poivre et le piment <strong>entier<\/strong>, sans le percer. Laissez mijoter à feu doux <strong>1 h 30<\/strong>, en remuant souvent avec une grande cuillère en bois et en raclant bien le fond : le bouillon accroche facilement.", "<strong>Les légumes<\/strong> : pendant ce temps, coupez le chou en lanières, les haricots verts en tronçons, les aubergines et les concombres en dés. Ajoutez le chou, les haricots et les aubergines, et laissez mijoter <strong>1 heure<\/strong>.", "<strong>Les fruits de mer<\/strong> : ajoutez les concombres, les épinards, les crabes, les crevettes et le poisson émietté. Laissez mijoter encore <strong>1 heure<\/strong>, toujours à feu doux et en remuant régulièrement. Ajoutez un peu d'eau si le bouillon épaissit trop.", "<strong>Le repos<\/strong> : goûtez et rectifiez l'assaisonnement, retirez le piment. Laissez reposer le bouillon : il est bien meilleur réchauffé le lendemain, et même le surlendemain.", "<strong>Servir<\/strong> : réchauffez le bouillon à feu doux en remuant, et servez-le bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le bouillon d'awara se prépare à l'avance<\/strong> : traditionnellement, on le fait cuire plusieurs jours avant Pâques en le réchauffant et en le remuant chaque jour. Ses saveurs se développent avec le temps.", "<strong>Remuez souvent et raclez le fond<\/strong> : la pâte d'awara est épaisse et brûle facilement. Une marmite à fond épais aide beaucoup.", "<strong>Le piment entier<\/strong> parfume sans trop piquer ; s'il éclate, le bouillon devient très fort. Retirez-le avant de servir.", "<strong>Les viandes salées et boucanées<\/strong> donnent tout son goût au bouillon : pensez à bien les dessaler, sinon il sera trop salé. Goûtez avant d'ajouter du sel.", "<strong>La pâte d'awara<\/strong> se trouve en pot ou surgelée sur les marchés et dans les épiceries de Guyane. Faite maison, elle demande de cuire longuement la pulpe des fruits du palmier awara jusqu'à obtenir une pâte orangée et onctueuse.", "<strong>Le bouillon se congèle très bien<\/strong> en portions."]}]}]}, {"title": "Tradition", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Le bouillon d'awara est le plat emblématique de la Guyane, servi en famille à <strong>Pâques<\/strong> et à la <strong>Pentecôte<\/strong>. Une légende dit : « Si tu manges le bouillon d'awara, en Guyane tu reviendras. »"}]}]}], "steps": [{"label": "", "title": "Dessaler les viandes", "body": "La veille, mettez la queue de cochon et le petit salé à tremper dans un grand saladier d'eau froide, en changeant l'eau 2 ou 3 fois."}, {"label": "", "title": "Blanchir les viandes salées", "body": "Le jour même, plongez-les dans une casserole d'eau froide, portez à ébullition et laissez cuire <strong>15 minutes<\/strong>, puis égouttez. Coupez-les en morceaux, ainsi que le poulet boucané et le jambon."}, {"label": "", "title": "Préparer le poisson", "body": "Ébouillantez le poisson boucané 5 minutes pour le dessaler, égouttez-le, retirez la peau et les arêtes et émiettez-le en gros morceaux."}, {"label": "", "title": "Les aromates", "body": "Hachez les oignons, les cives, l'ail et le persil."}, {"label": "", "title": "Faire revenir", "body": "Dans une très grande marmite, faites chauffer l'huile et faites revenir les aromates 5 minutes. Ajoutez les viandes et faites-les revenir 10 minutes en remuant."}, {"label": "", "title": "La pâte d'awara", "body": "Ajoutez la pâte d'awara et mélangez bien pour enrober les viandes, puis versez l'eau petit à petit en remuant pour obtenir un bouillon homogène."}, {"label": "", "title": "Le premier mijotage", "body": "Ajoutez le thym, le laurier, les clous de girofle, le poivre et le piment <strong>entier<\/strong>, sans le percer. Laissez mijoter à feu doux <strong>1 h 30<\/strong>, en remuant souvent avec une grande cuillère en bois et en raclant bien le fond : le bouillon accroche facilement."}, {"label": "", "title": "Les légumes", "body": "Pendant ce temps, coupez le chou en lanières, les haricots verts en tronçons, les aubergines et les concombres en dés. Ajoutez le chou, les haricots et les aubergines, et laissez mijoter <strong>1 heure<\/strong>."}, {"label": "", "title": "Les fruits de mer", "body": "Ajoutez les concombres, les épinards, les crabes, les crevettes et le poisson émietté. Laissez mijoter encore <strong>1 heure<\/strong>, toujours à feu doux et en remuant régulièrement. Ajoutez un peu d'eau si le bouillon épaissit trop."}, {"label": "", "title": "Le repos", "body": "Goûtez et rectifiez l'assaisonnement, retirez le piment. Laissez reposer le bouillon : il est bien meilleur réchauffé le lendemain, et même le surlendemain."}, {"label": "", "title": "Servir", "body": "Réchauffez le bouillon à feu doux en remuant, et servez-le bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "brioche", "name": "Brioche", "nameHtml": "Brioche", "subtitle": "2 brioches", "emoji": "🍞", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["500 g de farine (type T45 ou farine de gruau)", "5 œufs, à température ambiante", "10 cl de lait tiède", "200 g de beurre doux mou, coupé en dés", "70 g de sucre", "20 g de levure de boulanger fraîche (ou 1 sachet de levure sèche, 7 g)", "10 g de sel", "Facultatif : 1 cuillère à soupe de fleur d'oranger ou le zeste d'une orange"]}]}, {"title": "Dorure et décor", "blocks": [{"t": "ul", "items": ["1 jaune d'œuf + 1 cuillère à soupe de lait", "Facultatif : sucre perlé"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Activer la levure<\/strong> : délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme.", "<strong>Le mélange<\/strong> : dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez.", "<strong>Le pétrissage<\/strong> : pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol.", "<strong>Le beurre<\/strong> : ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante.", "<strong>Première pousse<\/strong> : couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume.", "<strong>Le repos au froid<\/strong> : dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner.", "<strong>Le façonnage<\/strong> : divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules.", "<strong>Deuxième pousse<\/strong> : couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume.", "<strong>La dorure<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez.", "<strong>La cuisson<\/strong> : faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium.", "<strong>Refroidir<\/strong> : laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Un robot pétrisseur est vivement conseillé<\/strong> : la pâte à brioche est très collante et demande un long pétrissage. À la main, comptez 20 à 25 minutes et ne rajoutez pas de farine.", "<strong>Le beurre doit être mou, pas fondu<\/strong> : il doit s'écraser facilement au doigt.", "<strong>Le repos d'une nuit au réfrigérateur<\/strong> rend la brioche plus parfumée et la pâte bien plus facile à façonner. Vous pouvez donc préparer la pâte la veille au soir et cuire le matin.", "<strong>La brioche est cuite<\/strong> quand elle sonne creux lorsqu'on tapote dessous, ou que l'intérieur atteint 90 °C avec un thermomètre.", "<strong>Elle se conserve<\/strong> 2 à 3 jours emballée dans du film alimentaire, et se congèle très bien en tranches : il suffit de les passer au grille-pain."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pépites de chocolat<\/strong> : ajoutez 150 g de pépites de chocolat à la fin du pétrissage.", "<strong>Brioche Nanterre<\/strong> : façonnez 8 boules par brioche et placez-les en deux rangées dans un moule à cake.", "<strong>Brioches individuelles<\/strong> : divisez la pâte en boules de 60 g et faites-les cuire 12 à 15 minutes.", "<strong>Brioche aux pralines roses<\/strong> : ajoutez 150 g de pralines roses concassées au moment du façonnage.", "<strong>Pain perdu<\/strong> : la brioche rassise de quelques jours fait un excellent pain perdu."]}]}]}], "steps": [{"label": "", "title": "Activer la levure", "body": "Délayez la levure dans le lait tiède et laissez reposer 10 minutes, jusqu'à ce qu'une mousse se forme."}, {"label": "", "title": "Le mélange", "body": "Dans le bol d'un robot pétrisseur (ou un grand saladier), mettez la farine, puis le sucre et le sel d'un côté et la levure de l'autre, pour qu'ils ne se touchent pas. Ajoutez les œufs et la fleur d'oranger si vous en mettez."}, {"label": "", "title": "Le pétrissage", "body": "Pétrissez à vitesse lente pendant 5 minutes, puis à vitesse moyenne <strong>10 minutes<\/strong>, jusqu'à ce que la pâte soit lisse, élastique et qu'elle se décolle des parois du bol."}, {"label": "", "title": "Le beurre", "body": "Ajoutez le beurre mou en plusieurs fois, en attendant qu'il soit bien absorbé avant d'en remettre. Continuez de pétrir <strong>5 à 10 minutes<\/strong>, jusqu'à ce que la pâte se décolle à nouveau des parois : elle doit être souple, brillante et légèrement collante."}, {"label": "", "title": "Première pousse", "body": "Couvrez le bol d'un torchon et laissez lever <strong>1 h 30<\/strong> dans un endroit tiède, jusqu'à ce que la pâte double de volume."}, {"label": "", "title": "Le repos au froid", "body": "Dégazez la pâte en la rabattant plusieurs fois sur elle-même, couvrez-la de film alimentaire et placez-la au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>. La pâte froide sera beaucoup plus facile à façonner."}, {"label": "", "title": "Le façonnage", "body": "Divisez la pâte en deux. Pour chaque brioche, partagez la pâte en 3 boudins et tressez-les, ou formez 6 boules que vous placerez côte à côte dans un moule à cake beurré. Déposez les brioches sur une plaque recouverte de papier cuisson ou dans leurs moules."}, {"label": "", "title": "Deuxième pousse", "body": "Couvrez d'un torchon et laissez lever <strong>1 h 30 à 2 heures<\/strong> dans un endroit tiède, jusqu'à ce que les brioches doublent de volume."}, {"label": "", "title": "La dorure", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Mélangez le jaune d'œuf et le lait, badigeonnez délicatement les brioches au pinceau et parsemez de sucre perlé si vous le souhaitez."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>25 à 30 minutes<\/strong>, jusqu'à ce que les brioches soient bien dorées. Si elles colorent trop vite, couvrez-les d'une feuille de papier aluminium."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir 10 minutes, puis démoulez et laissez refroidir sur une grille."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "chips-banane", "name": "Chips de banane plantain", "nameHtml": "Chips de banane plantain", "subtitle": "6 à 8 personnes à l'apéritif", "emoji": "🍌", "category": "Entrées et apéritifs", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["4 bananes plantain <strong>bien vertes<\/strong> (fermes, peau verte sans taches)", "Huile de friture (tournesol ou arachide)", "Sel fin", "Optionnel : piment en poudre, poudre à colombo ou jus de citron vert"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher<\/strong> : coupez les deux extrémités des bananes, puis incisez la peau sur toute la longueur, en suivant les arêtes, sans entailler la chair. Soulevez la peau avec le pouce et retirez-la en bandes.", "<strong>Faire tremper<\/strong> : plongez les bananes épluchées dans un saladier d'eau froide salée pendant <strong>10 minutes<\/strong>, pour qu'elles ne noircissent pas et pour retirer un peu d'amidon.", "<strong>Trancher<\/strong> : égouttez-les et coupez-les en rondelles <strong>très fines<\/strong> (1 à 2 mm), à la mandoline ou au couteau bien aiguisé. Pour des chips longues, coupez-les dans la longueur.", "<strong>Sécher<\/strong> : étalez les rondelles sur un torchon propre et séchez-les <strong>soigneusement<\/strong> : l'eau fait éclabousser l'huile et empêche les chips de croustiller.", "<strong>Chauffer l'huile<\/strong> : faites chauffer l'huile à <strong>170-175 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts.", "<strong>Frire<\/strong> : plongez les rondelles <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites-les frire <strong>2 à 4 minutes<\/strong> en remuant, jusqu'à ce qu'elles soient <strong>jaune doré<\/strong> et que les bulles autour diminuent nettement.", "<strong>Égoutter et saler<\/strong> : sortez-les avec une écumoire, égouttez-les sur du papier absorbant et salez-les aussitôt, pendant qu'elles sont chaudes.", "<strong>Laisser refroidir<\/strong> : elles finissent de croustiller en refroidissant. Servez-les à température ambiante."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Choisissez des bananes très vertes<\/strong> : plus elles sont vertes, plus les chips sont croustillantes et peu sucrées. Une banane jaune donne des chips molles qui brunissent trop vite.", "<strong>Huilez-vous les mains<\/strong> (ou mettez des gants) avant d'éplucher : la sève de la banane verte tache et colle aux doigts.", "<strong>Des tranches régulières<\/strong> cuisent toutes en même temps : la mandoline est idéale (utilisez le protège-main).", "<strong>Ne surchargez pas l'huile<\/strong> : trop de rondelles d'un coup font chuter la température et les chips deviennent grasses.", "<strong>Conservation<\/strong> : une fois bien refroidies, elles se gardent <strong>1 semaine<\/strong> dans une boîte hermétique.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pimentées<\/strong> : saupoudrez les chips chaudes de piment en poudre, de paprika fumé ou de poudre à colombo, en plus du sel.", "<strong>Au citron vert<\/strong> : arrosez-les d'un filet de jus de citron vert et parsemez de zeste juste avant de servir.", "<strong>À l'ail<\/strong> : mélangez le sel avec un peu d'ail en poudre avant de saler les chips.", "<strong>Au four<\/strong> : mélangez les rondelles avec 3 cuillères à soupe d'huile, étalez-les en une seule couche sur deux plaques recouvertes de papier cuisson et faites cuire <strong>15 à 20 minutes à 180 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>Bananes pesées<\/strong> : en tronçons frits deux fois et aplatis entre les deux cuissons (voir la recette de bananes pesées).", "<strong>Bananes jaunes mûres<\/strong> : coupées en rondelles épaisses (1 cm) et frites, elles donnent des <strong>alocos<\/strong>, moelleux et sucrés, à servir en accompagnement."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "À l'apéritif avec les accras de morue et la sauce chien, ou en accompagnement d'un poisson grillé ou d'un colombo de poulet."}]}]}], "steps": [{"label": "", "title": "Éplucher", "body": "Coupez les deux extrémités des bananes, puis incisez la peau sur toute la longueur, en suivant les arêtes, sans entailler la chair. Soulevez la peau avec le pouce et retirez-la en bandes."}, {"label": "", "title": "Faire tremper", "body": "Plongez les bananes épluchées dans un saladier d'eau froide salée pendant <strong>10 minutes<\/strong>, pour qu'elles ne noircissent pas et pour retirer un peu d'amidon."}, {"label": "", "title": "Trancher", "body": "Égouttez-les et coupez-les en rondelles <strong>très fines<\/strong> (1 à 2 mm), à la mandoline ou au couteau bien aiguisé. Pour des chips longues, coupez-les dans la longueur."}, {"label": "", "title": "Sécher", "body": "Étalez les rondelles sur un torchon propre et séchez-les <strong>soigneusement<\/strong> : l'eau fait éclabousser l'huile et empêche les chips de croustiller."}, {"label": "", "title": "Chauffer l'huile", "body": "Faites chauffer l'huile à <strong>170-175 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts."}, {"label": "", "title": "Frire", "body": "Plongez les rondelles <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites-les frire <strong>2 à 4 minutes<\/strong> en remuant, jusqu'à ce qu'elles soient <strong>jaune doré<\/strong> et que les bulles autour diminuent nettement."}, {"label": "", "title": "Égoutter et saler", "body": "Sortez-les avec une écumoire, égouttez-les sur du papier absorbant et salez-les aussitôt, pendant qu'elles sont chaudes."}, {"label": "", "title": "Laisser refroidir", "body": "Elles finissent de croustiller en refroidissant. Servez-les à température ambiante."}], "categorySlug": "entrees-et-aperitifs"}, {"slug": "chips", "name": "Chips maison", "nameHtml": "Chips maison", "subtitle": "4 grands bols, environ 8 personnes à l'apéritif", "emoji": "🥔", "category": "Entrées et apéritifs", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair farineuse (Bintje, Agria ou Russet)", "Huile de friture (tournesol ou arachide)", "Sel fin (ou fleur de sel)", "Facultatif, pour assaisonner : paprika fumé, ail en poudre, herbes de Provence, poivre, ou poudre à colombo"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher<\/strong> : lavez et épluchez les pommes de terre. Vous pouvez aussi les garder avec la peau, bien brossées, pour des chips plus rustiques.", "<strong>Trancher<\/strong> : coupez les pommes de terre en tranches <strong>très fines, de 1 à 2 mm<\/strong>, de préférence à la mandoline, en utilisant le protège-doigts.", "<strong>Rincer<\/strong> : plongez les tranches dans un grand saladier d'eau froide et remuez-les pour retirer l'amidon. Changez l'eau jusqu'à ce qu'elle reste claire, puis laissez tremper <strong>30 minutes<\/strong>.", "<strong>Sécher<\/strong> : égouttez les tranches et séchez-les <strong>très soigneusement<\/strong>, étalées entre deux torchons propres, en tamponnant bien. Elles doivent être parfaitement sèches.", "<strong>Chauffer l'huile<\/strong> : faites chauffer l'huile à <strong>160-170 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts.", "<strong>La friture<\/strong> : plongez les tranches <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites frire <strong>3 à 5 minutes<\/strong> en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et que l'huile ne bouillonne presque plus autour d'elles.", "<strong>Égoutter et saler<\/strong> : sortez les chips avec une écumoire, déposez-les sur du papier absorbant et <strong>salez-les aussitôt<\/strong>, pendant qu'elles sont encore chaudes, avec le sel ou votre assaisonnement. Continuez avec le reste des tranches.", "<strong>Refroidir<\/strong> : laissez refroidir les chips en une seule couche : elles finissent de croustiller en refroidissant."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Des tranches très fines et régulières<\/strong> sont la clé : une mandoline est presque indispensable. Utilisez toujours le protège-doigts, la lame est très coupante.", "<strong>Rincer et sécher<\/strong> retire l'amidon et l'eau : c'est ce qui rend les chips croustillantes au lieu de molles et collées entre elles.", "<strong>Les chips sont prêtes<\/strong> quand les grosses bulles autour d'elles disparaissent : cela veut dire que toute l'eau s'est évaporée.", "<strong>Une huile pas assez chaude<\/strong> donne des chips grasses ; trop chaude, elles brunissent avant d'être croustillantes. Retirez-les dès qu'elles sont blondes, elles continuent de colorer un peu.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu.", "<strong>Les chips se conservent<\/strong> 2 à 3 jours dans une boîte hermétique. Si elles ramollissent, repassez-les 3 minutes au four à 180 °C."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : badigeonnez les tranches bien sèches d'un peu d'huile, étalez-les en une seule couche sur des plaques recouvertes de papier cuisson et faites cuire <strong>15 à 20 minutes à 180 °C<\/strong>, en les surveillant de près à la fin.", "<strong>À la friteuse sans huile<\/strong> : mélangez les tranches avec 1 cuillère à soupe d'huile et faites-les cuire 15 à 20 minutes à 180 °C, en secouant le panier toutes les 5 minutes.", "<strong>Chips de banane plantain<\/strong> : utilisez des bananes plantains <strong>vertes<\/strong>, coupées en fines rondelles ou en longues lamelles. Pas besoin de les rincer : faites-les frire directement 2 à 3 minutes, puis salez.", "<strong>Chips de patate douce<\/strong> : même méthode, avec une huile un peu moins chaude (150-160 °C), car le sucre de la patate douce la fait brunir plus vite.", "<strong>Sel et vinaigre<\/strong> : vaporisez un peu de vinaigre blanc sur les chips chaudes avant de les saler."]}]}]}], "steps": [{"label": "", "title": "Éplucher", "body": "Lavez et épluchez les pommes de terre. Vous pouvez aussi les garder avec la peau, bien brossées, pour des chips plus rustiques."}, {"label": "", "title": "Trancher", "body": "Coupez les pommes de terre en tranches <strong>très fines, de 1 à 2 mm<\/strong>, de préférence à la mandoline, en utilisant le protège-doigts."}, {"label": "", "title": "Rincer", "body": "Plongez les tranches dans un grand saladier d'eau froide et remuez-les pour retirer l'amidon. Changez l'eau jusqu'à ce qu'elle reste claire, puis laissez tremper <strong>30 minutes<\/strong>."}, {"label": "", "title": "Sécher", "body": "Égouttez les tranches et séchez-les <strong>très soigneusement<\/strong>, étalées entre deux torchons propres, en tamponnant bien. Elles doivent être parfaitement sèches."}, {"label": "", "title": "Chauffer l'huile", "body": "Faites chauffer l'huile à <strong>160-170 °C<\/strong> dans une friteuse ou une grande casserole à bords hauts."}, {"label": "", "title": "La friture", "body": "Plongez les tranches <strong>par petites poignées<\/strong>, en les séparant pour qu'elles ne collent pas. Faites frire <strong>3 à 5 minutes<\/strong> en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et que l'huile ne bouillonne presque plus autour d'elles."}, {"label": "", "title": "Égoutter et saler", "body": "Sortez les chips avec une écumoire, déposez-les sur du papier absorbant et <strong>salez-les aussitôt<\/strong>, pendant qu'elles sont encore chaudes, avec le sel ou votre assaisonnement. Continuez avec le reste des tranches."}, {"label": "", "title": "Refroidir", "body": "Laissez refroidir les chips en une seule couche : elles finissent de croustiller en refroidissant."}], "categorySlug": "entrees-et-aperitifs"}, {"slug": "chocolat-de-communion", "name": "Chocolat de première communion", "nameHtml": "Chocolat de première communion", "subtitle": "environ 20 tasses", "emoji": "🍫", "category": "Boissons", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Chocolat et épices", "blocks": [{"t": "ul", "items": ["500 g de chocolat « pays » (bâtons de cacao pur), ou 400 g de chocolat noir à 70 % + 4 cuillères à soupe de cacao en poudre non sucré", "1 litre d'eau", "2 bâtons de cannelle", "2 étoiles de badiane (anis étoilé)", "2 gousses de vanille", "½ noix de muscade râpée", "Le zeste de 2 citrons verts, prélevé en larges rubans", "1 pincée de sel"]}]}, {"title": "Lait et liaison", "blocks": [{"t": "ul", "items": ["2 litres de lait entier", "2 boîtes de lait concentré non sucré (2 × 410 g)", "1 boîte de lait concentré sucré (397 g)", "3 cuillères à soupe de fécule de maïs (Maïzena)", "Sucre selon votre goût (environ 100 g)", "Facultatif : 50 g de beurre, pour un chocolat plus velouté"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Râper le chocolat<\/strong> : râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux.", "<strong>Faire fondre<\/strong> : dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse.", "<strong>Les épices<\/strong> : fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent.", "<strong>Les laits<\/strong> : versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>.", "<strong>Épaissir<\/strong> : délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère.", "<strong>Goûter<\/strong> : goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu.", "<strong>Filtrer<\/strong> : retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois.", "<strong>Faire mousser<\/strong> : juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser.", "<strong>Servir<\/strong> : servez bien chaud, dans des tasses, avec du pain au beurre."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le chocolat pays<\/strong> (bâtons ou boules de cacao pur, sans sucre) donne le goût authentique, plus intense et légèrement amer. On le trouve sur les marchés des Antilles et de Guyane.", "<strong>Remuez souvent et raclez le fond<\/strong> : avec la fécule et le lait concentré, le chocolat attache facilement. Une casserole à fond épais aide beaucoup.", "<strong>Ne faites jamais bouillir fort<\/strong> le chocolat une fois les laits ajoutés : il pourrait déborder et prendre un goût de brûlé.", "<strong>Le lélé<\/strong> est un petit bâton à pointes qu'on fait tourner entre les mains pour faire mousser le chocolat : c'est le geste traditionnel.", "<strong>Préparé à l'avance<\/strong>, le chocolat épaissit en refroidissant : réchauffez-le doucement en ajoutant un peu de lait, en fouettant.", "<strong>Il se conserve<\/strong> 2 à 3 jours au réfrigérateur dans des bouteilles fermées."]}]}]}, {"title": "Tradition", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Aux Antilles et en Guyane, le chocolat de communion est servi lors des grandes fêtes familiales : <strong>premières communions, baptêmes, mariages, Pâques et Noël<\/strong>. On le déguste traditionnellement le matin, bien épais et parfumé, accompagné de <strong>pain au beurre<\/strong> (voir la recette du recueil), de gâteaux et de tourments d'amour."}]}]}], "steps": [{"label": "", "title": "Râper le chocolat", "body": "Râpez le chocolat pays au couteau ou à la râpe, ou concassez la tablette en petits morceaux."}, {"label": "", "title": "Faire fondre", "body": "Dans une très grande casserole à fond épais, portez l'eau à frémissement. Ajoutez le chocolat et faites-le fondre à feu doux en remuant sans arrêt, jusqu'à obtenir une pâte lisse."}, {"label": "", "title": "Les épices", "body": "Fendez les gousses de vanille en deux. Ajoutez-les dans la casserole avec la cannelle, la badiane, la muscade, les zestes de citron vert et le sel. Laissez frémir <strong>15 minutes<\/strong> à feu très doux en remuant souvent, pour que les épices infusent."}, {"label": "", "title": "Les laits", "body": "Versez le lait entier et le lait concentré non sucré, puis le lait concentré sucré. Mélangez bien et chauffez doucement, <strong>sans faire bouillir<\/strong>."}, {"label": "", "title": "Épaissir", "body": "Délayez la fécule de maïs dans un bol avec un peu de lait froid, puis versez-la dans la casserole en fouettant. Laissez cuire à feu doux <strong>20 à 30 minutes<\/strong>, en remuant régulièrement et en raclant le fond, jusqu'à ce que le chocolat soit épais et nappe la cuillère."}, {"label": "", "title": "Goûter", "body": "Goûtez et ajoutez du sucre selon votre goût. Ajoutez le beurre si vous en mettez et fouettez jusqu'à ce qu'il soit fondu."}, {"label": "", "title": "Filtrer", "body": "Retirez les bâtons de cannelle, la badiane, les gousses de vanille et les zestes, ou passez le chocolat au chinois."}, {"label": "", "title": "Faire mousser", "body": "Juste avant de servir, fouettez énergiquement le chocolat (au lélé, au fouet ou au mixeur plongeant) pour le faire mousser."}, {"label": "", "title": "Servir", "body": "Servez bien chaud, dans des tasses, avec du pain au beurre."}], "categorySlug": "boissons"}, {"slug": "colombo-de-poulet", "name": "Colombo de poulet", "nameHtml": "Colombo de poulet", "subtitle": "8 à 10 personnes", "emoji": "🍛", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["2 poulets fermiers (environ 3 kg), coupés en morceaux (ou 3 kg de cuisses et hauts de cuisse)", "4 citrons verts", "8 gousses d'ail", "2 cuillères à soupe de poudre à colombo", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce et légumes", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe de poudre à colombo (en plus de celle de la marinade)", "4 oignons", "1 botte de cives", "4 aubergines", "4 christophines (chayottes)", "8 pommes de terre", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 litre d'eau (ou de bouillon de volaille)", "4 cuillères à soupe d'huile", "Facultatif : 40 cl de lait de coco, pour une sauce plus douce et onctueuse"]}]}, {"title": "Pour servir", "blocks": [{"t": "ul", "items": ["Riz blanc"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poulet<\/strong> : frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Préparer les légumes<\/strong> : épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Émincez les oignons et les cives.", "<strong>Faire dorer le poulet<\/strong> : dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les.", "<strong>Les aromates<\/strong> : dans la même cocotte, faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler.", "<strong>Mijoter<\/strong> : remettez le poulet et sa marinade dans la cocotte, ajoutez les pommes de terre, les christophines, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>30 minutes<\/strong> à feu doux.", "<strong>Les aubergines<\/strong> : ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. Les légumes doivent être fondants et la sauce un peu épaisse : les aubergines et les pommes de terre la lient naturellement.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La poudre à colombo<\/strong> (mélange de curcuma, coriandre, cumin, fenugrec, moutarde et poivre) se trouve sur les marchés et dans les épiceries des Antilles et de Guyane. Le curry indien n'a pas le même goût.", "<strong>Faites revenir la poudre à colombo<\/strong> avant d'ajouter l'eau : c'est ce qui lui donne toute sa saveur. Mais attention, brûlée elle devient amère.", "<strong>L'ail cru et le citron vert ajoutés à la fin<\/strong> donnent au colombo sa fraîcheur caractéristique : ne les supprimez pas.", "<strong>La sauce est trop liquide ?<\/strong> Écrasez quelques morceaux de pomme de terre ou d'aubergine dans la sauce et laissez réduire quelques minutes sans couvercle.", "<strong>Comme beaucoup de plats mijotés, le colombo est encore meilleur réchauffé le lendemain.<\/strong> Il se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Colombo de cabri<\/strong> : la version traditionnelle des fêtes, avec 3 kg de viande de cabri (chevreau) en morceaux. Prolongez la cuisson à 1 h 30 avant d'ajouter les aubergines.", "<strong>Colombo de porc<\/strong> : avec 3 kg d'échine ou de palette de porc en cubes, en prolongeant la cuisson de 30 minutes.", "<strong>Colombo de poisson ou de crevettes<\/strong> : faites mijoter les légumes 30 minutes, puis ajoutez le poisson en gros morceaux ou les crevettes pour les 10 dernières minutes seulement.", "<strong>Avec du giraumon<\/strong> : remplacez une partie des pommes de terre par du giraumon (potiron), qui rend la sauce plus douce et plus onctueuse."]}]}]}], "steps": [{"label": "", "title": "Nettoyer le poulet", "body": "Frottez les morceaux de poulet avec le jus de 2 citrons verts et rincez-les rapidement à l'eau froide. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Dans un grand saladier, mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, 2 cuillères à soupe de poudre à colombo, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en bien les morceaux de poulet, couvrez et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit."}, {"label": "", "title": "Préparer les légumes", "body": "Épluchez et coupez les pommes de terre et les christophines en gros cubes, les aubergines en gros dés. Émincez les oignons et les cives."}, {"label": "", "title": "Faire dorer le poulet", "body": "Dans une grande cocotte, faites chauffer l'huile et faites dorer les morceaux de poulet sur toutes leurs faces, en plusieurs fois pour ne pas les entasser. Réservez-les."}, {"label": "", "title": "Les aromates", "body": "Dans la même cocotte, faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter", "body": "Remettez le poulet et sa marinade dans la cocotte, ajoutez les pommes de terre, les christophines, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>30 minutes<\/strong> à feu doux."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. Les légumes doivent être fondants et la sauce un peu épaisse : les aubergines et les pommes de terre la lient naturellement."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "cookies", "name": "Cookies au chocolat", "nameHtml": "Cookies au chocolat", "subtitle": "environ 30 cookies", "emoji": "🍪", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "250 g de beurre doux mou (sorti du réfrigérateur 1 heure avant)", "200 g de sucre roux (cassonade ou vergeoise)", "100 g de sucre en poudre", "2 œufs", "400 g de chocolat noir ou au lait (en pépites, ou une tablette concassée au couteau)", "2 cuillères à café de bicarbonate de soude (ou 1 sachet de levure chimique)", "2 sachets de sucre vanillé", "1 cuillère à café de fleur de sel (ou 2 pincées de sel fin)", "Facultatif : 150 g de noix de pécan ou de noisettes concassées"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Crémer le beurre<\/strong> : dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>.", "<strong>Les œufs<\/strong> : ajoutez les œufs un par un, en mélangeant bien entre chaque.", "<strong>La farine<\/strong> : dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible.", "<strong>Le chocolat<\/strong> : incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule.", "<strong>Le repos<\/strong> : couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson.", "<strong>Façonner<\/strong> : formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler.", "<strong>La cuisson<\/strong> : faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant.", "<strong>Refroidir<\/strong> : laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne prolongez pas la cuisson<\/strong> même si les cookies semblent trop mous à la sortie du four : ils durcissent en refroidissant, et trop cuits ils deviennent secs et cassants.", "<strong>Le sucre roux<\/strong> donne des cookies moelleux et un goût de caramel ; plus il y a de sucre blanc, plus ils sont croustillants.", "<strong>Pour des cookies bien ronds<\/strong>, posez un grand verre retourné autour de chaque cookie dès la sortie du four et faites-le tourner pour arrondir les bords.", "<strong>Pour un aspect gourmand<\/strong>, enfoncez quelques pépites de chocolat sur le dessus des boules avant la cuisson et saupoudrez d'une pincée de fleur de sel en sortant du four.", "<strong>La pâte se congèle très bien<\/strong> en boules : faites-les cuire directement sans décongeler, en ajoutant 2 minutes de cuisson.", "<strong>Les cookies se conservent<\/strong> une semaine dans une boîte en métal hermétique. Ajoutez une tranche de pain de mie dans la boîte : ils resteront moelleux."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Double chocolat<\/strong> : remplacez 60 g de farine par 60 g de cacao en poudre non sucré.", "<strong>Chocolat blanc et cranberries<\/strong> : remplacez le chocolat noir par 250 g de chocolat blanc et 150 g de cranberries séchées.", "<strong>Beurre de cacahuète<\/strong> : remplacez 100 g de beurre par 150 g de beurre de cacahuète et ajoutez des cacahuètes concassées.", "<strong>M&amp;M's<\/strong> : remplacez la moitié du chocolat par des bonbons chocolatés colorés, enfoncés sur le dessus avant la cuisson."]}]}]}], "steps": [{"label": "", "title": "Crémer le beurre", "body": "Dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>."}, {"label": "", "title": "Les œufs", "body": "Ajoutez les œufs un par un, en mélangeant bien entre chaque."}, {"label": "", "title": "La farine", "body": "Dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible."}, {"label": "", "title": "Le chocolat", "body": "Incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule."}, {"label": "", "title": "Le repos", "body": "Couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Façonner", "body": "Formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant."}, {"label": "", "title": "Refroidir", "body": "Laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."}], "categorySlug": "patisseries"}, {"slug": "creme-patissiere", "name": "Crème pâtissière", "nameHtml": "Crème pâtissière", "subtitle": "environ 1,3 kg de crème", "emoji": "🍨", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 litre de lait entier", "8 jaunes d'œufs", "200 g de sucre", "80 g de fécule de maïs (Maïzena), ou 100 g de farine", "2 gousses de vanille (ou 4 cuillères à café d'extrait de vanille)", "Facultatif : 50 g de beurre doux, pour une crème plus onctueuse et plus brillante"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Infuser la vanille<\/strong> : fendez les gousses de vanille en deux et grattez les graines. Dans une casserole, faites chauffer le lait avec les gousses et les graines jusqu'à frémissement. Retirez du feu, couvrez et laissez infuser 10 minutes, puis retirez les gousses.", "<strong>Blanchir les jaunes<\/strong> : dans un saladier, fouettez les jaunes d'œufs avec le sucre jusqu'à ce que le mélange <strong>blanchisse<\/strong> légèrement.", "<strong>La fécule<\/strong> : ajoutez la fécule de maïs et fouettez jusqu'à obtenir un mélange lisse, sans grumeaux.", "<strong>Verser le lait chaud<\/strong> : versez le lait chaud petit à petit sur le mélange, en fouettant sans arrêt.", "<strong>Cuire la crème<\/strong> : reversez le tout dans la casserole et faites cuire à feu moyen <strong>en fouettant sans arrêt<\/strong>, surtout au fond et sur les bords. Quand la crème épaissit et que les premières bulles apparaissent, comptez encore <strong>1 à 2 minutes<\/strong> de cuisson, toujours en fouettant, pour que la fécule perde son goût.", "<strong>Le beurre<\/strong> (facultatif) : hors du feu, ajoutez le beurre en morceaux et fouettez jusqu'à ce qu'il soit complètement fondu.", "<strong>Refroidir rapidement<\/strong> : versez aussitôt la crème dans un plat large et peu profond. Couvrez-la de film alimentaire <strong>au contact<\/strong>, directement posé sur la crème, pour qu'elle ne forme pas de croûte.", "<strong>Le repos<\/strong> : laissez refroidir à température ambiante, puis placez la crème <strong>au moins 2 heures au réfrigérateur<\/strong>.", "<strong>Avant utilisation<\/strong> : fouettez la crème froide quelques secondes pour la rendre à nouveau lisse et souple, puis garnissez."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Fécule ou farine ?<\/strong> La fécule de maïs donne une crème plus légère et plus lisse ; la farine, une crème plus ferme et un peu plus « pâtissière » en goût.", "<strong>Si la crème fait des grumeaux<\/strong>, passez-la au mixeur plongeant ou au tamis dès qu'elle est cuite, pendant qu'elle est encore chaude.", "<strong>Le film au contact est indispensable<\/strong> : sans lui, une croûte se forme à la surface et laisse des morceaux dans la crème.", "<strong>Refroidissez-la vite et gardez-la au froid<\/strong> : c'est une crème fragile à base d'œufs. Elle se conserve <strong>2 jours maximum<\/strong> au réfrigérateur et ne se congèle pas bien.", "<strong>Pour une crème plus légère<\/strong> (crème diplomate), incorporez délicatement 25 cl de crème liquide montée en chantilly dans la crème pâtissière froide.", "<strong>Les 8 blancs restants<\/strong> se conservent 3 jours au réfrigérateur ou se congèlent : ils serviront pour des meringues, des macarons, des financiers ou des tuiles."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Chocolat<\/strong> : ajoutez 150 g de chocolat noir haché dans la crème chaude, juste après la cuisson, et fouettez jusqu'à ce qu'il fonde.", "<strong>Café<\/strong> : ajoutez 2 cuillères à soupe de café soluble dans le lait chaud.", "<strong>Praliné<\/strong> : incorporez 150 g de pâte de praliné dans la crème refroidie.", "<strong>Citron<\/strong> : remplacez la vanille par le zeste de 3 citrons infusé dans le lait.", "<strong>Rhum ou fleur d'oranger<\/strong> : ajoutez 2 cuillères à soupe de rhum ou de fleur d'oranger dans la crème refroidie."]}]}]}, {"title": "Idées d'utilisation", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Choux à la crème, éclairs, religieuses (avec la pâte à choux du recueil), tarte aux fraises ou aux fruits (avec la pâte sablée), mille-feuille (avec la pâte feuilletée), fraisier (avec la génoise), chaussons, brioches fourrées, galette des rois."}]}]}], "steps": [{"label": "", "title": "Infuser la vanille", "body": "Fendez les gousses de vanille en deux et grattez les graines. Dans une casserole, faites chauffer le lait avec les gousses et les graines jusqu'à frémissement. Retirez du feu, couvrez et laissez infuser 10 minutes, puis retirez les gousses."}, {"label": "", "title": "Blanchir les jaunes", "body": "Dans un saladier, fouettez les jaunes d'œufs avec le sucre jusqu'à ce que le mélange <strong>blanchisse<\/strong> légèrement."}, {"label": "", "title": "La fécule", "body": "Ajoutez la fécule de maïs et fouettez jusqu'à obtenir un mélange lisse, sans grumeaux."}, {"label": "", "title": "Verser le lait chaud", "body": "Versez le lait chaud petit à petit sur le mélange, en fouettant sans arrêt."}, {"label": "", "title": "Cuire la crème", "body": "Reversez le tout dans la casserole et faites cuire à feu moyen <strong>en fouettant sans arrêt<\/strong>, surtout au fond et sur les bords. Quand la crème épaissit et que les premières bulles apparaissent, comptez encore <strong>1 à 2 minutes<\/strong> de cuisson, toujours en fouettant, pour que la fécule perde son goût."}, {"label": "", "title": "", "body": "<strong>Le beurre<\/strong> (facultatif) : hors du feu, ajoutez le beurre en morceaux et fouettez jusqu'à ce qu'il soit complètement fondu."}, {"label": "", "title": "Refroidir rapidement", "body": "Versez aussitôt la crème dans un plat large et peu profond. Couvrez-la de film alimentaire <strong>au contact<\/strong>, directement posé sur la crème, pour qu'elle ne forme pas de croûte."}, {"label": "", "title": "Le repos", "body": "Laissez refroidir à température ambiante, puis placez la crème <strong>au moins 2 heures au réfrigérateur<\/strong>."}, {"label": "", "title": "Avant utilisation", "body": "Fouettez la crème froide quelques secondes pour la rendre à nouveau lisse et souple, puis garnissez."}], "categorySlug": "bases"}, {"slug": "crepes", "name": "Crêpes classiques", "nameHtml": "Crêpes classiques", "subtitle": "environ 30 crêpes", "emoji": "🫓", "category": "Desserts", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "4 œufs", "1 litre de lait (entier de préférence)", "2 pincées de sel", "2 cuillères à soupe de sucre (facultatif, pour des crêpes sucrées)", "100 g de beurre fondu (ou 4 cuillères à soupe d'huile)", "Facultatif : 2 sachets de sucre vanillé, 2 cuillères à soupe de rhum ou de fleur d'oranger"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Le mélange<\/strong> : versez la farine dans un grand saladier et creusez un puits au centre. Ajoutez-y les œufs, le sel et le sucre.", "<strong>Le lait<\/strong> : mélangez au fouet en versant le lait <strong>petit à petit<\/strong> pour éviter les grumeaux.", "<strong>Le beurre<\/strong> : incorporez le beurre fondu, puis l'arôme si vous en mettez un. La pâte doit être fluide, comme une crème liquide.", "<strong>Le repos<\/strong> : laissez reposer la pâte <strong>1 heure<\/strong> à température ambiante. Ce n'est pas obligatoire, mais les crêpes seront plus souples.", "<strong>La cuisson<\/strong> : chauffez une poêle bien chaude et graissez-la légèrement avec un papier absorbant imbibé d'huile ou de beurre. Versez une petite louche de pâte et inclinez la poêle pour l'étaler en couche fine.", "<strong>Retourner<\/strong> : quand les bords se décollent et dorent (environ 1 à 2 minutes), retournez la crêpe et laissez cuire 30 secondes à 1 minute de l'autre côté."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>S'il y a des grumeaux<\/strong>, passez la pâte au mixeur plongeant quelques secondes.", "<strong>Si la pâte est trop épaisse<\/strong>, ajoutez un peu de lait ou d'eau.", "<strong>La première crêpe est souvent ratée<\/strong>, c'est normal : elle sert à bien graisser et chauffer la poêle.", "Pour les garder chaudes, empilez-les sur une assiette posée sur une casserole d'eau frémissante et couvrez-les.", "Avec cette quantité, utiliser <strong>deux poêles en même temps<\/strong> fait gagner beaucoup de temps."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre et citron, Nutella, confiture, caramel au beurre salé, banane et chocolat, ou crème de marrons."}]}]}], "steps": [{"label": "", "title": "Le mélange", "body": "Versez la farine dans un grand saladier et creusez un puits au centre. Ajoutez-y les œufs, le sel et le sucre."}, {"label": "", "title": "Le lait", "body": "Mélangez au fouet en versant le lait <strong>petit à petit<\/strong> pour éviter les grumeaux."}, {"label": "", "title": "Le beurre", "body": "Incorporez le beurre fondu, puis l'arôme si vous en mettez un. La pâte doit être fluide, comme une crème liquide."}, {"label": "", "title": "Le repos", "body": "Laissez reposer la pâte <strong>1 heure<\/strong> à température ambiante. Ce n'est pas obligatoire, mais les crêpes seront plus souples."}, {"label": "", "title": "La cuisson", "body": "Chauffez une poêle bien chaude et graissez-la légèrement avec un papier absorbant imbibé d'huile ou de beurre. Versez une petite louche de pâte et inclinez la poêle pour l'étaler en couche fine."}, {"label": "", "title": "Retourner", "body": "Quand les bords se décollent et dorent (environ 1 à 2 minutes), retournez la crêpe et laissez cuire 30 secondes à 1 minute de l'autre côté."}], "categorySlug": "desserts"}, {"slug": "croissants", "name": "Croissants", "nameHtml": "Croissants", "subtitle": "environ 24 croissants", "emoji": "🥐", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["1 kg de farine T45 (ou farine de gruau)", "30 cl de lait entier froid", "30 cl d'eau froide", "120 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "20 g de sel", "100 g de beurre mou"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["560 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}, {"title": "Dorure", "blocks": [{"t": "ul", "items": ["2 œufs + 2 cuillères à soupe de lait"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique.", "<strong>Le repos au froid<\/strong> : divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>.", "<strong>Préparer le beurre<\/strong> : coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords.", "<strong>Le tour double<\/strong> : étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le tour simple<\/strong> : tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton.", "<strong>Étaler<\/strong> : étalez chaque pâton en un rectangle d'environ <strong>25 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid.", "<strong>Découper<\/strong> : découpez des triangles de <strong>10 cm de base<\/strong> et de 25 cm de hauteur. Faites une petite entaille de 1 cm au milieu de la base.", "<strong>Façonner<\/strong> : étirez légèrement chaque triangle, puis roulez-le sans serrer, de la base vers la pointe. La pointe doit se retrouver <strong>en dessous<\/strong>. Déposez les croissants sur des plaques recouvertes de papier cuisson, bien espacés.", "<strong>La pousse<\/strong> : mélangez les œufs et le lait, et badigeonnez une première fois les croissants au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume et qu'ils tremblent quand on secoue la plaque.", "<strong>La cuisson<\/strong> : préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois les croissants et faites-les cuire <strong>15 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés.", "<strong>Refroidir<\/strong> : laissez-les tiédir sur une grille avant de les déguster."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> : si le beurre fond pendant le tourage, les feuilletages se soudent et les croissants ne seront pas feuilletés. Au moindre doute, remettez la pâte 15 minutes au réfrigérateur.", "<strong>En climat chaud<\/strong>, travaillez tôt le matin, dans une pièce climatisée, et faites reposer la pâte au réfrigérateur plus longtemps entre chaque étape.", "<strong>Deux pâtons<\/strong> sont bien plus faciles à étaler qu'un seul gros : la pâte reste froide et ne se déchire pas.", "<strong>Ne laissez pas pousser au chaud<\/strong> : au-dessus de 25 °C, le beurre fond et coule à la cuisson.", "<strong>Préparez-les la veille<\/strong> : façonnez les croissants le soir, couvrez-les et placez-les au réfrigérateur. Le lendemain matin, laissez-les pousser 2 à 3 heures à température ambiante, puis faites-les cuire.", "<strong>Congélation<\/strong> : les croissants crus et façonnés se congèlent sur une plaque, puis en sachet. La veille, posez-les sur une plaque au réfrigérateur, puis laissez-les pousser le matin."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Croissants aux amandes<\/strong> : coupez des croissants de la veille en deux, imbibez-les de sirop, garnissez-les de crème d'amande, parsemez d'amandes effilées et faites-les cuire 15 minutes à 180 °C.", "<strong>Pains au chocolat<\/strong> : avec la même pâte (voir la recette de pain au chocolat).", "<strong>Croissants jambon-fromage<\/strong> : déposez une demi-tranche de jambon et un peu de fromage râpé sur chaque triangle avant de le rouler."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique."}, {"label": "", "title": "Le repos au froid", "body": "Divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>."}, {"label": "", "title": "Préparer le beurre", "body": "Coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords."}, {"label": "", "title": "Le tour double", "body": "Étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le tour simple", "body": "Tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton."}, {"label": "", "title": "Étaler", "body": "Étalez chaque pâton en un rectangle d'environ <strong>25 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid."}, {"label": "", "title": "Découper", "body": "Découpez des triangles de <strong>10 cm de base<\/strong> et de 25 cm de hauteur. Faites une petite entaille de 1 cm au milieu de la base."}, {"label": "", "title": "Façonner", "body": "Étirez légèrement chaque triangle, puis roulez-le sans serrer, de la base vers la pointe. La pointe doit se retrouver <strong>en dessous<\/strong>. Déposez les croissants sur des plaques recouvertes de papier cuisson, bien espacés."}, {"label": "", "title": "La pousse", "body": "Mélangez les œufs et le lait, et badigeonnez une première fois les croissants au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume et qu'ils tremblent quand on secoue la plaque."}, {"label": "", "title": "La cuisson", "body": "Préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois les croissants et faites-les cuire <strong>15 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés."}, {"label": "", "title": "Refroidir", "body": "Laissez-les tiédir sur une grille avant de les déguster."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "flan-patissier", "name": "Flan pâtissier", "nameHtml": "Flan pâtissier", "subtitle": "2 flans de 24 cm", "emoji": "🍮", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["2 fonds de pâte brisée (la recette de pâte brisée du recueil en donne exactement 2), ou 2 rouleaux de pâte brisée du commerce"]}]}, {"title": "Crème", "blocks": [{"t": "ul", "items": ["1,5 litre de lait entier", "50 cl de crème liquide entière", "8 œufs", "400 g de sucre", "180 g de fécule de maïs (Maïzena)", "2 gousses de vanille (ou 4 cuillères à café d'extrait de vanille)", "Un peu de beurre pour les moules"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Foncer les moules<\/strong> : beurrez deux moules à bords hauts (au moins 5 cm) de 24 cm. Étalez la pâte, garnissez-en les moules en la faisant bien remonter sur les bords, piquez le fond avec une fourchette et placez-les <strong>au moins 30 minutes<\/strong> au réfrigérateur.", "<strong>Infuser la vanille<\/strong> : fendez les gousses de vanille en deux et grattez les graines. Dans une grande casserole, faites chauffer le lait et la crème avec les gousses et les graines, jusqu'à frémissement. Retirez du feu, couvrez et laissez infuser 10 minutes, puis retirez les gousses.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong>.", "<strong>Le mélange œufs-sucre<\/strong> : dans un grand saladier, fouettez les œufs avec le sucre, puis ajoutez la fécule de maïs et fouettez jusqu'à obtenir un mélange <strong>lisse, sans grumeaux<\/strong>.", "<strong>Verser le lait chaud<\/strong> : versez le lait chaud petit à petit sur le mélange, en fouettant sans arrêt.", "<strong>Épaissir la crème<\/strong> : reversez le tout dans la casserole et faites cuire à feu moyen <strong>en fouettant sans arrêt<\/strong>, surtout au fond et sur les bords. Quand la crème épaissit et que les premières bulles apparaissent, comptez encore <strong>1 minute<\/strong> de cuisson, toujours en fouettant.", "<strong>Garnir<\/strong> : versez aussitôt la crème chaude dans les fonds de tarte et lissez la surface.", "<strong>La cuisson<\/strong> : faites cuire <strong>50 à 60 minutes<\/strong>, jusqu'à ce que le dessus soit bien doré, avec quelques taches brunes caramélisées.", "<strong>Refroidir<\/strong> : laissez refroidir complètement à température ambiante, puis placez les flans <strong>au moins 4 heures au réfrigérateur<\/strong>, idéalement une nuit, avant de les démouler et de les couper."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne coupez pas le flan tiède<\/strong> : il doit être bien froid pour se tenir et se découper en belles parts nettes.", "<strong>Fouettez sans arrêt pendant que la crème épaissit<\/strong>, sinon elle accroche au fond de la casserole et fait des grumeaux.", "<strong>Pour une crème très onctueuse<\/strong>, remplacez une partie du lait par davantage de crème ; pour un flan plus léger, utilisez uniquement du lait.", "<strong>Pour un
