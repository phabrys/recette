 du poivre. Ajoutez le poulet, couvrez et laissez mariner <strong>au moins 30 minutes<\/strong> au réfrigérateur, idéalement 2 heures.", "<strong>Préparer la panure<\/strong> : disposez trois assiettes creuses : la farine dans la première, les œufs battus avec une pincée de sel dans la deuxième, la chapelure mélangée au paprika, à l'ail en poudre (et au parmesan) dans la troisième.", "<strong>Égoutter<\/strong> : sortez le poulet de la marinade et épongez-le avec du papier absorbant.", "<strong>Paner<\/strong> : passez chaque escalope dans la farine en tapotant pour retirer l'excédent, puis dans l'œuf battu en laissant égoutter, et enfin dans la chapelure en appuyant bien pour qu'elle adhère sur toutes les faces.", "<strong>Le repos<\/strong> : déposez les escalopes panées sur une grande assiette et placez-les <strong>15 minutes<\/strong> au réfrigérateur.", "<strong>La cuisson<\/strong> : dans une grande poêle, faites chauffer 1 cm d'huile avec un morceau de beurre à <strong>feu moyen<\/strong>. Faites dorer les escalopes <strong>4 à 5 minutes de chaque côté<\/strong>, en plusieurs fois, jusqu'à ce que la panure soit bien dorée et que le poulet soit cuit à cœur.", "<strong>Égoutter<\/strong> : déposez-les sur du papier absorbant et salez légèrement. Gardez-les au chaud dans le four à 100 °C pendant que vous faites cuire le reste.", "<strong>Servir<\/strong> : servez aussitôt avec des quartiers de citron, des frites, une salade ou du riz."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La marinade au lait<\/strong> attendrit le poulet et le garde bien juteux à la cuisson.", "<strong>Des escalopes d'épaisseur régulière<\/strong> cuisent uniformément : la panure ne brûle pas avant que le centre soit cuit.", "<strong>Le poulet est cuit<\/strong> quand son jus est clair lorsqu'on le pique au centre, ou quand il atteint 74 °C à cœur avec un thermomètre.", "<strong>Pour une panure extra-croustillante<\/strong>, faites une double panure : œuf puis chapelure, une deuxième fois.", "<strong>Le poulet pané se garde<\/strong> 2 jours au réfrigérateur : réchauffez-le 10 minutes au four à 180 °C pour qu'il redevienne croustillant (pas au micro-ondes)."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : déposez les escalopes panées sur une plaque recouverte de papier cuisson, arrosez-les d'un filet d'huile et faites cuire <strong>20 à 25 minutes à 200 °C<\/strong>, en les retournant à mi-cuisson.", "<strong>Nuggets<\/strong> : coupez le poulet en morceaux de 3 cm avant de le paner, et faites-les cuire 2 à 3 minutes de chaque côté.", "<strong>Aux corn-flakes<\/strong> : remplacez la chapelure par 300 g de corn-flakes nature écrasés grossièrement, pour une panure très croustillante.", "<strong>Escalope milanaise<\/strong> : ajoutez le parmesan dans la panure et servez avec des spaghettis à la sauce tomate.", "<strong>Cordon-bleu<\/strong> : posez une tranche de jambon et de fromage sur une escalope fine, recouvrez d'une deuxième escalope, appuyez bien sur les bords et panez le tout."]}]}]}], "steps": [{"label": "", "title": "Aplatir le poulet", "body": "Coupez chaque blanc de poulet en deux dans l'épaisseur pour obtenir des escalopes fines, ou aplatissez-les entre deux feuilles de papier cuisson avec un rouleau à pâtisserie, jusqu'à environ <strong>1 cm d'épaisseur<\/strong>."}, {"label": "", "title": "La marinade", "body": "Dans un grand saladier, mélangez le lait, l'ail, le paprika, du sel et du poivre. Ajoutez le poulet, couvrez et laissez mariner <strong>au moins 30 minutes<\/strong> au réfrigérateur, idéalement 2 heures."}, {"label": "", "title": "Préparer la panure", "body": "Disposez trois assiettes creuses : la farine dans la première, les œufs battus avec une pincée de sel dans la deuxième, la chapelure mélangée au paprika, à l'ail en poudre (et au parmesan) dans la troisième."}, {"label": "", "title": "Égoutter", " ez le four à <strong>210 °C<\/strong> (chaleur traditionnelle).", "<strong>Préparer la garniture<\/strong> : coupez les citrons en quatre. Coupez les têtes d'ail en deux dans l'épaisseur, sans les éplucher. Épluchez les oignons et coupez-les en quartiers.", "<strong>Garnir l'intérieur<\/strong> : salez et poivrez l'intérieur des poulets, puis glissez dans chacun la moitié des citrons, une demi-tête d'ail, quelques branches de thym et 2 feuilles de laurier.", "<strong>Beurrer<\/strong> : séchez la peau avec du papier absorbant, puis badigeonnez généreusement les poulets de beurre mou sur toute leur surface. Salez et poivrez bien l'extérieur.", "<strong>Dresser le plat<\/strong> : répartissez les oignons, le reste de l'ail et du thym dans un grand plat allant au four (ou deux plats). Posez les poulets dessus, <strong>sur le côté<\/strong> (une cuisse vers le haut), et arrosez avec l'huile.", "<strong>Cuire<\/strong> : enfournez pour <strong>1 heure 15 à 1 heure 30<\/strong> au total. Au bout de <strong>25 minutes<\/strong>, retournez les poulets sur l'autre côté ; au bout de <strong>50 minutes<\/strong>, mettez-les sur le dos. Arrosez-les avec le jus du plat <strong>toutes les 15 minutes<\/strong>. Si le plat sèche, ajoutez un peu d'eau.", "<strong>Vérifier la cuisson<\/strong> : piquez la cuisse au niveau de l'articulation : le jus qui s'écoule doit être <strong>clair, sans trace rosée<\/strong>. Avec un thermomètre, comptez <strong>75 °C<\/strong> à cœur, au plus épais de la cuisse.", "<strong>Reposer<\/strong> : sortez les poulets, posez-les sur une planche, couvrez-les de papier aluminium et laissez-les reposer <strong>15 minutes<\/strong>.", "<strong>Faire le jus<\/strong> : pendant le repos, posez le plat sur feu moyen, versez l'eau et grattez les sucs du fond avec une spatule. Écrasez quelques gousses d'ail confites dans le jus, laissez réduire <strong>3 à 4 minutes<\/strong> et filtrez.", "<strong>Découper et servir<\/strong> : découpez les poulets et servez-les avec le jus chaud et les oignons fondants."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Une peau bien sèche<\/strong> avant de beurrer donne une peau plus croustillante.", "<strong>Commencer sur le côté<\/strong> puis retourner protège les blancs, qui cuisent plus vite que les cuisses et restent ainsi moelleux.", "<strong>Arroser souvent<\/strong> est la clé d'une chair juteuse et d'une peau dorée.", "<strong>Le repos est indispensable<\/strong> : les jus se répartissent dans la chair au lieu de couler sur la planche.", "<strong>Temps de cuisson<\/strong> : comptez environ <strong>45 à 50 minutes par kilo<\/strong> pour un poulet pesé seul (les deux poulets cuisent en même temps, il ne faut pas additionner leurs poids).", "<strong>Les restes<\/strong> se gardent 3 jours au réfrigérateur : en salade, en sandwich, dans un wrap ou effilochés dans un riz."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Aux pommes de terre<\/strong> : ajoutez dans le plat 1,5 kg de grenailles ou de pommes de terre coupées en morceaux, mélangées avec un peu d'huile, du sel et du thym, en même temps que les poulets.", "<strong>À la créole<\/strong> : la veille, faites mariner les poulets avec du jus de citron vert, de l'ail écrasé, des cives, du thym, du piment et du bois d'Inde, puis faites-les rôtir comme ci-dessus.", "<strong>Aux herbes<\/strong> : mélangez le beurre mou avec de l'ail haché, du persil et de l'estragon, et glissez-en une partie <strong>sous la peau<\/strong> des blancs.", "<strong>Au paprika<\/strong> : mélangez le beurre avec 2 cuillères à café de paprika fumé et 1 cuillère à café de cumin."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Gratin dauphinois, frites maison, purée de pommes de terre, riz blanc, haricots verts à l'ail, lentilles mijotées, avec une salade verte."}]}]}], "steps": [{"label": "", "title": "Sortir les poulets", "body": "Sortez les poulets du réfrigérateur <strong>1 heure avant<\/strong> la cuisson pour qu'ils soient à température ambiante."}, {"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>210 °C<\/strong> (chaleur traditionnelle)."}, {"label": "", "title": "Préparer la garniture", "body": "Coupez les citrons en quatre. Coupez les têtes d'ail en deux dans l'épaisseur, sans les éplucher. Épluchez les oignons et coupez-les en quartiers."}, {"label": "", "title": "Garnir l'intérieur", "body": "Salez et poivrez l'intérieur des poulets, puis glissez dans chacun la moitié des citrons, une demi-tête d'ail, quelques branches de thym et 2 feuilles de laurier."}, {"label": "", "title": "Beurrer", "body": "Séchez la peau avec du papier absorbant, puis badigeonnez généreusement les poulets de beurre mou sur toute leur surface. Salez et poivrez bien l'extérieur."}, {"label": "", "title": "Dresser le plat", "body": "Répartissez les oignons, le reste de l'ail et du thym dans un grand plat allant au four (ou deux plats). Posez les poulets dessus, <strong>sur le côté<\/strong> (une cuisse vers le haut), et arrosez avec l'huile."}, {"label": "", "title": "Cuire", "body": "Enfournez pour <strong>1 heure 15 à 1 heure 30<\/strong> au total. Au bout de <strong>25 minutes<\/strong>, retournez les poulets sur l'autre côté ; au bout de <strong>50 minutes<\/strong>, mettez-les sur le dos. Arrosez-les avec le jus du plat <strong>toutes les 15 minutes<\/strong>. Si le plat sèche, ajoutez un peu d'eau."}, {"label": "", "title": "Vérifier la cuisson", "body": "Piquez la cuisse au niveau de l'articulation : le jus qui s'écoule doit être <strong>clair, sans trace rosée<\/strong>. Avec un thermomètre, comptez <strong>75 °C<\/strong> à cœur, au plus épais de la cuisse."}, {"label": "", "title": "Reposer", "body": "Sortez les poulets, posez-les sur une planche, couvrez-les de papier aluminium et laissez-les reposer <strong>15 minutes<\/strong>."}, {"label": "", "title": "Faire le jus", "body": "Pendant le repos, posez le plat sur feu moyen, versez l'eau et grattez les sucs du fond avec une spatule. Écrasez quelques gousses d'ail confites dans le jus, laissez réduire <strong>3 à 4 minutes<\/strong> et filtrez."}, {"label": "", "title": "Découper et servir", "body": "Découpez les poulets et servez-les avec le jus chaud et les oignons fondants."}], "categorySlug": "plats"}, {"slug": "punch-coco", "name": "Punch coco", "nameHtml": "Punch coco", "subtitle": "environ 2 litres, 20 petits verres", "emoji": "🥥", "category": "Cocktails", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 boîtes de lait concentré sucré (2 × 397 g)", "80 cl de lait de coco (2 boîtes de 400 ml)", "40 cl de lait entier (ou de lait concentré non sucré, plus onctueux)", "50 cl de rhum agricole blanc à 50°", "2 gousses de vanille", "1 bâton de cannelle", "1 pincée de noix de muscade râpée", "Le zeste d'un citron vert (en un ruban, sans la partie blanche)", "Facultatif : 1 cuillère à café d'extrait d'amande amère"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La vanille<\/strong> : fendez les gousses de vanille en deux dans la longueur et grattez les graines avec la pointe d'un couteau.", "<strong>Mélanger les laits<\/strong> : dans un grand saladier, fouettez le lait concentré sucré, le lait de coco et le lait jusqu'à obtenir un mélange bien lisse.", "<strong>Le rhum et les épices<\/strong> : ajoutez le rhum, la vanille (graines et gousses), la cannelle, la muscade, le zeste de citron vert et l'extrait d'amande amère. Fouettez à nouveau.", "<strong>Mettre en bouteille<\/strong> : retirez le zeste de citron, puis versez le punch dans des bouteilles propres à l'aide d'un entonnoir, en y glissant les gousses de vanille et la cannelle.", "<strong>Reposer<\/strong> : placez les bouteilles au réfrigérateur <strong>au moins 24 heures<\/strong>, idéalement 2 ou 3 jours, pour que les arômes se développent.", "<strong>Servir<\/strong> : secouez bien les bouteilles et servez très frais dans des petits verres, avec un glaçon si vous le souhaitez."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Secouez toujours avant de servir<\/strong> : le lait de coco remonte à la surface au repos.", "<strong>Le temps de repos<\/strong> est essentiel : le punch coco est bien meilleur après quelques jours au frais.", "<strong>Conservation<\/strong> : il se garde <strong>2 semaines<\/strong> au réfrigérateur, en bouteilles bien fermées.", "<strong>C'est la boisson des fêtes de fin d'année<\/strong> aux Antilles et en Guyane, servie à l'apéritif ou au dessert.", "<strong>L'abus d'alcool est dangereux pour la santé<\/strong>, à consommer avec modération. Doux et sucré, le punch coco ne paraît pas fort, mais il l'est : gardez-le hors de portée des enfants."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la noix de coco fraîche<\/strong> : râpez la chair de 2 noix de coco, mixez-la avec 60 cl d'eau chaude et filtrez à travers un torchon pour obtenir un lait de coco maison.", "<strong>Punch coco sans alcool<\/strong> : remplacez le rhum par du lait, et ajoutez un peu plus de vanille. À conserver seulement 3 jours.", "<strong>Punch cacahuète<\/strong> : remplacez le lait de coco par 200 g de beurre de cacahuète mixé avec 60 cl de lait."]}]}]}], "steps": [{"label": "", "title": "La vanille", "body": "Fendez les gousses de vanille en deux dans la longueur et grattez les graines avec la pointe d'un couteau."}, {"label": "", "title": "Mélanger les laits", "body": "Dans un grand saladier, fouettez le lait concentré sucré, le lait de coco et le lait jusqu'à obtenir un mélange bien lisse."}, {"label": "", "title": "Le rhum et les épices", "body": "Ajoutez le rhum, la vanille (graines et gousses), la cannelle, la muscade, le zeste de citron vert et l'extrait d'amande amère. Fouettez à nouveau."}, {"label": "", "title": "Mettre en bouteille", "body": "Retirez le zeste de citron, puis versez le punch dans des bouteilles propres à l'aide d'un entonnoir, en y glissant les gousses de vanille et la cannelle."}, {"label": "", "title": "Reposer", "body": "Placez les bouteilles au réfrigérateur <strong>au moins 24 heures<\/strong>, idéalement 2 ou 3 jours, pour que les arômes se développent."}, {"label": "", "title": "Servir", "body": "Secouez bien les bouteilles et servez très frais dans des petits verres, avec un glaçon si vous le souhaitez."}], "categorySlug": "cocktails"}, {"slug": "puree", "name": "Purée de pommes de terre", "nameHtml": "Purée de pommes de terre", "subtitle": "6 à 8 personnes", "emoji": "🥔", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair farineuse (Bintje, Agria ou Mona Lisa)", "200 g de beurre, coupé en morceaux", "50 cl de lait entier", "2 cuillères à soupe de gros sel (pour l'eau de cuisson)", "Sel fin", "Poivre du moulin (blanc de préférence)", "1 pincée de noix de muscade râpée"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Éplucher et couper<\/strong> : épluchez les pommes de terre, rincez-les et coupez-les en morceaux de <strong>taille égale<\/strong> (environ 4 cm) pour qu'ils cuisent en même temps.", "<strong>Départ à l'eau froide<\/strong> : mettez les morceaux dans une grande casserole, couvrez-les largement d'eau froide et ajoutez le gros sel.", "<strong>Cuire<\/strong> : portez à ébullition, puis laissez cuire à petits bouillons <strong>20 à 25 minutes<\/strong>. Les pommes de terre sont cuites quand la pointe d'un couteau s'y enfonce sans résistance.", "<strong>Chauffer le lait<\/strong> : pendant ce temps, faites chauffer le lait dans une petite casserole, <strong>sans le faire bouillir<\/strong>.", "<strong>Égoutter et sécher<\/strong> : égouttez les pommes de terre, remettez-les dans la casserole chaude et laissez-les sécher <strong>1 à 2 minutes<\/strong> à feu doux en secouant la casserole, pour évaporer l'eau restante.", "<strong>Écraser<\/strong> : passez les pommes de terre au <strong>presse-purée<\/strong> ou au moulin à légumes, ou écrasez-les au pilon.", "<strong>Ajouter le beurre<\/strong> : incorporez le beurre morceau par morceau, en mélangeant à la spatule jusqu'à ce qu'il soit fondu.", "<strong>Ajouter le lait<\/strong> : versez le lait chaud petit à petit, en mélangeant vivement, jusqu'à obtenir la texture souhaitée.", "<strong>Assaisonner<\/strong> : salez, poivrez, ajoutez la muscade, goûtez et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Jamais de mixeur ni de robot<\/strong> : les lames cassent l'amidon et la purée devient collante et élastique. Utilisez un presse-purée, un moulin à légumes ou un pilon.", "<strong>Le lait doit être chaud<\/strong> : du lait froid refroidit la purée et l'alourdit.", "<strong>Le beurre avant le lait<\/strong> : il enrobe l'amidon et donne une purée plus onctueuse.", "<strong>Dosez le lait selon vos goûts<\/strong> : moins pour une purée ferme, un peu plus pour une purée souple. Vous n'aurez pas forcément besoin de tout.", "<strong>Pour la garder au chaud<\/strong>, couvrez-la et posez la casserole au bain-marie. Pour la réchauffer, ajoutez un peu de lait chaud en mélangeant."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À l'ail<\/strong> : faites cuire 6 gousses d'ail épluchées avec les pommes de terre et écrasez-les ensemble.", "<strong>À la crème<\/strong> : remplacez 20 cl de lait par de la crème fraîche épaisse.", "<strong>Au fromage<\/strong> : incorporez 200 g de fromage râpé (comté, emmental ou cheddar) à la fin, hors du feu.", "<strong>Aux herbes<\/strong> : ajoutez de la ciboulette, des cives ou du persil hachés juste avant de servir.", "<strong>Purée de patate douce<\/strong> : même méthode, avec une cuisson plus courte (<strong>15 minutes<\/strong>) et moins de lait. Délicieuse avec une pointe de muscade et de cannelle.", "<strong>Purée mixte<\/strong> : remplacez la moitié des pommes de terre par des carottes, du potiron ou du céleri-rave."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Poulet pané, poisson pané, saucisses, steak haché, rôti de porc, jambon, poisson en sauce."}]}]}], "steps": [{"label": "", "title": "Éplucher et couper", "body": "Épluchez les pommes de terre, rincez-les et coupez-les en morceaux de <strong>taille égale<\/strong> (environ 4 cm) pour qu'ils cuisent en même temps."}, {"label": "", "title": "Départ à l'eau froide", "body": "Mettez les morceaux dans une grande casserole, couvrez-les largement d'eau froide et ajoutez le gros sel."}, {"label": "", "title": "Cuire", "body": "Portez à ébullition, puis laissez cuire à petits bouillons <strong>20 à 25 minutes<\/strong>. Les pommes de terre sont cuites quand la pointe d'un couteau s'y enfonce sans résistance."}, {"label": "", "title": "Chauffer le lait", "body": "Pendant ce temps, faites chauffer le lait dans une petite casserole, <strong>sans le faire bouillir<\/strong>."}, {"label": "", "title": "Égoutter et sécher", "body": "Égouttez les pommes de terre, remettez-les dans la casserole chaude et laissez-les sécher <strong>1 à 2 minutes<\/strong> à feu doux en secouant la casserole, pour évaporer l'eau restante."}, {"label": "", "title": "Écraser", "body": "Passez les pommes de terre au <strong>presse-purée<\/strong> ou au moulin à légumes, ou écrasez-les au pilon."}, {"label": "", "title": "Ajouter le beurre", "body": "Incorporez le beurre morceau par morceau, en mélangeant à la spatule jusqu'à ce qu'il soit fondu."}, {"label": "", "title": "Ajouter le lait", "body": "Versez le lait chaud petit à petit, en mélangeant vivement, jusqu'à obtenir la texture souhaitée."}, {"label": "", "title": "Assaisonner", "body": "Salez, poivrez, ajoutez la muscade, goûtez et servez bien chaud."}], "categorySlug": "accompagnements"}, {"slug": "quatre-quarts", "name": "Quatre-quarts", "nameHtml": "Quatre-quarts", "subtitle": "2 cakes de 25 cm", "emoji": "🧈", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Le principe : <strong>le même poids<\/strong> d'œufs, de beurre, de sucre et de farine. Pesez d'abord les œufs avec leur coquille, puis ajustez les autres ingrédients sur ce poids (environ 500 g pour 8 œufs)."}, {"t": "ul", "items": ["8 œufs (environ 500 g)", "500 g de beurre demi-sel (ou doux + 2 pincées de sel)", "500 g de sucre", "500 g de farine", "1 sachet de levure chimique", "2 sachets de sucre vanillé", "Facultatif : le zeste de 2 citrons ou d'une orange, ou 2 cuillères à soupe de rhum", "Un peu de beurre et de farine pour les moules"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>170 °C<\/strong>. Beurrez et farinez deux moules à cake de 25 cm (ou recouvrez-les de papier cuisson).", "<strong>Le beurre<\/strong> : faites fondre le beurre à feu doux ou au micro-ondes, puis laissez-le tiédir.", "<strong>Séparer les œufs<\/strong> : mettez les blancs de côté dans un grand bol propre et sec.", "<strong>Blanchir<\/strong> : dans un grand saladier, fouettez les jaunes avec le sucre et le sucre vanillé pendant 3 à 4 minutes, jusqu'à ce que le mélange <strong>blanchisse et devienne mousseux<\/strong>.", "<strong>Le beurre et la farine<\/strong> : incorporez le beurre fondu tiède, puis la farine mélangée à la levure, et le zeste ou le rhum si vous en mettez. Mélangez jusqu'à obtenir une pâte lisse et épaisse.", "<strong>Les blancs en neige<\/strong> : montez les blancs en neige ferme avec une pincée de sel. Incorporez-en d'abord un tiers en mélangeant vivement pour détendre la pâte, puis le reste <strong>délicatement<\/strong> à la spatule, en soulevant la pâte.", "<strong>Remplir les moules<\/strong> : répartissez la pâte dans les deux moules, sans dépasser les deux tiers de leur hauteur.", "<strong>La cuisson<\/strong> : faites cuire <strong>45 à 50 minutes<\/strong>. Le quatre-quarts est cuit quand il est bien doré et que la lame d'un couteau plantée au centre ressort sèche.", "<strong>Démouler<\/strong> : laissez tiédir 10 minutes dans les moules, puis démoulez sur une grille et laissez refroidir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Pour une belle fente bien régulière<\/strong> sur le dessus, tracez un trait dans la longueur de la pâte avec un couteau trempé dans du beurre fondu, après 10 minutes de cuisson.", "<strong>Le dessus dore trop vite ?<\/strong> Couvrez le gâteau d'une feuille de papier aluminium pour la fin de la cuisson.", "<strong>Le beurre demi-sel<\/strong> donne le goût du quatre-quarts breton traditionnel.", "<strong>Sans les blancs en neige<\/strong>, la recette marche aussi (on ajoute alors les œufs entiers à l'étape 4), mais le gâteau est plus dense.", "<strong>Le quatre-quarts est encore meilleur le lendemain.<\/strong> Il se conserve une semaine emballé dans du film alimentaire, et se congèle très bien en tranches."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Marbré<\/strong> : séparez la pâte en deux, ajoutez 3 cuillères à soupe de cacao en poudre dans une moitié, puis versez les deux pâtes en alternance dans le moule.", "<strong>Aux pommes caramélisées<\/strong> : faites dorer 3 pommes en dés dans du beurre et du sucre, puis répartissez-les dans la pâte avant la cuisson.", "<strong>Citron<\/strong> : ajoutez le zeste de 3 citrons dans la pâte, puis nappez le gâteau refroidi d'un glaçage (150 g de sucre glace et le jus d'un citron).", "<strong>Pépites de chocolat<\/strong> : ajoutez 200 g de pépites de chocolat, roulées d'abord dans un peu de farine pour qu'elles ne tombent pas au fond."]}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>170 °C<\/strong>. Beurrez et farinez deux moules à cake de 25 cm (ou recouvrez-les de papier cuisson)."}, {"label": "", "title": "Le beurre", "body": "Faites fondre le beurre à feu doux ou au micro-ondes, puis laissez-le tiédir."}, {"label": "", "title": "Séparer les œufs", "body": "Mettez les blancs de côté dans un grand bol propre et sec."}, {"label": "", "title": "Blanchir", "body": "Dans un grand saladier, fouettez les jaunes avec le sucre et le sucre vanillé pendant 3 à 4 minutes, jusqu'à ce que le mélange <strong>blanchisse et devienne mousseux<\/strong>."}, {"label": "", "title": "Le beurre et la farine", "body": "Incorporez le beurre fondu tiède, puis la farine mélangée à la levure, et le zeste ou le rhum si vous en mettez. Mélangez jusqu'à obtenir une pâte lisse et épaisse."}, {"label": "", "title": "Les blancs en neige", "body": "Montez les blancs en neige ferme avec une pincée de sel. Incorporez-en d'abord un tiers en mélangeant vivement pour détendre la pâte, puis le reste <strong>délicatement<\/strong> à la spatule, en soulevant la pâte."}, {"label": "", "title": "Remplir les moules", "body": "Répartissez la pâte dans les deux moules, sans dépasser les deux tiers de leur hauteur."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>45 à 50 minutes<\/strong>. Le quatre-quarts est cuit quand il est bien doré et que la lame d'un couteau plantée au centre ressort sèche."}, {"label": "", "title": "Démouler", "body": "Laissez tiédir 10 minutes dans les moules, puis démoulez sur une grille et laissez refroidir."}], "categorySlug": "patisseries"}, {"slug": "quiche-lorraine", "name": "Quiche lorraine", "nameHtml": "Quiche lorraine", "subtitle": "2 quiches de 28 cm, 12 à 16 personnes", "emoji": "🥓", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Pâte", "blocks": [{"t": "ul", "items": ["1 recette de pâte brisée (2 fonds de tarte de 28 cm, voir la recette de pâte brisée), ou 2 rouleaux de pâte brisée du commerce"]}]}, {"title": "Garniture", "blocks": [{"t": "ul", "items": ["400 g de lardons fumés", "8 œufs", "50 cl de crème fraîche épaisse", "50 cl de lait entier", "1 pincée de noix de muscade râpée", "Poivre (et peu de sel, les lardons sont salés)", "Facultatif : 150 g de fromage râpé (gruyère ou emmental)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Foncer les moules<\/strong> : étalez la pâte et garnissez deux moules de 28 cm beurrés. Piquez le fond à la fourchette et placez-les <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Précuire<\/strong> : préchauffez le four à <strong>200 °C<\/strong>. Recouvrez les fonds de papier cuisson et de légumes secs, et faites-les cuire <strong>15 minutes<\/strong>. Retirez le papier et les légumes secs et poursuivez <strong>5 minutes<\/strong>. Baissez le four à <strong>180 °C<\/strong>.", "<strong>Les lardons<\/strong> : faites revenir les lardons <strong>5 minutes<\/strong> dans une poêle sans matière grasse, puis égouttez-les sur du papier absorbant.", "<strong>L'appareil<\/strong> : dans un saladier, fouettez les œufs, la crème et le lait. Ajoutez la muscade, du poivre et une petite pincée de sel.", "<strong>Garnir<\/strong> : répartissez les lardons (et le fromage) sur les deux fonds de tarte précuits, puis versez l'appareil par-dessus.", "<strong>Cuire<\/strong> : faites cuire <strong>30 à 35 minutes<\/strong> à <strong>180 °C<\/strong>, jusqu'à ce que la garniture soit prise et bien dorée.", "<strong>Servir<\/strong> : laissez reposer <strong>10 minutes<\/strong> avant de couper. Servez chaud ou tiède, avec une salade verte."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La précuisson du fond<\/strong> est indispensable : sans elle, la pâte reste détrempée sous la garniture liquide.", "<strong>La quiche est cuite<\/strong> quand le centre ne tremble presque plus lorsqu'on secoue le moule : il finit de prendre en refroidissant.", "<strong>La vraie quiche lorraine<\/strong> ne contient pas de fromage : il est facultatif.", "<strong>Conservation<\/strong> : elle se garde 3 jours au réfrigérateur et se réchauffe 15 minutes à 160 °C. Elle se congèle bien, cuite."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Quiche au thon<\/strong> : remplacez les lardons par 2 boîtes de thon émietté et 2 tomates en rondelles.", "<strong>Quiche saumon-poireaux<\/strong> : avec 400 g de saumon en dés et 4 poireaux émincés fondus au beurre.", "<strong>Quiche à la morue et aux cives<\/strong> : avec 400 g de morue dessalée et émiettée, revenue avec des cives et un peu de piment.", "<strong>Quiche aux légumes<\/strong> : avec des courgettes, des poivrons, des épinards ou du giraumon revenus à la poêle."]}]}]}], "steps": [{"label": "", "title": "Foncer les moules", "body": "Étalez la pâte et garnissez deux moules de 28 cm beurrés. Piquez le fond à la fourchette et placez-les <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Précuire", "body": "Préchauffez le four à <strong>200 °C<\/strong>. Recouvrez les fonds de papier cuisson et de légumes secs, et faites-les cuire <strong>15 minutes<\/strong>. Retirez le papier et les légumes secs et poursuivez <strong>5 minutes<\/strong>. Baissez le four à <strong>180 °C<\/strong>."}, {"label": "", "title": "Les lardons", "body": "Faites revenir les lardons <strong>5 minutes<\/strong> dans une poêle sans matière grasse, puis égouttez-les sur du papier absorbant."}, {"label": "", "title": "L'appareil", "body": "Dans un saladier, fouettez les œufs, la crème et le lait. Ajoutez la muscade, du poivre et une petite pincée de sel."}, {"label": "", "title": "Garnir", "body": "Répartissez les lardons (et le fromage) sur les deux fonds de tarte précuits, puis versez l'appareil par-dessus."}, {"label": "", "title": "Cuire", "body": "Faites cuire <strong>30 à 35 minutes<\/strong> à <strong>180 °C<\/strong>, jusqu'à ce que la garniture soit prise et bien dorée."}, {"label": "", "title": "Servir", "body": "Laissez reposer <strong>10 minutes<\/strong> avant de couper. Servez chaud ou tiède, avec une salade verte."}], "categorySlug": "plats"}, {"slug": "ragout-de-porc", "name": "Ragoût de porc créole", "nameHtml": "Ragoût de porc créole", "subtitle": "8 à 10 personnes", "emoji": "🥩", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Viande et marinade", "blocks": [{"t": "ul", "items": ["3 kg d'échine ou de palette de porc, en cubes de 5 cm (ou un mélange échine et travers)", "4 citrons verts", "8 gousses d'ail", "1 piment antillais", "4 branches de thym", "Sel et poivre"]}]}, {"title": "Sauce", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe d'huile", "2 cuillères à soupe de sucre roux (pour la caramélisation)", "4 oignons", "1 botte de cives", "4 tomates", "2 cuillères à soupe de concentré de tomates", "4 feuilles de bois d'Inde (ou de laurier)", "4 clous de girofle", "1 bouquet de persil", "1 litre d'eau", "Facultatif : 4 carottes, 1 kg de pommes de terre, 500 g de giraumon"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer la viande<\/strong> : frottez les cubes de porc avec le jus de 2 citrons verts et rincez-les rapidement. Égouttez-les et séchez-les.", "<strong>La marinade<\/strong> : mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), le thym, du sel et du poivre. Enrobez-en la viande et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit.", "<strong>Caraméliser<\/strong> : égouttez la viande en gardant la marinade. Dans une grande cocotte, faites chauffer l'huile avec le sucre jusqu'à ce qu'il prenne une couleur <strong>caramel foncé<\/strong>. Ajoutez la viande, en plusieurs fois, et faites-la dorer sur toutes les faces jusqu'à ce qu'elle soit bien brune.", "<strong>Les aromates<\/strong> : émincez les oignons et les cives, coupez les tomates en dés. Remettez toute la viande dans la cocotte, ajoutez les oignons et les cives et faites revenir <strong>5 minutes<\/strong>. Ajoutez le concentré de tomates et faites revenir <strong>1 minute<\/strong>.", "<strong>Mijoter<\/strong> : ajoutez les tomates, la marinade, le bois d'Inde, les clous de girofle et l'eau. Couvrez et laissez mijoter <strong>1 h 30<\/strong> à feu doux, en remuant de temps en temps. Ajoutez un peu d'eau si la sauce réduit trop.", "<strong>Les légumes<\/strong> (facultatif) : épluchez et coupez les carottes, les pommes de terre et le giraumon en gros morceaux. Ajoutez-les pour les <strong>30 dernières minutes<\/strong> de cuisson.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes hachées et le persil ciselé. Goûtez, rectifiez l'assaisonnement et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le caramel<\/strong> donne au ragoût sa couleur brune et son goût caractéristique. Il doit être foncé mais pas noir : brûlé, il devient amer.", "<strong>Attention aux projections<\/strong> quand vous mettez la viande dans le caramel : séchez-la bien et reculez-vous.", "<strong>Un morceau un peu gras<\/strong> comme l'échine reste fondant après la longue cuisson.", "<strong>À l'autocuiseur<\/strong> : comptez <strong>35 minutes<\/strong> sous pression après l'étape 5.", "<strong>Encore meilleur le lendemain<\/strong>, il se garde 3 jours au réfrigérateur et se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ragoût de cochon de Noël<\/strong> : la version des fêtes, avec un mélange d'échine, de travers et de jambon frais, souvent accompagné de pois d'angole.", "<strong>Ragoût de bœuf<\/strong> : avec 3 kg de paleron ou de joue de bœuf, mijoté <strong>2 h 30<\/strong>.", "<strong>Aux pois d'angole<\/strong> : ajoutez 2 boîtes de pois d'angole égouttés pour les 20 dernières minutes."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, haricots rouges, pois d'angole, igname, bananes pesées, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Nettoyer la viande", "body": "Frottez les cubes de porc avec le jus de 2 citrons verts et rincez-les rapidement. Égouttez-les et séchez-les."}, {"label": "", "title": "La marinade", "body": "Mélangez le jus d'un citron vert, 6 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), le thym, du sel et du poivre. Enrobez-en la viande et laissez mariner <strong>au moins 2 heures<\/strong> au réfrigérateur, idéalement une nuit."}, {"label": "", "title": "Caraméliser", "body": "Égouttez la viande en gardant la marinade. Dans une grande cocotte, faites chauffer l'huile avec le sucre jusqu'à ce qu'il prenne une couleur <strong>caramel foncé<\/strong>. Ajoutez la viande, en plusieurs fois, et faites-la dorer sur toutes les faces jusqu'à ce qu'elle soit bien brune."}, {"label": "", "title": "Les aromates", "body": "Émincez les oignons et les cives, coupez les tomates en dés. Remettez toute la viande dans la cocotte, ajoutez les oignons et les cives et faites revenir <strong>5 minutes<\/strong>. Ajoutez le concentré de tomates et faites revenir <strong>1 minute<\/strong>."}, {"label": "", "title": "Mijoter", "body": "Ajoutez les tomates, la marinade, le bois d'Inde, les clous de girofle et l'eau. Couvrez et laissez mijoter <strong>1 h 30<\/strong> à feu doux, en remuant de temps en temps. Ajoutez un peu d'eau si la sauce réduit trop."}, {"label": "", "title": "", "body": "<strong>Les légumes<\/strong> (facultatif) : épluchez et coupez les carottes, les pommes de terre et le giraumon en gros morceaux. Ajoutez-les pour les <strong>30 dernières minutes<\/strong> de cuisson."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes hachées et le persil ciselé. Goûtez, rectifiez l'assaisonnement et servez bien chaud."}], "categorySlug": "plats"}, {"slug": "riz-blanc", "name": "Riz blanc", "nameHtml": "Riz blanc", "subtitle": "6 à 8 personnes", "emoji": "🍚", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de riz long grain (environ 2 tasses ½ ou 600 ml)", "750 ml d'eau (1 volume ½ d'eau pour 1 volume de riz)", "2 cuillères à soupe d'huile (ou 30 g de beurre)", "2 cuillères à café de sel fin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Rincer<\/strong> : versez le riz dans une passoire fine et rincez-le à l'eau froide en le remuant avec la main, jusqu'à ce que l'eau soit <strong>presque claire<\/strong> (3 à 4 rinçages). Égouttez-le bien.", "<strong>Nacrer<\/strong> : faites chauffer l'huile dans une casserole à fond épais, à feu moyen. Ajoutez le riz et remuez <strong>1 à 2 minutes<\/strong>, jusqu'à ce que les grains deviennent légèrement translucides.", "<strong>Mouiller<\/strong> : versez l'eau et ajoutez le sel. Mélangez une seule fois et portez à <strong>ébullition<\/strong>.", "<strong>Cuire à couvert<\/strong> : dès que l'eau bout, baissez le feu <strong>au minimum<\/strong>, couvrez avec un couvercle bien hermétique et laissez cuire <strong>12 minutes<\/strong> sans soulever le couvercle.", "<strong>Reposer<\/strong> : coupez le feu et laissez reposer <strong>10 minutes<\/strong>, toujours à couvert, sans ouvrir.", "<strong>Égrener<\/strong> : soulevez le couvercle, égrenez délicatement le riz à la fourchette et servez."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Rincer le riz<\/strong> retire l'amidon en surface : les grains restent bien séparés et ne collent pas.", "<strong>Mesurez au volume<\/strong> : pour le riz long grain, comptez <strong>1 volume ½ d'eau pour 1 volume de riz<\/strong> (rincé). Pour le riz basmati, réduisez à 1 volume ¼.", "<strong>Ne remuez pas pendant la cuisson<\/strong> et ne soulevez pas le couvercle : la vapeur fait cuire le riz, et la laisser s'échapper le rend inégal.", "<strong>Le repos est indispensable<\/strong> : il permet à l'humidité de se répartir, le riz finit de cuire et se détache du fond.", "<strong>Si le fond attache un peu<\/strong>, ne grattez pas : servez le dessus et laissez le fond, qui fait le « gratin » apprécié par certains.", "<strong>Conservation<\/strong> : le riz cuit se garde 2 jours au réfrigérateur, bien refroidi rapidement et dans une boîte fermée. Réchauffez-le avec un filet d'eau, à couvert."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À l'eau, comme des pâtes<\/strong> : faites cuire le riz dans un grand volume d'eau bouillante salée <strong>10 à 12 minutes<\/strong>, puis égouttez-le. Méthode infaillible, mais le riz a un peu moins de goût.", "<strong>Riz au cuiseur<\/strong> : rincez le riz, mettez-le dans la cuve avec l'eau (suivez les graduations), le sel et l'huile, et lancez la cuisson.", "<strong>Riz parfumé<\/strong> : ajoutez dans l'eau une gousse d'ail écrasée, une feuille de laurier, une branche de thym ou un oignon piqué d'un clou de girofle.", "<strong>Riz au lait de coco<\/strong> : remplacez la moitié de l'eau par du lait de coco, idéal avec le poulet au coco ou le colombo."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Colombo de poulet, poulet au coco, bouillon d'awara, poisson pané, haricots verts à l'ail, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Rincer", "body": "Versez le riz dans une passoire fine et rincez-le à l'eau froide en le remuant avec la main, jusqu'à ce que l'eau soit <strong>presque claire<\/strong> (3 à 4 rinçages). Égouttez-le bien."}, {"label": "", "title": "Nacrer", "body": "Faites chauffer l'huile dans une casserole à fond épais, à feu moyen. Ajoutez le riz et remuez <strong>1 à 2 minutes<\/strong>, jusqu'à ce que les grains deviennent légèrement translucides."}, {"label": "", "title": "Mouiller", "body": "Versez l'eau et ajoutez le sel. Mélangez une seule fois et portez à <strong>ébullition<\/strong>."}, {"label": "", "title": "Cuire à couvert", "body": "Dès que l'eau bout, baissez le feu <strong>au minimum<\/strong>, couvrez avec un couvercle bien hermétique et laissez cuire <strong>12 minutes<\/strong> sans soulever le couvercle."}, {"label": "", "title": "Reposer", "body": "Coupez le feu et laissez reposer <strong>10 minutes<\/strong>, toujours à couvert, sans ouvrir."}, {"label": "", "title": "Égrener", "body": "Soulevez le couvercle, égrenez délicatement le riz à la fourchette et servez."}], "categorySlug": "accompagnements"}, {"slug": "sauce-chien", "name": "Sauce chien", "nameHtml": "Sauce chien", "subtitle": "un grand bol, environ 50 cl", "emoji": "🌶️", "category": "Bases", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 oignons (ou 4 échalotes)", "1 botte de cives (environ 4 tiges)", "4 gousses d'ail", "1 bouquet de persil plat", "1 piment antillais (ou ½, selon votre tolérance)", "Le jus de 4 citrons verts", "10 cl d'huile neutre (tournesol ou colza)", "20 cl d'eau bouillante (ou de bouillon de poisson ou de volaille)", "Sel et poivre", "Facultatif : quelques feuilles de thym frais ou 1 petite branche de bois d'Inde"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Hacher les aromates<\/strong> : épluchez les oignons et l'ail. Hachez <strong>très finement au couteau<\/strong> les oignons, les cives, l'ail et le persil.", "<strong>Le piment<\/strong> : coupez le piment en deux, retirez les graines et les membranes blanches si vous voulez une sauce moins forte, puis hachez-le très finement. Lavez-vous bien les mains ensuite, ou portez des gants.", "<strong>Assaisonner<\/strong> : mettez tous les aromates hachés dans un bol, ajoutez le thym si vous en mettez, salez et poivrez généreusement. Mélangez.", "<strong>Le citron vert<\/strong> : versez le jus des citrons verts et mélangez.", "<strong>L'eau bouillante<\/strong> : versez l'eau bouillante sur le mélange : elle « cuit » légèrement les aromates et adoucit le goût de l'oignon et de l'ail.", "<strong>L'huile<\/strong> : ajoutez l'huile et mélangez bien.", "<strong>Le repos<\/strong> : laissez reposer <strong>au moins 30 minutes<\/strong> à température ambiante pour que les saveurs se mélangent. Goûtez et rectifiez le sel, le citron ou le piment avant de servir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Hachez au couteau, pas au mixeur<\/strong> : le mixeur écrase les herbes et rend la sauce trouble et amère. Les morceaux doivent rester fins mais distincts.", "<strong>L'eau bouillante est le secret<\/strong> de la sauce chien : elle donne une sauce plus douce et plus digeste qu'une simple vinaigrette crue.", "<strong>Dosez le piment avec prudence<\/strong> : le piment antillais est très fort. Commencez par une petite quantité, vous pourrez toujours en ajouter.", "<strong>La sauce se conserve<\/strong> 2 à 3 jours au réfrigérateur dans un bocal fermé. Sortez-la un peu avant de servir."]}]}]}, {"title": "Idées d'utilisation", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Poisson grillé ou frit, poisson pané (voir la recette du recueil), accras d     var hasSteps = r.steps.length > 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn nav" data-back>← ' + findCategory(r.categorySlug).nameHtml + "</button>" +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1>" +
      (r.subtitle ? '<p class="sub">' + r.subtitle + "</p>" : "") + "</div>" +
      (hasSteps ? '<button class="btn primary nav" id="start" data-go="#/r/' + r.slug + '/etape/1">▶ Pas à pas</button>' : "") +
      "</header>" +
      '<main class="scroll recipe">' +
      (r.ingredients ? sectionHtml(r.ingredients) : "<div></div>") +
      "<div>" + r.prep.map(function (s) { return sectionHtml(s); }).join("") + "</div>" +
      (r.other.length ? '<div class="extras">' + r.other.map(function (s) { return sectionHtml(s); }).join("") + "</div>" : "") +
      "</main>";
    focusEl(document.getElementById("start") || app.querySelector(".nav"));
  }

  function sizeClass(htmlText) {
    var len = htmlText.replace(/<[^>]*>/g, "").length;
    return len > 320 ? " xlong" : len > 200 ? " long" : "";
  }

  // Sur grand écran (TV), rapetisse le texte de l'étape tant qu'il dépasse :
  // la télécommande ne permet pas de faire défiler la zone de l'étape
  function fitStep() {
    var step = app.querySelector(".step");
    var body = app.querySelector(".step .sbody");
    var title = app.querySelector(".step .stitle");
    if (!step || !body || window.innerWidth <= 700) return;
    body.style.fontSize = "";
    if (title) title.style.fontSize = "";
    var base = parseFloat(getComputedStyle(body).fontSize);
    var tbase = title ? parseFloat(getComputedStyle(title).fontSize) : 0;
    for (var k = 0.95; step.scrollHeight > step.clientHeight + 1 && k >= 0.6; k -= 0.05) {
      body.style.fontSize = (base * k) + "px";
      if (title) title.style.fontSize = (tbase * Math.max(k, 0.8)) + "px";
    }
  }

  function renderStep(r, n) {
    var s = r.steps[n - 1];
    var total = r.steps.length;
    var dir = n < lastStep ? " rev" : "";
    lastStep = n;
    document.title = r.name + " – étape " + n;
    var side = app.querySelector(".side");
    var sideScroll = side ? side.scrollTop : 0;
    app.innerHTML =
      '<header class="top">' +
      '<button class="btn" tabindex="-1" data-back>✕ Quitter</button>' +
      '<div class="ttl"><h1>' + r.emoji + " " + r.nameHtml + "</h1></div>" +
      "</header>" +
      '<div class="progress"><div style="width:' + (n / total * 100) + '%"></div></div>' +
      '<main class="stepmain">' +
      '<section class="step"><div class="stepinner fade' + dir + '">' +
      '<div class="count">Étape ' + n + " / " + total + "</div>" +
      (s.label ? '<p class="label">' + s.label + "</p>" : "") +
      (s.title ? '<h2 class="stitle">' + s.title + "</h2>" : "") +
      '<p class="sbody' + sizeClass(s.body) + '">' + s.body + "</p></div></section>" +
      (r.ingredients ? sectionHtml(r.ingredients, "side") : "") +
      "</main>" +
      '<footer class="stepfoot">' +
      '<button class="btn" tabindex="-1" data-step="-1"' + (n === 1 ? " disabled style=\"visibility:hidden\"" : "") + ">◀ Précédente</button>" +
      '<span class="hint">◀ ▶ changer d\'étape · ▲ ▼ ingrédients · Retour pour quitter</span>' +
      '<button class="btn primary" tabindex="-1" data-step="1">' + (n === total ? "Terminé ✓" : "Suivante ▶") + "</button>" +
      "</footer>";
    var newSide = app.querySelector(".side");
    if (newSide) newSide.scrollTop = sideScroll;
    fitStep();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function render() {
    var prev = view;
    view = parseRoute();
    if (view.name !== "step") lastStep = 0;
    if (view.name === "home") renderHome();
    else if (view.name === "category") { lastCat = view.cat.slug; renderCategory(view.cat); }
    else if (view.name === "recipe") {
      lastSlug = view.recipe.slug;
      lastCat = view.recipe.categorySlug;
      renderRecipe(view.recipe);
    }
    else {
      if (prev.name !== "step" || prev.recipe !== view.recipe) lastStep = 0;
      lastSlug = view.recipe.slug;
      renderStep(view.recipe, view.n);
    }
    keepAwake(view.name === "step");
  }

  function changeStep(delta) {
    var n = view.n + delta;
    if (n < 1) return;
    if (n > view.recipe.steps.length) { goBack(); return; }
    replace("#/r/" + view.recipe.slug + "/etape/" + n);
  }

  // ---------- Navigation à la télécommande ----------
  function focusEl(el) {
    if (!el) return;
    el.focus({ preventScroll: true });
    var sc = el.classList.contains("card") && app.querySelector(".scroll");
    if (!sc) {
      if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    // Garde la carte visible, avec une marge pour l'effet d'agrandissement au focus
    var view = sc.getBoundingClientRect(), card = el.getBoundingClientRect();
    var pad = 16;
    if (card.top < view.top + pad) sc.scrollBy({ top: card.top - view.top - pad, behavior: "smooth" });
    else if (card.bottom > view.bottom - pad) sc.scrollBy({ top: card.bottom - view.bottom + pad, behavior: "smooth" });
  }

  function moveFocus(dir) {
    var els = Array.prototype.slice.call(app.querySelectorAll(".nav"));
    var cur = document.activeElement;
    if (els.indexOf(cur) < 0) { focusEl(els[0]); return !!els[0]; }
    var a = cur.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = null, bestScore = Infinity;
    els.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      var main, cross;
      if (dir === "left") { main = -dx; cross = dy; }
      else if (dir === "right") { main = dx; cross = dy; }
      else if (dir === "up") { main = -dy; cross = dx; }
      else { main = dy; cross = dx; }
      if (main <= 1) return;
      var score = main + Math.abs(cross) * 2;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) focusEl(best);
    return !!best;
  }

  function scrollArea(selector, dir) {
    var el = app.querySelector(selector);
    if (el) el.scrollBy({ top: dir * el.clientHeight * 0.45, behavior: "smooth" });
  }

  var BACK_KEYS = { Escape: 1, Backspace: 1, GoBack: 1, BrowserBack: 1 };
  var BACK_CODES = { 4: 1, 27: 1, 461: 1, 10009: 1 };
  var DIRS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Left: "left", Right: "right", Up: "up", Down: "down" };

  document.addEventListener("keydown", function (e) {
    if (BACK_KEYS[e.key] || BACK_CODES[e.keyCode]) {
      if (view.name !== "home") { e.preventDefault(); goBack(); }
      return;
    }
    var dir = DIRS[e.key];
    var enter = e.key === "Enter" || e.key === " " || e.keyCode === 13;
    if (view.name === "step") {
      if (dir === "right" || enter) { e.preventDefault(); changeStep(1); }
      else if (dir === "left") { e.preventDefault(); changeStep(-1); }
      else if (dir === "up" || dir === "down") { e.preventDefault(); scrollArea(".side", dir === "up" ? -1 : 1); }
      return;
    }
    if (dir) {
      e.preventDefault();
      if (!moveFocus(dir) && (dir === "up" || dir === "down")) scrollArea(".scroll", dir === "up" ? -1 : 1);
    }
  });

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-back],[data-step]");
    if (!t) return;
    e.preventDefault();
    if (t.hasAttribute("data-back")) goBack();
    else if (t.hasAttribute("data-step")) changeStep(parseInt(t.getAttribute("data-step"), 10));
    else go(t.getAttribute("data-go"));
  });

  // ---------- Garder l'écran allumé en mode pas à pas (si le navigateur le permet) ----------
  var wakeLock = null;
  function keepAwake(on) {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") keepAwake(view.name === "step");
  });

  render();
})();
</script>
</body>
</html>
