 la même cocotte, faites revenir les oignons et les cives 5 minutes, jusqu'à ce qu'ils soient tendres. Ajoutez 4 cuillères à soupe de poudre à colombo et faites-la revenir <strong>1 minute<\/strong> en remuant, pour qu'elle libère ses arômes sans brûler."}, {"label": "", "title": "Mijoter", "body": "Remettez le poulet et sa marinade dans la cocotte, ajoutez les pommes de terre, les christophines, le thym et les feuilles de bois d'Inde. Versez l'eau, salez légèrement, couvrez et laissez mijoter <strong>30 minutes<\/strong> à feu doux."}, {"label": "", "title": "Les aubergines", "body": "Ajoutez les aubergines (et le lait de coco si vous en mettez) et poursuivez la cuisson <strong>20 à 30 minutes<\/strong>, à couvert, en remuant de temps en temps. Les légumes doivent être fondants et la sauce un peu épaisse : les aubergines et les pommes de terre la lient naturellement."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Goûtez et rectifiez l'assaisonnement."}, {"label": "", "title": "Servir", "body": "Servez bien chaud avec du riz blanc."}], "categorySlug": "plats"}, {"slug": "cookies", "name": "Cookies au chocolat", "nameHtml": "Cookies au chocolat", "subtitle": "environ 30 cookies", "emoji": "🍪", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["500 g de farine", "250 g de beurre doux mou (sorti du réfrigérateur 1 heure avant)", "200 g de sucre roux (cassonade ou vergeoise)", "100 g de sucre en poudre", "2 œufs", "400 g de chocolat noir ou au lait (en pépites, ou une tablette concassée au couteau)", "2 cuillères à café de bicarbonate de soude (ou 1 sachet de levure chimique)", "2 sachets de sucre vanillé", "1 cuillère à café de fleur de sel (ou 2 pincées de sel fin)", "Facultatif : 150 g de noix de pécan ou de noisettes concassées"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Crémer le beurre<\/strong> : dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>.", "<strong>Les œufs<\/strong> : ajoutez les œufs un par un, en mélangeant bien entre chaque.", "<strong>La farine<\/strong> : dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible.", "<strong>Le chocolat<\/strong> : incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule.", "<strong>Le repos<\/strong> : couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux.", "<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson.", "<strong>Façonner<\/strong> : formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler.", "<strong>La cuisson<\/strong> : faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant.", "<strong>Refroidir<\/strong> : laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne prolongez pas la cuisson<\/strong> même si les cookies semblent trop mous à la sortie du four : ils durcissent en refroidissant, et trop cuits ils deviennent secs et cassants.", "<strong>Le sucre roux<\/strong> donne des cookies moelleux et un goût de caramel ; plus il y a de sucre blanc, plus ils sont croustillants.", "<strong>Pour des cookies bien ronds<\/strong>, posez un grand verre retourné autour de chaque cookie dès la sortie du four et faites-le tourner pour arrondir les bords.", "<strong>Pour un aspect gourmand<\/strong>, enfoncez quelques pépites de chocolat sur le dessus des boules avant la cuisson et saupoudrez d'une pincée de fleur de sel en sortant du four.", "<strong>La pâte se congèle très bien<\/strong> en boules : faites-les cuire directement sans décongeler, en ajoutant 2 minutes de cuisson.", "<strong>Les cookies se conservent<\/strong> une semaine dans une boîte en métal hermétique. Ajoutez une tranche de pain de mie dans la boîte : ils resteront moelleux."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Double chocolat<\/strong> : remplacez 60 g de farine par 60 g de cacao en poudre non sucré.", "<strong>Chocolat blanc et cranberries<\/strong> : remplacez le chocolat noir par 250 g de chocolat blanc et 150 g de cranberries séchées.", "<strong>Beurre de cacahuète<\/strong> : remplacez 100 g de beurre par 150 g de beurre de cacahuète et ajoutez des cacahuètes concassées.", "<strong>M&amp;M's<\/strong> : remplacez la moitié du chocolat par des bonbons chocolatés colorés, enfoncés sur le dessus avant la cuisson."]}]}]}], "steps": [{"label": "", "title": "Crémer le beurre", "body": "Dans un grand saladier, travaillez le beurre mou avec le sucre roux, le sucre en poudre et le sucre vanillé, à la spatule ou au fouet, jusqu'à obtenir un mélange <strong>crémeux et homogène<\/strong>."}, {"label": "", "title": "Les œufs", "body": "Ajoutez les œufs un par un, en mélangeant bien entre chaque."}, {"label": "", "title": "La farine", "body": "Dans un autre bol, mélangez la farine, le bicarbonate et le sel. Versez-les dans le saladier et mélangez <strong>juste assez<\/strong> pour qu'il n'y ait plus de farine visible."}, {"label": "", "title": "Le chocolat", "body": "Incorporez les pépites ou morceaux de chocolat (et les noix si vous en mettez) avec une spatule."}, {"label": "", "title": "Le repos", "body": "Couvrez et placez la pâte <strong>au moins 1 heure<\/strong> au réfrigérateur. Elle s'étalera moins à la cuisson et les cookies seront plus épais et moelleux."}, {"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong> et recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Façonner", "body": "Formez des boules de pâte de la taille d'une grosse noix (environ 50 g) et déposez-les sur les plaques en les espaçant de 5 cm : elles vont s'étaler."}, {"label": "", "title": "La cuisson", "body": "Faites cuire <strong>10 à 12 minutes<\/strong>, une plaque à la fois. Les bords doivent être dorés mais le centre encore <strong>pâle et mou<\/strong> : c'est normal, les cookies finissent de cuire en refroidissant."}, {"label": "", "title": "Refroidir", "body": "Laissez les cookies 5 minutes sur la plaque, puis faites-les glisser sur une grille pour qu'ils refroidissent complètement."}], "categorySlug": "patisseries"}, {"slug": "court-bouillon-de-poisson", "name": "Court-bouillon de poisson", "nameHtml": "Court-bouillon de poisson", "subtitle": "8 personnes", "emoji": "🍅", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Poisson et marinade", "blocks": [{"t": "ul", "items": ["2,5 kg de poisson à chair ferme en darnes (vivaneau, acoupa, mérou, thon, mahi-mahi)", "4 citrons verts", "6 gousses d'ail", "1 piment antillais", "Sel et poivre"]}]}, {"title": "Sauce", "blocks": [{"t": "ul", "items": ["4 cuillères à soupe d'huile", "3 oignons", "1 botte de cives", "2 poivrons (rouge et vert)", "6 tomates bien mûres (ou 1 grande boîte de tomates concassées de 800 g)", "2 cuillères à soupe de concentré de tomates", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "2 gousses d'ail", "1 piment antillais entier (non percé)", "40 cl d'eau", "1 cuillère à café de roucou en poudre (ou de paprika), pour la couleur"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Nettoyer le poisson<\/strong> : rincez les darnes de poisson et frottez-les avec le jus de 2 citrons verts. Rincez-les rapidement.", "<strong>La marinade<\/strong> : mélangez le jus d'un citron vert, 4 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Enrobez-en le poisson et laissez mariner <strong>30 minutes à 1 heure<\/strong> au réfrigérateur.", "<strong>Préparer les légumes<\/strong> : émincez les oignons, les cives et les poivrons. Coupez les tomates en dés.", "<strong>La base de sauce<\/strong> : dans une grande sauteuse ou une cocotte, faites chauffer l'huile et faites revenir les oignons, les cives et les poivrons <strong>5 minutes<\/strong>. Ajoutez le roucou, le concentré de tomates, et faites revenir <strong>1 minute<\/strong> en remuant.", "<strong>Mijoter la sauce<\/strong> : ajoutez les tomates, le thym, le bois d'Inde, le piment entier et l'eau. Salez légèrement, couvrez et laissez mijoter <strong>15 minutes<\/strong> à feu doux, jusqu'à ce que la sauce épaississe.", "<strong>Le poisson<\/strong> : déposez les darnes de poisson et leur marinade dans la sauce, en les enfonçant à moitié. Couvrez et laissez cuire <strong>10 à 15 minutes<\/strong> à feu doux, <strong>sans remuer<\/strong>, en arrosant le poisson de sauce de temps en temps.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes finement hachées et le persil ciselé. Retirez le piment entier. Goûtez et rectifiez l'assaisonnement.", "<strong>Servir<\/strong> : servez bien chaud avec du riz blanc."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Ne remuez pas<\/strong> une fois >Le repos<\/strong> : laissez reposer la pâte <strong>1 heure<\/strong> à température ambiante. Ce n'est pas obligatoire, mais les crêpes seront plus souples.", "<strong>La cuisson<\/strong> : chauffez une poêle bien chaude et graissez-la légèrement avec un papier absorbant imbibé d'huile ou de beurre. Versez une petite louche de pâte et inclinez la poêle pour l'étaler en couche fine.", "<strong>Retourner<\/strong> : quand les bords se décollent et dorent (environ 1 à 2 minutes), retournez la crêpe et laissez cuire 30 secondes à 1 minute de l'autre côté."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>S'il y a des grumeaux<\/strong>, passez la pâte au mixeur plongeant quelques secondes.", "<strong>Si la pâte est trop épaisse<\/strong>, ajoutez un peu de lait ou d'eau.", "<strong>La première crêpe est souvent ratée<\/strong>, c'est normal : elle sert à bien graisser et chauffer la poêle.", "Pour les garder chaudes, empilez-les sur une assiette posée sur une casserole d'eau frémissante et couvrez-les.", "Avec cette quantité, utiliser <strong>deux poêles en même temps<\/strong> fait gagner beaucoup de temps."]}]}]}, {"title": "Idées de garnitures", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Sucre et citron, Nutella, confiture, caramel au beurre salé, banane et chocolat, ou crème de marrons."}]}]}], "steps": [{"label": "", "title": "Le mélange", "body": "Versez la farine dans un grand saladier et creusez un puits au centre. Ajoutez-y les œufs, le sel et le sucre."}, {"label": "", "title": "Le lait", "body": "Mélangez au fouet en versant le lait <strong>petit à petit<\/strong> pour éviter les grumeaux."}, {"label": "", "title": "Le beurre", "body": "Incorporez le beurre fondu, puis l'arôme si vous en mettez un. La pâte doit être fluide, comme une crème liquide."}, {"label": "", "title": "Le repos", "body": "Laissez reposer la pâte <strong>1 heure<\/strong> à température ambiante. Ce n'est pas obligatoire, mais les crêpes seront plus souples."}, {"label": "", "title": "La cuisson", "body": "Chauffez une poêle bien chaude et graissez-la légèrement avec un papier absorbant imbibé d'huile ou de beurre. Versez une petite louche de pâte et inclinez la poêle pour l'étaler en couche fine."}, {"label": "", "title": "Retourner", "body": "Quand les bords se décollent et dorent (environ 1 à 2 minutes), retournez la crêpe et laissez cuire 30 secondes à 1 minute de l'autre côté."}], "categorySlug": "desserts"}, {"slug": "croissants", "name": "Croissants", "nameHtml": "Croissants", "subtitle": "environ 24 croissants", "emoji": "🥐", "category": "Pains et viennoiseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Détrempe", "blocks": [{"t": "ul", "items": ["1 kg de farine T45 (ou farine de gruau)", "30 cl de lait entier froid", "30 cl d'eau froide", "120 g de sucre", "40 g de levure de boulanger fraîche (ou 2 sachets de levure sèche, 14 g)", "20 g de sel", "100 g de beurre mou"]}]}, {"title": "Beurre de tourage", "blocks": [{"t": "ul", "items": ["560 g de beurre bien froid (idéalement un beurre sec, dit « beurre de tourage », ou un beurre à 82 % de matière grasse)"]}]}, {"title": "Dorure", "blocks": [{"t": "ul", "items": ["2 œufs + 2 cuillères à soupe de lait"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La détrempe<\/strong> : dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique.", "<strong>Le repos au froid<\/strong> : divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>.", "<strong>Préparer le beurre<\/strong> : coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid.", "<strong>Enfermer le beurre<\/strong> : travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords.", "<strong>Le tour double<\/strong> : étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>Le tour simple<\/strong> : tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton.", "<strong>Étaler<\/strong> : étalez chaque pâton en un rectangle d'environ <strong>25 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid.", "<strong>Découper<\/strong> : découpez des triangles de <strong>10 cm de base<\/strong> et de 25 cm de hauteur. Faites une petite entaille de 1 cm au milieu de la base.", "<strong>Façonner<\/strong> : étirez légèrement chaque triangle, puis roulez-le sans serrer, de la base vers la pointe. La pointe doit se retrouver <strong>en dessous<\/strong>. Déposez les croissants sur des plaques recouvertes de papier cuisson, bien espacés.", "<strong>La pousse<\/strong> : mélangez les œufs et le lait, et badigeonnez une première fois les croissants au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume et qu'ils tremblent quand on secoue la plaque.", "<strong>La cuisson<\/strong> : préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois les croissants et faites-les cuire <strong>15 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés.", "<strong>Refroidir<\/strong> : laissez-les tiédir sur une grille avant de les déguster."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Tout doit rester froid<\/strong> : si le beurre fond pendant le tourage, les feuilletages se soudent et les croissants ne seront pas feuilletés. Au moindre doute, remettez la pâte 15 minutes au réfrigérateur.", "<strong>En climat chaud<\/strong>, travaillez tôt le matin, dans une pièce climatisée, et faites reposer la pâte au réfrigérateur plus longtemps entre chaque étape.", "<strong>Deux pâtons<\/strong> sont bien plus faciles à étaler qu'un seul gros : la pâte reste froide et ne se déchire pas.", "<strong>Ne laissez pas pousser au chaud<\/strong> : au-dessus de 25 °C, le beurre fond et coule à la cuisson.", "<strong>Préparez-les la veille<\/strong> : façonnez les croissants le soir, couvrez-les et placez-les au réfrigérateur. Le lendemain matin, laissez-les pousser 2 à 3 heures à température ambiante, puis faites-les cuire.", "<strong>Congélation<\/strong> : les croissants crus et façonnés se congèlent sur une plaque, puis en sachet. La veille, posez-les sur une plaque au réfrigérateur, puis laissez-les pousser le matin."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Croissants aux amandes<\/strong> : coupez des croissants de la veille en deux, imbibez-les de sirop, garnissez-les de crème d'amande, parsemez d'amandes effilées et faites-les cuire 15 minutes à 180 °C.", "<strong>Pains au chocolat<\/strong> : avec la même pâte (voir la recette de pain au chocolat).", "<strong>Croissants jambon-fromage<\/strong> : déposez une demi-tranche de jambon et un peu de fromage râpé sur chaque triangle avant de le rouler."]}]}]}], "steps": [{"label": "", "title": "La détrempe", "body": "Dans le bol d'un robot pétrisseur, mettez la farine, puis le sucre et le sel d'un côté et la levure émiettée de l'autre. Ajoutez le lait, l'eau et le beurre mou. Pétrissez <strong>5 minutes<\/strong> à vitesse lente, jusqu'à obtenir une pâte lisse et homogène. Ne pétrissez pas plus : la pâte ne doit pas devenir élastique."}, {"label": "", "title": "Le repos au froid", "body": "Divisez la pâte en <strong>deux pâtons<\/strong>, aplatissez-les en rectangles, emballez-les dans du film alimentaire et placez-les au réfrigérateur <strong>au moins 4 heures, idéalement une nuit<\/strong>."}, {"label": "", "title": "Préparer le beurre", "body": "Coupez le beurre en deux. Placez chaque moitié entre deux feuilles de papier cuisson, tapez-la avec le rouleau pour l'assouplir, puis étalez-la en un carré d'environ 18 cm de côté. Remettez-les au réfrigérateur : le beurre doit avoir <strong>la même consistance que la détrempe<\/strong>, souple mais froid."}, {"label": "", "title": "Enfermer le beurre", "body": "Travaillez un pâton à la fois, l'autre restant au froid. Sur un plan de travail fariné, étalez la détrempe en un rectangle deux fois plus long que le carré de beurre. Posez le beurre au centre et rabattez les deux côtés de la pâte par-dessus pour l'enfermer. Soudez bien les bords."}, {"label": "", "title": "Le tour double", "body": "Étalez la pâte en un long rectangle d'environ <strong>60 × 20 cm<\/strong>, toujours dans le même sens. Rabattez un quart de la longueur vers le centre, puis le quart opposé, et repliez le tout en deux comme un livre. Emballez la pâte et laissez-la reposer <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "Le tour simple", "body": "Tournez la pâte d'un quart de tour, étalez-la à nouveau en un long rectangle, puis pliez-la en trois comme une lettre. Emballez-la et laissez-la reposer <strong>1 heure<\/strong> au réfrigérateur. Recommencez les étapes 4 à 6 avec le second pâton."}, {"label": "", "title": "Étaler", "body": "Étalez chaque pâton en un rectangle d'environ <strong>25 cm de large<\/strong> et <strong>4 mm d'épaisseur<\/strong>. Si la pâte se rétracte, remettez-la 15 minutes au froid."}, {"label": "", "title": "Découper", "body": "Découpez des triangles de <strong>10 cm de base<\/strong> et de 25 cm de hauteur. Faites une petite entaille de 1 cm au milieu de la base."}, {"label": "", "title": "Façonner", "body": "Étirez légèrement chaque triangle, puis roulez-le sans serrer, de la base vers la pointe. La pointe doit se retrouver <strong>en dessous<\/strong>. Déposez les croissants sur des plaques recouvertes de papier cuisson, bien espacés."}, {"label": "", "title": "La pousse", "body": "Mélangez les œufs et le lait, et badigeonnez une première fois les croissants au pinceau. Laissez-les lever <strong>2 heures à 2 h 30<\/strong> dans un endroit tiède, <strong>à 25 °C au maximum<\/strong>, jusqu'à ce qu'ils aient presque doublé de volume et qu'ils tremblent quand on secoue la plaque."}, {"label": "", "title": "La cuisson", "body": "Préchauffez le four à <strong>190 °C<\/strong> (chaleur traditionnelle). Badigeonnez une seconde fois les croissants et faites-les cuire <strong>15 à 18 minutes<\/strong>, jusqu'à ce qu'ils soient bien dorés."}, {"label": "", "title": "Refroidir", "body": "Laissez-les tiédir sur une grille avant de les déguster."}], "categorySlug": "pains-et-viennoiseries"}, {"slug": "croque-monsieur", "name": "Croque-monsieur", "nameHtml": "Croque-monsieur", "subtitle": "8 croque-monsieur", "emoji": "🥪", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["16 tranches de pain de mie", "8 tranches de jambon blanc", "300 g de fromage râpé (emmental ou gruyère)", "60 g de beurre mou"]}]}, {"title": "Béchamel", "blocks": [{"t": "ul", "items": ["40 g de beurre", "40 g de farine", "50 cl de lait", "1 pincée de noix de muscade râpée", "Sel et poivre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La béchamel<\/strong> : dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 minutes<\/strong> à feu doux. Salez, poivrez, ajoutez la muscade et laissez tiédir.", "<strong>Préchauffer<\/strong> : préchauffez le four à <strong>200 °C<\/strong> (position gril si possible). Recouvrez deux plaques de papier cuisson.", "<strong>Beurrer<\/strong> : beurrez légèrement une face de chaque tranche de pain de mie.", "<strong>Monter<\/strong> : posez 8 tranches sur les plaques, face beurrée en dessous. Étalez une fine couche de béchamel, posez une tranche de jambon pliée à la taille du pain et une petite poignée de fromage râpé. Recouvrez d'une seconde tranche de pain, face beurrée au-dessus.", "<strong>Le dessus<\/strong> : étalez le reste de béchamel sur le dessus des croque-monsieur et parsemez du reste de fromage.", "<strong>Cuire<\/strong> : enfournez <strong>10 à 15 minutes<\/strong>, jusqu'à ce que le dessus soit bien gratiné et doré.", "<strong>Servir<\/strong> : servez aussitôt, avec une salade verte."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La béchamel<\/strong> rend le croque-monsieur fondant à l'intérieur et gratiné dessus, comme au bistrot.", "<strong>Sans béchamel<\/strong>, version rapide : beurrez le pain à l'extérieur, garnissez de jambon et de fromage, et faites dorer <strong>3 minutes de chaque côté<\/strong> à la poêle ou dans un appareil à croque-monsieur.", "<strong>Surveillez la cuisson<\/strong> sous le gril : le fromage passe vite de doré à brûlé."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Croque-madame<\/strong> : posez un œuf au plat sur chaque croque-monsieur au moment de servir.", "<strong>Au poulet<\/strong> : remplacez le jambon par des restes de poulet rôti effiloché.", "<strong>Au thon<\/strong> : avec du thon émietté mélangé à un peu de béchamel et de tomate.", "<strong>Végétarien<\/strong> : avec des tomates, des champignons et des épinards à la place du jambon."]}]}]}], "steps": [{"label": "", "title": "La béchamel", "body": "Dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 minutes<\/strong> à feu doux. Salez, poivrez, ajoutez la muscade et laissez tiédir."}, {"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>200 °C<\/strong> (position gril si possible). Recouvrez deux plaques de papier cuisson."}, {"label": "", "title": "Beurrer", "body": "Beurrez légèrement une face de chaque tranche de pain de mie."}, {"label": "", "title": "Monter", "body": "Posez 8 tranches sur les plaques, face beurrée en dessous. Étalez une fine couche de béchamel, posez une tranche de jambon pliée à la taille du pain et une petite poignée de fromage râpé. Recouvrez d'une seconde tranche de pain, face beurrée au-dessus."}, {"label": "", "title": "Le dessus", "body": "Étalez le reste de béchamel sur le dessus des croque-monsieur et parsemez du reste de fromage."}, {"label": "", "title": "Cuire", "body": "Enfournez <strong>10 à 15 minutes<\/strong>, jusqu'à ce que le dessus soit bien gratiné et doré."}, {"label": "", "title": "Servir", "body": "Servez aussitôt, avec une salade verte."}], "categorySlug": "plats"}, {"slug": "dombres", "name": "Dombrés aux crevettes", "nameHtml": "Dombrés aux crevettes", "subtitle": "8 personnes", "emoji": "🥣", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Dombrés", "blocks": [{"t": "ul", "items": ["500 g de farine", "25 cl d'eau tiède (environ)", "1 cuillère à café de sel"]}]}, {"title": "Sauce et crevettes", "blocks": [{"t": "ul", "items": ["1,5 kg de crevettes crues décortiquées", "2 citrons verts", "6 gousses d'ail", "1 piment antillais", "4 cuillères à soupe d'huile", "3 oignons", "1 botte de cives", "4 tomates", "2 cuillères à soupe de concentré de tomates", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 litre d'eau (ou de fumet de poisson)", "Sel et poivre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Mariner les crevettes<\/strong> : mélangez les crevettes avec le jus d'un citron vert, 4 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Réservez <strong>30 minutes<\/strong> au réfrigérateur.", "<strong>La pâte des dombrés<\/strong> : dans un saladier, mélangez la farine et le sel. Versez l'eau petit à petit en mélangeant, puis pétrissez <strong>5 minutes<\/strong> jusqu'à obtenir une pâte souple et lisse, qui ne colle pas. Couvrez et laissez reposer <strong>15 minutes<\/strong>.", "<strong>Façonner<\/strong> : prélevez des petits morceaux de pâte et roulez-les entre vos paumes pour former des <strong>boudins de 5 cm<\/strong> ou des petites boules de la taille d'une noix. Posez-les sur un plateau fariné.", "<strong>La sauce<\/strong> : émincez les oignons et les cives, coupez les tomates en dés. Dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives <strong>5 minutes<\/strong>. Ajoutez le concentré de tomates et faites revenir <strong>1 minute<\/strong>, puis ajoutez les tomates, le thym et le bois d'Inde.", "<strong>Cuire les dombrés<\/strong> : versez l'eau, salez légèrement et portez à ébullition. Plongez les dombrés dans la sauce bouillante, baissez le feu, couvrez et laissez cuire <strong>15 à 20 minutes<\/strong> à feu doux, en remuant délicatement de temps en temps. Les dombrés gonflent et épaississent la sauce.", "<strong>Les crevettes<\/strong> : ajoutez les crevettes et leur marinade et laissez cuire <strong>4 à 5 minutes<\/strong>, jusqu'à ce qu'elles soient roses et opaques.", "<strong>La touche finale<\/strong> : hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes hachées et le persil ciselé. Goûtez, rectifiez l'assaisonnement et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Les dombrés<\/strong> sont des petites boulettes de farine pochées, typiques de la Guadeloupe. Ils doivent être fermes mais moelleux : ne les faites pas trop gros, sinon le cœur reste pâteux.", "<strong>La sauce doit bouillir<\/strong> au moment d'y plonger les dombrés, sinon ils se délitent.", "<strong>Les crevettes en dernier<\/strong> : elles cuisent en quelques minutes et deviennent caoutchouteuses si elles cuisent trop.", "<strong>Ajoutez de l'eau<\/strong> si la sauce devient trop épaisse : les dombrés absorbent beaucoup de liquide."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Dombrés aux haricots rouges<\/strong> : remplacez les crevettes par 4 boîtes de haricots rouges cuits (ou 1 kg de haricots secs cuits, voir la recette de haricots rouges) et 300 g de lard fumé en dés, revenus avec les oignons.", "<strong>Dombrés au poulet<\/strong> : avec 1,5 kg de poulet en petits morceaux, dorés au début et mijotés 30 minutes avant d'ajouter les dombrés.", "<strong>Dombrés à la morue<\/strong> : avec 800 g de morue dessalée et émiettée, ajoutée 5 minutes avant la fin."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Les dombrés se suffisent à eux-mêmes ; servez-les avec une salade de crudités et de la sauce chien."}]}]}], "steps": [{"label": "", "title": "Mariner les crevettes", "body": "Mélangez les crevettes avec le jus d'un citron vert, 4 gousses d'ail écrasées, le piment haché (sans les graines si vous le voulez moins fort), du sel et du poivre. Réservez <strong>30 minutes<\/strong> au réfrigérateur."}, {"label": "", "title": "La pâte des dombrés", "body": "Dans un saladier, mélangez la farine et le sel. Versez l'eau petit à petit en mélangeant, puis pétrissez <strong>5 minutes<\/strong> jusqu'à obtenir une pâte souple et lisse, qui ne colle pas. Couvrez et laissez reposer <strong>15 minutes<\/strong>."}, {"label": "", "title": "Façonner", "body": "Prélevez des petits morceaux de pâte et roulez-les entre vos paumes pour former des <strong>boudins de 5 cm<\/strong> ou des petites boules de la taille d'une noix. Posez-les sur un plateau fariné."}, {"label": "", "title": "La sauce", "body": "Émincez les oignons et les cives, coupez les tomates en dés. Dans une grande cocotte, faites chauffer l'huile et faites revenir les oignons et les cives <strong>5 minutes<\/strong>. Ajoutez le concentré de tomates et faites revenir <strong>1 minute<\/strong>, puis ajoutez les tomates, le thym et le bois d'Inde."}, {"label": "", "title": "Cuire les dombrés", "body": "Versez l'eau, salez légèrement et portez à ébullition. Plongez les dombrés dans la sauce bouillante, baissez le feu, couvrez et laissez cuire <strong>15 à 20 minutes<\/strong> à feu doux, en remuant délicatement de temps en temps. Les dombrés gonflent et épaississent la sauce."}, {"label": "", "title": "Les crevettes", "body": "Ajoutez les crevettes et leur marinade et laissez cuire <strong>4 à 5 minutes<\/strong>, jusqu'à ce qu'elles soient roses et opaques."}, {"label": "", "title": "La touche finale", "body": "Hors du feu, ajoutez le jus du dernier citron vert, les 2 gousses d'ail restantes hachées et le persil ciselé. Goûtez, recti rong>6 à 8 minutes<\/strong> : elles doivent être tendres à cœur mais rester <strong>pâles<\/strong>, sans colorer. Égouttez-les sur du papier absorbant.", "<strong>Le repos<\/strong> : laissez reposer les frites <strong>au moins 15 minutes<\/strong>, le temps qu'elles refroidissent.", "<strong>Deuxième cuisson<\/strong> : juste avant de servir, faites chauffer l'huile à <strong>180 °C<\/strong>. Replongez les frites par petites quantités pendant <strong>2 à 3 minutes<\/strong>, jusqu'à ce qu'elles soient bien dorées et croustillantes.", "<strong>Égoutter et saler<\/strong> : égouttez-les sur du papier absorbant, salez-les aussitôt et servez immédiatement."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La double cuisson est le secret<\/strong> des frites croustillantes dehors et fondantes dedans : la première cuit l'intérieur, la seconde dore l'extérieur.", "<strong>Rincer et sécher<\/strong> retire l'amidon et l'eau : les frites ne collent pas entre elles et croustillent mieux.", "<strong>Ne surchargez pas la friteuse<\/strong> : trop de frites d'un coup font chuter la température de l'huile, et les frites deviennent molles et grasses.", "<strong>Préparez la première cuisson à l'avance<\/strong> : les frites précuites se gardent quelques heures à température ambiante, ou se congèlent étalées sur une plaque. Il ne reste que la seconde cuisson au moment du repas.", "<strong>Salez au dernier moment<\/strong>, dans un grand saladier en les faisant sauter : le sel adhère mieux sur les frites chaudes.", "<strong>Sécurité<\/strong> : ne laissez jamais l'huile chaude sans surveillance, et n'y versez jamais d'eau en cas de flamme : couvrez la casserole avec un couvercle et coupez le feu."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au four<\/strong> : après le rinçage et le séchage, mélangez les frites avec 3 cuillères à soupe d'huile, étalez-les en une seule couche > au réfrigérateur."}, {"label": "", "title": "Dorer et décorer", "body": "Préchauffez le four à <strong>200 °C<\/strong>. Badigeonnez le dessus de jaune d'œuf mélangé au lait, <strong>sans couler sur les bords<\/strong>. Laissez sécher 5 minutes, redorez, puis dessinez des motifs (rosace, feuilles, quadrillage) avec la pointe d'un couteau, sans percer la pâte. Faites 4 ou 5 petits trous au centre pour laisser s'échapper la vapeur."}, {"label": "", "title": "Cuire", "body": "Enfournez, baissez à <strong>180 °C<\/strong> et faites cuire <strong>35 à 40 minutes<\/strong>, jusqu'à ce que les galettes soient bien gonflées et dorées."}, {"label": "", "title": "Faire briller", "body": "À la sortie du four, badigeonnez-les aussitôt de sirop de sucre. Laissez tiédir avant de servir."}], "categorySlug": "patisseries"}, {"slug": "gateau-au-chocolat", "name": "Gâteau au chocolat fondant", "nameHtml": "Gâteau au chocolat fondant", "subtitle": "2 gâteaux de 24 cm, 16 personnes", "emoji": "🍫", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["400 g de chocolat noir pâtissier (à 52 % ou plus)", "300 g de beurre doux", "300 g de sucre", "8 œufs", "120 g de farine", "1 pincée de sel", "Facultatif : 1 sachet de sucre vanillé, 1 cuillère à soupe de café soluble ou de rhum"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules à manqué de 24 cm (ou tapissez le fond de papier cuisson).", "<strong>Fondre le chocolat<\/strong> : cassez le chocolat en morceaux et faites-le fondre avec le beurre coupé en dés, au bain-marie ou au micro-ondes par tranches de <strong>30 secondes<\/strong> en remuant entre chaque. Mélangez jusqu'à obtenir un mélange lisse, et laissez tiédir.", "<strong>Œufs et sucre<\/strong> : dans un grand saladier, fouettez les œufs, le sucre et le sel <strong>2 à 3 minutes<\/strong>, jusqu'à ce que le mélange blanchisse légèrement.", "<strong>Mélanger<\/strong> : versez le chocolat fondu tiède sur les œufs en fouettant. Ajoutez la vanille, le café ou le rhum.", "<strong>La farine<\/strong> : incorporez la farine tamisée à la spatule, juste ce qu'il faut pour obtenir une pâte lisse. Ne mélangez pas trop.", "<strong>Cuire<\/strong> : répartissez la pâte dans les deux moules et faites cuire <strong>20 à 25 minutes<\/strong>. Le gâteau est prêt quand le bord est cuit mais que le centre tremble encore légèrement : une lame plantée au centre doit ressortir <strong>un peu humide<\/strong>.", "<strong>Refroidir<\/strong> : laissez tiédir <strong>15 minutes<\/strong> dans les moules avant de démouler. Servez tiède ou froid."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le secret du fondant<\/strong> : ne prolongez pas la cuisson. Il finit de cuire en refroidissant et devient encore plus fondant le lendemain.", "<strong>Le chocolat ne doit pas être trop chaud<\/strong> quand on l'ajoute aux œufs, sinon ils cuisent.", "<strong>Le choix du chocolat<\/strong> fait tout le goût du gâteau : prenez un bon chocolat pâtissier.", "<strong>Conservation<\/strong> : il se garde 4 jours à température ambiante, sous cloche, ou au réfrigérateur s'il fait chaud. Il se congèle très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Au cœur coulant<\/strong> : versez la pâte dans 16 ramequins beurrés et faites cuire <strong>8 à 10 minutes<\/strong> à 200 °C seulement.", "<strong>Brownies<\/strong> : ajoutez 200 g de noix ou de noix de pécan concassées et faites cuire dans deux moules carrés.", "<strong>Chocolat-coco<\/strong> : remplacez 40 g de farine par 80 g de noix de coco râpée.", "<strong>Sans gluten<\/strong> : remplacez la farine par de la poudre d'amande ou de la fécule de maïs."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Crème anglaise, chantilly, boule de glace à la vanille ou de sorbet coco, coulis de fruits rouges ou de maracudja."}]}]}], "steps": [{"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules à manqué de 24 cm (ou tapissez le fond de papier cuisson)."}, {"label": "", "title": "Fondre le chocolat", "body": "Cassez le chocolat en morceaux et faites-le fondre avec le beurre coupé en dés, au bain-marie ou au micro-ondes par tranches de <strong>30 secondes<\/strong> en remuant entre chaque. Mélangez jusqu'à obtenir un mélange lisse, et laissez tiédir."}, {"label": "", "title": "Œufs et sucre", "body": "Dans un grand saladier, fouettez les œufs, le sucre et le sel <strong>2 à 3 minutes<\/strong>, jusqu'à ce que le mélange blanchisse légèrement."}, {"label": "", "title": "Mélanger", "body": "Versez le chocolat fondu tiède sur les œufs en fouettant. Ajoutez la vanille, le café ou le rhum."}, {"label": "", "title": "La farine", "body": "Incorporez la farine tamisée à la spatule, juste ce qu'il faut pour obtenir une pâte lisse. Ne mélangez pas trop."}, {"label": "", "title": "Cuire", "body": "Répartissez la pâte dans les deux moules et faites cuire <strong>20 à 25 minutes<\/strong>. Le gâteau est prêt quand le bord est cuit mais que le centre tremble encore légèrement : une lame plantée au centre doit ressortir <strong>un peu humide<\/strong>."}, {"label": "", "title": "Refroidir", "body": "Laissez tiédir <strong>15 minutes<\/strong> dans les moules avant de démouler. Servez tiède ou froid."}], "categorySlug": "patisseries"}, {"slug": "gateau-au-yaourt", "name": "Gâteau au yaourt", "nameHtml": "Gâteau au yaourt", "subtitle": "2 gâteaux de 24 cm", "emoji": "🍰", "category": "Pâtisseries", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Le pot de yaourt vide sert de mesure pour tout le reste : pas besoin de balance."}, {"t": "ul", "items": ["2 pots de yaourt nature (2 × 125 g)", "6 œufs", "4 pots de sucre (environ 400 g)", "6 pots de farine (environ 420 g)", "1 pot d'huile neutre (tournesol ou colza, environ 12 cl)", "2 sachets de levure chimique", "2 sachets de sucre vanillé", "2 pincées de sel", "Facultatif : le zeste de 2 citrons, ou 2 cuillères à soupe de rhum ou de fleur d'oranger", "Un peu de beurre et de farine pour les moules"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer le four<\/strong> : préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules de 24 cm (ou recouvrez-les de papier cuisson).", "<strong>Le yaourt<\/strong> : videz les 2 yaourts dans un grand saladier. Rincez et séchez un pot : il servira de mesure.", "<strong>Les œufs et le sucre<\/strong> : ajoutez les œufs, le sucre et le sucre vanillé, puis fouettez jusqu'à ce que le mélange blanchisse légèrement.", "<strong>La farine<\/strong> : ajoutez la farine, la levure et le sel, puis mélangez jusqu'à obtenir une pâte lisse et sans grumeaux.", "<strong>L'huile<\/strong> : incorporez l'huile, puis le zeste de citron ou l'arôme si vous en mettez.", "<strong>Remplir les moules<\/strong> : répartissez la pâte dans les deux moules.", "<strong>La cuisson<\/strong> : faites cuire <strong>30 à 35 minutes<\/strong>. Le gâteau est cuit quand il est bien doré et que la lame d'un couteau plantée au centre ressort sèche.", "<strong>Démouler<\/strong> : laissez tiédir 10 minutes dans les moules, puis démoulez sur une grille et laissez refroidir."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>C'est la recette idéale à faire avec des enfants<\/strong> : tout se mesure avec le pot de yaourt et tout se mélange dans un seul saladier.", "<strong>Pour un gâteau plus moelleux<\/strong>, utilisez un yaourt à la grecque ou un yaourt au lait entier.", "<strong>Le dessus dore trop v a même pâte sert à faire deux bûches ou gâteaux roulés :"}, {"t": "ol", "items": ["Étalez la pâte sur deux plaques recouvertes de papier cuisson, sur environ 1 cm d'épaisseur.", "Faites cuire <strong>8 à 10 minutes à 200 °C<\/strong>, jusqu'à ce que le biscuit soit juste doré.", "Dès la sortie du four, retournez le biscuit sur un torchon humide, retirez le papier et roulez-le dans le torchon. Laissez-le refroidir ainsi, puis déroulez-le, garnissez-le et roulez-le à nouveau."]}]}]}, {"title": "Idées de gâteaux", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Fraisier, forêt-noire, gâteau d'anniversaire à la crème et aux fruits, gâteau au chocolat fourré de ganache, bûche de Noël, gâteau roulé à la confiture, charlotte."}]}]}], "steps": [{"label": "", "title": "Préchauffer le four", "body": "Préchauffez le four à <strong>180 °C<\/strong>. Beurrez et farinez deux moules ronds de 24 cm, ou recouvrez leur fond d'un disque de papier cuisson."}, {"label": "", "title": "Le bain-marie", "body": "Dans un grand saladier résistant à la chaleur, mettez les œufs entiers, le sucre, le sucre vanillé et le sel. Posez-le sur une casserole d'eau <strong>frémissante<\/strong>, sans que le fond touche l'eau."}, {"label": "", "title": "Fouetter à chaud", "body": "Fouettez sans arrêt, de préférence au batteur électrique, jusqu'à ce que le mélange soit tiède au doigt (<strong>45 à 50 °C<\/strong>) et ait doublé de volume, environ 5 minutes."}, {"label": "", "title": "Fouetter à froid", "body": "Retirez le saladier du bain-marie et continuez de fouetter à grande vitesse <strong>8 à 10 minutes<\/strong>, jusqu'à ce que le mélange ait refroidi et triplé de volume. Il est prêt quand il forme un <strong>ruban<\/strong> épais qui reste quelques secondes à la surface quand on soulève le fouet."}, {"label": "", "title": "La farine", "body": "Tamisez la farine en trois fois au-dessus du saladier, en l'incorporant à chaque fois <strong>très délicatement<\/strong> avec une spatule, en soulevant la pâte du fond vers le dessus. Arrêtez dès qu'il n'y a plus de farine visible : la pâte ne doit pas retomber."}, {"label": "", "title": "", "body": "<strong>Le beurre<\/strong> (facultatif) : prélevez 2 cuillères de pâte, mélangez-les avec le beurre fondu tiède, puis reversez ce mélange dans le saladier et incorporez-le délicatement."}, {"label": "", "title": "Remplir les moules", "body": "Répartissez la pâte dans les deux moules et lissez la surface sans appuyer."}, {"label": "", "title": "La cuisson", "body": "Enfournez aussitôt et faites cuire <strong>20 à 25 minutes<\/strong>, sans ouvrir le four pendant les 15 premières minutes. La génoise est cuite quand elle est dorée, se décolle des bords et reprend sa forme quand on appuie doucement dessus."}, {"label": "", "title": "Démouler", "body": "Démoulez dès la sortie du four sur une grille et laissez refroidir complètement avant de couper ou de garnir."}], "categorySlug": "patisseries"}, {"slug": "giraumonade", "name": "Giraumonade", "nameHtml": "Giraumonade", "subtitle": "8 personnes", "emoji": "🎃", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de giraumon (potiron antillais), épluché et épépiné", "2 oignons", "1 botte de cives", "4 gousses d'ail", "2 branches de thym", "1 piment antillais entier (non percé)", "60 g de beurre", "2 cuillères à soupe d'huile", "1 pincée de noix de muscade râpée", "Sel et poivre", "Facultatif : 150 g de lard fumé en dés"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Couper le giraumon<\/strong> : coupez le giraumon en morceaux de <strong>4 cm<\/strong>.", "<strong>Cuire<\/strong> : mettez les morceaux dans une grande casserole avec le thym et le piment entier, couvrez d'eau froide et salez. Portez à ébullition et laissez cuire <strong>15 à 20 minutes<\/strong>, jusqu'à ce que le giraumon soit très tendre.", "<strong>Égoutter<\/strong> : égouttez-le <strong>soigneusement<\/strong> dans une passoire et laissez-le s'égoutter <strong>5 minutes<\/strong> : le giraumon rend beaucoup d'eau. Retirez le thym et le piment.", "<strong>Les aromates<\/strong> : pendant ce temps, émincez les oignons et les cives, hachez l'ail. Dans une grande poêle, faites chauffer l'huile et faites revenir les oignons, les cives (et le lard) <strong>5 minutes<\/strong>, puis ajoutez l'ail et faites revenir encore <strong>1 minute<\/strong>.", "<strong>Écraser<\/strong> : ajoutez le giraumon dans la poêle et écrasez-le à la fourchette ou au presse-purée, en mélangeant avec les aromates.", "<strong>Dessécher<\/strong> : laissez cuire <strong>5 à 10 minutes<\/strong> à feu moyen, en remuant, pour évaporer l'eau restante : la purée doit se tenir.", "<strong>Finir<\/strong> : hors du feu, ajoutez le beurre et la muscade, mélangez, goûtez, rectifiez l'assaisonnement et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le giraumon<\/strong> est une courge antillaise à chair orange et sucrée. À défaut, prenez du potiron, du butternut ou du potimarron.", "<strong>Bien égoutter et dessécher<\/strong> : c'est la clé d'une giraumonade qui se tient au lieu d'être aqueuse.", "<strong>Le piment entier non percé<\/strong> parfume sans piquer : retirez-le avant d'écraser."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>À la morue<\/strong> : ajoutez 300 g de morue dessalée et émiettée, revenue avec les aromates.", "<strong>Au lait de coco<\/strong> : remplacez le beurre par 15 cl de lait de coco.", "<strong>Gratinée<\/strong> : versez la giraumonade dans un plat beurré, parsemez de chapelure et de fromage râpé et faites gratiner <strong>15 minutes à 200 °C<\/strong>."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Court-bouillon de poisson, blaff de poisson, fricassée de poulet, ragoût de porc, colombo, poulet rôti."}]}]}], "steps": [{"label": "", "title": "Couper le giraumon", "body": "Coupez le giraumon en morceaux de <strong>4 cm<\/strong>."}, {"label": "", "title": "Cuire", "body": "Mettez les morceaux dans une grande casserole avec le thym et le piment entier, couvrez d'eau froide et salez. Portez à ébullition et laissez cuire <strong>15 à 20 minutes<\/strong>, jusqu'à ce que le giraumon soit très tendre."}, {"label": "", "title": "Égoutter", "body": "Égouttez-le <strong>soigneusement<\/strong> dans une passoire et laissez-le s'égoutter <strong>5 minutes<\/strong> : le giraumon rend beaucoup d'eau. Retirez le thym et le piment."}, {"label": "", "title": "Les aromates", "body": "Pendant ce temps, émincez les oignons et les cives, hachez l'ail. Dans une grande poêle, faites chauffer l'huile et faites revenir les oignons, les cives (et le lard) <strong>5 minutes<\/strong>, puis ajoutez l'ail et faites revenir encore <strong>1 minute<\/strong>."}, {"label": "", "title": "Écraser", "body": "Ajoutez le giraumon dans la poêle et écrasez-le à la fourchette ou au presse-purée, en mélangeant avec les aromates."}, {"label": "", "title": "Dessécher", "body": "Laissez cuire <strong>5 à 10 minutes<\/strong> à feu moyen, en remuant, pour évaporer l'eau restante : la purée doit se tenir."}, {"label": "", "title": "Finir", "body": "Hors du feu, ajoutez le beurre et la muscade, mélangez, goûtez, rectifiez l'assaisonnement et servez bien chaud."}], "categorySlug": "accompagnements"}, {"slug": "gratin-dauphinois", "name": "Gratin dauphinois", "nameHtml": "Gratin dauphinois", "subtitle": "8 à 10 personnes", "emoji": "🫕", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair ferme ou mixte (Charlotte, Monalisa ou Agria)", "1 litre de lait entier", "50 cl de crème fraîche liquide entière", "4 gousses d'ail", "40 g de beurre (pour le plat et le dessus)", "2 cuillères à café de sel fin", "Poivre du moulin", "2 pincées de noix de muscade râpée"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Préchauffer<\/strong> : préchauffez le four à <strong>160 °C<\/strong> (chaleur traditionnelle).", "<strong>Préparer le plat<\/strong> : coupez une gousse d'ail en deux et frottez-en généreusement le fond et les bords d'un grand plat à gratin (ou de deux plats moyens). Beurrez ensuite le plat avec une partie du beurre.", "<strong>Éplucher et trancher<\/strong> : épluchez les pommes de terre et coupez-les en rondelles <strong>fines et régulières<\/strong> de <strong>3 mm<\/strong>, à la mandoline ou au couteau. <strong>Ne les rincez pas<\/strong> : leur amidon va lier la crème.", "<strong>Précuire dans le lait<\/strong> : mettez les rondelles dans une grande casserole avec le lait, la crème, les gousses d'ail restantes écrasées, le sel, le poivre et la muscade. Portez doucement à frémissement en remuant délicatement avec une spatule, puis laissez cuire <strong>10 minutes<\/strong> à feu doux, jusqu'à ce que le mélange épaississe légèrement.", "<strong>Garnir le plat<\/strong> : retirez les gousses d'ail, puis versez les pommes de terre et le liquide dans le plat. Égalisez la surface : le liquide doit arriver juste au niveau des pommes de terre.", "<strong>Parsemer de beurre<\/strong> : déposez le reste du beurre en petits morceaux sur le dessus.", "<strong>Cuire<\/strong> : enfournez pour <strong>1 heure à 1 heure 15<\/strong>, jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse les pommes de terre sans résistance.", "<strong>Reposer<\/strong> : laissez reposer <strong>10 minutes<\/strong> hors du four avant de servir, le temps que le gratin se tienne."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le vrai gratin dauphinois ne contient pas de fromage<\/strong> : c'est la crème et l'amidon des pommes de terre qui le rendent fondant et gratiné.", "<strong>Ne rincez pas les pommes de terre après les avoir coupées<\/strong> : l'amidon épaissit la sauce et lie le gratin.", "<strong>La précuisson dans le lait<\/strong> raccourcit le passage au four et garantit des pommes de terre bien fondantes à cœur.", "<strong>Cuisson douce et longue<\/strong> : à 160 °C, la crème ne tranche pas et le gratin reste onctueux. Si le dessus dore trop vite, couvrez-le de papier aluminium.", "<strong>Des rondelles régulières<\/strong> cuisent toutes en même temps : la mandoline est idéale (attention aux doigts, utilisez le protège-main).", "<strong>Préparez-le à l'avance<\/strong> : il se réchauffe très bien 20 minutes à 160 °C, et il est même souvent meilleur le lendemain."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Gratin savoyard<\/strong> : remplacez le lait et la crème par du bouillon et parsemez 200 g de beaufort ou de comté râpé entre les couches et sur le dessus.", "<strong>Avec du fromage<\/strong> : pour ceux qui aiment, parsemez 150 g de gruyère ou d'emmental râpé sur le dessus 15 minutes avant la fin de la cuisson.", "<strong>Plus léger<\/strong> : remplacez la crème par du lait (1,5 litre de lait au total).", "<strong>Gratin de patate douce<\/strong> : remplacez la moitié des pommes de terre par de la patate douce, et ajoutez une pincée de piment ou de colombo dans la crème."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Rôti de porc, gigot d'agneau, poulet rôti, côtes de bœuf, jambon à l'os, magret de canard, avec une salade verte."}]}]}], "steps": [{"label": "", "title": "Préchauffer", "body": "Préchauffez le four à <strong>160 °C<\/strong> (chaleur traditionnelle)."}, {"label": "", "title": "Préparer le plat", "body": "Coupez une gousse d'ail en deux et frottez-en généreusement le fond et les bords d'un grand plat à gratin (ou de deux plats moyens). Beurrez ensuite le plat avec une partie du beurre."}, {"label": "", "title": "Éplucher et trancher", "body": "Épluchez les pommes de terre et coupez-les en rondelles <strong>fines et régulières<\/strong> de <strong>3 mm<\/strong>, à la mandoline ou au couteau. <strong>Ne les rincez pas<\/strong> : leur amidon va lier la crème."}, {"label": "", "title": "Précuire dans le lait", "body": "Mettez les rondelles dans une grande casserole avec le lait, la crème, les gousses d'ail restantes écrasées, le sel, le poivre et la muscade. Portez doucement à frémissement en remuant délicatement avec une spatule, puis laissez cuire <strong>10 minutes<\/strong> à feu doux, jusqu'à ce que le mélange épaississe légèrement."}, {"label": "", "title": "Garnir le plat", "body": "Retirez les gousses d'ail, puis versez les pommes de terre et le liquide dans le plat. Égalisez la surface : le liquide doit arriver juste au niveau des pommes de terre."}, {"label": "", "title": "Parsemer de beurre", "body": "Déposez le reste du beurre en petits morceaux sur le dessus."}, {"label": "", "title": "Cuire", "body": "Enfournez pour <strong>1 heure à 1 heure 15<\/strong>, jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse les pommes de terre sans résistance."}, {"label": "", "title": "Reposer", "body": "Laissez reposer <strong>10 minutes<\/strong> hors du four avant de servir, le temps que le gratin se tienne."}], "categorySlug": "accompagnements"}, {"slug": "gratin-de-christophines", "name": "Gratin de christophines", "nameHtml": "Gratin de christophines", "subtitle": "8 personnes", "emoji": "🥒", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Christophines", "blocks": [{"t": "ul", "items": ["8 christophines (chayottes)", "2 oignons", "4 gousses d'ail", "1 botte de cives", "2 branches de thym", "30 g de beurre", "Sel et poivre", "1 pincée de piment (facultatif)"]}]}, {"title": "Béchamel et gratin", "blocks": [{"t": "ul", "items": ["60 g de beurre", "60 g de farine", "75 cl de lait", "1 pincée de noix de muscade râpée", "200 g de fromage râpé (emmental ou gruyère)", "4 cuillères à soupe de chapelure"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Cuire les christophines<\/strong> : coupez les christophines en deux dans la longueur, sans les éplucher. Faites-les cuire <strong>25 à 30 minutes<\/strong> dans une grande casserole d'eau bouillante salée, jusqu'à ce que la pointe d'un couteau s'y enfonce facilement.", "<strong>Vider<\/strong> : égouttez-les et laissez-les tiédir. Retirez le noyau blanc central, puis évidez la chair à la cuillère en laissant <strong>5 mm<\/strong> contre la peau, pour garder des coques solides. Écrasez la chair à la fourchette et laissez-la <strong>égoutter 10 minutes<\/strong> dans une passoire, en pressant.", "<strong>Les aromates<\/strong> : émincez les oignons et les cives, hachez l'ail. Dans une poêle, faites fondre le beurre et faites revenir les oignons et les cives <strong>5 minutes<\/strong>. Ajoutez l'ail, le thym effeuillé et la chair des christophines, salez, poivrez, et laissez cuire <strong>5 minutes<\/strong> pour évaporer l'eau.", "<strong>La béchamel<\/strong> : dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 minutes<\/strong> à feu doux. Salez, poivrez, ajoutez la muscade.", "<strong>Garnir<\/strong> : préchauffez le four à <strong>200 °C<\/strong>. Mélangez la chair des christophines avec la moitié de la béchamel et la moitié du fromage. Remplissez les coques, rangez-les dans un grand plat beurré et nappez-les du reste de béchamel.", "<strong>Gratiner<\/strong> : parsemez du reste de fromage et de la chapelure et enfournez <strong>20 à 25 minutes<\/strong>, jusqu'à ce que le dessus soit bien doré."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>La christophine rend beaucoup d'eau<\/strong> : égouttez bien la chair et faites-la dessécher à la poêle, sinon le gratin sera liquide.", "<strong>Huilez-vous les mains<\/strong> ou mettez des gants pour manipuler les christophines crues : leur sève colle et dessèche la peau.", "<strong>Préparez à l'avance<\/strong> : les christophines farcies se gardent un jour au réfrigérateur, prêtes à gratiner."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Christophines farcies à la viande<\/strong> : ajoutez 400 g de viande hachée revenue avec les aromates.", "<strong>Aux crevettes ou au crabe<\/strong> : ajoutez 400 g de crevettes décortiquées ou de chair de crabe à la farce.", "<strong>En gratin simple<\/strong> : épluchez les christophines, coupez-les en cubes, faites-les cuire 15 minutes, puis mettez-les en plat avec la béchamel et le fromage.", "<strong>Béchamel maison<\/strong> : voir aussi la recette de béchamel."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Poulet rôti, poisson grillé, court-bouillon de poisson, colombo, ragoût de porc."}]}]}], "steps": [{"label": "", "title": "Cuire les christophines", "body": "Coupez les christophines en deux dans la longueur, sans les éplucher. Faites-les cuire <strong>25 à 30 minutes<\/strong> dans une grande casserole d'eau bouillante salée, jusqu'à ce que la pointe d'un couteau s'y enfonce facilement."}, {"label": "", "title": "Vider", "body": "Égouttez-les et laissez-les tiédir. Retirez le noyau blanc central, puis évidez la chair à la cuillère en laissant <strong>5 mm<\/strong> contre la peau, pour garder des coques solides. Écrasez la chair à la fourchette et laissez-la <strong>égoutter 10 minutes<\/strong> dans une passoire, en pressant."}, {"label": "", "title": "Les aromates", "body": "Émincez les oignons et les cives, hachez l'ail. Dans une poêle, faites fondre le beurre et faites revenir les oignons et les cives <strong>5 minutes<\/strong>. Ajoutez l'ail, le thym effeuillé et la chair des christophines, salez, poivrez, et laissez cuire <strong>5 minutes<\/strong> pour évaporer l'eau."}, {"label": "", "title": "La béchamel", "body": "Dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez <strong>1 minute<\/strong> au fouet. Versez le lait petit à petit sans cesser de fouetter, puis laissez épaissir <strong>5 minutes<\/strong> à feu doux. Salez, poivrez, ajoutez la muscade."}, {"label": "", "title": "Garnir", "body": "Préchauffez le four à <strong>200 °C<\/strong>. Mélangez la chair des christophines avec la moitié de la béchamel et la moitié du fromage. Remplissez les coques, rangez-les dans un grand plat beurré et nappez-les du reste de béchamel."}, {"label": "", "title": "Gratiner", "body": "Parsemez du reste de fromage et de la chapelure et enfournez <strong>20 à 25 minutes<\/strong>, jusqu'à ce que le dessus soit bien doré."}], "categorySlug": "accompagnements"}, {"slug": "hachis-parmentier", "name": "Hachis parmentier", "nameHtml": "Hachis parmentier", "subtitle": "8 à 10 personnes", "emoji": "🥔", "category": "Plats", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": []}, {"title": "Purée", "blocks": [{"t": "ul", "items": ["2 kg de pommes de terre à chair farineuse (Bintje, Agria)", "100 g de beurre", "40 cl de lait entier chaud", "1 pincée de noix de muscade râpée", "Sel et poivre"]}]}, {"title": "Viande", "blocks": [{"t": "ul", "items": ["1,2 kg de bœuf haché (ou un reste de pot-au-feu, de rôti ou de poulet, haché)", "3 oignons", "4 gousses d'ail", "1 bouquet de persil", "2 cuillères à soupe de concentré de tomates", "2 branches de thym", "2 cuillères à soupe d'huile", "Sel et poivre"]}]}, {"title": "Gratin", "blocks": [{"t": "ul", "items": ["150 g de fromage râpé (emmental ou gruyère)", "40 g de beurre", "2 cuillères à soupe de chapelure (facultatif)"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>La purée<\/strong> : épluchez les pommes de terre, coupez-les en morceaux et faites-les cuire <strong>20 à 25 minutes<\/strong> dans une grande casserole d'eau froide salée portée à ébullition. Égouttez-les, écrasez-les au presse-purée, puis incorporez le beurre, le lait chaud, la muscade, du sel et du poivre (voir aussi la recette de purée de pommes de terre).", "<strong>Les aromates<\/strong> : pendant ce temps, épluchez et hachez les oignons et l'ail, ciselez le persil.", "<strong>La viande<\/strong> : dans une grande poêle, faites chauffer l'huile et faites revenir les oignons <strong>5 minutes<\/strong>. Ajoutez la viande hachée et faites-la dorer <strong>8 à 10 minutes<\/strong> en l'émiettant à la spatule.", "<strong>Assaisonner<\/strong> : ajoutez l'ail, le concentré de tomates et le thym effeuillé, salez, poivrez et laissez cuire encore <strong>5 minutes<\/strong>. Hors du feu, ajoutez le persil.", "<strong>Monter le hachis<\/strong> : préchauffez le four à <strong>200 °C<\/strong>. Beurrez un grand plat à gratin (ou deux plats moyens). Étalez la viande au fond, puis recouvrez-la de purée en lissant la surface. Tracez des sillons à la fourchette.", "<strong>Gratiner<\/strong> : parsemez de fromage râpé, de chapelure et de petits morceaux de beurre. Enfournez <strong>25 à 30 minutes<\/strong>, jusqu'à ce que le dessus soit bien doré.", "<strong>Servir<\/strong> : laissez reposer <strong>5 minutes<\/strong> et servez bien chaud, avec une salade verte."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>C'est le plat idéal pour accommoder les restes<\/strong> de viande : pot-au-feu, rôti de bœuf, poulet rôti, colombo effiloché.", "<strong>Les sillons à la fourchette<\/strong> dorent mieux et rendent le dessus croustillant.", "<strong>Préparez-le à l'avance<\/strong> : monté mais pas gratiné, il se garde un jour au réfrigérateur. Comptez alors 40 minutes au four.", "<strong>Il se congèle très bien<\/strong>, en portions ou en entier."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Parmentier de patate douce<\/strong> : remplacez la moitié des pommes de terre par de la patate douce, et la viande par de la morue ou du poulet.", "<strong>Parmentier de canard<\/strong> : avec des cuisses de canard confites effilochées.", "<strong>Parmentier de poisson<\/strong> : avec 1,2 kg de poisson poché et émietté, mélangé à une béchamel et des épinards.", "<strong>Végétarien<\/strong> : remplacez la viande par des lentilles cuites revenues aux aromates."]}]}]}], "steps": [{"label": "", "title": "La purée", "body": "Épluchez les pommes de terre, coupez-les en morceaux et faites-les cuire <strong>20 à 25 minutes<\/strong> dans une grande casserole d'eau froide salée portée à ébullition. Égouttez-les, écrasez-les au presse-purée, puis incorporez le beurre, le lait chaud, la muscade, du sel et du poivre (voir aussi la recette de purée de pommes de terre)."}, {"label": "", "title": "Les aromates", "body": "Pendant ce temps, épluchez et hachez les oignons et l'ail, ciselez le persil."}, {"label": "", "title": "La viande", "body": "Dans une grande poêle, faites chauffer l'huile et faites revenir les oignons <strong>5 minutes<\/strong>. Ajoutez la viande hachée et faites-la dorer <strong>8 à 10 minutes<\/strong> en l'émiettant à la spatule."}, {"label": "", "title": "Assaisonner", "body": "Ajoutez l'ail, le concentré de tomates et le thym effeuillé, salez, poivrez et laissez cuire encore <strong>5 minutes<\/strong>. Hors du feu, ajoutez le persil."}, {"label": "", "title": "Monter le hachis", "body": "Préchauffez le four à <strong>200 °C<\/strong>. Beurrez un grand plat à gratin (ou deux plats moyens). Étalez la viande au fond, puis recouvrez-la de purée en lissant la surface. Tracez des sillons à la fourchette."}, {"label": "", "title": "Gratiner", "body": "Parsemez de fromage râpé, de chapelure et de petits morceaux de beurre. Enfournez <strong>25 à 30 minutes<\/strong>, jusqu'à ce que le dessus soit bien doré."}, {"label": "", "title": "Servir", "body": "Laissez reposer <strong>5 minutes<\/strong> et servez bien chaud, avec une salade verte."}], "categorySlug": "plats"}, {"slug": "haricots-rouges", "name": "Haricots rouges à la créole", "nameHtml": "Haricots rouges à la créole", "subtitle": "8 à 10 personnes", "emoji": "🥫", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["1 kg de haricots rouges secs (ou 4 boîtes de 800 g de haricots rouges cuits)", "300 g de lard fumé ou de queue de cochon salée (facultatif)", "3 oignons", "1 botte de cives", "6 gousses d'ail", "4 branches de thym", "4 feuilles de bois d'Inde (ou de laurier)", "1 bouquet de persil", "1 piment antillais entier (non percé)", "4 cuillères à soupe d'huile", "2 cuillères à soupe de concentré de tomates (facultatif)", "Sel et poivre"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Faire tremper<\/strong> : la veille, triez les haricots, rincez-les et mettez-les à tremper dans un grand volume d'eau froide pendant <strong>12 heures<\/strong>. Si vous utilisez de la queue de cochon salée, mettez-la à dessaler dans un autre saladier, en changeant l'eau 2 ou 3 fois.", "<strong>Première cuisson<\/strong> : égouttez les haricots, mettez-les dans une grande cocotte et couvrez-les largement d'eau froide, <strong>sans sel<\/strong>. Portez à ébullition, faites bouillir <strong>10 minutes<\/strong> à gros bouillons, puis écumez.", "<strong>Cuire<\/strong> : ajoutez le lard ou la queue de cochon, le thym, le bois d'Inde et le piment entier. Laissez cuire à petits frémissements, à couvert, <strong>1 h 30 à 2 heures<\/strong>, jusqu'à ce que les haricots soient bien tendres. Ajoutez de l'eau chaude s'il en manque.", "<strong>Les aromates<\/strong> : pendant ce temps, émincez les oignons et les cives, hachez l'ail. Dans une poêle, faites chauffer l'huile et faites revenir les oignons et les cives <strong>5 minutes<\/strong>, puis ajoutez l'ail et le concentré de tomates et faites revenir encore <strong>1 minute<\/strong>.", "<strong>Assembler<\/strong> : versez les aromates dans les haricots cuits, salez, poivrez et laissez mijoter <strong>20 minutes<\/strong> à découvert, en remuant de temps en temps, jusqu'à ce que la sauce épaississe. Écrasez quelques haricots contre la paroi de la cocotte pour la lier.", "<strong>Servir<\/strong> : retirez le piment, ajoutez le persil ciselé, goûtez, rectifiez l'assaisonnement et servez bien chaud."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Le trempage<\/strong> raccourcit la cuisson et rend les haricots plus digestes.", "<strong>Les 10 minutes à gros bouillons<\/strong> au début sont indispensables : les haricots rouges crus contiennent une substance toxique détruite par une ébullition franche.", "<strong>Salez en fin de cuisson<\/strong> : le sel au début durcit la peau des haricots.", "<strong>Avec des haricots en boîte<\/strong>, rincez-les, puis commencez directement à l'étape 4 et laissez mijoter 20 minutes avec un peu d'eau.", "<strong>À l'autocuiseur<\/strong> : après le trempage et l'ébullition de 10 minutes, comptez <strong>25 à 30 minutes<\/strong> sous pression.", "<strong>Encore meilleurs réchauffés<\/strong>, ils se gardent 3 jours au réfrigérateur et se congèlent très bien."]}]}]}, {"title": "Variantes", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>Riz et pois<\/strong> : mélangez les haricots rouges cuits avec le riz blanc, ou faites cuire le riz directement dans le bouillon des haricots.", "<strong>Au lait de coco<\/strong> : ajoutez 40 cl de lait de coco à l'étape 5, pour une version plus douce.", "<strong>Dombrés aux haricots rouges<\/strong> : voir la recette de dombrés.", "<strong>Végétariens<\/strong> : supprimez la viande et ajoutez des dés de giraumon pour les 30 dernières minutes."]}]}]}, {"title": "Idées d'accompagnement", "subs": [{"title": "", "blocks": [{"t": "p", "html": "Riz blanc, colombo de poulet, colombo de porc, court-bouillon de poisson, fricassée de poulet, ragoût de porc, avec un peu de sauce chien."}]}]}], "steps": [{"label": "", "title": "Faire tremper", "body": "La veille, triez les haricots, rincez-les et mettez-les à tremper dans un grand volume d'eau froide pendant <strong>12 heures<\/strong>. Si vous utilisez de la queue de cochon salée, mettez-la à dessaler dans un autre saladier, en changeant l'eau 2 ou 3 fois."}, {"label": "", "title": "Première cuisson", "body": "Égouttez les haricots, mettez-les dans une grande cocotte et couvrez-les largement d'eau froide, <strong>sans sel<\/strong>. Portez à ébullition, faites bouillir <strong>10 minutes<\/strong> à gros bouillons, puis écumez."}, {"label": "", "title": "Cuire", "body": "Ajoutez le lard ou la queue de cochon, le thym, le bois d'Inde et le piment entier. Laissez cuire à petits frémissements, à couvert, <strong>1 h 30 à 2 heures<\/strong>, jusqu'à ce que les haricots soient bien tendres. Ajoutez de l'eau chaude s'il en manque."}, {"label": "", "title": "Les aromates", "body": "Pendant ce temps, émincez les oignons et les cives, hachez l'ail. Dans une poêle, faites chauffer l'huile et faites revenir les oignons et les cives <strong>5 minutes<\/strong>, puis ajoutez l'ail et le concentré de tomates et faites revenir encore <strong>1 minute<\/strong>."}, {"label": "", "title": "Assembler", "body": "Versez les aromates dans les haricots cuits, salez, poivrez et laissez mijoter <strong>20 minutes<\/strong> à découvert, en remuant de temps en temps, jusqu'à ce que la sauce épaississe. Écrasez quelques haricots contre la paroi de la cocotte pour la lier."}, {"label": "", "title": "Servir", "body": "Retirez le piment, ajoutez le persil ciselé, goûtez, rectifiez l'assaisonnement et servez bien chaud."}], "categorySlug": "accompagnements"}, {"slug": "haricots-verts-a-l-ail", "name": "Haricots verts à l'ail", "nameHtml": "Haricots verts à l'ail", "subtitle": "4 à 6 personnes", "emoji": "🫛", "category": "Accompagnements", "ingredients": {"title": "Ingrédients", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["2 boîtes de haricots verts (boîtes 4/4, environ 440 g égouttés chacune)", "2 cuillères à soupe d'huile (ou 30 g de beurre)", "2 cuillères à café d'ail en poudre", "2 cuillères à soupe de vinaigre blanc", "Sel fin", "Poivre du moulin"]}]}]}, "prep": [{"title": "Préparation", "subs": [{"title": "", "blocks": [{"t": "ol", "items": ["<strong>Égoutter<\/strong> : versez les haricots verts dans une passoire, rincez-les rapidement à l'eau froide pour retirer le goût de conserve, puis égouttez-les bien.", "<strong>Sécher<\/strong> : étalez-les sur un torchon propre ou du papier absorbant et tapotez-les pour retirer un maximum d'eau. Plus ils sont secs, mieux ils dorent.", "<strong>Faire revenir<\/strong> : faites chauffer l'huile dans une grande poêle à feu <strong>moyen-vif<\/strong>. Ajoutez les haricots et faites-les sauter <strong>2 à 3 minutes<\/strong> en remuant de temps en temps.", "<strong>Ajouter le vinaigre<\/strong> : versez le vinaigre blanc dans la poêle, mélangez et poursuivez la cuisson <strong>1 minute<\/strong>, le temps qu'il s'évapore en partie.", "<strong>Ajouter l'ail<\/strong> : baissez le feu, saupoudrez l'ail en poudre, salez légèrement et poivrez. Mélangez et laissez cuire <strong>1 minute<\/strong>, sans plus. Au total, la cuisson dure <strong>4 à 5 minutes<\/strong>.", "<strong>Goûter et servir<\/strong> : rectifiez l'assaisonnement et servez aussitôt."]}]}]}], "other": [{"title": "Astuces", "subs": [{"title": "", "blocks": [{"t": "ul", "items": ["<strong>L'ail en poudre brûle très vite<\/strong> et devient amer : ajoutez-le toujours en fin de cuisson, à feu doux.
